 villains_chronicle_phase_first_generation:0 "제1장: 이세계의 강림자들"
 villains_chronicle_phase_first_generation_desc:0 "서기 867년에 직접 눈을 뜬 1대 전생 주인공들이 아직 한 명 이상 세상에 살아 숨 쉬며 각자의 기행과 야망을 펼치고 있는 시기입니다."
 reincarnated_villains_chronicle_villains_chronicle_phase_first_generation_situation_phase:0 "$villains_chronicle_phase_first_generation$"
 villains_chronicle_phase_heirs_era:0 "제2장: 후예들의 시대"
 villains_chronicle_phase_heirs_era_desc:0 "1대 전생자들이 모두 역사 속으로 떠나고, 그들이 남긴 기괴한 이념과 유산을 물려받은 후손들이 왕조의 존속을 놓고 다투는 시기입니다."
 reincarnated_villains_chronicle_villains_chronicle_phase_heirs_era_situation_phase:0 "$villains_chronicle_phase_heirs_era$"
 villains_chronicle_phase_last_standing:0 "종장: 최후의 생존자"
 villains_chronicle_phase_last_standing_desc:0 "수많은 전생 가문들이 세월의 풍파 속에 쓰러지고, 이제 단 하나의 왕조만이 남았거나 모든 전생 가문이 막을 내린 종착점입니다."
