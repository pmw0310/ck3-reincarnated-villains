 # === [공통 핵심 교의 · 역사 용어 사전] ===
 tenet_mass_propaganda_name:0 "대중 선전"
 tenet_mass_propaganda_desc:0 "광장에 울려 퍼지는 나팔 소리와 물결치는 깃발, 끊임없이 배포되는 선언문은 분산된 군중을 하나의 강철 같은 의지로 묶어 세웁니다. 정권의 정통성은 침묵하는 신전이 아니라 열광하는 대중의 함성 속에서 완성됩니다."
 tenet_planned_economy_name:0 "계획 경제"
 tenet_planned_economy_desc:0 "개별 영지의 사사로운 이윤 추구를 철폐하고 모든 토지와 곡식, 대장간과 노동력을 중앙 당국의 치밀한 연차 계획 아래 통합합니다. 일시적인 불만이 따르더라도 국가의 건설 역량과 생산력은 비약적으로 증대됩니다."
 tenet_permanent_revolution_name:0 "영구 혁명"
 tenet_permanent_revolution_desc:0 "혁명은 정권 장악으로 끝나지 않으며 안팎에 숨어든 반동 분자와 수정주의자들을 끊임없이 색출하고 뿌리 뽑아야만 유지됩니다. 무자비한 숙청의 공포와 대외 혁명 전쟁만이 체제의 순수성을 지켜냅니다."
 tenet_fuhrerprinzip_name:0 "지도자 원리"
 tenet_fuhrerprinzip_desc:0 "모든 국가 권위는 최고 지도자 한 사람의 의지에서 비롯되며 아래로는 오직 절대적인 복종만이 요구됩니다. 온 나라가 하나의 병영처럼 일사불란하게 움직일 때 정예 군단은 그 어떤 적국도 단숨에 짓밟을 수 있습니다."
 tenet_free_market_name:0 "자유 시장"
 tenet_free_market_desc:0 "보이지 않는 거래의 손길과 끝없는 이윤 추구야말로 세상을 움직이는 가장 정직하고도 위대한 동력입니다. 번영하는 상업 도시와 축적된 금화 앞에서 낡은 중세의 청빈 관념은 무력하게 무너집니다."
 tenet_military_industrial_complex_name:0 "군산복합체"
 tenet_military_industrial_complex_desc:0 "막강한 금고와 주조소의 화력이 결합할 때 전쟁은 가장 확실한 투자처가 되고 외교는 거부할 수 없는 거래가 됩니다. 풍부한 자금으로 고용한 용병단과 정밀한 막후 로비는 전 세계의 판도를 입맛대로 재편합니다."
 VILLAINS_TENET_TOOLTIP_INLINE_PERSONAL_EFFECTS:0 "#S [personal_tenet|E]로서 효과:#!\n[TenetType.GetPersonalTenetEffectsDescription( Rite.Self )]"
 tenet_mass_propaganda_agitprop_historical_glossary:0 "[Glossary('아지트프로프','tenet_mass_propaganda_agitprop_historical_desc')]"
 tenet_mass_propaganda_agitprop_historical_desc:0 "선동과 선전을 결합하여 예술과 언론, 대중 집회를 통해 국가 이념을 전파하고 군중을 동원하는 정치 교화 방식입니다."
 tenet_mass_propaganda_gleichschaltung_historical_glossary:0 "[Glossary('획일화','tenet_mass_propaganda_gleichschaltung_historical_desc')]"
 tenet_mass_propaganda_gleichschaltung_historical_desc:0 "사회와 문화, 언론과 제도를 단일한 국가 지도 이념 아래 일사불란하게 정렬시키는 총체적 체제 통합 정책입니다."
 tenet_mass_propaganda_historical_glossary:0 "$tenet_mass_propaganda_agitprop_historical_glossary$ / $tenet_mass_propaganda_gleichschaltung_historical_glossary$"
 tenet_planned_economy_gosplan_historical_glossary:0 "[Glossary('고스플란','tenet_planned_economy_gosplan_historical_desc')]"
 tenet_planned_economy_gosplan_historical_desc:0 "국가의 모든 생산 목표와 자원 배분, 중공업 건설 일정을 중앙에서 일괄 수립하고 감독하는 국가계획위원회 체제입니다."
 tenet_planned_economy_kolkhoz_historical_glossary:0 "[Glossary('콜호스','tenet_planned_economy_kolkhoz_historical_desc')]"
 tenet_planned_economy_kolkhoz_historical_desc:0 "개별 농가의 사유 농지와 가축, 농기구를 통합하여 공동 경작과 의무 공출을 수행하는 집단농장 제도입니다."
 tenet_planned_economy_historical_glossary:0 "$tenet_planned_economy_gosplan_historical_glossary$ / $tenet_planned_economy_kolkhoz_historical_glossary$"
 tenet_permanent_revolution_chistka_historical_glossary:0 "[Glossary('치스트카','tenet_permanent_revolution_chistka_historical_desc')]"
 tenet_permanent_revolution_chistka_historical_desc:0 "당과 국가 기구 내부의 불순분자와 반대파를 정기적으로 심사하고 축출하여 조직의 이념적 순결을 유지하는 대숙청을 뜻합니다."
 tenet_permanent_revolution_zaofan_historical_glossary:0 "[Glossary('조반유리','tenet_permanent_revolution_zaofan_historical_desc')]"
 tenet_permanent_revolution_zaofan_historical_desc:0 "낡은 권위와 기득권 질서에 맞서 반기를 드는 것에 정당성이 있다는 급진적 대중 혁명 구호입니다."
 tenet_permanent_revolution_historical_glossary:0 "$tenet_permanent_revolution_chistka_historical_glossary$ / $tenet_permanent_revolution_zaofan_historical_glossary$"
 tenet_fuhrerprinzip_german_historical_glossary:0 "[Glossary('퓌러프린치프','tenet_fuhrerprinzip_german_historical_desc')]"
 tenet_fuhrerprinzip_german_historical_desc:0 "최고 지도자의 명령이 곧 성문법을 초월하는 절대적 법원이며 모든 하위 위계는 무조건 복종해야 한다는 지도자 원리입니다."
 tenet_fuhrerprinzip_totalkrieg_historical_glossary:0 "[Glossary('총력전','tenet_fuhrerprinzip_totalkrieg_historical_desc')]"
 tenet_fuhrerprinzip_totalkrieg_historical_desc:0 "전선과 후방의 구분을 없애고 국가의 모든 인적 자원과 산업 역량을 전쟁 수행에 남김없이 투입하는 군사 교리입니다."
 tenet_fuhrerprinzip_historical_glossary:0 "$tenet_fuhrerprinzip_german_historical_glossary$ / $tenet_fuhrerprinzip_totalkrieg_historical_glossary$"
 tenet_free_market_laissez_faire_historical_glossary:0 "[Glossary('레세페르','tenet_free_market_laissez_faire_historical_desc')]"
 tenet_free_market_laissez_faire_historical_desc:0 "국가의 인위적 간섭과 규제를 최소화하고 자유로운 사적 계약과 시장 경쟁에 경제 질서를 맡기는 자유방임주의 원칙입니다."
 tenet_free_market_invisible_hand_historical_glossary:0 "[Glossary('보이지 않는 손','tenet_free_market_invisible_hand_historical_desc')]"
 tenet_free_market_invisible_hand_historical_desc:0 "개개인이 사익을 추구하는 자유로운 상업 활동이 가격 기구를 통해 사회 전체의 부와 자원 배분을 달성한다는 고전 경제학 개념입니다."
