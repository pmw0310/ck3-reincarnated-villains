l_korean:
 # ============================================================================
 # 00. 전생한 악당들 — 공통 시스템 · 이념 교리 · 공유 교의
 # ============================================================================

 # === [북마크 탭 헤더 · 공통 시스템] ===
 bm_867_reincarnated_hitler:0 "전생한 악당들: 서방편"
 bm_867_reincarnated_hitler_desc:0 "서기 867년, 근현대사에서 온갖 광기와 권모술수, 블랙코미디로 역사를 뒤흔들었던 서방과 중동의 통치자·선동가·괴승들이 천 년 전 유럽과 러시아, 예루살렘과 나일강 상류에 나란히 전생했습니다.\n\n브리튼 북부 방벽의 부동산 대통령과 예루살렘 철벽 성채의 시온 총리, 네바강의 방랑 괴승, 알프스와 밀라노의 추축 동맹, 모스크바의 강철 서기장, 동아프리카의 종신 원수까지—과연 누가 중세 서방 세계의 상식을 박살 내고 최후의 승자가 될까요?"
 villains_dead_personality_neutral_fallback:0 "균형 잡힘"
 villains_trickster_fate_name:0 "변덕스러운 운명"
 villains_trickster_fate_name_possessive:0 "변덕스러운 운명의"
 bm_867_reincarnated_villains_east:0 "전생한 악당들: 동방편"
 bm_867_reincarnated_villains_east_desc:0 "서기 867년, 동아시아와 인도차이나, 아삼 밀림의 격동기를 무대로 근현대 동방의 악명 높은 통치자들과 사령관이 나란히 젊은 몸으로 눈을 떴습니다.\n\n서경의 백두혈통 남매와 당나라 강남 양절을 장악한 상하이 문혁파의 붉은 여황, 임팔 분지의 초식 병참 사령관, 그리고 앙코르 밀림에서 제0년을 선포한 앙카르 지도자까지—과연 누가 동방 천하의 패권을 거머쥘까요?"

