 # === [Religion, Faith & Holy Sites] ===
 bolshevism_religion:0 "Communism"
 bolshevism_religion_adj:0 "Communist"
 bolshevism_religion_adherent:0 "Communist"
 bolshevism_religion_adherent_plural:0 "Communists"
 bolshevism_religion_desc:0 "A revolutionary communist ideology preaching the collective ownership of all land and means of production and relentless world revolution."
 bolshevism:0 "Bolshevism"
 bolshevism_adj:0 "Bolshevik"
 bolshevism_adherent:0 "Bolshevik"
 bolshevism_adherent_plural:0 "Bolsheviks"
 bolshevism_desc:0 "A radical revolutionary ideology preaching the collective ownership of all land and means of production, iron party discipline, ruthless power struggle, and relentless world revolution. It seeks to smash feudal hierarchy and subject all society to the directives of the Central Committee and the General Secretary."
 bolshevism_house_of_worship:0 "Palace of Soviets"
