 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_netanyahu:0 "총리의 감색 예복"
 bookmark_reincarnated_netanyahu:0 "총리 베냐민 네타냐후"
 bookmark_reincarnated_netanyahu_subheading:0 "시온 안보자치령의 총리"
 bookmark_reincarnated_netanyahu_desc:0 "부패 기소와 연정 붕괴 위기가 터질 때마다 기가 막히게 안보 비상시국을 선포하며 총리석에서 버텨내던 이스라엘 최장수 총리 베냐민 네타냐후는, 사예레트 마트칼 특임대 장교로 복무하던 열여덟 살 청년의 몸으로 서기 867년 예루살렘과 야파에서 눈을 떴습니다.\n\n평화로운 날엔 분홍 포도주와 최고급 잎담배 상납 장부를 캐묻는 율법 재판관들에게 시달리지만, 국경에 불만 붙으면 큼지막한 빨간 선 폭탄 그림판을 번쩍 치켜들고 귀신같이 권력을 연장하는 중동 정치 구단입니다! 엔테베의 영웅인 친형 요나탄과 함께 사방의 대제국에 포위된 요새에서, 과연 불사신 비비는 재판을 영원히 미루고 대이스라엘을 세울 수 있을까요?"
 bookmark_reincarnated_yonatan_netanyahu:0 "특임대장 요나탄 네타냐후"
 dynn_Netanyahu_867:0 "네타냐후"
 dynn_Netanyahu_867_motto:0 "비상시국에 총리를 재판할 수는 없다!"
 nick_shield_of_zion:0 "불사신 비비"
 nick_shield_of_zion_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 분홍 포도주 뇌물 추문과 탄핵 위기가 덮칠 때마다 어김없이 붉은 선 폭탄 그림판을 흔들며 안보 비상사태를 선포해 기어코 권좌에 살아남는 불사조 정치 구단입니다."
 villains_dead_personality_benzion:0 "완고한 역사학자"

