 # === [Religion, Faith & Holy Sites] ===
 zionism:0 "Zionism"
 zionism_adj:0 "Zionist"
 zionism_adherent:0 "Zionist"
 zionism_adherent_plural:0 "Zionists"
 zionism_desc:0 "A national revival creed dedicated to rebuilding a sovereign fortress state upon the ancient land of Zion. Rejecting passive waiting, it preaches preemptive military strikes, relentless shadow intelligence, and shamelessly billing distant allies for every rampart stone."
 zionism_high_god_name:0 "Adonai"
 zionism_high_god_name_possessive:0 "Adonai's"
 zionism_high_god_name_alternate:0 "the Rock of Israel"
 zionism_high_god_name_alternate_possessive:0 "the Rock of Israel's"
