 sa_stormtroopers:0 "Stormtroopers"
 sa_stormtroopers_flavor:0 "#F Brown-shirted paramilitary party militants who dominate assembly halls and city streets alike, trading defensive formation discipline for fierce urban, hill, and Alpine shock damage and relentless pursuit.#!"
