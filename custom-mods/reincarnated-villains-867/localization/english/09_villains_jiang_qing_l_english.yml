 dynn_Wang_867:0 "Wang"
 Hongwen:0 "Hongwen"
 nick_white_boned_empress:0 "the Red Empress"
 nick_white_boned_empress_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is the merciless 'Red Empress' who rose from the silver screens of Shanghai to direct a cultural revolution and covet the throne of Empress Wu Zetian. Behind walls of crimson posters, [Select_CString( CHARACTER.IsLocalPlayer, 'your', CHARACTER.GetHerHis )] fanatical Red Guards and brutal struggle sessions reduce every old rival and tradition to ashes."
 bookmark_reincarnated_jiang_qing:0 "Madame Jiang Qing"
 bookmark_reincarnated_jiang_qing_subheading:0 "Group Leader of the Jiangnan Rebel Headquarters"
 bookmark_reincarnated_jiang_qing_desc:0 "Once the ruthless stage-manager of revolutionary model operas and Red Guard struggle sessions at the height of the Cultural Revolution, Jiang Qing has awakened in 867 AD as the young Kingdom-tier Celestial Circuit Governor of Liangzhe and Shanghai under the waning Tang dynasty.\n\nFlanked in her court by her Shanghai inner circle—Zhang Chunqiao, Yao Wenyuan, and Wang Hongwen—she has raised the blazing banner of Cultural Revolution Thought beneath the Great Sun to smash old traditions across Jiangnan. Can the Red Empress break free from the Tang court and forge a Cultural Revolution Empire across China?"

