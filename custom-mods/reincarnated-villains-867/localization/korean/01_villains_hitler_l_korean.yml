 # === [문화 · 전통 · 고유 무장병] ===
 hitler_sa_stormtroopers_name:0 "SA 돌격대"
 sa_stormtroopers:0 "돌격대"
 sa_stormtroopers_flavor:0 "#F 갈색 셔츠를 맞춰 입고 집회장과 거리를 장악한 국가사회주의 당원 행동대입니다. 방어 대열은 얇지만 시가전과 산악·구릉 돌격에서 거침없는 충격력과 추격전을 퍼붓습니다.#!"
 hitler_ss_guard_army_name:0 "총통 직속 근위대"
 hitler_waffen_ss_panzer_army_name:0 "철십자 돌격 선봉군단"
 aryan:0 "대독일"
 aryan_prefix:0 "대독일계"
 aryan_collective_noun:0 "대독일인"
 tradition_stormtrooper_vanguard_name:0 "돌격대 가두 선봉"
 tradition_stormtrooper_vanguard_desc:0 "갈색 셔츠와 군화 소리로 거리와 광장을 제압하는 준군사 당원 행동대가 사회 전반을 통제합니다. 지도자의 단일 명령 아래 일사불란하게 동원되어 적에게 공포와 파상 공세를 퍼붓습니다."
 tradition_stormtrooper_vanguard_only_tt:0 "대독일 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_sa_stormtroopers:0 "[GetMaA('sa_stormtroopers').GetName](을)를 [men_at_arms|E]으로 모병 가능"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 councillor_court_chaplain_national_socialism:0 "선전장관"
 councillor_court_chaplain_national_socialism_possessive:0 "선전장관의"
 d_national_socialism:0 "국가 최고 지도부"
 d_national_socialism_adj:0 "국가 최고 지도부"
 artifact_relic_blutfahne_name:0 "피의 깃발 블루트파네"
 artifact_relic_blutfahne_desc:0 "어설픈 맥줏집 폭동 당시의 핏자국을 신성한 순교의 증표로 포장한 당기입니다. 모든 신규 군기가 이 천 조각에 끝자락을 스쳐야만 정식 깃발로 인정받는 기묘한 의식에 쓰입니다."
 artifact_relic_bronze_reichsadler_name:0 "제국수상부의 청동 독수리상"
 artifact_relic_bronze_reichsadler_desc:0 "방문객의 기를 죽이겠다며 문틀이 내려앉을 만큼 비대한 크기로 주조한 청동 제국 독수리 조형물입니다. 과장된 권위주의 건축 취향과 정복욕을 노골적으로 드러냅니다."
 artifact_relic_reichsparteitag_chalice_name:0 "전당대회의 성화 성배"
 artifact_relic_reichsparteitag_chalice_desc:0 "뉘른베르크 야간 횃불 집회에서 극적인 무대 연출로 군중의 혼을 빼놓을 때 쓰이던 의식용 성배입니다."
 artifact_relic_mein_kampf_manuscript_name:0 "나의 투쟁 친필 원본"
 artifact_relic_mein_kampf_manuscript_desc:0 "빈 미대 낙방의 울분과 실패한 맥줏집 폭동 뒤 감옥에서 구술한 국가사회주의 교리서 원본입니다. 끝없이 중언부언하는 악필 문장 탓에 끝까지 읽은 자는 거의 없지만, 숙청당하지 않으려는 봉신들마다 서재 가장 잘 보이는 곳에 모셔두고 인세만 꼬박꼬박 바칩니다."
 artifact_relic_wewelsburg_ring_name:0 "베벨스부르크 지하 원탁 성배"
 artifact_relic_wewelsburg_ring_desc:0 "파더보른 인근 베벨스부르크 성 지하실을 고대 기사단 풍으로 개조한다며 막대한 영지 예산을 탕진해 만든 비전 의식용 성배입니다."
 hitler_proclaim_thousand_year_reich_decision:0 "독일국 창건 선포"
 hitler_proclaim_thousand_year_reich_decision_desc:0 "인스브루크의 작은 산악 요새에서 시작된 우리의 투쟁은 마침내 바이에른 전역과 알프스를 완전히 장악하기에 이르렀습니다. 이제 낡은 카롤링거 왕실의 굴레를 벗어던지고, 히틀러 가문의 영도 아래 하나 된 '독일국'의 창건을 온 세상에 선포할 때가 왔습니다!"
 hitler_proclaim_thousand_year_reich_decision_tooltip:0 "독자적인 '독일국'을 창설하고 히틀러 가문의 영구적인 총통 지도 체제를 선포합니다."
 hitler_proclaim_thousand_year_reich_decision_confirm:0 "하나의 민족, 하나의 국가, 하나의 총통!"
 hitler_thousand_year_reich_dynasty_modifier:0 "독일국 총통의 혈통"
 hitler_thousand_year_reich_dynasty_modifier_desc:0 "이 가문은 바이에른과 알프스를 평정하고 국가사회주의 독일국을 창건하여, 모든 가문원이 강력한 군사적 권위와 공포를 발휘합니다."
 hitler_proclaim_greater_german_reich_decision:0 "대게르만국 선포"
 hitler_proclaim_greater_german_reich_decision_desc:0 "바이에른과 알프스, 오스트리아에서 북방의 베를린에 이르기까지 모든 독일 땅이 마침내 하나의 깃발 아래 통일되었습니다! 이제 분열의 역사를 끝내고 영원히 무너지지 않을 '대게르만국'의 탄생을 온 세상에 선포할 때입니다!"
 hitler_proclaim_greater_german_reich_decision_tooltip:0 "'대게르만국'을 창설하고 수도를 세계수도 게르마니아로 재건하여 제국의 패권을 확립합니다."
 hitler_proclaim_greater_german_reich_decision_confirm:0 "위대한 대게르만국이여, 영원하라!"
 hitler_greater_german_reich_dynasty_modifier:0 "대게르만국의 지배자"
 hitler_greater_german_reich_dynasty_modifier_desc:0 "이 가문은 전 독일 권역을 통일하고 대게르만국을 창건하여, 모든 가문원이 압도적인 군사 지휘력과 기사 전투력, 제국의 위신을 떨칩니다."
 hitler_germania_world_capital_county_modifier:0 "세계수도 게르마니아"
 hitler_germania_world_capital_county_modifier_desc:0 "거대한 국민대회당과 개선문이 세워진 천년제국의 세계수도로서 막대한 세금과 병력, 개발 성장을 이끌어냅니다."
 axis_mass_agitation_decision_hitler_title:0 "제국 전당대회 및 대중 선동 연설"
 axis_mass_agitation_decision_hitler_desc:0 "깃발과 횃불이 물결치는 광장에 수만 명의 군중이 집결했습니다! 침이 튀도록 포효하는 총통의 열변으로 민중의 이성을 마비시키고, 거리에서 휩쓸려 자원입대하는 열성 돌격대원들을 긁어모으겠습니다!"
 axis_mass_agitation_decision_hitler_confirm:0 "하나의 민족, 하나의 국가, 하나의 총통!"
 artifact_hitler_rejected_watercolor_name:0 "빈 미술원 불합격 수채화 습작"
 artifact_hitler_rejected_watercolor_desc:0 "인물 데생 능력 부족이라는 냉정한 평가와 함께 빈 미술아카데미 입학시험에서 두 번이나 퇴짜 맞은 해묵은 건물 수채화 습작입니다. 그림의 원근법을 조금이라도 지적하는 신하는 그 자리에서 숙청당하기에 온 궁정이 숨죽여 명작이라 칭송하지만, 정작 본인은 볼 때마다 옛 열등감이 치밀어 스트레스를 받습니다."
 hitler_rejected_watercolor_modifier:0 "빈 미술원 불합격 수채화 습작"
 hitler_married_to_the_state_modifier:0 "국가와 결혼함"
 hitler_married_to_the_state_modifier_desc:0 "이 인물은 대중 연단 위에서 자신의 유일한 반려자는 오직 조국과 제국뿐이라고 열변을 토하며 사생활을 베일에 감추고 있습니다. 밤마다 침실 대신 건축 모형과 작전 지도를 붙들고 지새우니 후사를 보기는 요원합니다."
 axis_mass_agitation_hitler_event_preview_tt:0 "횃불 군중 집회 이벤트가 열리며 [diplomacy|E] 연설 승부수, [intrigue|E] 거리 위압 행진, 또는 안전한 단상 사열 중 하나를 선택합니다"
 villains_religious_decision.0010.t:0 "타오르는 밤의 횃불 집회"
 villains_religious_decision.0010.desc:0 "수천 개의 횃불이 밤하늘을 핏빛으로 물들이고, 갈색 제복을 맞춰 입은 돌격대원들의 군화 소리가 광장 바닥을 천둥처럼 뒤흔든다. 단상 아래 운집한 군중은 숨을 죽인 채 내 입술이 열리기만을 기다리고 있다.\n\n오늘 밤의 열기를 어떻게 폭발시키느냐에 따라 수많은 청년들이 광신적인 전사로 거듭날 수도, 혹은 어설픈 소동 끝에 웃음거리로 전락할 수도 있다."
 villains_religious_decision.0010.a:0 "목청이 찢어져라 민족의 숙명과 복수를 포효한다!"
 villains_religious_decision.0010.a.success:0 "광란의 연설이 군중의 혼을 완전히 사로잡음"
 villains_religious_decision.0010.a.failure:0 "갈라진 쉰 목소리에 청중의 야유와 실소가 터져 나옴"
 villains_religious_decision.0010.b:0 "돌격대의 횃불 행진으로 반대파 거리를 무자비하게 휩쓴다."
 villains_religious_decision.0010.b.success:0 "일사불란한 폭력의 시위가 온 수도를 공포와 복종으로 얼어붙게 함"
 villains_religious_decision.0010.b.failure:0 "통제를 벗어난 패싸움이 유혈 폭동으로 번져 민심이 악화됨"
 villains_religious_decision.0010.c:0 "각본대로 엄숙하게 단상에서 돌격대 사열만 받는다."
 hitler_grand_architecture_and_art_purge_decision:0 "퇴폐 예술 심판과 대건축 모형 친람식"
 hitler_grand_architecture_and_art_purge_decision_desc:0 "위대한 민족 공동체의 정신은 나약하고 타락한 예술이 아니라 영원을 압도하는 거대한 석조 건축에서 완성됩니다! 영지 곳곳의 귀족 저택과 수도원에 숨겨진 퇴폐적인 성화와 채색 필사본을 전면 압류하고, 내가 밤을 지새워 직접 목탄으로 설계한 천년 수도의 백색 대성당 모형을 봉신들 앞에 공개하여 불멸의 질서를 각인시킬 때입니다."
 hitler_grand_architecture_and_art_purge_decision_tooltip:0 "백색 대성당 석조 모형 친람식을 열어 외교력 건축 설파나 계책력 압류 미술품 해외 밀매 판정을 진행하는 전용 이벤트를 시작합니다."
 hitler_grand_architecture_and_art_purge_decision_confirm:0 "천년 수도의 모형을 공개하라!"
 hitler_grand_architecture_event_preview_tt:0 "석조 회랑에서 #V 외교력#! 대건축 모형 설파, #V 계책력#! 압류 미술품 국외 밀매, 또는 안전한 불온 서적 소각 의식 중 하나를 선택합니다"
 villains_religious_decision.0140.t:0 "백색 돔의 환영과 압류된 성화 상자"
 villains_religious_decision.0140.desc:0 "횃불이 일렁이는 석조 회랑 한가운데, 밤새워 깎아 만든 거대한 백색 석회암 대성당과 개선 열주 모형이 위용을 드러냈다. 회랑 한편에서는 사슬갑옷을 입은 병사들이 귀족 저택에서 압류해 온 화려한 성화와 금박 필사본들을 거친 나무 상자에 쓸어 담고 있다.\n\n나는 직접 그린 목탄 설계도 두루마리를 쥐고 숨을 죽인 봉신들 앞에 섰다. 고대 로마조차 초라하게 만들 이 완벽한 비례와 거대한 돔의 숭고함을 설파하여 전 영지의 건설 역량을 하나로 결집할 것인가, 아니면 저 쓸모없는 퇴폐 미술품들을 국경 너머 부유한 상인들에게 비밀리에 고가로 팔아치워 국고를 두둑이 채울 것인가?"
 villains_religious_decision.0140.a:0 "밤새 직접 설계한 백색 대성당 모형의 완벽한 비례를 열변으로 설파한다!"
 villains_religious_decision.0140.a.success:0 "장엄한 천년 수도 청사진에 봉신들과 장인들이 압도됨"
 villains_religious_decision.0140.a.failure:0 "석공 장인이 돔 하중 결함을 지적하자 참지 못하고 불같이 격노함"
 villains_religious_decision.0140.b:0 "압류한 퇴폐 미술품들을 국경 밖 상인들에게 비밀리에 고가로 매각한다."
 villains_religious_decision.0140.b.success:0 "은밀한 국경 경매로 막대한 금화와 사상 통제를 동시에 거머쥠"
 villains_religious_decision.0140.b.failure:0 "측근들의 명화 빼돌리기와 위선적인 밀매 소문이 궁정에 새어나감"
 villains_religious_decision.0140.c:0 "광장에서 불온 서적 소각식을 열고 궁정 화가들에게 영웅 벽화를 명한다."
 hitler_germania_grand_model_modifier:0 "천년 수도 대건축 청사진"
 hitler_germania_grand_model_modifier_desc:0 "거대한 백색 석조 대성당 모형이 영지의 석공과 봉신들에게 광적인 건설 열기를 불어넣고 있습니다."
 hitler_cultural_purification_modifier:0 "퇴폐 예술 압류 및 사상 정화"
 hitler_cultural_purification_modifier_desc:0 "불온 미술품 색출과 엄격한 문화 검열로 불순 세력의 암약을 억누르고 신앙 결속을 다졌습니다."
 hitler_rejected_artist_rage_modifier:0 "무시당한 예술가의 격분"
 hitler_rejected_artist_rage_modifier_desc:0 "완벽하다고 믿었던 건축 설계에 결함이 지적되자 주체할 수 없는 분노로 궁정 행정이 경색되었습니다."
