 cultural_revolution_desc:0 "구시대의 낡은 사상·낡은 문화·낡은 풍속·낡은 관습을 철저히 타파하고, 동방에서 떠오르는 위대한 태양의 붉은 어록 아래 영구 혁명과 대중 조반 투쟁을 설파하는 급진 공산주의 사상입니다."
