 trump_youre_fired_tribunal_decision_select_tt:0 "선택한 인물이 생존해 있으며 감옥에 갇혀 있지 않아야 함"
 trump_youre_fired_tribunal_event_preview_tt:0 "선택한 인물을 원탁 앞에 세우고 #V 관리력#! 관세 재협상, 대상과의 #V 외교력#! 공개 해고 대결, 또는 안전한 충성 서약 중 하나를 집행합니다"
 villains_religious_decision.0130.t:0 "황금 원탁의 심판: 거래의 기술과 해고 선고"
 villains_religious_decision.0130.desc:0 "양털 휘장과 황금 독수리 깃발이 드리워진 평의회 대전 한복판에 무거운 침묵이 내려앉았다. 참나무 원탁 위에 수북이 쌓인 세금 양피지 장부 너머로 호출된 [fired_target.GetTitledFirstName]의 이마에 식은땀이 흐르고, 배석한 귀족들은 숨을 죽인 채 내 입술만 바라보고 있다.\n\n\"솔직히 말해 보지. 이 장부 숫자는 재앙이야. 역사상 최악의 거래라고! 다들 그렇게 말하고 있어.\" 나는 원탁을 손바닥으로 짚고 몸을 앞으로 기울이며 차갑게 쏘아보았다. 지금 저 가련한 패배자에게 감당 못 할 징벌적 관세 청구서를 들이밀어 금고와 약점을 통째로 털어낼 것인가, 아니면 만좌의 앞에서 손가락을 곧게 겨누며 영원히 잊지 못할 해고 통보를 날려 줄 것인가?"
 villains_religious_decision.0130.a:0 "징벌적 관세 칙령을 들이밀어 추가 공납과 이면 각서를 받아낸다!"
 villains_religious_decision.0130.a.success:0 "압도적인 거래의 기술로 금화와 약점을 모두 챙김"
 villains_religious_decision.0130.a.failure:0 "장부 조항의 허점을 역공당해 협상이 결렬됨"
 villains_religious_decision.0130.b:0 "만좌의 앞에서 손가락을 겨누며 외친다. \"넌 해고야!\""
 villains_religious_decision.0130.b.success:0 "가차 없는 해고 선고에 온 궁정이 승자의 권위에 압도됨"
 villains_religious_decision.0130.b.failure:0 "해고당한 신하가 궁정 한복판에서 거세게 맞받아쳐 소동이 벌어짐"
 villains_religious_decision.0130.c:0 "황금 인장이 찍힌 충성 서약서에 서명하게 하고 마지막 기회를 준다."
