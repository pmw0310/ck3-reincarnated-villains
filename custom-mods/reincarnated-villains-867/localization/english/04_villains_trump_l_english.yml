l_english:
 # ============================================================================
 # 04. Donald Trump — Americanism & American
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 bookmark_reincarnated_trump:0 "President Donald Trump"
 bookmark_reincarnated_trump_subheading:0 "President of the Mar-a-Lago Free Zone"
 bookmark_reincarnated_trump_desc:0 "Real estate mogul and 45th & 47th President of the United States—famed for his obsession with border walls and tariffs—Donald Trump has awakened over a millennium in the past in 867 AD right along the ancient Roman border wall of Britain: as the young independent Governor of Northumberland and Cumberland along Hadrian's Wall.\n\nRealizing at once that the Kingdom of Northumbria was doomed to fall to the Sons of Ragnar, he used his signature 'Art of the Deal' to strike a ten-year non-aggression truce with the invading Viking brothers, forged an alliance with Mercia, and betrayed King Aella by launching a war against Northumbria from within! Having proclaimed 'Americanism', can he swallow up Northumbria, rebuild Hadrian's Wall bigger and better than ever, and make Britain great again?"
 dynn_Trump_867:0 "Trump"
 dynn_Trump_867_motto:0 "Make America Great Again!"
 nick_the_president:0 "the Deal-Maker"
 nick_the_president_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] treats every war and alliance as a high-stakes real estate transaction, obsessed with building tremendous border walls and levying massive tariffs on rival faiths."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_trump:0 "President's Navy Executive Surcoat"

 # === [Titles, Polities & Honorifics] ===
 k_united_states:0 "United States of America"
 k_united_states_adj:0 "American"
 d_rep_trump:0 "Mar-a-Lago Free Zone"
 d_rep_trump_adj:0 "Mar-a-Lago"
 e_american_empire:0 "United American Empire"
 e_american_empire_adj:0 "American Imperial"

 # === [Religion, Faith & Holy Sites] ===
 americanism:0 "Americanism"
 americanism_adj:0 "Americanist"
 americanism_adherent:0 "Patriot"
 americanism_adherent_plural:0 "Patriots"
 americanism_desc:0 "A bold ideology fusing the founding myth of a future superpower across the Atlantic with golden prosperity theology, heavy tariffs on rivals, and 'The Art of the Deal'. Rejecting poverty and humility as traits for losers, it preaches that towering wealth, impenetrable walls, and peace through overwhelming strength are the highest proof of favor."
 americanism_house_of_worship:0 "Trump Tower"
 americanism_house_of_worship_plural:0 "Trump Towers"
 americanism_religious_symbol:0 "Stars and Stripes & Golden Eagle"
 americanism_religious_text:0 "The Art of the Deal"
 americanism_priest_male:0 "Lobbyist"
 americanism_priest_male_plural:0 "Lobbyists"
 americanism_bishop_male:0 "Secretary"
 americanism_bishop_male_plural:0 "Secretaries"
 americanism_religious_head_title:0 "President"
 americanism_religious_head_title_name:0 "The White House"
 americanism_ghw_name:0 "Operation Enduring Freedom"
 americanism_ghw_name_plural:0 "Operations Enduring Freedom"
 americanism_high_god_name:0 "God"
 americanism_high_god_name_possessive:0 "God's"
 americanism_high_god_name_alternate:0 "the Lord"
 americanism_high_god_name_alternate_possessive:0 "the Lord's"
 americanism_war_god_name:0 "the Lord of Hosts"
 americanism_war_god_name_possessive:0 "the Lord of Hosts'"
 americanism_devil_name:0 "Satan"
 americanism_devil_name_possessive:0 "Satan's"
 americanism_devotee:0 "MAGA Loyalist"
 americanism_devotee_plural:0 "MAGA Loyalists"
 americanism_positive_afterlife:0 "Heaven"
 americanism_negative_afterlife:0 "Hell"
 americanism_religion:0 "Americanism"
 americanism_religion_adj:0 "Americanist"
 americanism_religion_adherent:0 "Americanist"
 americanism_religion_adherent_plural:0 "Americanists"
 americanism_religion_desc:0 "A secular capitalist ideological tradition sanctifying the Almighty Dollar, the Art of the Deal, and the Founding Fathers to build an empire of tariffs and golden prosperity."
 americanism_religion_opinion:0 "$americanism_religion_adherent$ Opinion"

 # === [Culture, Traditions & Men-at-Arms] ===
 american:0 "American"
 american_prefix:0 "American"
 american_collective_noun:0 "Americans"
 pinkerton_guards:0 "Pinkerton Corporate Guards"
 pinkerton_guards_flavor:0 "#F Dark-cloaked private guild bowmen wearing silver sheriff badges to guard tycoon vaults and tariff walls, commanding high salaries in exchange for heavy war-bow volleys and city, castle, and farmland defense.#!"
 trump_pinkerton_guards_name:0 "Trump Tower Private Security Corps"
 tradition_wall_street_tycoons_name:0 "Wall Street Deal-Makers"
 tradition_wall_street_tycoons_desc:0 "To this culture, diplomacy and warfare alike are grand real estate developments and lucrative deals, leveraging surging capital to build fast, hire mercenaries cheaply, and deploy private corporate guards."
 tradition_wall_street_tycoons_only_tt:0 "Must be of American culture or descended from it"
 culture_parameter_unlock_maa_pinkerton_guards:0 "Can recruit [GetMaA('pinkerton_guards').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 TRUCE_TRUMP_VIKING_DEAL:0 "Art of the Deal Non-Aggression Pact"
 councillor_court_chaplain_americanism:0 "Chief Lobbyist"
 councillor_court_chaplain_americanism_possessive:0 "Chief Lobbyist's"
 d_americanism:0 "White House Directorate"
 d_americanism_adj:0 "White House"
 artifact_trump_cane_sugar_cola_name:0 "Cane-Sugar Cola"
 artifact_trump_cane_sugar_cola_desc:0 "A chilled glass bottle of genuine cane-sugar cola delivered on a silver platter the instant the red desk button is pressed. Brewed strictly without cheap corn syrup for the President's discerning palate, one refreshing gulp melts away stress during high-stakes negotiations."
 trump_build_great_wall_and_tower_decision:0 "Found the United States & Build Trump Tower"
 trump_build_great_wall_and_tower_decision_desc:0 "With all of Northumberland in our hands, it is time to rebuild Hadrian's Wall into the biggest, most beautiful Border Wall in history, erect a Golden Trump Tower, and proclaim the United States of America a thousand years early!"
 trump_build_great_wall_and_tower_decision_tooltip:0 "Found the 'United States of America' and erect the Golden Trump Tower in your capital."
 trump_build_great_wall_and_tower_decision_confirm:0 "It's going to be the greatest country in history!"
 trump_golden_empire_dynasty_modifier:0 "The Art of the Deal & Golden Empire"
 trump_golden_empire_dynasty_modifier_desc:0 "Turning statecraft into prime real estate deals, this dynasty enjoys surging domain taxes and drastically reduced construction costs and build times."
 trump_golden_tower_county_modifier:0 "Golden Trump Tower & Great Border Wall"
 trump_golden_tower_county_modifier_desc:0 "Protected by an impenetrable border wall and dominated by a gleaming golden tower, this county boasts massive tariff revenues and fortifications."
 trump_proclaim_pax_americana_empire_decision:0 "Pax Americana & Proclaim the United American Empire"
 trump_proclaim_pax_americana_empire_decision_desc:0 "From Northumberland and York to Scotland and London, Britannia has become our ultimate real estate portfolio! Now we shall proclaim the United American Empire, open Wall Street in our capital, and usher in an era of Pax Americana!"
 trump_proclaim_pax_americana_empire_decision_tooltip:0 "Found the 'United American Empire' and establish Wall Street in your capital."
 trump_proclaim_pax_americana_empire_decision_confirm:0 "We're going to win so much, you'll get tired of winning!"
 trump_pax_americana_empire_dynasty_modifier:0 "Pax Americana Superpower"
 trump_pax_americana_empire_dynasty_modifier_desc:0 "Ruling the United American Empire through supreme deal-making, this dynasty enjoys expanded domain limits, surging taxes, and cheap construction and mercenaries."
 trump_wall_street_capital_county_modifier:0 "Wall Street Financial Capital"
 trump_wall_street_capital_county_modifier_desc:0 "The financial center of the world beneath the Golden Trump Tower, generating unprecedented tax revenues and rapid development."
 trump_marine_expeditionary_force_name:0 "United States Marine Expeditionary Force"
 trump_monetize_faith_decision:0 "Patriotic Fundraising & Golden Merch Sale"
 trump_monetize_faith_decision_desc:0 "Our tremendous patriots and believers are ready to open their wallets for limited-edition Golden Trump Bibles, gilded sneakers, and Patriot Bonds! Let us convert their fervent devotion into the greatest cash flow in history!"
 trump_monetize_faith_decision_tooltip:0 "Host a Golden Temple fundraising gala where your Stewardship or Diplomacy determines the profits of your relic auction and rally donations."
 trump_monetize_faith_decision_confirm:0 "The best merch, the best fundraising! Order now!"
 trump_super_pac_fundraising_modifier:0 "Super PAC Golden Fundraising"
 trump_super_pac_fundraising_modifier_desc:0 "Grassroots donations and golden merchandise revenues pour into the treasury while improving mercenary contract deals."
 d_nf_trump:0 "Trump Family"
 d_nf_trump_adj:0 "Trump"
 war_867_Trump_Conquest_of_Northumbria:0 "Trump's Betrayal of Northumbria"
 trump_cane_sugar_cola_modifier:0 "Cane-Sugar Cola"
 trump_monetize_faith_event_preview_tt:0 "Opens the Golden Temple Gala event, letting you choose between a [stewardship|E] luxury relic deal, a [diplomacy|E] rally fundraiser, or a safe fixed-price sale"
 villains_religious_decision.0040.t:0 "The Greatest Golden Relic Gala in History"
 villains_religious_decision.0040.desc:0 "Chandeliers blaze across gilded banners as deep-pocketed lords and adoring believers crowd the banquet hall, eager to part with their coin. Upon velvet tables gleam gold-leafed scriptures and limited-edition blessed keepsakes bearing my personal seal.\n\nShall I corner the wealthiest nobles into an exclusive luxury deal, or whip the faithful crowd into a frenzy of grass-roots donations?"
 villains_religious_decision.0040.a:0 "Close a massive, exclusive golden relic deal with the richest lords!"
 villains_religious_decision.0040.a.success:0 "Masterful art of the deal empties noble coffers into your hands"
 villains_religious_decision.0040.a.failure:0 "Cheap gold leaf peels off mid-banquet, sparking a fraud scandal"
 villains_religious_decision.0040.b:0 "Hold a roaring rally to sweep up patriotic donations from the crowd!"
 villains_religious_decision.0040.b.success:0 "Electrified believers hurl sacks of gold onto the stage"
 villains_religious_decision.0040.b.failure:0 "Embarrassing gaffe cools the hall and sends donors walking out"
 villains_religious_decision.0040.c:0 "Sell blessed keepsakes at a safe fixed price to loyal insiders."
 trump_art_of_the_deal_boom_modifier:0 "Golden Relic Deal Boom"
 trump_art_of_the_deal_boom_modifier_desc:0 "Exclusive luxury relic contracts with wealthy nobles keep rivers of gold flowing steadily into the treasury."
 trump_fraud_scandal_modifier:0 "Gilded Relic Fraud Scandal"
 trump_fraud_scandal_modifier_desc:0 "Peeling gold leaf on costly keepsakes sparked an embarrassing fraud uproar among donors and vassals."
 trump_youre_fired_tribunal_decision:0 "Public Performance Tribunal and Dismissal Decree"
 trump_youre_fired_tribunal_decision_desc:0 "In Americanism, bankruptcy and incompetence are unforgivable sins, and only masters of the deal deserve golden grace. Summon a vassal, councillor, or courtier before your gilded council table to audit their performance in front of the entire court. Slam punitive tariff decrees onto the table to extract tribute, or point your finger across the oak board and thunder their dismissal to prove who the true winner is."
 trump_youre_fired_tribunal_decision_tooltip:0 "Summon the selected subject to your council table, opening an event to test Stewardship tariff pressure or an opposed Diplomacy dismissal showdown."
 trump_youre_fired_tribunal_decision_confirm:0 "Summon Them to the Boardroom!"
 trump_youre_fired_tribunal_decision_no_item_selected:0 "No Tribunal Subject Selected"
 trump_youre_fired_tribunal_decision_req_candidate:0 "Must have at least one adult, unimprisoned councillor, vassal, or courtier"
 trump_youre_fired_tribunal_decision_select_tt:0 "The selected character must be alive and unimprisoned"
 trump_youre_fired_tribunal_event_preview_tt:0 "Confront the chosen subject at the council table through a #V Stewardship#! tariff shakeup, an opposed #V Diplomacy#! dismissal duel, or a safe loyalty pledge"
 villains_religious_decision.0130.t:0 "The Golden Council Table: Art of the Tariff and Dismissal"
 villains_religious_decision.0130.desc:0 "Heavy silence falls across the vaulted stone hall beneath banners of blue and gold. Across the polished oak council table strewn with tax parchments and coins, [fired_target.GetTitledFirstName] stands sweating profusely while the assembled nobles hold their breath.\n\n\"Let us be honest here. These ledger numbers are a total disaster. Frankly, the worst deal in the history of our realm, everybody says so.\" Leaning forward with one palm planted firmly on the table, I fix my gaze upon the trembling subject. Shall I slam down a punitive tariff decree to drain their coffers and secure a binding favor, or point straight across the board and thunder their public dismissal before the entire court?"
 villains_religious_decision.0130.a:0 "Slam down a punitive tariff decree to extract gold and a binding favor!"
 villains_religious_decision.0130.a.success:0 "Masterful Tariff Deal Secures Gold and Favor"
 villains_religious_decision.0130.a.failure:0 "Ledger Loophole Exposes a Botched Deal"
 villains_religious_decision.0130.b:0 "Point straight across the table before the whole court: \"You are fired!\""
 villains_religious_decision.0130.b.success:0 "Thunderous Dismissal Awes the Entire Court"
 villains_religious_decision.0130.b.failure:0 "Defiant Subject Talks Back Before the Court"
 villains_religious_decision.0130.c:0 "Have them sign a gold-sealed loyalty pledge and grant one last chance."
 trump_tariff_deal_master_modifier:0 "Master of Punitive Tariff Deals"
 trump_tariff_deal_master_modifier_desc:0 "Relentless pressure at the council table has reshaped tribute and tariff terms in the ruler’s favor."
 trump_youre_fired_authority_modifier:0 "Unforgiving Authority of Dismissal"
 trump_youre_fired_authority_modifier_desc:0 "Publicly dismissing an underperforming subject before the whole court has instilled fear and respect for a true winner."
 trump_bad_deal_humiliation_modifier:0 "Botched Tariff Deal Humiliation"
 trump_bad_deal_humiliation_modifier_desc:0 "Boastful tariff threats backfired over glaring ledger loopholes, denting the ruler’s reputation as a dealmaker."
