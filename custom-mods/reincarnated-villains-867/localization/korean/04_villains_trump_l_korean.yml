 americanism_devotee_plural:0 "마가 열성 지지자"
 americanism_positive_afterlife:0 "천국"
 americanism_negative_afterlife:0 "지옥"
 americanism_religion:0 "아메리카니즘"
 americanism_religion_adj:0 "아메리카니즘"
 americanism_religion_adherent:0 "아메리카니즘 신봉자"
 americanism_religion_adherent_plural:0 "아메리카니즘 신봉자"
 americanism_religion_desc:0 "자본의 섭리와 거래의 기술, 그리고 건국의 아버지들을 신성시하며 관세와 황금의 힘으로 부강한 제국을 건설하려는 세속 자본주의 사상 체계입니다."
