 # === [Culture, Traditions & Men-at-Arms] ===
 khmer_rouge_guerrillas:0 "Khmer Rouge Guerrillas"
 khmer_rouge_guerrillas_flavor:0 "#F Clad in black peasant tunics and red checkered krama scarves, Angkar's jungle guerrillas cost almost nothing in gold upkeep and dominate jungles and wetlands with unmatched ambush screening.#!"
 pol_pot_red_khmers_grand_army_name:0 "Angkar Red Khmer Grand Army"
 tradition_year_zero_collectives_name:0 "Year Zero Jungle Collectives"
 tradition_year_zero_collectives_desc:0 "Emptying old urban centers to organize the entire populace into self-sufficient agrarian collectives and ruthless jungle guerrillas."
 tradition_year_zero_collectives_only_tt:0 "Must be of Angkar Khmer culture or descended from it"
 culture_parameter_unlock_maa_khmer_rouge_guerrillas:0 "Can recruit [GetMaA('khmer_rouge_guerrillas').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 d_angkar:0 "Angkar Standing Committee"
 d_angkar_adj:0 "Angkar"
 councillor_court_chaplain_angkar:0 "Chief Security Cadre"
 pol_pot_khmer_rouge_name:0 "Khmer Rouge Central Division"
 pol_pot_proclaim_democratic_kampuchea_decision:0 "Proclaim Democratic Kampuchea and Year Zero"
 pol_pot_proclaim_democratic_kampuchea_decision_desc:0 "The decadent God-Kings of Angkor and their corrupt temple elites have fallen! It is time to burn away currency, markets, and history itself, and proclaim the birth of 'Democratic Kampuchea'—the agrarian utopia of Year Zero!"
 pol_pot_proclaim_democratic_kampuchea_decision_tooltip:0 "Found 'Democratic Kampuchea' and establish the Year Zero agrarian communist regime."
 pol_pot_proclaim_democratic_kampuchea_decision_confirm:0 "From this day forward, history begins anew at Year Zero!"
 pol_pot_year_zero_utopia_dynasty_modifier:0 "Supreme Organization of Year Zero"
 pol_pot_year_zero_utopia_dynasty_modifier_desc:0 "This dynasty overthrew the old temple kingdoms and founded Democratic Kampuchea, commanding total surveillance and peasant guerrilla mobilization."
 pol_pot_angkar_central_division_name:0 "Angkar Revolutionary Central Division"
 pol_pot_proclaim_angkar_agrarian_empire_decision:0 "Proclaim the Empire of Greater Kampuchea"
 pol_pot_proclaim_angkar_agrarian_empire_decision_desc:0 "The flames of Year Zero have swept from Angkor and Phnom Penh across the Mekong Delta, Champa, and Chenla! Having torn down the old temple kingdoms, we now proclaim the supreme agrarian empire of Southeast Asia—the 'Empire of Greater Kampuchea'!"
 pol_pot_proclaim_angkar_agrarian_empire_decision_tooltip:0 "Found the 'Empire of Greater Kampuchea' and unite mainland Southeast Asia under Angkar."
 pol_pot_proclaim_angkar_agrarian_empire_decision_confirm:0 "Long live Supreme Angkar and Red Kampuchea!"
 pol_pot_red_khmers_supreme_dynasty_modifier:0 "Supreme Architect of Year Zero"
 pol_pot_red_khmers_supreme_dynasty_modifier_desc:0 "This dynasty united Indochina under the Empire of Greater Kampuchea, wielding absolute dread, domain authority, and ideological zeal."
 pol_pot_year_zero_commune_capital_county_modifier:0 "Central Collective Commune No. 1"
 pol_pot_year_zero_commune_capital_county_modifier_desc:0 "The beating heart of Year Zero where the entire population is mobilized day and night for collective farming and defense."
 pol_pot_year_zero_great_purge_decision:0 "Year Zero City Evacuation & Commune Relocation"
 pol_pot_year_zero_great_purge_decision_desc:0 "Urban merchants, currency, and decadent temple life are parasites upon Angkar's pure agrarian utopia! We shall evacuate all townsfolk into the jungle collectives with hoes in hand and reorganize the entire realm into self-sufficient communes!"
 pol_pot_year_zero_great_purge_decision_tooltip:0 "Launch the Year Zero city evacuation, opening an event where your Intrigue or Stewardship determines commune mobilization and harvest results."
 pol_pot_year_zero_great_purge_decision_confirm:0 "Empty the towns and march to the jungle communes!"
 pol_pot_year_zero_commune_labor_modifier:0 "Year Zero Commune Mobilization"
 pol_pot_year_zero_commune_labor_modifier_desc:0 "Mass collective labor drastically reduces construction costs and build times while accelerating levy reinforcement."
 pol_pot_peasant_purification_squad_name:0 "Angkar Peasant Purification Squad"
 pol_pot_arrest_intellectuals_decision:0 "Arrest Reactionary Intellectuals & Angkar Dungeon Purge"
 pol_pot_arrest_intellectuals_decision_desc:0 "Those who can read, scholars who recite scriptures, physicians, and the soft-handed intelligentsia are bourgeois traitors to Angkar! Under the maxim 'To keep you is no benefit, to destroy you is no loss', we shall immediately arrest the intellectuals in our realm and cast them into Angkar's re-education dungeons!"
 pol_pot_arrest_intellectuals_decision_tooltip:0 "Haul the selected intellectual into interrogation, pitting your Intrigue or Learning against theirs to extract confessions and hidden wealth."
 pol_pot_arrest_intellectuals_decision_confirm:0 "Drag them to the Angkar dungeon and extract their confession!"
 pol_pot_arrest_intellectuals_decision_req_candidate:0 "There is at least one un-imprisoned adult intellectual with [learning|E] 10 or higher, or holding an intellectual or scholarly trait, among your courtiers, guests, or direct vassals"
 pol_pot_arrest_intellectuals_decision_select_tt:0 "You must select a reactionary intellectual to imprison in the Angkar security dungeon."
 pol_pot_arrest_intellectuals_decision_effect_tt:0 "[arrested_intellectual.GetShortUIName|U] is denounced as a reactionary intellectual, stripped of wealth, and thrown into the dungeon"
 pol_pot_tuol_sleng_purge_modifier:0 "Angkar Security Interrogation"
 pol_pot_tuol_sleng_purge_modifier_desc:0 "Relentless interrogations and purges in Angkar's security dungeons keep all intellectuals and plotters in the realm paralyzed with terror."
 artifact_pol_pot_failed_paris_transcript_name:0 "Failed Paris Radio-School Transcript"
 artifact_pol_pot_failed_paris_transcript_desc:0 "A humiliating academic transcript from a Paris radio-electricity school recording lost scholarships and failed exams before an inglorious return home. Simmering with lifelong resentment toward bespectacled scholars and exams, it fuels ruthless purges at the expense of genuine learning."
 pol_pot_failed_paris_transcript_modifier:0 "Failed Paris Radio-School Transcript"
 councillor_court_chaplain_angkar_possessive:0 "Chief Security Cadre's"
 pol_pot_year_zero_event_preview_tt:0 "Opens the Year Zero Evacuation event, offering an [intrigue|E] forced march, a high-risk [stewardship|E] fourfold harvest plan, or gradual mobilization"
 pol_pot_arrest_intellectuals_event_preview_tt:0 "Opens the Special Interrogation event against [arrested_intellectual.GetShortUIName], offering an opposed [intrigue|E] duel, an opposed [learning|E] debate, or immediate dungeon chains"
 villains_religious_decision.0070.t:0 "Dawn of Year Zero and the Emptied City"
 villains_religious_decision.0070.desc:0 "Guerrillas clad in crimson scarves beat drums through every street, ordering all townsfolk to abandon the corrupt city at once. Currency, markets, and old class distinctions end today; only the pure agrarian communes of Angkar shall remain.\n\nShall our secret surveillance network drive every last soul into jungle labor camps, or shall I personally design a grand canal grid to quadruple the rice harvest?"
 villains_religious_decision.0070.a:0 "Enforce a total jungle march under Angkar secret surveillance!"
 villains_religious_decision.0070.a.success:0 "Relentless oversight channels the entire populace into commune labor"
 villains_religious_decision.0070.a.failure:0 "Mass desertions and riots shatter the evacuation columns and rations"
 villains_religious_decision.0070.b:0 "Personally draft a nationwide grid of canals to quadruple rice yields!"
 villains_religious_decision.0070.b.success:0 "Miraculous irrigation turns jungle wasteland into a bumper granary!"
 villains_religious_decision.0070.b.failure:0 "Ignorant canal engineering triggers catastrophic floods and famine"
 villains_religious_decision.0070.c:0 "Induct outer-district residents into rural labor teams step by step."
 villains_religious_decision.0080.t:0 "Interrogation Beneath the Single Lamp"
 villains_religious_decision.0080.desc:0 "Upon a wooden chair in the damp stone interrogation chamber sits [arrested_intellectual.GetTitledFirstName], pale and trembling beneath a lone oil lamp. Across the table rest blank confession scrolls and fresh dark ink.\n\nShall I weave a relentless trap of questions to extract a spy confession and hidden gold, or drag this arrogant scholar before a public struggle session to crush their arguments?"
 villains_religious_decision.0080.a:0 "Wring out a full spy confession and every hidden coin through guile!"
 villains_religious_decision.0080.a.success:0 "[arrested_intellectual.GetShortUIName] breaks down, confessing all and surrendering hidden gold"
 villains_religious_decision.0080.a.failure:0 "[arrested_intellectual.GetShortUIName] exploits a lapse in security and slips out of reach!"
 villains_religious_decision.0080.b:0 "Refute their bourgeois learning in a public ideological struggle session!"
 villains_religious_decision.0080.b.success:0 "Crushing ideological rebuttal forces tearful self-criticism and conversion"
 villains_religious_decision.0080.b.failure:0 "Sharp counterarguments leave you tongue-tied and humiliated before the court"
 villains_religious_decision.0080.c:0 "Skip the questioning and throw them straight into dungeon chains."
 pol_pot_year_zero_miracle_harvest_modifier:0 "Year Zero Miracle Harvest"
 pol_pot_year_zero_miracle_harvest_modifier_desc:0 "Newly dug irrigation grids and commune labor unexpectedly aligned to produce overflowing granaries."
 pol_pot_commune_famine_modifier:0 "Year Zero Commune Famine"
 pol_pot_commune_famine_modifier_desc:0 "Reckless forced marches and disastrous canal plans ruined the paddies and plunged the communes into famine."
 pol_pot_arrest_intellectuals_decision_no_item_selected:0 "No old-society intellectual target selected"
