 # === [Culture, Traditions & Men-at-Arms] ===
 tradition_iron_wall_citadels_name:0 "Iron Wall Citadel Keepers"
 tradition_iron_wall_citadels_desc:0 "Surrounded on every frontier by numerically superior foes, this culture fortifies every castle into an unyielding iron wall and maintains permanent elite commando units ready to strike behind enemy lines."
 tradition_iron_wall_citadels_israeli_only_tt:0 "Must be of Israeli culture or descended from it"
 culture_parameter_unlock_maa_sayeret_commandos:0 "Can recruit [GetMaA('sayeret_commandos').GetName] as [men_at_arms|E]"
 sayeret_commandos:0 "Sayeret Matkal Commandos"
 sayeret_commandos_flavor:0 "#F Elite General Staff reconnaissance commandos reporting directly to the Prime Minister, trained for deep-penetration night raids, bedsheet extractions, and lethal strikes across deserts and hills.#!"
 netanyahu_idf_defense_force_army_name:0 "Israel Defense Forces Main Brigade"
 netanyahu_lions_of_zion_army_name:0 "Lions of Zion Guard Division"
 netanyahu_iron_dome_reserve_army_name:0 "Emergency Coalition Sayeret Unit"

 # === [Decisions, Events, Modifiers & Relics] ===
 d_nf_netanyahu:0 "Netanyahu Family"
 d_nf_netanyahu_adj:0 "Netanyahu"
 yonatan_married_to_sayeret_modifier:0 "Married to the Commando Unit"
 yonatan_married_to_sayeret_modifier_desc:0 "Turning aside domestic comfort and courtship alike, this lifelong bachelor commander has pledged every waking hour to night-raid drills and hostage-rescue readiness."
 israeli:0 "Israeli"
 israeli_prefix:0 "Israeli"
 israeli_collective_noun:0 "Israelis"
 netanyahu_sayeret_initial_troops:0 "1st Sayeret Matkal Commando Unit"
 councillor_court_chaplain_zionism:0 "Chief Rabbi"
 councillor_court_chaplain_zionism_possessive:0 "Chief Rabbi's"
 d_zionism:0 "Knesset Security Cabinet"
 d_zionism_adj:0 "Knesset"
 artifact_netanyahu_red_line_bomb_placard_name:0 "Prime Minister's Red-Line Fuse-Bomb Placard"
 artifact_netanyahu_red_line_bomb_placard_desc:0 "A speech-ready parchment placard bearing a comically round sputtering fuse bomb bisected by a bright crimson paint stroke. Whenever coalition partners waver or corruption hearings draw near, hoisting this placard from the ramparts buries every scandal beneath an instant security emergency."
 artifact_netanyahu_pink_champagne_ledger_name:0 "Secret Gift Ledger of Friendship Pink Champagne"
 artifact_netanyahu_pink_champagne_ledger_desc:0 "A confidential ledger listing crates of vintage pink sparkling wine and fine cigars delivered by wealthy magnates purely out of warm personal friendship. Its backroom connections fatten revenues and hostile schemes, though vassals eye the crates with sour suspicion."
 artifact_relic_western_wall_foundation_stone_name:0 "Reliquary of the Western Wall Foundation Stone"
 artifact_relic_western_wall_foundation_stone_desc:0 "A gilt-bronze reliquary enshrining an ancient stone fragment from the Western Wall of Jerusalem, revered as the foremost emblem of Zionist return."
 artifact_relic_scroll_of_zionist_independence_name:0 "Parchment Scroll of Zionist Independence"
 artifact_relic_scroll_of_zionist_independence_desc:0 "The historic parchment proclamation signed along the Mediterranean coast of Jaffa and Tel Aviv, declaring the rebirth of sovereign Jewish statehood."
 artifact_relic_maccabean_bronze_menorah_name:0 "Maccabean Warrior Bronze Menorah of Galilee"
 artifact_relic_maccabean_bronze_menorah_desc:0 "A seven-branched bronze menorah from the Maccabean revolt unearthed beside the Sea of Galilee, lit whenever Sayeret commandos swear their oath before battle."
 artifact_relic_sinai_covenant_tablet_shard_name:0 "Shard of the Sinai Covenant Tablet"
 artifact_relic_sinai_covenant_tablet_shard_desc:0 "A weathered stone fragment recovered from the craggy heights of Mount Sinai, still bearing crisp ancient Hebrew inscriptions."
 artifact_relic_northern_iron_wall_lion_standard_name:0 "Lion of Judah Standard of the Northern Iron Wall"
 artifact_relic_northern_iron_wall_lion_standard_desc:0 "A blue-and-white Lion of Judah battle standard carried by vanguard garrisons guarding the northern approaches toward Damascus."
 netanyahu_red_line_bomb_placard_modifier:0 "Prime Minister's Red-Line Fuse-Bomb Placard"
 netanyahu_pink_champagne_ledger_modifier:0 "Secret Gift Ledger of Friendship Pink Champagne"
 netanyahu_state_of_israel_dynasty_modifier:0 "Guardians of the Iron Wall of Zion"
 netanyahu_state_of_israel_dynasty_modifier_desc:0 "Having restored the sovereign State of Israel in the Promised Land, this dynasty commands fierce cohesion in defensive warfare and heavy infantry combat."
 netanyahu_greater_israel_empire_dynasty_modifier:0 "Greater Israeli Hegemony of David and Solomon"
 netanyahu_greater_israel_empire_dynasty_modifier_desc:0 "Commanding the Levant from Sinai to Damascus through iron citadels and shadow intelligence, this dynasty towers over every rival empire."
 netanyahu_eternal_jerusalem_capital_county_modifier:0 "Eternal Golden Capital of Jerusalem"
 netanyahu_eternal_jerusalem_capital_county_modifier_desc:0 "An impregnable golden metropolis ringed with layered ramparts, counter-siege batteries, thriving halls, and arsenals."
 netanyahu_iron_dome_bastion_modifier:0 "Bomb-Placard Fearmongering and Iron Dome"
 netanyahu_iron_dome_bastion_modifier_desc:0 "Terrified by the Prime Minister's vivid cartoon-bomb speech warning that enemy doomsday weapons are nine-tenths complete, nobles and merchants poured funds into precision counter-siege batteries."
 netanyahu_iron_dome_fort_county_modifier:0 "Iron Dome Fortified Shield Network"
 netanyahu_iron_dome_fort_county_modifier_desc:0 "Reinforced iron canopies and rapid-fire counter-batteries neutralize incoming siege fire across the county's strongholds."
 netanyahu_iron_dome_budget_overrun_modifier:0 "Recycled Cartoon-Bomb Placard Embarrassment"
 netanyahu_iron_dome_budget_overrun_modifier_desc:0 "Vassals noticed you brought out the exact same nine-tenths-full bomb drawing two years ago, tanking your emergency defense fundraising amid open jeers."
 netanyahu_judicial_overhaul_triumph_modifier:0 "King Bibi's Judicial Overhaul and Indefinite Trial Delay"
 netanyahu_judicial_overhaul_triumph_modifier_desc:0 "Citing an urgent security crisis, you stripped the high judges of impeachment power and struck a backroom coalition deal so nobody dares mention your pink-wine ledgers."
 netanyahu_judicial_protest_backlash_modifier:0 "All-Night Torchlight Protests Against Judicial Overhaul"
 netanyahu_judicial_protest_backlash_modifier_desc:0 "Outraged by your brazen attempt to gut the courts and dodge corruption charges, crowds blow ram's horns and surround the Prime Minister's residence with torches every night."
 netanyahu_defense_pact_arsenal_modifier:0 "Shameless Allied Defense-Invoice Diplomacy"
 netanyahu_defense_pact_arsenal_modifier_desc:0 "Politely ignoring every allied plea for restraint while billing them down to the last copper coin has sharply cut castle construction and army upkeep costs."
 netanyahu_mossad_shadow_network_modifier:0 "Dread of the Exploding Golden Pigeon-Box"
 netanyahu_mossad_shadow_network_modifier_desc:0 "Foreign commanders now leap out of windows at the mere sight of a gift-wrapped Mossad scroll case or carrier-pigeon tube."
 netanyahu_mossad_compromised_cell_modifier:0 "Brazen Nighttime Security-Drill Briefing"
 netanyahu_mossad_compromised_cell_modifier_desc:0 "Caught red-handed outside the target's bedroom, your spokesman shamelessly claimed the raid was a complimentary nighttime guard-readiness inspection."
 netanyahu_secret_tunnel_excuse_modifier:0 "Mockery Over the Secret Stable-Tunnel Briefing"
 netanyahu_secret_tunnel_excuse_modifier_desc:0 "After blowing up an innocent donkey stable by mistake, your cabinet insisted an enemy underground command tunnel was hidden beneath the hay trough, drawing widespread ridicule."
 rival_mossad_raid_exposed:0 "Mossad operatives sent by [CHARACTER.GetShortUIName] were caught outside [TARGET_CHARACTER.GetShortUIName]'s bedroom and brazenly claimed it was a complimentary guard drill."
 rival_mossad_raid_exposed_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] exposed [CHARACTER.GetShortUIName]'s brazen midnight Mossad raid and swore bloody vengeance."
 netanyahu_proclaim_state_of_israel_decision:0 "Proclaim the State of Israel"
 netanyahu_proclaim_state_of_israel_decision_desc:0 "After millennia of dispersion, the children of Zion hold firm command over Jerusalem and the coasts of Palestine. Now is the hour to hoist the blue-and-white Star of David high above the Temple Mount and proclaim the sovereign State of Israel!"
 netanyahu_proclaim_state_of_israel_decision_tooltip:0 "Unite Palestine and surrounding strongholds to found the State of Israel and muster an elite Sayeret Matkal brigade."
 netanyahu_proclaim_state_of_israel_decision_confirm:0 "Raise the Star of David above Jerusalem!"
 netanyahu_proclaim_greater_israel_decision:0 "Proclaim Greater Israel"
 netanyahu_proclaim_greater_israel_decision_desc:0 "From the crags of Mount Sinai to the Sea of Galilee and the gates of Damascus, no empire on earth can breach our iron wall. The moment has come to proclaim an unbreakable Greater Israel surpassing the ancient glory of David and Solomon!"
 netanyahu_proclaim_greater_israel_decision_tooltip:0 "Command Palestine, Jordan, Sinai, and Damascus to found Greater Israel and exalt Jerusalem as an eternal golden capital."
 netanyahu_proclaim_greater_israel_decision_confirm:0 "Let the Iron Wall of Zion stand forever!"
 netanyahu_iron_dome_fortification_decision:0 "Bomb-Placard Security Briefing and Iron Dome Budget"
 netanyahu_iron_dome_fortification_decision_desc:0 "Meddlesome high judges are once again waving ledgers of gifted pink wine and fine cigars while muttering about putting the Prime Minister on trial! Clearly, it is time to summon every vassal and envoy atop Jerusalem's ramparts and hoist a giant cartoon bomb placard with a bright red line. Scare up massive Iron Dome fortification funds—or declare a security emergency to muzzle the courts indefinitely!"
 netanyahu_iron_dome_fortification_decision_tooltip:0 "Wave the red-line bomb placard to fund Iron Dome ramparts, or declare an emergency to gut the high judges and postpone your corruption trial."
 netanyahu_iron_dome_fortification_decision_confirm:0 "Fetch the red paint and my bomb placard!"
 netanyahu_iron_dome_fortification_event_preview_tt:0 "Use #V Diplomacy and Martial#! to scare up full Iron Dome fortifications with your bomb placard, or test #V Intrigue and Stewardship#! to gut the courts, postpone your trial, and call up Sayeret reserves."
 netanyahu_mossad_targeted_operation_decision:0 "Mossad Exploding Pigeon-Box and Midnight Raid"
 netanyahu_mossad_targeted_operation_decision_desc:0 "In peacetime, nothing projects preemptive self-defense like striking rivals in their sleep! Slip Sayeret commandos into a target's bedroom to roll them up in their bedsheets, or mail them a gilded carrier-pigeon scroll case packed with clockwork blackpowder disguised as a peace gift. Even if the wrong building blows up, we can simply announce a secret enemy tunnel was underneath it!"
 netanyahu_mossad_targeted_operation_decision_tooltip:0 "Select an in-range rival, neighboring foreign ruler, vassal, or courtier in peacetime for a bedsheet abduction, exploding pigeon-box gift, or pink-wine vault heist."
 netanyahu_mossad_targeted_operation_decision_confirm:0 "Wrap the ticking scroll case! Launch the operation!"
 netanyahu_mossad_targeted_operation_decision_no_item_selected:0 "You must first select a target character for the Mossad operation"
 netanyahu_mossad_targeted_operation_decision_req_candidate:0 "You must have at least one adult rival or neighboring ruler within diplomatic and operational range, or an adult vassal, councillor, courtier, or prisoner"
 netanyahu_mossad_targeted_operation_decision_select_tt:0 "The selected target must be a living adult within diplomatic and operational range"
 netanyahu_mossad_targeted_operation_event_preview_tt:0 "Attempt a high-risk bedsheet abduction, exploding pigeon-box assassination, or pink-wine bribery heist, with higher target rank and greater distance sharply reducing your odds."
 villains_religious_decision.0210.t:0 "The Red-Line Bomb Placard Atop Jerusalem"
 villains_religious_decision.0210.desc:0 "Beneath the torchlit ramparts of Jerusalem stand my vassals, foreign merchant envoys, and a row of stern high judges clutching ledgers of my gifted pink wine and imported cigars, waiting to serve an indictment.\n\nClearing my throat dramatically, I hoist a massive parchment drawing of a round sputtering cartoon bomb and slash a bright red paint line across its neck! \"My friends, enemy doomsday weapons are already nine-tenths full! Right here is the red line!\" Shall I use this terrifying diagram to shake down huge budgets for Iron Dome rampart batteries, or declare a wartime security crisis to strip those pesky judges of their authority first?"
 villains_religious_decision.0210.a:0 "Shake the placard! \"Nine-tenths full! Hand over the Iron Dome rampart budget at once!\""
 villains_religious_decision.0210.a.success:0 "Panicked nobles pour gold into Iron Dome counter-siege batteries across every wall!"
 villains_religious_decision.0210.a.failure:0 "\"Didn't you show that exact nine-tenths bomb drawing two years ago?!\" Jeers erupt!"
 villains_religious_decision.0210.b:0 "\"A trial during an emergency?!\" Suspend the judges' powers and strike an extremist coalition deal!"
 villains_religious_decision.0210.b.success:0 "Your trial is postponed indefinitely and emergency Sayeret reserves muster!"
 villains_religious_decision.0210.b.failure:0 "Furious judges and citizens blow ram's horns and ring your residence with torches!"
 villains_religious_decision.0210.c:0 "Hand allied envoys a hefty defense invoice to subsidize our castle walls and armories."
 villains_religious_decision.0220.t:0 "The Ticking Golden Pigeon-Box and the Tunnel Script"
 villains_religious_decision.0220.desc:0 "On the table of Jerusalem's underground war room sits a bedroom chart of [mossad_target.GetTitledFirstName] beside a luxury gilded carrier-pigeon scroll case packed with a clockwork gunpowder trigger. In the corner, my spokesman is already rehearsing a backup statement declaring that an enemy underground tunnel was definitely hidden beneath whatever building gets hit by mistake.\n\nShall I send Sayeret commandos over the wall to roll [mossad_target.GetFirstNameNoTooltip] up in their bedsheets straight to Jerusalem's dungeon, or have this ticking peace gift delivered to their bedside?"
 villains_religious_decision.0220.a:0 "Entebbe-style! Roll them up in their bedsheets and haul them to Jerusalem's dungeon!"
 villains_religious_decision.0220.a.success:0 "While guards yawn, your team hauls the target in their bedsheets straight to the dungeon!"
 villains_religious_decision.0220.a.failure:0 "Spotted fleeing, your spokesman claims it was a complimentary nighttime guard inspection!"
 villains_religious_decision.0220.b:0 "Deliver the gilded clockwork gunpowder pigeon-box disguised as a peace offering!"
 villains_religious_decision.0220.b.success:0 "The instant the latch clicks open, a blast erases the target without a trace!"
 villains_religious_decision.0220.b.failure:0 "The courier's donkey trips and blows up a stable, so you claim a tunnel was under the trough!"
 villains_religious_decision.0220.c:0 "Bribe the guards with vintage pink wine and quietly loot their vault and blackmail ledgers."
 villains_religious_decision.0220.c.success:0 "Tipsy guards pass out over pink wine while your agents lift gold and a favor!"
 villains_religious_decision.0220.c.failure:0 "The guards guzzle all your vintage pink wine and slam the vault door shut!"
 netanyahu_dynastic_polarization_modifier:0 "Netanyahu Dynastic Polarization"
 netanyahu_dynastic_polarization_modifier_desc:0 "Decades of uncompromising security posturing and bitter feuds with judicial elites have entrenched deep-seated veto resentment against the Netanyahu dynasty across the parliament and electorates."
 netanyahu_judicial_protest_crisis_modifier:0 "Judicial Overhaul Backlash & Street Protests"
 netanyahu_judicial_protest_crisis_modifier_desc:0 "Furious backlash against the judicial overhaul and perceived authoritarian overreach has triggered relentless mass street protests and strikes across the capital, plunging public confidence in the premiership to historic lows."
 netanyahu_knesset_strategic_mobilization_decision:0 "Knesset Strategic Maneuver & General Election Mobilization"
 netanyahu_knesset_strategic_mobilization_decision_desc:0 "Surrounded by hostile borders and facing relentless impeachment maneuvers by domestic rivals, retaining the premiership demands aggressive strategic agility. Shall we spend campaign slush funds on backroom deals to dominate the coalition, or declare a national emergency and summon the Sayeret Commandos?"
 netanyahu_knesset_strategic_mobilization_decision_tooltip:0 "Mobilize parliamentary resources and military assets to maximize election voting strength for 5 years or instantly raise elite special forces."
 netanyahu_knesset_strategic_mobilization_decision_confirm:0 "Decree Strategic Knesset Action!"
 netanyahu_knesset_strategic_mobilization_event_preview_tt:0 "Triggers an event to choose between an all-out election victory push, emergency Sayeret mobilization, or a Netanyahu-exclusive 'Mr. Security' national rally."
 villains_religious_decision.0230.t:0 "Battle for the Knesset: Power Preservation & National Mobilization"
 villains_religious_decision.0230.desc:0 "Uproar echoes through the parliamentary chamber. Opposition factions and judicial magistrates demand resignation over corruption allegations, while across the frontier hostile armies test our resolve.\n\nRetaining power and safeguarding the realm demands decisive action. Shall we distribute ministries and patronage to lock in an absolute parliamentary majority, or call up the Sayeret Commandos to impose order through unyielding strength?"
 villains_religious_decision.0230.a:0 "Backroom Coalition Accord: Shower allies with gold and portfolios! (Election Victory Focus)"
 villains_religious_decision.0230.a.toast:0 "Knesset Majority Coalition Sealed"
 villains_religious_decision.0230.b:0 "Emergency Military Mobilization: Summon Sayeret Commandos to the colors! (Elite Troop Recruitment)"
 villains_religious_decision.0230.b.toast:0 "Sayeret Strike Force Formed"
 villains_religious_decision.0230.c:0 "Declare National Emergency: Rally all factions under the banner of 'Mr. Security'! (Hybrid Focus)"
 villains_religious_decision.0230.c.toast:0 "'Mr. Security' Electoral Rallying Cry Achieved"
 netanyahu_sayeret_mobilized_regiment_name:0 "Knesset Sayeret Strike Brigade"
 netanyahu_knesset_election_victory_modifier:0 "Knesset Majority Coalition Hegemony"
 netanyahu_knesset_election_victory_modifier_desc:0 "Flawless backroom political maneuvering and judicial suppression secure ironclad parliamentary dominance, guaranteeing overwhelming election victory."
 netanyahu_iron_security_modifier:0 "Iron Security Total Mobilization"
 netanyahu_iron_security_modifier_desc:0 "Rapid reinforcement of elite special forces and fortress defenses ensures immediate destruction of any hostile border provocation."
 netanyahu_mr_security_crisis_modifier:0 "'Mr. Security' Wartime Rally Stance"
 netanyahu_mr_security_crisis_modifier_desc:0 "Leveraging external crisis to unify the populace behind a single leader, seizing supremacy in both election ballots and martial command."
