 # === [Culture, Traditions & Men-at-Arms] ===
 idi_amin_simba_army_name:0 "Uganda Army Simba Brigade"
 uganda_simba_battalion:0 "Simba Battalion"
 uganda_simba_battalion_flavor:0 "#F Named after the Swahili word for 'Lion', Idi Amin's lion-shield shock warriors suffer in freezing winters but crush foes across East African drylands and floodplains with near-heavy-infantry melee power and toughness.#!"
 ugandan:0 "Ugandan"
 ugandan_prefix:0 "Ugandan"
 ugandan_collective_noun:0 "Ugandans"
 tradition_simba_warlordism_name:0 "Simba Military Junta"
 tradition_simba_warlordism_desc:0 "A military junta culture where the Field Marshal personal prowess, dread, and loyal Simba shock battalions stand above every law."
 tradition_simba_warlordism_only_tt:0 "Must be of Ugandan culture or descended from it"
 culture_parameter_unlock_maa_uganda_simba_battalion:0 "Can recruit [GetMaA('uganda_simba_battalion').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 d_aminism:0 "Supreme Defense Council"
 d_aminism_adj:0 "Supreme Defense Council"
 councillor_court_chaplain_aminism:0 "State Research Director"
 flav_idi_amin_king_male:0 "Field Marshal"
 flav_idi_amin_emperor_male:0 "Supreme Field Marshal"
 idi_amin_proclaim_uganda_republic_decision:0 "Proclaim the Second Republic of Uganda & President for Life"
 idi_amin_proclaim_uganda_republic_decision_desc:0 "Our Simba Battalion has secured Sennar and Alodia along the Upper Nile! Now it is time to award ourselves the Victoria Cross and the baton of Field Marshal, proclaiming the invincible military state of the 'Last King of Scotland'—the 'Second Republic of Uganda'!"
 idi_amin_proclaim_uganda_republic_decision_tooltip:0 "Found the 'Second Republic of Uganda' and muster 1,000 Simba Battalion troops."
 idi_amin_proclaim_uganda_republic_decision_confirm:0 "I am the President for Life and Field Marshal of Uganda!"
 idi_amin_last_king_of_scotland_dynasty_modifier:0 "Last King of Scotland & Field Marshal for Life"
 idi_amin_last_king_of_scotland_dynasty_modifier_desc:0 "This dynasty founded the Second Republic of Uganda and bestowed upon itself grand military honors, projecting overwhelming prowess and dread."
 idi_amin_proclaim_british_conqueror_empire_decision:0 "Proclaim Conqueror of the British Empire & Grand Empire of Uganda"
 idi_amin_proclaim_british_conqueror_empire_decision_desc:0 "Our march from the Upper Nile has swallowed Nubia, Kordofan, and the savannas of Darfur! Worthy of the title 'Lord of All the Beasts of the Earth and Fishes of the Sea' and 'Conqueror of the British Empire', we now proclaim the 'Grand Empire of Uganda'!"
 idi_amin_proclaim_british_conqueror_empire_decision_tooltip:0 "Found the 'Grand Empire of Uganda' and muster 2,000 Simba Battalion troops."
 idi_amin_proclaim_british_conqueror_empire_decision_confirm:0 "All beasts of the earth and fishes of the sea, bow before the Field Marshal!"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier:0 "Lord of All the Beasts of the Earth and Fishes of the Sea"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier_desc:0 "This dynasty conquered East Africa and established the Grand Empire of Uganda, commanding terrifying dread and elite knights."
 idi_amin_kampala_command_capital_modifier:0 "Kampala High Command & Nile Crocodile Pits"
 idi_amin_kampala_command_capital_modifier_desc:0 "Home to the Field Marshal's golden banquet hall and crocodile execution pits, the imperial capital boasts high tribute and fortifications."
 idi_amin_economic_war_expulsion_decision:0 "Declare Economic War & Expropriate Merchant Wealth"
 idi_amin_economic_war_expulsion_decision_desc:0 "Last night in a dream, the Almighty revealed His command! We shall launch a grand 'Economic War'—confiscating the shops and gold of wealthy merchants across the realm and distributing the spoils to our loyal Simba officers!"
 idi_amin_economic_war_expulsion_decision_tooltip:0 "Declare an Economic War and open an event where your Martial or Stewardship determines the spoils of seizing merchant districts."
 idi_amin_economic_war_expulsion_decision_confirm:0 "From today, every shop and treasury belongs to our officers!"
 idi_amin_economic_war_spoils_modifier:0 "Economic War Spoils Distribution"
 idi_amin_economic_war_spoils_modifier_desc:0 "Generous distribution of confiscated merchant properties among military officers boosts vassal loyalty and reduces army upkeep."
 idi_amin_srb_crocodile_feast_decision:0 "State Research Bureau Secret Banquet & Crocodile Execution"
 idi_amin_srb_crocodile_feast_decision_desc:0 "There is no mercy for traitors who dare oppose His Excellency the President for Life! Send the State Research Bureau agents to drag them into the basement. Tonight a special dish shall grace the Field Marshal's table, and the bones shall be tossed to the hungry crocodiles of the Nile!"
 idi_amin_srb_crocodile_feast_decision_tooltip:0 "Drag your chosen rival to the Nile crocodile pool, testing your Prowess or Intrigue for a terrifying execution spectacle."
 idi_amin_srb_crocodile_feast_decision_confirm:0 "Set the table, and throw the leftovers to the Nile crocodiles!"
 idi_amin_srb_crocodile_feast_decision_req_candidate:0 "You have an adult prisoner, or a rival, nemesis, or disgruntled courtier or vassal with opinion -25 or lower"
 idi_amin_srb_crocodile_feast_decision_select_tt:0 "You must select a target for the State Research Bureau execution."
 idi_amin_srb_crocodile_feast_decision_effect_tt:0 "[crocodile_victim.GetShortUIName|U] is dragged to the State Research Bureau basement, stripped of wealth, and devoured at the Field Marshal's banquet"
 idi_amin_crocodile_execution_modifier:0 "Crocodiles of the Nile & the Marshal's Table"
 idi_amin_crocodile_execution_modifier_desc:0 "Terrified of ending up on the Field Marshal's dinner plate or in the jaws of Nile crocodiles, all vassals and plotters cower in obedience."
 artifact_idi_amin_scotland_medal_rack_name:0 "Self-Awarded Medal Rack of the Last King of Scotland"
 artifact_idi_amin_scotland_medal_rack_desc:0 "A chest-spanning rack of self-bestowed Victoria Crosses and Scottish royal medallions heavy enough to rip uniform seams. Its deafening metallic jingle and sheer audacity strike dread into foes across the battlefield."
 idi_amin_scotland_medal_rack_modifier:0 "Self-Awarded Medal Rack of the Last King of Scotland"
 councillor_court_chaplain_aminism_possessive:0 "State Research Director's"
 idi_amin_economic_war_event_preview_tt:0 "Opens the Economic War event, offering a [martial|E] military seizure, a high-risk [stewardship|E] state trade guild takeover, or a safe protection levy"
 idi_amin_crocodile_feast_event_preview_tt:0 "Opens the Nile Crocodile Feast event with [crocodile_victim.GetShortUIName], offering a bare-handed [prowess|E] bout, an [intrigue|E] public drowning, or a safe caged execution"
 villains_religious_decision.0090.t:0 "Trumpets of the Economic War"
 villains_religious_decision.0090.desc:0 "Armed warriors of the Simba Battalion ring the bustling merchant quarter where silk, spices, and gold change hands. Terrified traders clutch their ledgers awaiting my decree, while my officers behind me eye the keys to the richest storehouses with hungry grins.\n\nShall I unleash the troops to seize the warehouses and reward my loyal commanders, or take personal charge of a grand state trade guild myself?"
 villains_religious_decision.0090.a:0 "Send in the Simba Battalion to seize the shops and reward loyal officers!"
 villains_religious_decision.0090.a.success:0 "Swift military seizure secures overflowing coffers and fierce army loyalty"
 villains_religious_decision.0090.a.failure:0 "Unchecked looting and fires reduce the rich market quarter to ashes"
 villains_religious_decision.0090.b:0 "Reorganize every seized shop into a state guild under my personal management!"
 villains_religious_decision.0090.b.success:0 "Unexpected commercial brilliance sends trade profits soaring!"
 villains_religious_decision.0090.b.failure:0 "Baffling ledgers and botched orders paralyze trade across the realm"
 villains_religious_decision.0090.c:0 "Spare their shops in exchange for a hefty special protection tribute."
 villains_religious_decision.0100.t:0 "Bloody Banquet at the Crocodile Pool"
 villains_religious_decision.0100.desc:0 "Below the torchlit riverside pavilion, massive Nile crocodiles snap their jaws in the murky shallows, yellow eyes gleaming in the dark. Dragged to the water edge, [crocodile_victim.GetTitledFirstName] begs pitifully for mercy while my assembled vassals swallow hard.\n\nShall I unbind the prisoner to knock them into the jaws with my own bare fists like a heavyweight champion, or have the secret police stage a chilling execution?"
 villains_religious_decision.0100.a:0 "Cut the ropes! I will knock them into the crocodile jaws with my own fists!"
 villains_religious_decision.0100.a.success:0 "A thunderous bare-knuckle blow sends the victim flying into the jaws!"
 villains_religious_decision.0100.a.failure:0 "Desperate resistance leaves you wounded before guards finish the deed"
 villains_religious_decision.0100.b:0 "Have secret police agents stage a chilling drowning before the vassals."
 villains_religious_decision.0100.b.success:0 "Merciless spectacle freezes every scheming vassal in silent terror"
 villains_religious_decision.0100.b.failure:0 "Grotesque excess sickens the attending nobles and stirs revulsion"
 villains_religious_decision.0100.c:0 "Safely shove the bound prisoner through the iron grate into the water."
 idi_amin_economic_boom_modifier:0 "State Trade Guild Boom"
 idi_amin_economic_boom_modifier_desc:0 "Seized merchant networks thrived against all expectations, enriching both the treasury and the officer corps."
 idi_amin_economic_collapse_modifier:0 "Economic War Market Collapse"
 idi_amin_economic_collapse_modifier_desc:0 "Driving out skilled traders in favor of innumerate soldiers left storehouses empty and markets paralyzed."
 idi_amin_srb_crocodile_feast_decision_no_item_selected:0 "No rival or prisoner selected for execution"
 idi_amin_coronation_true_king_of_scotland_decision:0 "Coronation as the True Last King of Scotland"
 idi_amin_coronation_true_king_of_scotland_decision_desc:0 "Marching all the way from the Upper Nile across stormy northern seas, our Simba Battalion has seized the heartland of Scotland in the flesh! No longer a boastful self-awarded title, it is time to ascend the ancient coronation stone to the thunder of massed bagpipes and tartan-clad Simba guards as the undisputed Last King of Scotland!"
 idi_amin_coronation_true_king_of_scotland_decision_tooltip:0 "Claim true sovereignty over Scotland, learn the Goidelic tongue, and muster 1,000 Highland Tartan Simba Guards."
 idi_amin_coronation_true_king_of_scotland_decision_confirm:0 "Sound the bagpipes! I am the true King of Scotland!"
 idi_amin_true_king_of_alba_dynasty_modifier:0 "True Sovereign of Scotland and Uganda"
 idi_amin_true_king_of_alba_dynasty_modifier_desc:0 "Having marched from the Nile to the Scottish Highlands to turn an outrageous boast into reality, this dynasty commands stunned awe across every culture."
 idi_amin_edinburgh_bagpipe_palace_modifier:0 "Field Marshal's Highland Bagpipe Palace"
 idi_amin_edinburgh_bagpipe_palace_modifier_desc:0 "Echoing day and night with Ugandan military parades and Scottish bagpipe ensembles, this northern seat enjoys booming taxes and festive local acclaim."
 idi_amin_highland_simba_guard_name:0 "Highland Tartan Simba Guard"
