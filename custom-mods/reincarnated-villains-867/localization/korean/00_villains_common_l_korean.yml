 VILLAINS_CHRONICLE_HISTORY_HEADER:0 "사신의 모래시계 연대기 기록"
 villains_chronicle_entry_opening_867:0 "#S 서기 867년 새해 첫날, 미래의 기억과 기벽을 품은 영혼들이 중세 각지에서 눈을 뜨자 사신이 모래시계를 뒤집었습니다.#!"
 villains_chronicle_entry_first_gen_death:0 "1대 전생자 [SituationHistoryEntry.GetVariable( 'actor_char' ).Char.GetFullNameNicknamed](이)가 파란만장한 이세계의 삶을 마감했습니다."
 villains_chronicle_entry_polity_founded:0 "[SituationHistoryEntry.GetVariable( 'founder' ).Char.GetShortUIName](이)가 중세 한복판에 [SituationHistoryEntry.GetVariable( 'founded_title' ).Title.GetDefinitiveName](을)를 선포했습니다!"
 villains_chronicle_entry_dynasty_fallen:0 "[SituationHistoryEntry.GetVariable( 'actor_char' ).Char.GetDynasty.GetName] 가문이 모든 통치 기반을 잃고 역사의 뒤안길로 몰락했습니다."
 villains_chronicle_entry_phase_heirs_era:0 "#S 마지막 1대 전생자가 숨을 거두면서 연대기가 후예들의 시대로 접어들었습니다.#!"
 villains_chronicle_entry_phase_last_standing:0 "#S 기나긴 세월 끝에 사신의 모래시계가 마지막 장에 도달했습니다.#!"
 villains_chronicle.0001.t:0 "전생한 악당들의 연대기"
 villains_chronicle.0001.desc:0 "서기 867년 새해 첫날, 미래 천 년의 기억과 지독한 기벽을 고스란히 품은 영혼들이 중세 대륙 곳곳에서 눈을 떴다.\n\n현세의 심판을 피해 낯선 시대로 떨어진 이들에게 천국의 구원 따위는 없었으니, 오직 낫과 모래시계를 든 사신만이 이 기묘한 가문들이 몇 세대나 버텨낼지 느긋하게 지켜보고 있을 뿐이다.\n\n과연 [ROOT.Char.GetDynasty.GetName] 가문은 피와 철의 중세에서 끝내 살아남아 후대에 이름을 남길 것인가, 아니면 허무하게 역사의 뒤안길로 스러질 것인가?"
 villains_chronicle.0001.a:0 "사신의 모래시계가 뒤집혔다. 끝까지 살아남아 보자!"
