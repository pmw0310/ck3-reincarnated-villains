 red_guard_rebels:0 "홍위병 조반파 돌격대"
 red_guard_rebels_flavor:0 "#F 진홍빛 완장을 차고 붉은 어록을 높이 치켜든 채 구시대의 관아와 사원을 습격하는 청년 조반파 결사대입니다. 개별 전투력은 낮으나 부대 정원이 125명으로 훨씬 많고 유지비가 저렴해 강남의 범람원·농지·다랑논에서 인해전술로 적을 압도합니다.#!"
