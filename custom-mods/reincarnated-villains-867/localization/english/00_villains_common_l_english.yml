 # ============================================================================
 # 00. Reincarnated Villains — Common Systems, Ideologies & Shared Tenets
 # ============================================================================

 # === [Bookmark Tabs & Common Systems] ===
 bm_867_reincarnated_hitler:0 "Reincarnated Villains: Western Theater"
 bm_867_reincarnated_hitler_desc:0 "In 867 AD, modern rulers, demagogues, and mystics whose ambitions and black comedy shook the West and the Middle East have awakened across Europe, Russia, Jerusalem, and the Upper Nile.\n\nFrom the real-estate President on Hadrian's Wall and the Prime Minister of Zion in Jerusalem to the wandering mystic on the Neva, the Axis duo across the Alps, the Man of Steel in Moscow, and the Life President up the Nile—who will shatter medieval order and emerge supreme?"
 villains_dead_personality_neutral_fallback:0 "Balanced"
 villains_trickster_fate_name:0 "Fickle Fortune"
 villains_trickster_fate_name_possessive:0 "Fickle Fortune's"
 bm_867_reincarnated_villains_east:0 "Reincarnated Villains: Eastern Theater"
 bm_867_reincarnated_villains_east_desc:0 "In 867 AD, infamous modern rulers, ideologues, and commanders of Asia have awakened in their youth across Tang China, Korea, Angkor, and the jungles of Imphal.\n\nFrom the Mount Paektu siblings in Pyongyang and the Red Empress of the Shanghai Faction in Jiangnan to the grass-grazing Commander of Imphal and the Angkar General Secretary in Khmer—who will seize hegemony over all under heaven in the East?"

