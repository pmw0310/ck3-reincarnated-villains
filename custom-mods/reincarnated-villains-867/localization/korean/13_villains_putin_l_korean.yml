 neo_russian:0 "신러시아"
 neo_russian_prefix:0 "신러시아계"
 neo_russian_collective_noun:0 "신러시아인"
 tradition_siloviki_oligarchy_name:0 "실로비키 올리가르히 체제"
 tradition_siloviki_oligarchy_desc:0 "정보·군부 출신 요원단인 실로비키가 공화국의 기간 광산과 상업 조합, 그리고 관제 선전망을 수직으로 틀어쥐어 신흥 재벌 올리가르히로부터 충성세와 사설 용병 군자금을 거두어들이고 종신 통치 아래에서도 흔들림 없는 수도 여론을 만들어내는 권위주의 과두 전통입니다."
 tradition_siloviki_oligarchy_only_tt:0 "신러시아 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_wagner_storm_contractors:0 "[GetMaA('wagner_storm_contractors').GetName](을)를 [men_at_arms|E]으로 모병 가능"
 culture_parameter_siloviki_despot_capital_popular_opinion:0 "[GetLaw('republican_despot_succession_law').GetName] [succession_law|E] 보유 시 [capital|E] [popular_opinion|E] 기준치 #P +80#!, [trade_routes|E] #N -1#!"
 wagner_storm_contractors:0 "바그너 용병단"
 wagner_storm_contractors_flavor:0 "#F 묵직한 양손 공성 망치와 철갑으로 무장한 채 금화와 사면장을 대가로 가장 잔혹한 성벽 돌파전에 투입되는 사설 돌격 중보병입니다. 평야와 초원, 도시 공방전에서 적 장창병과 중보병 방진을 거침없이 부수어 버립니다.#!"
