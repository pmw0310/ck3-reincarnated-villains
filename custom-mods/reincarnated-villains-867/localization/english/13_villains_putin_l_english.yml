 # === [Culture, Traditions & Men-at-Arms] ===
 neo_russian:0 "Neo-Russian"
 neo_russian_prefix:0 "Neo-Russian"
 neo_russian_collective_noun:0 "Neo-Russians"
 tradition_siloviki_oligarchy_name:0 "Siloviki Oligarchic Cartel"
 tradition_siloviki_oligarchy_desc:0 "Former intelligence and military insiders preside over state mines, merchant syndicates, and tightly orchestrated public messaging, extracting mercenary funding from leashed oligarchs while manufacturing unshakable capital approval even under lifelong despot rule."
 tradition_siloviki_oligarchy_only_tt:0 "Must be of Neo-Russian culture or descended from it"
 culture_parameter_unlock_maa_wagner_storm_contractors:0 "Can recruit [GetMaA('wagner_storm_contractors').GetName] as [men_at_arms|E]"
 culture_parameter_siloviki_despot_capital_popular_opinion:0 "With [GetLaw('republican_despot_succession_law').GetName] [succession_law|E]: [capital|E] [popular_opinion|E] Baseline #P +80#!, [trade_routes|E] #N -1#!"
 wagner_storm_contractors:0 "Wagner Mercenaries"
 wagner_storm_contractors_flavor:0 "#F Heavily armored private shock infantry wielding two-handed breaching sledgehammers in exchange for gold and pardons, smashing through enemy spearwalls across plains, steppes, and urban sieges.#!"
 putin_wagner_expeditionary_corps_name:0 "Wagner Special Expeditionary Corps"
 putin_eurasian_guard_corps_name:0 "Eurasian Presidential Guard Corps"
 putin_wagner_reserve_detachment_name:0 "Wagner Contract Reserve Detachment"

 # === [Holy Site Relics, Single-Name Heirlooms, Decisions, Events & Modifiers] ===
 artifact_relic_terebovl_security_seal_name:0 "Golden Security Seal of Terebovl"
 artifact_relic_terebovl_security_seal_desc:0 "A heavy double-headed eagle signet binding every western frontier tollgate and tax ledger beneath a single vertical chain of command."
 artifact_relic_kiev_millennium_standard_name:0 "Dnieper Millennium Sovereign Standard"
 artifact_relic_kiev_millennium_standard_desc:0 "A gold-embroidered tricolor banner raised above the bluffs of the Dnieper to claim sole inheritance over ancient Rus."
 artifact_relic_kerch_fleet_compass_name:0 "Brass Fleet Compass of Kerch Strait"
 artifact_relic_kerch_fleet_compass_desc:0 "A weighty brass naval compass used by Black Sea admirals to command the Crimean narrows and southern trade lanes."
 artifact_relic_kremlin_spasskaya_chime_name:0 "Iron Chime Bell of the Kremlin Tower"
 artifact_relic_kremlin_spasskaya_chime_desc:0 "A solemn cast-iron tower bell proclaiming from atop crimson walls that the ruler's hour is the sole law of the realm."
 artifact_relic_neva_directorate_dossier_name:0 "Classified Kompromat Ledger of the Neva"
 artifact_relic_neva_directorate_dossier_desc:0 "A black leather dossier cataloging the hidden vaults, indiscretions, and leverage points of every noble along the northern waterways."
 artifact_putin_long_marble_table_name:0 "Kremlin Long Marble Table"
 artifact_putin_long_marble_table_desc:0 "An absurdly elongated white marble conference table carved more than twenty paces long so neither assassin's dagger nor stray cough can ever reach the head seat. Councillors and vassals squinting from the far end struggle to hear a word, yet its protection against court plots is second to none."
 artifact_putin_lubyanka_samovar_name:0 "Lubyanka Special Samovar"
 artifact_putin_lubyanka_samovar_desc:0 "An ornate brass tea urn brewing fragrant herbal infusions known only to the Security Director. Rivals graciously offered a steaming cup beside this samovar have an uncanny habit of slipping from high tower windows or succumbing to sudden stomach cramps weeks later."
 putin_long_marble_table_modifier:0 "Kremlin Long Marble Table"
 putin_lubyanka_samovar_modifier:0 "Lubyanka Special Samovar"
 putin_power_vertical_dynasty_modifier:0 "Vertical of Power and Siloviki Rule"
 putin_power_vertical_dynasty_modifier_desc:0 "Having subordinated assemblymen and oligarchs beneath a single security hierarchy, this dynasty commands ruthless efficiency in heavy infantry assaults, vassal taxation, and rule by dread."
 putin_eurasian_hegemony_dynasty_modifier:0 "Eternal Hegemony of the Eurasian Union"
 putin_eurasian_hegemony_dynasty_modifier_desc:0 "Spanning from the Baltic approaches and the Black Sea straits to the Moscow heartland, this dynasty wields unmatched counter-espionage, heavy infantry shock power, and domain oversight."
 putin_sovereign_capital_county_modifier:0 "Sovereign Third-Rome Citadel of the Kremlin"
 putin_sovereign_capital_county_modifier_desc:0 "An impregnable imperial capital packed with concentric ramparts, state syndicate vaults, and Federal Security headquarters."
 putin_window_audit_dread_modifier:0 "Dread of Open Tower Windows and Samovar Tea"
 putin_window_audit_dread_modifier_desc:0 "Ever since an unruly oligarch tragically tumbled from an upper tower casement, every vassal stays well clear of open windows and pays tribute on time."
 putin_window_audit_botched_scandal_modifier:0 "Botched Tower-Window Defenestration Scandal"
 putin_window_audit_botched_scandal_modifier_desc:0 "Surviving a tumble onto a haycart with only a sprained ankle, your target loudly denounced your poisoned tea and open-window trap before the entire court."
 putin_three_day_blitz_modifier:0 "Three-Day Lightning Maneuver Directive"
 putin_three_day_blitz_modifier_desc:0 "With dress uniforms for a victory parade already packed in the vanguard wagons, your armies are ordered to storm enemy walls at breakneck speed before a single year elapses!"
 putin_endless_mud_rasputitsa_modifier:0 "Bogged Down in Endless Rasputitsa Mud"
 putin_endless_mud_rasputitsa_modifier_desc:0 "So much for wrapping up in three days—a full year later your supply wagons sit axle-deep in seasonal mud while treasury gold and international prestige bleed away."
 siloviki_despot_managed_opinion_modifier:0 "Despot Managed Opinion and Trade Sanctions"
 siloviki_despot_managed_opinion_modifier_desc:0 "Siloviki security directorates keep capital sentiment firmly aligned behind lifelong Despot rule, though foreign sanctions and autarkic controls constrict external trade routes."
 putin_taiga_bear_hunt_macho_modifier:0 "Shirtless Taiga Bear-Hunt Prestige"
 putin_taiga_bear_hunt_macho_modifier_desc:0 "Heroic tales of the ruler riding bare-chested across icy rivers and pine forests to wrestle a wild bear have electrified the realm."
 putin_establish_russian_federation_decision:0 "Proclaim the Russian Federation"
 putin_establish_russian_federation_decision_desc:0 "The fortified towns and mineral veins of Halych and the western Rus frontier stand firmly consolidated beneath our Kremlin Security Administration! End the squabbling of fragmented Slavic principalities and hoist the white-blue-red tricolor over a centralized Russian Federation."
 putin_establish_russian_federation_decision_tooltip:0 "Consolidate Halych and neighboring Rus strongholds to proclaim the 'Russian Federation', unlocking the Vertical of Power dynasty modifier and a Wagner Expeditionary Corps."
 putin_establish_russian_federation_decision_confirm:0 "Hoist the white-blue-red tricolor! Sovereign order prevails!"
 putin_proclaim_eurasian_empire_decision:0 "Proclaim the Eurasian Union"
 putin_proclaim_eurasian_empire_decision_desc:0 "From Terebovl and the bluffs of Kiev to the Kerch Strait, the Neva estuary, and the Moscow Kremlin, every sacred stronghold answers to one sovereign command! Proclaim the continental superpower of the Eurasian Union before all the world!"
 putin_proclaim_eurasian_empire_decision_tooltip:0 "Control all five strategic holy strongholds and a vast realm to proclaim the 'Eurasian Union', exalting Moscow and mustering the Eurasian Presidential Guard Corps."
 putin_proclaim_eurasian_empire_decision_confirm:0 "Inaugurate the Eurasian Union across East and West!"
 putin_oligarch_window_audit_decision:0 "Summon Oligarch for Tower-Window Tea Audit"
 putin_oligarch_window_audit_decision_desc:0 "Vassals and magnates fattened on state concessions have begun hiding coin and muttering behind closed doors! Invite one wealthy figure to a breezy upper-tower chamber for a steaming cup from our Lubyanka samovar. Whether they voluntarily donate their shares to the treasury or accidentally slip near the open casement, the state always wins."
 putin_oligarch_window_audit_decision_tooltip:0 "Select a vassal or courtier for a high-tower tea audit to extract state equity donations or stage an unfortunate open-window accident."
 putin_oligarch_window_audit_decision_confirm:0 "Boil the samovar and unlatch the upper tower window!"
 putin_oligarch_window_audit_decision_no_item_selected:0 "You must first select a character to summon for the window audit"
 putin_oligarch_window_audit_decision_select_tt:0 "The selected invitee must be a living, unimprisoned adult"
 putin_oligarch_window_audit_event_preview_tt:0 "Test #V Intrigue#! in an open-window samovar accident to seize gold and dread, or test #V Stewardship and Diplomacy#! to extract voluntary state-concern tribute and a loyalty hook."
 putin_three_day_special_operation_decision:0 "Three-Day Special Maneuver and Taiga Bear Hunt"
 putin_three_day_special_operation_decision_desc:0 "This is no ordinary war, only a strictly scheduled 'special military maneuver' guaranteed to wrap up in three days according to plan! Issue a lightning assault directive during an offensive war—or in peacetime, ride bare-chested into the icy taiga forest to wrestle a brown bear for public acclaim."
 putin_three_day_special_operation_decision_tooltip:0 "Launch a high-stakes one-year lightning offensive directive during war, ride out on a shirtless taiga bear hunt, or call up Wagner contract reserves."
 putin_three_day_special_operation_decision_confirm:0 "Everything is proceeding strictly according to plan!"
 putin_three_day_special_operation_event_preview_tt:0 "During an offensive war, gain a #V 1-year#! siege and march blitz bonus that grants rich rewards on timely victory—or inflicts Endless Rasputitsa Mud if the war drags past a year. Otherwise test #V Prowess#! on a shirtless taiga bear hunt or muster Wagner reserves."
 villains_religious_decision.0260.t:0 "An Open Tower Casement and a Steaming Samovar"
 villains_religious_decision.0260.desc:0 "Twenty paces away at the far end of my gleaming white marble table, [window_audit_target.GetTitledFirstName] clutches a trembling saucer. Behind [window_audit_target.GetHerHim], an unlatched high-tower casement rattles in the chill draft while my brass Lubyanka samovar hisses softly beside me.\n\n\"Drink up before your tea grows cold. Do mind the stone sill, though—tower drafts have been terribly treacherous lately.\" Shall I invite our wealthy guest to admire the view from the open ledge and confiscate [window_audit_target.GetHerHis] estate for the state, or smile warmly while sliding over a voluntary equity-donation charter?"
 villains_religious_decision.0260.a:0 "\"What a splendid view from that ledge!\" Pour the special tea and swing the window wide!"
 villains_religious_decision.0260.a.success:0 "Tragic news of an accidental tower fall arrives alongside a generous treasury windfall!"
 villains_religious_decision.0260.a.failure:0 "Your guest lands in a haycart alive and denounces your poisoned tea before the whole court!"
 villains_religious_decision.0260.b:0 "Leave the window half-open and slide over a voluntary state-concern donation deed!"
 villains_religious_decision.0260.b.success:0 "Pale with terror, your guest signs over hefty tribute and swears undying loyalty!"
 villains_religious_decision.0260.b.failure:0 "Your guest pleads poverty with empty ledgers, leaving your authority embarrassed!"
 villains_religious_decision.0260.c:0 "Deliver a two-hour lecture on ancient Rus history across the long marble table and collect a modest levy."
 villains_religious_decision.0270.t:0 "Parade Uniforms for Three Days and Reins in the Taiga"
 villains_religious_decision.0270.desc:0 "Around the campaign map in my command pavilion, my generals watch my lips in nervous silence. Out front, the lead baggage wagons are already loaded with polished dress uniforms for a grand victory parade in three days' time!\n\nShall I issue the 'Three-Day Special Maneuver' directive right now, ordering every column to storm the enemy's gates before the year is out? Or shall I wave aside timid staff officers, cast off my tunic, and ride bare-chested across icy rivers into the taiga to hunt a giant brown bear?"
 villains_religious_decision.0270.a:0 "\"Three days will suffice! Full speed ahead—put the parade band in the vanguard!\""
 villains_religious_decision.0270.a.deadline_tt:0 "#warning Winning your offensive war within 1 year grants massive Prestige, Piety, and Treasury rewards—but if you remain bogged down in an offensive war after 366 days, you will suffer 'Bogged Down in Endless Rasputitsa Mud'!#!"
 villains_religious_decision.0270.b:0 "Cast off my shirt and ride into the icy taiga pines to wrestle a brown bear!"
 villains_religious_decision.0270.b.success:0 "Word of your bare-chested river crossing and bear hunt electrifies the entire realm!"
 villains_religious_decision.0270.b.failure:0 "Shivering and sneezing in the icy wind, you slip off your pony to muffled court laughter!"
 villains_religious_decision.0270.c:0 "Skip the theatrics and open the vaults to muster a Wagner contract reserve detachment."
 villains_religious_decision.0270.c.toast:0 "Mustered a Wagner Contract Reserve Detachment in the capital"
 villains_religious_decision.0271.t:0 "Lightning Special Military Maneuver Completed According to Plan!"
 villains_religious_decision.0272.t:0 "Day Three Hundred Sixty-Six of the Three-Day Maneuver"
 villains_religious_decision.0272.desc:0 "My generals swore up and down that three days would be plenty to march down the enemy's main avenue in gleaming parade coats—yet an entire year has turned, and our columns sit axle-deep in bottomless seasonal mud!\n\nSoldiers trudge past mire-swallowed supply carts wearing their ruined parade tunics as rain cloaks, while a vein throbs at my temple across the long marble table. Who on earth embezzled the wagon wheels and dry rations?!"
 villains_religious_decision.0272.a:0 "\"Everything is... still proceeding strictly according to plan! Find the Culprits!\""
