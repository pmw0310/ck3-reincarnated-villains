 aminism_desc:0 "꿈속에서 알라의 계시를 직접 받는다고 주장하며 '지상의 모든 짐승과 바다의 모든 물고기의 주인'인 종신 대통령 각하의 절대 권력을 신성시하는 이단 무슬림 군벌 교리입니다. 가슴을 가득 채운 훈장과 압도적인 완력이 곧 신의 섭리이며, 감히 원수 각하께 맞서는 반역자들은 나일강의 악어 밥이 되거나 성대한 피의 연회 제단에 바쳐지는 것이 마땅하다고 설파합니다."
