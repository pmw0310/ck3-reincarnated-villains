 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 warhorse_name_paektu_steed:0 "Mount Paektu White Steed"
 Il_sung:0 "Il-sung"
 Jong_nam:0 "Jong-nam"
 Jong_un:0 "Jong-un"
 Yo_jong:0 "Yo-jong"
 Yong_hui:0 "Ko Yong-hui"
 bookmark_reincarnated_kim_jongun:0 "Chairman Kim Jong-un"
 bookmark_reincarnated_kim_jongun_subheading:0 "Chairman of State Affairs of the Paektu Revolutionary Zone"
 bookmark_reincarnated_kim_jongun_desc:0 "Wielding absolute power as the scion of the Mount Paektu Bloodline, Kim Jong-un and his ruthless younger sister Kim Yo-jong have awakened in 867 AD as the meritocratic sibling rulers of Seogyeong and Seongju.\n\nThough stripped of nuclear missiles and luxury armored trains in medieval Korea, the siblings have wasted no time raising the banner of Juche and deifying their ancestors as living gods. Commanding the elite Storm Corps with Yo-jong's purges at his side, can the Supreme Leader unite the Three Han into a socialist paradise?"
 bookmark_reincarnated_kim_yojong:0 "First Vice Director Kim Yo-jong"
 dynn_Kim_867:0 "Kim"
 dynn_Paektu_867:0 "Paektu"
 dynn_Kim_867_motto:0 "Carry the Paektu Revolutionary Cause to the End!"
 nick_the_supreme_leader:0 "the Supreme Dignity"
 nick_the_supreme_leader_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] proclaims [Select_CString( CHARACTER.IsLocalPlayer, 'yourself', CHARACTER.GetHerselfHimself )] the sacred 'Supreme Dignity' born of the spirit of Mount Paektu, demanding total devotion from every subject."
 nick_the_first_vice_director:0 "the First Vice Director"
 nick_the_first_vice_director_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rules from the shadows as her brother's chief propagandist, enforcer, and heir apparent of the Mount Paektu Bloodline."
 villains_dead_personality_kim_ilsung:0 "Rapacious Gambler"
