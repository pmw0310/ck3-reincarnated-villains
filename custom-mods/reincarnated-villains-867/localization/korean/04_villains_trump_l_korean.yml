 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 bookmark_reincarnated_trump:0 "대통령 도널드 트럼프"
 bookmark_reincarnated_trump_subheading:0 "마러라고 자유특구의 대통령"
 bookmark_reincarnated_trump_desc:0 "거대한 국경 장벽과 무역 관세로 세계를 뒤흔들던 부동산 재벌이자 대통령 도널드 트럼프는, 서기 867년 브리튼 북부의 옛 로마 방벽—하드리아누스 방벽이 가로지르는 노섬벌랜드와 컴벌랜드의 독립 행정관으로 눈을 떴습니다.\n\n눈을 뜨자마자 옛 주군 노섬브리아가 바이킹에게 멸망할 부실 매물임을 간파한 그는, 특유의 거래의 기술로 바이킹 삼형제와 10년 불가침 협상을 타결지은 뒤 머시아와 동맹을 맺고 노섬브리아의 뒤통수를 쳤습니다! 황금과 관세를 숭배하는 아메리카니즘을 선포한 그가, 과연 노섬브리아를 집어삼키고 역사상 가장 크고 아름다운 장벽을 다시 세울 수 있을까요?"
 dynn_Trump_867:0 "트럼프"
 dynn_Trump_867_motto:0 "미국을 다시 위대하게!"
 nick_the_president:0 "거래의 달인"
 nick_the_president_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 모든 외교와 전쟁, 통치를 거대한 부동산 협상으로 취급하는 '거래의 달인'입니다. 국경마다 거대하고 아름다운 방벽을 세우고 경쟁 영주들에게 막대한 관세를 물리는 데 집착합니다."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_trump:0 "대통령의 감색 예복"

