 national_socialism_religion_adherent_plural:0 "국가사회주의자"
 national_socialism_religion_desc:0 "전체주의적 국가관과 민족공동체 우월주의, 그리고 끝없는 생존권 정복 전쟁의 교리를 결합한 급진적 사상 체계입니다."
