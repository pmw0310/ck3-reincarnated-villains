 reincarnated_villains_chronicle_sub_region_world_stage:0 "서기 867년 구대륙 전역"
 reincarnated_villains_chronicle_sub_region_world_stage_desc:0 "유럽과 지중해에서 나일강, 러시아 초원과 아삼 밀림, 강남과 한반도, 일본 열도에 이르기까지 전생한 악당들의 가문이 뿌리내린 모든 무대입니다."
 reincarnated_villains_chronicle_participant_group_villains_ascendant_dynasts:0 "패권을 쥔 전생 왕조"
 reincarnated_villains_chronicle_participant_group_villains_ascendant_dynasts_desc:0 "낯선 중세에서 살아남아 왕국이나 제국 등급 이상의 국가 패권을 거머쥔 전생 가문의 통치자들입니다."
 reincarnated_villains_chronicle_participant_group_villains_surviving_dynasts:0 "분투 중인 전생 가문"
 reincarnated_villains_chronicle_participant_group_villains_surviving_dynasts_desc:0 "백작령과 공작령, 가문 장원 혹은 방랑 야영지에 의지해 아직 명맥을 이어가고 있는 전생 가문의 통치자들입니다."
