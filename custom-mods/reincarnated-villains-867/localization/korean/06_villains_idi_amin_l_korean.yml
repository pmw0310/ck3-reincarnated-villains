 idi_amin_simba_army_name:0 "우간다 육군 심바 직할대"
 uganda_simba_battalion:0 "심바 친위대대"
 uganda_simba_battalion_flavor:0 "#F 스와힐리어로 사자를 뜻하는 이디 아민의 최정예 방패·투창 친위 타격대입니다. 혹한에는 취약하지만 중보병에 버금가는 압도적 육박 타격력과 맷집으로 사바나 건조지와 나일강 범람원을 초토화합니다.#!"
 ugandan:0 "우간다"
 ugandan_prefix:0 "우간다계"
 ugandan_collective_noun:0 "우간다인"
 tradition_simba_warlordism_name:0 "심바 군벌 통치"
 tradition_simba_warlordism_desc:0 "원수 각하의 개인적 무력과 공포 정치, 그리고 최측근 정예 군부 대대가 곧 국가의 법이 되는 군벌 문화입니다. 강력한 전사와 공포심이 통치의 핵심 기반을 이룹니다."
