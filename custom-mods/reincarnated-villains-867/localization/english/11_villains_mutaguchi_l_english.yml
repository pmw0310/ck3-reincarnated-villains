 state_shinto_negative_afterlife:0 "Yomi"

 # === [Culture, Traditions & Men-at-Arms] ===
 mutaguchi_15th_army_name:0 "15th Army Imphal Do-or-Die Force"
 mutaguchi_banzai_samurai:0 "Imphal Jungle Shock Troops"
 mutaguchi_banzai_samurai_flavor:0 "#F Driven by their commander's reckless order to graze on Imphal jungle grass rather than wait for supplies, these 15th Army shock warriors consume almost no provisions and deal explosive tachi blade damage and pursuit through monsoon thickets at the cost of paper-thin defense.#!"
 mutaguchi_southern_expeditionary_army_name:0 "Imperial Southern Expeditionary Army"
 imperial_japanese:0 "Imperial Japanese"
 imperial_japanese_prefix:0 "Imperial Japanese"
 imperial_japanese_collective_noun:0 "Imperial Subjects"
 tradition_gyokusai_bushido_name:0 "Gyokusai Shock Bushido"
 tradition_gyokusai_bushido_desc:0 "An extreme imperial martial ethos demanding all-out tachi blade charges through dense Imphal jungle rather than retreat even when cut off from supply lines."
 tradition_gyokusai_bushido_only_tt:0 "Must be of Imperial Japanese culture or descended from it"
 culture_parameter_unlock_maa_mutaguchi_banzai_samurai:0 "Can recruit [GetMaA('mutaguchi_banzai_samurai').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 councillor_court_chaplain_state_shinto:0 "Military Shrine Priest"
 councillor_court_chaplain_state_shinto_possessive:0 "Military Shrine Priest's"
 artifact_mutaguchi_herbivore_manual_name:0 "Imphal Herbivore Wild-Grass Tasting Manual"
 artifact_mutaguchi_herbivore_manual_desc:0 "A field logistics manual personally penned by the Commander preaching in dead earnest that Japanese troops are natural herbivores capable of marching indefinitely by grazing on wild jungle grass. Only Renya Mutaguchi himself can wield its delusional supply miracles, though friendly casualties soar from starvation."
 mutaguchi_execute_operation_ugo_decision:0 "Establish the Imphal Military Administration"
 mutaguchi_execute_operation_ugo_decision_desc:0 "The weak-willed staff officers whining about supply lines were wrong! By conquering the jungles of Imphal and Kamarupa, we have proven in combat that humans are naturally herbivores and established the Imphal Military Administration!"
 mutaguchi_execute_operation_ugo_decision_tooltip:0 "Found the 'Imphal Military Administration' and permanently establish the Mutaguchi dynasty's Herbivore Logistics doctrine."
 mutaguchi_execute_operation_ugo_decision_confirm:0 "Graze on the jungle grass and advance into India!"
 mutaguchi_herbivore_logistics_dynasty_modifier:0 "Imphal Herbivore Logistics Doctrine"
 mutaguchi_herbivore_logistics_dynasty_modifier_desc:0 "Convinced that soldiers can survive by eating grass anywhere, this dynasty's armies enjoy vastly extended supply duration, faster movement, and reduced maintenance."
 mutaguchi_imphal_vanguard_name:0 "Imphal Breakthrough Shock Vanguard"
 mutaguchi_grand_marshal:0 "Grand Marshal"
 mutaguchi_proclaim_greater_east_asia_decision:0 "Proclaim the Greater East Asia Co-Prosperity Sphere"
 mutaguchi_proclaim_greater_east_asia_decision_desc:0 "From the jungles of Imphal and Assam to the plains of Pagan and Bengal, all have bowed before the 15th Army! Our victory proves beyond doubt that armies need no supply lines when there is grass to eat. Behold the Greater East Asia Co-Prosperity Sphere!"
 mutaguchi_proclaim_greater_east_asia_decision_tooltip:0 "Found the 'Greater East Asia Co-Prosperity Sphere' across Assam, Burma, and Bengal."
 mutaguchi_proclaim_greater_east_asia_decision_confirm:0 "Supply comes from the jungle grass! Advance!"
 mutaguchi_greater_east_asia_dynasty_modifier:0 "Jungle Grand Marshal of Greater East Asia"
 mutaguchi_greater_east_asia_dynasty_modifier_desc:0 "Having conquered Assam, Burma, and Bengal through sheer willpower and herbivore logistics, this dynasty enjoys unmatched supply duration, speed, and battle advantage."
 mutaguchi_geisha_banquet_decision:0 "Host Headquarters Geisha Ryotei Banquet"
 mutaguchi_geisha_banquet_decision_desc:0 "While the troops march through the jungle eating grass, a brilliant commander requires 'spiritual refinement' in the rear! Let us summon the finest geishas to our headquarters ryotei for an extravagant night of sake and celebration!"
 mutaguchi_geisha_banquet_decision_tooltip:0 "Host a headquarters geisha banquet where your strategy lecture or hospitality check determines officer morale and stress relief."
 mutaguchi_geisha_banquet_decision_confirm:0 "Leave the front line to the staff—tonight we feast at the ryotei!"
 mutaguchi_geisha_banquet_modifier:0 "Headquarters Ryotei Nights"
 mutaguchi_geisha_banquet_modifier_desc:0 "Enjoying lavish nightly banquets with geishas at rear headquarters, melting away stress and indulging in courtly seduction."
 mutaguchi_personal_only_tt:0 "Only Renya Mutaguchi himself can equip and benefit from this artifact"
 artifact_mutaguchi_geisha_sake_flask_name:0 "Rear-HQ Geisha House Fine Sake Flask"
 artifact_mutaguchi_geisha_sake_flask_desc:0 "A porcelain flask of top-grade warm sake poured nightly at rear-headquarters geisha banquets while frontline soldiers chewed jungle roots in the monsoon mud. Passed down through House Mutaguchi, it washes away stress and charms every banquet guest."
 mutaguchi_herbivore_manual_modifier:0 "Imphal Herbivore Wild-Grass Tasting Manual"
 mutaguchi_geisha_sake_flask_modifier:0 "Rear-HQ Geisha House Fine Sake Flask"
 mutaguchi_geisha_banquet_event_preview_tt:0 "Opens the Headquarters Geisha Banquet event, offering a high-risk [martial|E] strategy lecture, a [diplomacy|E] and [prowess|E] sake toast, or quiet drinking"
 villains_religious_decision.0050.t:0 "Lanterns of the Headquarters Ryotei"
 villains_religious_decision.0050.desc:0 "Silken screens glow softly beneath paper lanterns as plucked strings and the aroma of warm sake fill the headquarters banquet hall. As cups circulate among my staff officers and honored guests, the irrepressible pride of a self-proclaimed military genius swells within my chest!\n\nShall I overturn the table to lecture everyone on how sheer fighting spirit conquers all without supply lines, or focus on charming the guests with fine sake and song?"
 villains_religious_decision.0050.a:0 "Clear the cups! Lecture the staff on invincible spirit over logistics!"
 villains_religious_decision.0050.a.success:0 "Miraculous frenzy-fueled bravado moves the entire officer corps to tears!"
 villains_religious_decision.0050.a.failure:0 "Delusional drunken rambling leaves your staff officers in utter despair"
 villains_religious_decision.0050.b:0 "Win over officers and guests with geisha dances and bold toasts."
 villains_religious_decision.0050.b.success:0 "Splendid hospitality fills the banquet with laughter and loyalty"
 villains_religious_decision.0050.b.failure:0 "Drunken stupor overturns tables and ends in humiliating disgrace"
 villains_religious_decision.0050.c:0 "Keep silent about strategy and quietly savor the sake and music."
 mutaguchi_banzai_delusion_inspired_modifier:0 "Contagious Spirit-Over-Matter Mania"
 mutaguchi_banzai_delusion_inspired_modifier_desc:0 "Infected by their commander miraculous bluster, the officer corps charges ahead convinced sheer willpower conquers all."
 mutaguchi_drunken_blunder_modifier:0 "Drunken Strategy Lecture Blunder"
 mutaguchi_drunken_blunder_modifier_desc:0 "Absurd drunken boasting at the banquet left staff officers and soldiers alike questioning their commander sanity."
 mutaguchi_hangover_disgrace_modifier:0 "Disgraceful Banquet Hangover"
 mutaguchi_hangover_disgrace_modifier_desc:0 "Collapsing into overturned sake tables left a lingering headache and plenty of courtly gossip."
 mutaguchi_jingisukan_herbivore_logistics_decision:0 "Jingisukan Ox-Convoy Decree and Herbivore March Inspection"
 mutaguchi_jingisukan_herbivore_logistics_decision_desc:0 "Complaining that troops cannot advance without supply lines is sheer cowardice born of weak spirit! Pack hundreds of oxen and water buffaloes with rations so they carry the baggage and serve as meat afterward, and if the beasts vanish, look around: our ancestors were herbivores by nature, so the lush green jungle grass all around us is abundant food! March to the monsoon riverbank to inspect the crossing and discipline spineless subordinate officers."
 mutaguchi_jingisukan_herbivore_logistics_decision_tooltip:0 "Inspect the monsoon river crossing in an event offering a high-risk Stewardship and Martial water-buffalo gamble or a Prowess and Diplomacy grass-eating lecture."
 mutaguchi_jingisukan_herbivore_logistics_decision_confirm:0 "Even Grass Is Rations, Advance!"
 mutaguchi_jingisukan_herbivore_event_preview_tt:0 "Choose between a reckless #V Stewardship and Martial#! water-buffalo river crossing, a #V Prowess and Diplomacy#! wild-grass lecture and officer scapegoating, or safe shrine prayers"
 villains_religious_decision.0160.t:0 "Water Buffaloes in the Monsoon Rapids and a Fistful of Jungle Weeds"
 villains_religious_decision.0160.desc:0 "Under sheets of torrential monsoon rain, bamboo-laden water buffaloes bellow and thrash wildly in the churning brown river rapids. When a rain-soaked subordinate officer approaches pale-faced to plead that rations are lost and the column must halt, righteous fury boils in my chest.\n\nRaising my wooden war fan in one hand, I rip a dripping fistful of wild green weeds from the mud and thrust it straight before the officer’s nose! \"Surrounded by endless green foliage, how dare you whine about lacking food!\" Shall I whip the panicked water-buffalo convoy straight across the raging current to prove my genius, or gulp down wild weed broth myself while pinning every blunder squarely on this spineless subordinate?"
 villains_religious_decision.0160.a:0 "Wave the war fan and drive the entire water-buffalo convoy across the raging rapids!"
 villains_religious_decision.0160.a.success:0 "Miraculous Crossing Turns the Water-Buffalo Convoy into Legend!"
 villains_religious_decision.0160.a.failure:0 "Panicked Water Buffaloes Wash Downstream with All the Rations!"
 villains_religious_decision.0160.b:0 "Swallow wild weed soup myself and fiercely reprimand the spineless officer!"
 villains_religious_decision.0160.b.success:0 "Herbivore Spirit and Scapegoating Restore Command Discipline"
 villains_religious_decision.0160.b.failure:0 "Poisonous Jungle Weeds Trigger Violent Stomach Cramps"
 villains_religious_decision.0160.c:0 "Skip the river crossing, pray for victory at headquarters, and send a courier."
 mutaguchi_miracle_ox_convoy_modifier:0 "Miraculous Jingisukan Ox Convoy"
 mutaguchi_miracle_ox_convoy_modifier_desc:0 "Against every law of military science, the water-buffalo pack column crossed the river intact to sustain the march!"
 mutaguchi_herbivore_march_spirit_modifier:0 "Herbivore Foraging and Blame Shifting"
 mutaguchi_herbivore_march_spirit_modifier_desc:0 "Fierce orders to graze on wild jungle greens and ruthless scapegoating force troops to march on sheer willpower."
 mutaguchi_drowned_buffalo_disaster_modifier:0 "Drowned Water-Buffalo Supply Disaster"
 mutaguchi_drowned_buffalo_disaster_modifier_desc:0 "Panicked water buffaloes swept away in the river rapids took the army’s precious rations down with them."
 mutaguchi_toxic_weed_stomachache_modifier:0 "Poisonous Weed Stomachache"
 mutaguchi_toxic_weed_stomachache_modifier_desc:0 "Boastfully swallowing random jungle weeds left the commander doubled over with acute stomach poisoning."
