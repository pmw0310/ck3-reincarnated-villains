 putinism_devil_name_possessive:0 "the Foreign Agent Traitor's"
 putinism_house_of_worship:0 "Security Cathedral"
 putinism_house_of_worship_plural:0 "Security Cathedrals"
 putinism_religious_symbol:0 "the Sword-and-Shield Double Eagle"
 putinism_religious_text:0 "Charter of Sovereign Democracy"
