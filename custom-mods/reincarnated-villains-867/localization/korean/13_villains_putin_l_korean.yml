 putin_wagner_reserve_detachment_name:0 "바그너 계약 예비 타격대"

 # === [성지 봉안 성유물 · 단일 명칭 유물 · 고유 결단 · 이벤트 · 변화요소] ===
 artifact_relic_terebovl_security_seal_name:0 "테레보빌 보안관구 황금 직인"
 artifact_relic_terebovl_security_seal_desc:0 "서방 변경 전초기지의 모든 관문과 조세 장부를 단 하나의 수직 명령 체계로 봉인하던 쌍두독수리 황금 인장입니다."
 artifact_relic_kiev_millennium_standard_name:0 "드네프르 천년 주권 군기"
 artifact_relic_kiev_millennium_standard_desc:0 "드네프르강 언덕 위에서 고대 루스의 정통성을 독점하겠다고 선포하며 내걸었던 금실 자수 삼색 군기입니다."
 artifact_relic_kerch_fleet_compass_name:0 "케르치 흑해 함대 황동 나침반"
 artifact_relic_kerch_fleet_compass_desc:0 "크림반도와 흑해 해협의 거센 물살을 장악하고 남방 항로를 통제하던 해군 제독의 묵직한 황동 나침반입니다."
 artifact_relic_kremlin_spasskaya_chime_name:0 "크렘린 성탑의 강철 시보종"
 artifact_relic_kremlin_spasskaya_chime_desc:0 "붉은 성벽 꼭대기에서 온 제국의 신민에게 최고 통치자의 시간만이 유일한 법도임을 알리던 장엄한 강철 종입니다."
 artifact_relic_neva_directorate_dossier_name:0 "네바 비밀 감찰국 기밀 명부"
 artifact_relic_neva_directorate_dossier_desc:0 "북방 수로와 도성 귀족들의 은밀한 약점과 금고 내역을 빈틈없이 기록해 둔 검은 가죽 표지의 감찰 철입니다."
 artifact_putin_long_marble_table_name:0 "크렘린 장거리 대리석 식탁"
 artifact_putin_long_marble_table_desc:0 "자객의 단검과 역병의 비말이 결코 닿지 못하도록 스무 걸음도 넘게 길쭉하게 깎아 만든 순백색 대리석 회의 식탁입니다. 반대편 끝에 앉은 자문위원과 봉신들은 통치자의 말소리가 잘 들리지 않아 속을 태우지만, 암살 음모로부터의 안전만큼은 타의 추종을 불허합니다."
 artifact_putin_lubyanka_samovar_name:0 "루뱐카 특제 홍차 사모바르"
 artifact_putin_lubyanka_samovar_desc:0 "은은한 은빛 장식 아래 오직 보안국장만이 아는 비밀 약초 우린 물을 끓여 내는 화려한 황동 홍차 주전자입니다. 이 사모바르 앞에서 차 한 잔을 대접받은 정적들은 이상하게도 몇 달 뒤 고층 성탑 창가에서 발을 헛디디거나 갑작스러운 복통으로 세상을 떠나곤 합니다."
 putin_long_marble_table_modifier:0 "크렘린 장거리 대리석 식탁"
 putin_lubyanka_samovar_modifier:0 "루뱐카 특제 홍차 사모바르"
 putin_power_vertical_dynasty_modifier:0 "권력의 수직화와 실로비키 지배"
 putin_power_vertical_dynasty_modifier_desc:0 "의회와 신흥 귀족들을 단일한 안보 수직 체계 아래 복속시킨 이 가문은 중보병 돌격전과 봉신 조세 징수, 공포 통치에서 냉혹한 효율을 발휘합니다."
 putin_eurasian_hegemony_dynasty_modifier:0 "유라시아 초강대국 종신 패권"
 putin_eurasian_hegemony_dynasty_modifier_desc:0 "발트해 어귀부터 흑해 해협과 모스크바 심장부까지 유라시아 대륙을 석권한 이 가문은 압도적인 방첩망과 중보병 화력, 직할 통제력을 자랑합니다."
 putin_sovereign_capital_county_modifier:0 "크렘린 성벽의 제3로마 주권 수도"
 putin_sovereign_capital_county_modifier_desc:0 "겹겹의 성채와 국영 콘체른 금고, 연방 보안 본부가 밀집한 유라시아 연방의 난공불락 수도입니다."
 putin_window_audit_dread_modifier:0 "고층 성탑 열린 창문과 홍차의 공포"
 putin_window_audit_dread_modifier_desc:0 "불충한 올리가르히가 성탑 창밖으로 추락한 뒤, 모든 봉신들이 창문 근처에는 얼씬도 하지 못한 채 앞다투어 충성세를 바치고 있습니다."
 putin_window_audit_botched_scandal_modifier:0 "덜미 잡힌 어설픈 창가 추락 공작"
 putin_window_audit_botched_scandal_modifier_desc:0 "단층 마구간 창문에서 떨어져 발목만 삐끗한 표적이 만좌 앞에서 홍차 암살 미수를 폭로하는 바람에 궁정 여론이 흉흉해졌습니다."
 putin_three_day_blitz_modifier:0 "사흘이면 충분하다는 전격 기동령"
 putin_three_day_blitz_modifier_desc:0 "적 수도에 사흘 뒤 열병식 예복까지 미리 실어 보낸 채 전군에 맹렬한 속도전 진격을 독촉하고 있습니다. 일 년 안에 전쟁을 끝내지 못하면 돌이킬 수 없는 망신이 기다립니다!"
 putin_endless_mud_rasputitsa_modifier:0 "사흘 작전이 빠져 버린 끝없는 라스푸티차 진흙탕"
 putin_endless_mud_rasputitsa_modifier_desc:0 "사흘이면 끝난다던 호언장담이 무색하게 해가 바뀌도록 전쟁이 끝나지 않자, 보급 마차들은 봄가을 진흙탕 수렁에 처박히고 군비와 위신이 끝없이 새어 나가고 있습니다."
 siloviki_despot_managed_opinion_modifier:0 "데스포티스 주권 관제 여론과 무역 제재"
 siloviki_despot_managed_opinion_modifier_desc:0 "실로비키 보안 기구와 관영 전령망이 데스포티스 종신 체제의 수도 여론을 빈틈없이 틀어쥐고 있으나, 국제적 경계와 폐쇄적 통제로 대외 무역로가 위축되어 있습니다."
 putin_taiga_bear_hunt_macho_modifier:0 "웃통 벗은 타이가 곰 사냥 화보의 위세"
 putin_taiga_bear_hunt_macho_modifier_desc:0 "얼음장 같은 강물과 침엽수림에서 웃통을 벗어 던지고 말 고삐를 쥔 채 사냥감을 제압한 무용담이 온 영지에 퍼져 강인한 지도자의 위세를 떨치고 있습니다."
 putin_establish_russian_federation_decision:0 "러시아 연방 주권 체제 선포"
 putin_establish_russian_federation_decision_desc:0 "갈리치아와 드네프르 서방 변경의 성읍과 광산들이 마침내 우리의 실로비키 행정부 아래 완전히 장악되었습니다! 분열된 슬라브 공국들의 혼란을 끝장내고 백청적 삼색기 아래 강철 같은 권력 수직 구조로 움직이는 '러시아 연방'을 공식 선포할 시간입니다."
 putin_establish_russian_federation_decision_tooltip:0 "할리치와 인접 루스 거점을 통합하여 '러시아 연방'을 수립하고 가문 고유의 권력 수직화 체제와 바그너 특별 원정 돌격군단을 창설합니다."
 putin_establish_russian_federation_decision_confirm:0 "백청적 삼색기를 올려라! 연방의 주권은 흔들리지 않는다!"
 putin_proclaim_eurasian_empire_decision:0 "유라시아 연방 제국 선포"
 putin_proclaim_eurasian_empire_decision_desc:0 "테레보빌과 키예프 언덕에서 흑해 케르치 해협, 네바강 어귀와 모스크바 크렘린에 이르기까지 모든 성지가 하나의 주권 아래 통합되었습니다! 과거의 어떤 차르나 서기장도 이루지 못한 불패의 대륙 패권국 '유라시아 연방'을 온 세상에 천명하십시오!"
 putin_proclaim_eurasian_empire_decision_tooltip:0 "5대 핵심 거점과 광대한 영토를 석권하여 '유라시아 연방'을 선포하고 모스크바를 주권 수도로 격상하며 근위 돌격군을 소집합니다."
 putin_proclaim_eurasian_empire_decision_confirm:0 "대륙의 동서를 잇는 유라시아의 시대를 선포하라!"
 putin_oligarch_window_audit_decision:0 "올리가르히 고층 창가 홍차 면담 소집"
 putin_oligarch_window_audit_decision_desc:0 "국가 콘체른 덕분에 배를 불린 봉신과 재력가들이 슬슬 주머니에 딴주머니를 차고 불평을 늘어놓기 시작했습니다! 가장 돈 많은 인물을 크렘린 고층 성탑의 전망 좋은 방으로 불러들여 루뱐카 특제 사모바르 홍차를 따르십시오. 순순히 지분을 국고에 헌납하든, 시원한 바람을 쐬다 창턱에서 발을 헛디디든 결과는 국가에 유익할 것입니다."
 putin_oligarch_window_audit_decision_tooltip:0 "봉신이나 궁정 인물을 한 명 지목해 성탑 창가 홍차 면담으로 불러들여 비자금 헌납 압박이나 '우발적 추락' 감찰을 집행합니다."
 putin_oligarch_window_audit_decision_confirm:0 "사모바르 물을 끓이고 성탑 창문을 활짝 열어 두어라!"
 putin_oligarch_window_audit_decision_no_item_selected:0 "창가 면담에 소환할 대상 인물을 먼저 선택해야 합니다"
 putin_oligarch_window_audit_decision_select_tt:0 "선택한 면담 대상이 투옥되지 않은 생존 성인이어야 합니다"
 putin_oligarch_window_audit_event_preview_tt:0 "지목한 대상에게 #V 계책력#! 열린 창가 홍차 사고사를 시도해 금화와 공포를 챙기거나, #V 관리력·외교력#! 압박으로 국영 콘체른 기부금과 충성 약점을 받아냅니다."
 putin_three_day_special_operation_decision:0 "사흘 기한 특별 군사 기동과 타이가 사냥"
 putin_three_day_special_operation_decision_desc:0 "이것은 결코 전면전이 아니라 정확히 사흘 안에 모든 목표가 계획대로 달성될 '특별 군사 기동'입니다! 출정 중인 전군에 전격 진격령을 내려 단숨에 적의 성문을 부수거나, 평시라면 웃통을 벗고 차가운 타이가 침엽수림으로 말을 몰아 곰 사냥 화보로 강인한 통치자의 위세를 과시하십시오."
 putin_three_day_special_operation_decision_tooltip:0 "공격 전쟁 중 일 년 기한 전격 기동 버프를 걸고 승부수를 띄우거나, 웃통 벗은 타이가 곰 사냥 원정 또는 바그너 예비 타격대 소집을 단행합니다."
 putin_three_day_special_operation_decision_confirm:0 "모든 것은 계획대로 진행되고 있다!"
 putin_three_day_special_operation_event_preview_tt:0 "공격 전쟁 중이라면 #V 1년 기한#! 전격 공성·기동 보너스를 얻는 사흘 특별 기동령을 발령하며, 기한 내 승리 시 막대한 보상을 얻지만 실패 시 라스푸티차 진흙탕 페널티를 받습니다. 평시에는 #V 기량#! 타이가 곰 사냥이나 바그너 예비대 소집을 선택할 수 있습니다."
 villains_religious_decision.0260.t:0 "고층 성탑의 열린 창문과 김이 모락모락 나는 사모바르"
 villains_religious_decision.0260.desc:0 "스무 걸음 길이의 차가운 흰 대리석 식탁 저편 끝에서 [window_audit_target.GetTitledFirstName](이)가 바들바들 떨리는 손으로 찻잔 받침을 쥐고 있다. 등 뒤로는 빗장이 풀린 성탑 고층 창문이 서늘한 강풍에 덜컹거리고, 내 옆에서는 루뱐카 특제 황동 사모바르가 불길한 김을 뿜어내고 있다.\n\n\"차 식기 전에 어서 마시게나. 요즘 성탑 계단과 창턱이 워낙 미끄러워서 말이야.\" 지금 당장 저 건방진 재력가에게 바람 잘 드는 창가 구경을 시켜 주고 유산을 국고로 환수할 것인가, 아니면 웃는 얼굴로 자발적 국영 콘체른 지분 헌납 서류에 서명하게 만들 것인가?"
 villains_religious_decision.0260.a:0 "\"창밖 경치가 참 좋지 않은가?\" 특제 홍차를 권하고 창문을 활짝 연다!"
 villains_religious_decision.0260.a.success:0 "안타까운 창가 실족 사고 소식과 함께 막대한 유산이 국고에 귀속됨!"
 villains_religious_decision.0260.a.failure:0 "표적이 짚더미 위로 살아남아 홍차 독살과 추락 공작을 만천하에 폭로함!"
 villains_religious_decision.0260.b:0 "창문을 반쯤 열어 둔 채 국영 콘체른 자진 기부 서류와 깃펜을 내민다!"
 villains_religious_decision.0260.b.success:0 "사색이 된 대상이 거액의 헌납금과 영구 충성 서약서에 두 손 모아 서명함!"
 villains_religious_decision.0260.b.failure:0 "대상이 빈 금고 장부만 내밀고 버티는 바람에 체면만 구김!"
 villains_religious_decision.0260.c:0 "장거리 대리석 식탁에 앉아 두 시간짜리 고대 루스 역사 강의를 들려주고 애국세만 걷는다."
 villains_religious_decision.0270.t:0 "사흘치 열병식 예복과 타이가 숲의 말 고삐"
 villains_religious_decision.0270.desc:0 "야전 지휘 천막 한가운데 펼쳐진 작전 지도 위에서 장군들이 조심스레 내 입술만 바라보고 있다. 보급 행렬 맨 앞마차에는 사흘 뒤 적 수도 한복판에서 입을 반짝이는 열병식 정복까지 이미 실려 있는 참이다!\n\n지금 당장 전군에 '사흘 특별 군사 기동'을 발령해 번개 같은 속도전으로 적의 성문을 밀어붙일 것인가? 아니면 어설픈 장군들 대신 내가 직접 웃통을 벗어 던지고 얼음 강물과 타이가 숲으로 말을 몰아 불굴의 마초 지도자 화보를 남길 것인가?"
 villains_religious_decision.0270.a:0 "\"사흘이면 끝난다! 전군 전격 기동 개시, 열병식 악대부터 앞세워라!\""
 villains_religious_decision.0270.a.deadline_tt:0 "#warning 앞으로 1년 이내에 현재 수행 중인 공격 전쟁에서 승리하면 막대한 위신과 국고를 얻지만, 해가 바뀌도록 전쟁이 끝나지 않으면 '끝없는 라스푸티차 진흙탕' 후유증에 시달리게 됩니다!#!"
 villains_religious_decision.0270.b:0 "웃통을 벗어 던지고 타이가 침엽수림으로 말을 몰아 거대한 불곰 사냥에 나선다!"
 villains_religious_decision.0270.b.success:0 "얼음 강물을 건너 맹수를 제압한 상의 탈의 승마 일화에 온 영지가 열광함!"
 villains_religious_decision.0270.b.failure:0 "차가운 강바람에 재채기만 연발하다가 조랑말에서 미끄러져 망신을 당함!"
 villains_religious_decision.0270.c:0 "선전은 접어 두고 금고를 열어 바그너 계약 예비 타격대부터 실전 배치한다."
 villains_religious_decision.0270.c.toast:0 "바그너 계약 예비 타격대가 수도에 소집됨"
 villains_religious_decision.0271.t:0 "계획대로 완수된 전격 특별 군사 기동 대승리!"
 villains_religious_decision.0272.t:0 "사흘이 일 년으로 늘어난 끝없는 라스푸티차 진흙탕"
 villains_religious_decision.0272.desc:0 "분명히 사흘이면 적 수도 한복판에서 화려한 열병식을 열 수 있다고 보고받았건만, 어느덧 달력이 한 바퀴를 다 돌도록 전선은 끝없는 봄가을 진흙탕 수렁 한가운데에 처박혀 있다!\n\n바퀴가 진창에 파묻힌 보급 마차 옆에서 병사들은 열병식 예복을 걸레처럼 뒤집어쓴 채 투덜거리고, 장거리 대리석 식탁 너머에서 보고서를 읽는 내 관자놀이에는 핏줄이 돋아난다. 도대체 누가 보급로 타이어와 군량미를 다 빼돌렸단 말인가!"
 villains_religious_decision.0272.a:0 "\"모든 것은... 여전히 계획대로 진행 중이다! 반역자부터 색출하라!\""
