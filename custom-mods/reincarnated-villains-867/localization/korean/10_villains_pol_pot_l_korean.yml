 bookmark_reincarnated_pol_pot:0 "총비서 살롯 사 '폴 포트'"
 bookmark_reincarnated_pol_pot_subheading:0 "제0년 정글 해방구의 총비서"
 bookmark_reincarnated_pol_pot_desc:0 "화폐와 도시를 폐지하고 전 국민을 농촌으로 내몰아 킬링필드의 참극을 불러왔던 크메르 루주의 수괴 살롯 사—가명 폴 포트가 눈을 뜬 곳은, 서기 867년 신왕 자야바르만 3세가 다스리는 앙코르 만다라 왕조 산하의 밀림 변경인 코케르와 삼부푸라 백작령이었습니다.\n\n안경 쓴 지식인은커녕 글자조차 모르는 정글 농민들과 화폐 없는 물물교환 사회를 마주한 그는, 오히려 자신이 꿈꾸던 완벽한 '제0년'의 원시 농경 유토피아에 도착했다며 감격에 겨워하고 있습니다! 보이지 않는 절대 조직 '앙카르'의 총비서이자 제1형제를 자처하며 파괴의 만다라 위상을 내건 그가, 과연 주군인 앙코르의 신왕을 타도하고 동남아시아의 화려한 힌두·불교 사원 왕국들을 모두 허물어 제0년의 농경 낙원으로 되돌릴 수 있을까요?"
