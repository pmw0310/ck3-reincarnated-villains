 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 d_cultural_revolution:0 "중앙문혁소조"
 d_cultural_revolution_adj:0 "문혁파"
 councillor_court_chaplain_cultural_revolution:0 "중앙문혁소조원"
 councillor_court_chaplain_cultural_revolution_possessive:0 "중앙문혁소조원의"
 jiang_qing_western_film_log_modifier:0 "서방 금서 활동사진 비밀 상영 일지"
 artifact_jiang_qing_western_film_log_name:0 "서방 금서 활동사진 비밀 상영 일지"
 artifact_jiang_qing_western_film_log_desc:0 "낮에는 광장에서 온 세상의 부르주아 예술을 불태우라 호령하면서, 밤마다 별장 영사실에서 몰래 감상한 서방 금서 연극과 활동사진 감상평을 꼼꼼히 적어 둔 비단 일지입니다. 이 위선적인 비밀 노트의 존재를 눈치챈 신하는 영락없이 반혁명 주자파로 몰려 먼저 숙청당합니다."
 artifact_relic_shanghai_january_storm_manifesto_name:0 "상하이 일월폭풍 조반 선언문"
 artifact_relic_shanghai_january_storm_manifesto_desc:0 "상하이의 기존 관청과 세가를 일거에 전복하고 인민코뮌의 탄생을 선포한 진홍빛 혁명 격문입니다."
 artifact_relic_west_lake_may_16_directive_name:0 "서호 비밀회의 문혁 강령 초고"
 artifact_relic_west_lake_may_16_directive_desc:0 "항주 서호의 비밀 회합에서 작성되어 구시대의 학자와 관료들을 숙청할 신호탄을 쏘아 올린 문혁 강령 원본입니다."
 artifact_relic_first_big_character_poster_name:0 "북경 제1장 대자보 현판"
 artifact_relic_first_big_character_poster_desc:0 "청년 조반파들이 학당 성벽에 내걸어 전국적인 파사구 열풍을 점화한 첫 번째 대자보 판각입니다."
 artifact_relic_yangtze_red_guard_standard_name:0 "강남 조반파 총사령부 홍기"
 artifact_relic_yangtze_red_guard_standard_desc:0 "양자강 하류 전역을 휩쓴 홍위병 조반파 돌격대의 황금 태양 군기입니다."
 artifact_relic_dongfanghong_armband_casket_name:0 "장안 동방홍 황금 완장함"
 artifact_relic_dongfanghong_armband_casket_desc:0 "제국 수도의 대광장 열병식에서 최전열 홍위병 지휘관들에게 수여된 붉은 비단 완장 보관함입니다."
 jiang_shanghai_january_storm_dynasty_modifier:0 "일월폭풍과 상하이 코뮌의 조반 기세"
 jiang_shanghai_january_storm_dynasty_modifier_desc:0 "상하이의 구관청을 전복하고 인민코뮌을 세운 이 가문의 조반파 열기는 모든 정적을 공포로 짓누릅니다."
 jiang_proletarian_cultural_empire_dynasty_modifier:0 "영구 문화대혁명 최고영도 체제"
 jiang_proletarian_cultural_empire_dynasty_modifier_desc:0 "중원 대륙 전체를 거대한 혁명 극장으로 개조한 이 가문 아래에서는 오직 위대한 태양을 향한 광신만이 허용됩니다."
 jiang_shanghai_revolutionary_capital_county_modifier:0 "상하이 프롤레타리아 조반 총본부"
 jiang_shanghai_revolutionary_capital_county_modifier_desc:0 "수만 명의 홍위병과 선전대가 집결한 강남 최대의 혁명 심장부입니다."
 jiang_four_olds_revolutionary_gale_modifier:0 "파사구 혁명 광풍"
 jiang_four_olds_revolutionary_gale_modifier_desc:0 "구사상과 구문화를 불사르는 광신적 행군 속에서 홍위병 돌격대의 진격 속도와 사기가 극에 달해 있습니다."
 jiang_big_character_poster_terror_modifier:0 "성문을 뒤덮은 대자보의 공포"
 jiang_big_character_poster_terror_modifier_desc:0 "골목마다 나붙은 고발 대자보 때문에 관료와 백성 모두가 서로를 감시하며 숨을 죽이고 있습니다."
 jiang_model_opera_premiere_modifier:0 "혁명 모범극 전국 순회공연 열기"
 jiang_model_opera_premiere_modifier_desc:0 "장칭이 직접 연출한 모범극 가락이 장터와 병영마다 울려 퍼지며 영주의 권위를 드높이고 있습니다."
 jiang_red_guard_factional_clash_modifier:0 "홍위병 계파 간 유혈 무투 사태"
 jiang_red_guard_factional_clash_modifier_desc:0 "서로 자신이 진정한 조반파라 주장하는 홍위병 분파들이 시가전을 벌여 영지 행정이 마비되었습니다."
 jiang_struggle_session_terror_modifier:0 "자아비판 단상의 서슬 퍼런 본보기"
 jiang_struggle_session_terror_modifier_desc:0 "고깔모자를 쓰고 무릎 꿇린 정적의 비참한 말로를 목격한 신하들이 감히 고개를 들지 못합니다."
 jiang_botched_struggle_backlash_modifier:0 "단상 위의 역설과 군중 동요"
 jiang_botched_struggle_backlash_modifier_desc:0 "비판대회 단상에 끌려 나온 표적이 오히려 날 선 웅변으로 부조리를 폭로하여 광장이 술렁이고 있습니다."
 rival_struggle_session_defiance:0 "[TARGET_CHARACTER.GetShortUIName|U](이)가 비판대회 단상에서 [CHARACTER.GetShortUIName]의 자아비판 강요를 정면으로 거부하며 맞섰습니다."
 rival_struggle_session_defiance_corresponding:0 "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUIName]에게 치욕스러운 고깔모자를 씌워 군중 앞에 조리돌림하려 했습니다."
 jiang_proclaim_shanghai_commune_decision:0 "상하이 인민코뮌 선포"
 jiang_proclaim_shanghai_commune_decision_desc:0 "낡은 강남의 절도사와 문벌 세가들을 일월폭풍의 기세로 쓸어버릴 때가 왔습니다. 화정과 절서 일대의 부두 노동자와 홍위병 조반파를 총결집하여 위대한 태양 아래 빛나는 상하이 인민코뮌의 진홍빛 깃발을 높이 내걸 것입니다."
 jiang_proclaim_shanghai_commune_decision_tooltip:0 "절서와 강남 거점을 통합하여 상하이 인민코뮌을 창건하고 홍위병 주력군을 소집합니다."
 jiang_proclaim_shanghai_commune_decision_confirm:0 "일월폭풍이여, 낡은 강남을 뒤엎어라!"
 jiang_proclaim_cultural_revolution_empire_decision:0 "중화 프롤레타리아 문화대제국 선포"
 jiang_proclaim_cultural_revolution_empire_decision_desc:0 "수천 년간 중원을 지배해 온 봉건 예교와 주자파 관료들의 시대는 끝났습니다. 만방의 백성이 붉은 어록을 외치며 조반의 대열에 합류하니, 이제 영구 문화대혁명으로 다스려지는 중화 프롤레타리아 문화대제국의 개막을 천하에 고할 것입니다!"
 jiang_proclaim_cultural_revolution_empire_decision_tooltip:0 "중화 핵심 권역을 석권하여 중화 프롤레타리아 문화대제국을 건국하고 영구 문혁 체제를 완성합니다."
 jiang_proclaim_cultural_revolution_empire_decision_confirm:0 "위대한 태양 아래 천하를 붉게 물들여라!"
 jiang_smash_four_olds_decision:0 "파사구 운동과 홍위병 대장정"
 jiang_smash_four_olds_decision_desc:0 "구사상과 구문화, 구풍속과 구관습이라는 네 가지 낡은 사슬을 불태우지 않고서는 새 세상이 열리지 않습니다. 붉은 완장을 찬 청년 홍위병들을 거리와 사원으로 내보내 썩어빠진 유산을 타파하고 혁명 모범극의 북소리를 울려야 합니다."
 jiang_smash_four_olds_decision_tooltip:0 "영지 전역에 파사구 운동을 전개하여 금화와 신앙심, 홍위병 병력 또는 공포를 획득합니다."
 jiang_smash_four_olds_decision_confirm:0 "낡은 세상을 부수고 붉은 완장을 채워라!"
 jiang_smash_four_olds_event_preview_tt:0 "외교 또는 계략 판정을 통해 사원 자산을 몰수하고 홍위병을 소집하거나, 안전하게 혁명 모범극 순회공연을 열어 위신과 명성을 얻습니다."
 jiang_struggle_session_decision:0 "반동분자 고깔모자 조리돌림 비판대회"
 jiang_struggle_session_decision_desc:0 "당과 궁정 내부에 숨어든 주자파 반동분자는 만인이 지켜보는 광장 단상 위에서 영혼까지 발가벗겨야 합니다. 치욕스러운 종이 고깔모자와 무거운 죄목 목패를 걸어 군중 앞에 무릎 꿇리고 눈물의 자아비판을 받아낼 것입니다."
 jiang_struggle_session_decision_tooltip:0 "궁정 신하, 자문위원, 봉신 또는 죄수 한 명을 지목하여 광장 비판대회에 세우고 약점 확보, 숙청 투옥 또는 강제 개종을 집행합니다."
 jiang_struggle_session_decision_confirm:0 "저 주자파 반동분자를 단상 위로 끌어올려라!"
 jiang_struggle_session_decision_no_item_selected:0 "비판대회 단상에 세울 대상 인물을 먼저 선택해야 합니다"
 jiang_struggle_session_decision_req_candidate:0 "비판대회에 끌어낼 성인 자문위원, 봉신, 궁정 신하 또는 죄수가 최소 1명 이상 있어야 합니다"
 jiang_struggle_session_decision_select_tt:0 "선택한 대상이 생존 중인 성인이어야 합니다"
 jiang_struggle_session_event_preview_tt:0 "지목한 인물을 상대로 계략 대결을 펼쳐 재산과 약점을 쥐어짜거나, 즉각 지하감옥에 투옥하거나, 조반 문혁사상으로 강제 개종시킵니다."
 villains_religious_decision.0190.t:0 "타오르는 파사구의 횃불과 붉은 물결"
 villains_religious_decision.0190.desc:0 "징과 북소리가 성안의 기와지붕을 뒤흔드는 가운데, 진홍빛 완장을 찬 수천 명의 청년 홍위병들이 붉은 어록을 높이 치켜들고 광장으로 쏟아져 나왔습니다.\n\n이미 해묵은 사찰의 청동 향로와 문벌 세가의 가보 비단들이 화톳불 앞에 산더미처럼 쌓여 있으며, 붓과 먹통을 든 선전원들은 성문마다 누구의 이름을 대자보에 적어 매달지 나의 손끝만을 주시하고 있습니다."
 villains_religious_decision.0190.a:0 "낡은 사원과 세가의 비단 창고를 모조리 쓸어버려라!"
 villains_religious_decision.0190.a.success:0 "몰수한 사원 재보와 열광한 청년들로 홍위병 대오가 불어납니다"
 villains_religious_decision.0190.a.failure:0 "약탈품을 둘러싼 홍위병 분파 간 유혈 무투가 벌어집니다"
 villains_religious_decision.0190.b:0 "성문마다 서슬 퍼런 고발 대자보를 붙여 관료들의 숨통을 조여라!"
 villains_religious_decision.0190.b.success:0 "온 성안이 대자보의 서슬에 얼어붙어 복종합니다"
 villains_religious_decision.0190.b.failure:0 "밤사이 대자보가 찢겨 나가고 조롱 섞인 벽서가 나붙습니다"
 villains_religious_decision.0190.c:0 "새 혁명 모범극 붉은 여인군의 성대한 막을 올려라!"
 villains_religious_decision.0200.t:0 "광장 단상 위의 고깔모자와 자아비판"
 villains_religious_decision.0200.desc:0 "수천 개의 붉은 깃발이 파도처럼 출렁이는 광장 한복판 단상 위로 [struggle_target.GetTitledFirstName](이)가 두 팔을 뒤로 꺾인 채 끌려 올라왔습니다. 홍위병들이 그 머리에 우스꽝스럽고 기다란 종이 고깔모자를 억지로 씌우고, 목에는 굵은 먹글씨로 반혁명 주자파라 적힌 무거운 나무 패를 매달자 군중의 고함이 천지를 뒤흔듭니다.\n\n창백하게 질린 [struggle_target.GetFirstNameNoTooltip]의 시선이 단상 귀빈석에 앉은 나를 향해 떨리고 있습니다."
 villains_religious_decision.0200.a:0 "만인 앞에서 무릎 꿇고 피눈물 나는 자아비판 각서를 쓰게 하라!"
 villains_religious_decision.0200.a.success:0 "꺾여버린 표적이 만인 앞에서 모든 죄를 자백하고 복종을 맹세합니다"
 villains_religious_decision.0200.a.failure:0 "표적이 고깔모자를 벗어 던지며 단상 위에서 맹렬히 저항합니다"
 villains_religious_decision.0200.b:0 "타협의 여지는 없다. 인민의 이름으로 지하감옥에 처넣어라!"
 villains_religious_decision.0200.c:0 "눈물의 참회를 받아들이고 홍위병 완장을 채워 새사람으로 만들어라."
