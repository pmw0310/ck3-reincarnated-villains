 angkar_adherent_plural:0 "크메르 루주"
 angkar_desc:0 "보이지 않는 절대 조직 '앙카르'에 대한 무조건적인 복종과 도시 문명의 철저한 파괴를 설파하는 극단적 농본 공산주의 교리입니다. 화폐와 시장, 경전과 사원을 모두 타락한 구시대의 적폐로 규정하여 불태우고, 오직 검은 작업복을 입은 농민 전사들이 괭이와 정글도로 일구는 '제0년'의 순수한 집단 농경 사회만이 유일한 구원이라 가르칩니다."
