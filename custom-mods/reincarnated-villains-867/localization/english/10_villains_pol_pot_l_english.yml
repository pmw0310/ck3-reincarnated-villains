 # ============================================================================
 # 10. Pol Pot — Angkar & Angkar Khmer
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 Saloth:0 "Saloth"
 Saloth_Sar:0 "Saloth Sar"
 villains_name_sar:0 "Sar"
 bookmark_reincarnated_pol_pot:0 "General Secretary Saloth Sar 'Pol Pot'"
 bookmark_reincarnated_pol_pot_subheading:0 "General Secretary of the Year Zero Jungle Liberated Zone"
 bookmark_reincarnated_pol_pot_desc:0 "Saloth Sar—better known by his alias Pol Pot, the notorious General Secretary of the Khmer Rouge who abolished money, emptied the cities, and plunged Cambodia into the Killing Fields—has awakened in 867 AD in the jungle marches of Koh Ker and Sambhupura as a Mandala vassal beneath Devaraja Jayavarman III of Angkor.\n\nFinding himself in a pre-monetary jungle society devoid of modern cities or bespectacled intellectuals, he is overjoyed that his ideal 'Year Zero' agrarian utopia has already arrived! Proclaiming himself General Secretary and 'Brother Number One' of the faceless organization 'Angkar' while embracing the Aspect of Destruction, can he overthrow his Angkorian liege and tear down the Hindu-Buddhist temple-kingdoms of Southeast Asia?"
 dynn_Pol_Pot_867:0 "Saloth"
 dynn_House_Pol_Pot_867:0 "Pol Pot"
 dynn_Pol_Pot_867_motto:0 "To keep you is no benefit, to destroy you is no loss!"
 nick_brother_number_one:0 "Pol Pot"
 nick_brother_number_one_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] conceals his birth name Saloth Sar behind the revolutionary alias 'Pol Pot' and inner-circle codename 'Brother Number One', ruling as General Secretary of the supreme organization Angkar to erase urban civilization and reset history to Year Zero."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_pol_pot:0 "General Secretary's Angkar Black Garb"

