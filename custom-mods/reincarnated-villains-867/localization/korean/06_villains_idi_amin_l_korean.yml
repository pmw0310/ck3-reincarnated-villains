 d_aminism:0 "국방최고평의회"
 d_aminism_adj:0 "국방최고평의회"
 councillor_court_chaplain_aminism:0 "국가연구국장"
 flav_idi_amin_king_male:0 "원수 각하"
 flav_idi_amin_emperor_male:0 "종신 대원수"
 idi_amin_proclaim_uganda_republic_decision:0 "우간다 제2공화국 및 종신 대통령 선포"
 idi_amin_proclaim_uganda_republic_decision_desc:0 "나일강 상류의 센나르와 알로디아 전역을 우리의 심바 대대가 완전히 장악했습니다! 이제 스스로에게 빅토리아 십자훈장과 원수 계급장을 수여하고, '스코틀랜드의 마지막 왕'이자 종신 대통령이 통치하는 불패의 군사 국가—'우간다 제2공화국'의 탄생을 온 세상에 선포할 시간입니다!"
 idi_amin_proclaim_uganda_republic_decision_tooltip:0 "'우간다 제2공화국'을 창설하고 종신 대통령 작위와 심바 정예 대대 1,000명을 소집합니다."
 idi_amin_proclaim_uganda_republic_decision_confirm:0 "짐이 곧 우간다의 종신 대통령이자 원수 각하시다!"
 idi_amin_last_king_of_scotland_dynasty_modifier:0 "스코틀랜드의 마지막 왕이자 종신 원수"
 idi_amin_last_king_of_scotland_dynasty_modifier_desc:0 "이 가문은 우간다 제2공화국을 창건하고 스스로에게 온갖 화려한 원수 칭호와 훈장을 수여하여 압도적인 무력과 공포를 과시합니다."
 idi_amin_proclaim_british_conqueror_empire_decision:0 "대영제국 정복자 및 우간다 대제국 선포"
 idi_amin_proclaim_british_conqueror_empire_decision_desc:0 "나일강 상류에서 시작된 우리의 행군이 누비아와 코르도판, 다르푸르의 사바나까지 동아프리카 전역을 집어삼켰습니다! 이제 '지상의 모든 짐승과 바다의 모든 물고기의 주인'이자 '대영제국의 정복자'라는 위대한 칭호에 걸맞은 초거대 군벌 제국—'우간다 대제국'의 등극을 엄숙히 선포합니다!"
 idi_amin_proclaim_british_conqueror_empire_decision_tooltip:0 "'우간다 대제국'을 창설하고 수도 캄팔라 총사령부 버프 및 심바 정예 대대 2,000명을 소집합니다."
 idi_amin_proclaim_british_conqueror_empire_decision_confirm:0 "지상의 모든 짐승과 바다의 물고기들아, 대원수 앞에 엎드려라!"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier:0 "지상의 모든 짐승과 바다의 물고기들의 지배자"
 idi_amin_conqueror_of_all_beasts_dynasty_modifier_desc:0 "이 가문은 동아프리카를 제패하고 우간다 대제국을 건설하여, 누구도 감히 넘볼 수 없는 괴력과 공포, 최정예 친위 기사단을 거느립니다."
 idi_amin_kampala_command_capital_modifier:0 "캄팔라 총사령부와 나일강 악어 처형장"
 idi_amin_kampala_command_capital_modifier_desc:0 "대원수의 황금 연회장과 악어들이 우글거리는 처형장이 자리 잡은 제국의 수도로서 막대한 공납과 삼엄한 경비를 자랑합니다."
 idi_amin_economic_war_expulsion_decision:0 "경제 전쟁 선포 및 외래 상인 재산 몰수"
 idi_amin_economic_war_expulsion_decision_desc:0 "어젯밤 꿈속에서 전능하신 신께서 직접 계시를 내리셨습니다! 우리 영지의 상권을 쥐락펴락하며 금화를 쓸어 담는 외래 상인들과 배부른 부유층들의 재산을 전부 몰수하여, 충직한 심바 대대 장교들과 군부 측근들에게 통 크게 나누어 주는 위대한 '경제 전쟁'을 선포하겠습니다!"
 idi_amin_economic_war_expulsion_decision_tooltip:0 "경제 전쟁을 선포하여 전투력이나 관리력 판정에 따라 상점가 무력 접수 또는 국영 상회 운영 성과가 갈리는 전용 이벤트를 시작합니다."
 idi_amin_economic_war_expulsion_decision_confirm:0 "오늘부터 모든 상점과 금고는 우리 군부의 것이다!"
 idi_amin_economic_war_spoils_modifier:0 "경제 전쟁 적산 분배"
 idi_amin_economic_war_spoils_modifier_desc:0 "몰수한 상인들의 재산과 점포를 군부 장교들과 봉신들에게 후하게 나누어 주어 군대의 충성심과 사기가 하늘을 찌릅니다."
 idi_amin_srb_crocodile_feast_decision:0 "국가연구국 비밀 만찬 및 악어 밥 처형"
 idi_amin_srb_crocodile_feast_decision_desc:0 "감히 종신 대통령 각하께 불만을 품거나 맞서는 반역자들에게는 자비란 없습니다! 국가연구국 요원들을 보내 놈을 지하 취조실로 끌고 오십시오. 오늘 밤 원수 각하의 비밀 냉장고와 식탁에는 특별한 고기 요리가 오를 것이며, 남은 뼈다귀는 나일강의 굶주린 악어들에게 던져 줄 것입니다!"
 idi_amin_srb_crocodile_feast_decision_tooltip:0 "선택한 정적을 나일강 악어 연못 연회장으로 끌고 가 희생양과의 기량 육탄 대결이나 계책력 연출에 따라 처형 보상이 갈리는 전용 이벤트를 시작합니다."
 idi_amin_srb_crocodile_feast_decision_confirm:0 "식탁을 차려라! 남은 것은 나일강의 악어들에게 던져 주어라!"
 idi_amin_srb_crocodile_feast_decision_req_candidate:0 "감옥에 성인 죄수가 있거나, 궁정 신하·직속 봉신 중 경쟁자·원수 또는 의견이 -25 이하인 불만 세력이 존재함"
 idi_amin_srb_crocodile_feast_decision_select_tt:0 "국가연구국 비밀 만찬 및 악어 밥으로 처형할 대상을 선택해야 합니다."
 idi_amin_srb_crocodile_feast_decision_effect_tt:0 "[crocodile_victim.GetShortUIName|U](이)가 국가연구국 지하실로 끌려가 재산을 몰수당하고 원수의 비밀 만찬 제물로 식인 처형됨"
 idi_amin_crocodile_execution_modifier:0 "나일강의 악어와 원수의 식탁"
 idi_amin_crocodile_execution_modifier_desc:0 "정적을 직접 식탁에 올리고 나일강 악어 밥으로 던져 주는 기괴한 공포 앞에 모든 봉신과 음모꾼들이 벌벌 떨며 복종합니다."
 artifact_idi_amin_scotland_medal_rack_name:0 "스코틀랜드의 마지막 왕 자칭 훈장 패용대"
 artifact_idi_amin_scotland_medal_rack_desc:0 "제복 상의가 무게를 이기지 못해 찢어질 지경으로 주렁주렁 매달아 놓은 자칭 빅토리아 십자훈장과 스코틀랜드 왕위 계승 기념 메달 패용대입니다. 짤랑거리는 금속 훈장 소리와 압도적인 체격만으로도 적들의 간담을 서늘하게 얼어붙게 만듭니다."
 idi_amin_scotland_medal_rack_modifier:0 "스코틀랜드의 마지막 왕 자칭 훈장 패용대"
 councillor_court_chaplain_aminism_possessive:0 "국가연구국장의"
 idi_amin_economic_war_event_preview_tt:0 "경제 전쟁 선포 이벤트가 열리며 [martial|E] 군부 상점가 무력 압류, 고위험 [stewardship|E] 국영 상회 직접 운영, 또는 특별 보호세 징수 중 하나를 선택합니다"
 idi_amin_crocodile_feast_event_preview_tt:0 "나일강 악어 연못 연회 이벤트가 열리며 [crocodile_victim.GetShortUIName](와)과 맨주먹 [prowess|E] 육탄 대결, [intrigue|E] 비밀경찰 공개 수장, 또는 안전한 철창 처형 중 하나를 선택합니다"
 villains_religious_decision.0090.t:0 "시장통에 울려 퍼진 경제 전쟁의 나팔"
 villains_religious_decision.0090.desc:0 "비단과 향신료, 금화가 오가던 번화한 상점가 입구를 무장한 심바 대대 병사들이 겹겹이 포위했다. 겁에 질린 대상인들이 장부를 껴안은 채 내 명령만을 기다리고 있고, 내 뒤의 장교들은 부유한 점포 열쇠를 차지할 생각에 군침을 흘리고 있다.\n\n군대를 풀어 창고와 점포를 일거에 접수하고 충직한 장교들에게 통 크게 하사할 것인가, 아니면 내가 직접 국영 상회의 총재가 되어 국가 경제를 지휘할 것인가?"
 villains_religious_decision.0090.a:0 "심바 대대를 투입해 상점가를 전격 압류하고 충성파 장교들에게 나눠준다!"
 villains_religious_decision.0090.a.success:0 "일사불란한 무력 접수로 막대한 금화와 군부의 절대 충성을 확보함"
 villains_religious_decision.0090.a.failure:0 "통제를 잃은 병사들의 약탈 방화로 시장 거리가 잿더미가 됨"
 villains_religious_decision.0090.b:0 "몰수한 모든 상권을 내 직속 국영 상회로 재편해 직접 경영한다!"
 villains_religious_decision.0090.b.success:0 "뜻밖의 천재적 상술로 교역망이 번창하며 금화가 폭포처럼 쏟아짐!"
 villains_religious_decision.0090.b.failure:0 "복잡한 회계 장부를 읽지 못해 물류가 마비되고 상권이 붕괴함"
 villains_religious_decision.0090.c:0 "전면 추방 대신 상인 조합에서 거액의 특별 보호세만 징수한다."
 villains_religious_decision.0100.t:0 "나일강 악어 연못의 피의 만찬"
 villains_religious_decision.0100.desc:0 "횃불이 일렁이는 강변 연회장 아래, 거대한 나일강 악어들이 흙탕물 속에서 누런 눈을 번뜩이며 턱을 딱딱거리고 있다. 끌려 나온 [crocodile_victim.GetTitledFirstName](은)는 사색이 되어 목숨을 구걸하고, 초청받은 봉신들은 마른침을 삼키며 내 손짓을 주시한다.\n\n천하무적 헤비급 챔피언의 괴력을 과시하기 위해 포박을 풀고 맨주먹으로 때려눕혀 연못에 던져 넣을 것인가, 아니면 비밀경찰을 시켜 본보기로 수장시킬 것인가?"
 villains_religious_decision.0100.a:0 "밧줄을 풀어라! 내 맨주먹으로 때려눕혀 직접 악어 밥으로 던져주마!"
 villains_religious_decision.0100.a.success:0 "벼락같은 강펀치 한 방에 희생양이 연못으로 날아가며 모두가 전율함!"
 villains_religious_decision.0100.a.failure:0 "필사적으로 저항한 희생양에게 상처를 입고 호위병의 도움으로 겨우 처형함"
 villains_religious_decision.0100.b:0 "비밀경찰 요원들을 시켜 봉신들의 눈앞에서 잔혹하게 수장시킨다."
 villains_religious_decision.0100.b.success:0 "피도 눈물도 없는 처형 연출에 모든 불만 세력이 공포로 얼어붙음"
 villains_religious_decision.0100.b.failure:0 "지나치게 역겨운 연출에 참석한 귀족들이 구역질하며 반감을 품음"
 villains_religious_decision.0100.c:0 "철창 너머에서 안전하게 결박된 죄수를 연못으로 밀어 넣는다."
 idi_amin_economic_boom_modifier:0 "국영 상회 번영의 기적"
 idi_amin_economic_boom_modifier_desc:0 "몰수한 상점과 교역망이 예상 밖으로 원활하게 운영되어 국고와 군부 모두 막대한 부를 누리고 있습니다."
 idi_amin_economic_collapse_modifier:0 "경제 전쟁 상권 붕괴"
 idi_amin_economic_collapse_modifier_desc:0 "숙련된 상인들을 내쫓고 장부도 못 읽는 군인들이 점포를 차지한 바람에 시장 유통망이 완전히 마비되었습니다."
 idi_amin_srb_crocodile_feast_decision_no_item_selected:0 "악어 밥 만찬에서 처형할 정적이 선택되지 않았습니다"
 idi_amin_coronation_true_king_of_scotland_decision:0 "진짜 스코틀랜드의 마지막 왕 대관식 선포"
 idi_amin_coronation_true_king_of_scotland_decision_desc:0 "나일강 상류에서 출발한 우리의 심바 대대가 지중해와 거친 북해의 파도를 건너 마침내 머나먼 스코틀랜드의 심장부를 진짜로 점령했습니다! 이제 자칭이 아닌 명실상부한 '스코틀랜드의 마지막 왕'으로서 에든버러와 스콘의 대관석 위에 올라, 타탄 체크 치마를 입은 심바 근위대와 백파이프 군악대의 우렁찬 행진곡 아래 대관식을 거행할 시간입니다!"
 idi_amin_coronation_true_king_of_scotland_decision_tooltip:0 "스코틀랜드 왕국의 진정한 군주로 등극하여 게일어를 습득하고, 가문 영구 보너스와 백파이프 행궁 버프 및 하일랜드 심바 근위대 1,000명을 소집합니다."
 idi_amin_coronation_true_king_of_scotland_decision_confirm:0 "백파이프를 불어라! 짐이 진짜 스코틀랜드의 왕이다!"
 idi_amin_true_king_of_alba_dynasty_modifier:0 "진정한 스코틀랜드와 우간다의 군주"
 idi_amin_true_king_of_alba_dynasty_modifier_desc:0 "나일강에서 북해 끝 스코틀랜드까지 대장정을 완수해 허풍을 현실로 만든 이 가문은 타 문화 신민들조차 경악과 경탄 속에 복종시킵니다."
 idi_amin_edinburgh_bagpipe_palace_modifier:0 "원수 각하의 하일랜드 백파이프 행궁"
 idi_amin_edinburgh_bagpipe_palace_modifier_desc:0 "우간다식 군사 열병식과 스코틀랜드 백파이프 악단이 밤낮으로 울려 퍼지는 이 북방 행궁은 기묘한 축제 분위기 속에 높은 세수와 민심을 자랑합니다."
 idi_amin_highland_simba_guard_name:0 "하일랜드 타탄 심바 근위대"
