 # === [단일 명칭 유물 · 고유 결단 · 이벤트 · 변화요소] ===
 artifact_tojo_tortoiseshell_spectacles_name:0 "도조의 둥근 대모테 안경"
 artifact_tojo_tortoiseshell_spectacles_desc:0 "도조 히데키가 밤낮없이 서류철과 배급 장부, 골목 쓰레기통 잔반 내역까지 샅샅이 들여다볼 때 코끝에 걸치던 둥근 거북등 대모테 안경입니다. 부하들의 사소한 회계 누락과 음모는 귀신같이 잡아내지만, 정작 본인의 피로와 신경질은 날마다 쌓여만 갑니다."
 artifact_tojo_ghq_victory_bulletin_name:0 "대본영 대승리 허위 발표문"
 artifact_tojo_ghq_victory_bulletin_desc:0 "전선에서 궤멸적인 패배를 당해도 붓끝 하나로 적군 전멸 대승리나 '전진적 전선 이동'으로 둔갑시켜 버리는 마법 같은 대본영 공식 발표 철입니다. 영지 백성들은 연일 울려 퍼지는 승전보에 열광하며 정통성을 바치지만, 서류와 현실의 괴리 탓에 실제 병력 충원은 자꾸만 헛돌곤 합니다."
 tojo_tortoiseshell_spectacles_modifier:0 "도조의 둥근 대모테 안경"
 tojo_ghq_victory_bulletin_modifier:0 "대본영 대승리 허위 발표문"
 tojo_total_mobilization_dynasty_modifier:0 "국가총동원령과 통제파 내각"
 tojo_total_mobilization_dynasty_modifier_desc:0 "간토 전역을 총력전 행정망으로 편제한 이 가문은 헌병대 중보병 운용과 봉신 세수 징수에서 냉혹한 효율을 발휘합니다."
 tojo_imperial_rule_dynasty_modifier:0 "팔굉일우 총력체제 패권"
 tojo_imperial_rule_dynasty_modifier_desc:0 "열도 전역을 단일한 대정익찬 동원 체제로 석권한 이 가문은 흔들림 없는 통제력과 중보병 화력, 방첩망을 자랑합니다."
 tojo_imperial_tokyo_capital_county_modifier:0 "제도 도쿄 대본영 총괄청"
 tojo_imperial_tokyo_capital_county_modifier_desc:0 "대본영 참모부와 헌병 사령부, 군수 병기창이 밀집한 총력전 제국의 심장부입니다."
 tojo_ghq_fabricated_victory_euphoria_modifier:0 "열도를 뒤덮은 대본영 승전 제등행렬"
 tojo_ghq_fabricated_victory_euphoria_modifier_desc:0 "적군을 열 배로 격멸했다는 대본영 발표에 감격한 백성들이 밤새 제등행렬을 벌이며 징집과 군비 헌납에 앞다투어 응하고 있습니다."
 tojo_ghq_bulletin_exposed_fiasco_modifier:0 "들통난 대본영 허위 전과 망신"
 tojo_ghq_bulletin_exposed_fiasco_modifier_desc:0 "이미 수차례 격침했다고 발표한 적 함대가 멀쩡히 앞바다에 나타나면서 대본영 발표가 새빨간 거짓말이었음이 만천하에 들통났습니다."
 tojo_strategic_redeployment_requisition_modifier:0 "전진적 전선 이동과 비상 국채 징발"
 tojo_strategic_redeployment_requisition_modifier_desc:0 "후퇴라는 단어를 금지하고 '전진적 전선 이동'이라 부르며 결전 준비 명목으로 비상 전시 세금을 걷어들이고 있습니다."
 tojo_portfolio_monopoly_cabinet_modifier:0 "일인다역 팔부처 겸직 내각"
 tojo_portfolio_monopoly_cabinet_modifier_desc:0 "총리 본인이 군무와 내무, 재정과 병기 행정까지 모조리 겸직하여 군 유지비와 직할지 효율을 끌어올렸으나, 자리를 빼앗긴 봉신들의 원성이 자자합니다."
 tojo_midnight_trash_audit_triumph_modifier:0 "새벽 골목 쓰레기통 불시 감찰의 공포"
 tojo_midnight_trash_audit_triumph_modifier_desc:0 "내각총리대신이 동트기 전 골목 쓰레기통을 직접 뒤져 생선 가시와 흰쌀밥 흔적을 적발하자 온 영지 관료들이 부패할 엄두조차 내지 못합니다."
 tojo_alleyway_laughingstock_modifier:0 "새벽 쓰레기통 뒤지다 개에게 물린 총리"
 tojo_alleyway_laughingstock_modifier_desc:0 "한밤중 남의 집 뒷골목 쓰레기통을 뒤지다가 도둑으로 몰리고 들개에게 쫓긴 일화가 퍼져 궁정의 웃음거리가 되었습니다."
 tojo_establish_total_mobilization_cabinet_decision:0 "대일본 총력내각 수립과 국가총동원령"
 tojo_establish_total_mobilization_cabinet_decision_desc:0 "간토 평야와 도쿄만의 무사단과 장원들이 마침내 우리의 대정익찬 총괄부 아래 일사불란하게 정렬했습니다! 나약한 귀족들의 파벌 놀음을 끝장내고 모든 인력과 물자를 서류 한 장으로 동원하는 '대일본 총력내각'을 공식 출범시킬 시간입니다."
 tojo_establish_total_mobilization_cabinet_decision_tooltip:0 "간토 거점을 통합하여 '대일본 총력내각'을 수립하고 가문 고유의 국가총동원 체제와 특무 헌병단을 창설합니다."
 tojo_establish_total_mobilization_cabinet_decision_confirm:0 "국가총동원령에 직인을 찍어라!"
 tojo_proclaim_empire_of_japan_decision:0 "대일본 제국 선포와 익찬 신체제 완성"
 tojo_proclaim_empire_of_japan_decision_desc:0 "동쪽 무사시 도쿄만에서 서쪽 교토 어소에 이르기까지 열도의 모든 성채와 관청이 대정익찬회의 깃발 아래 통합되었습니다! 낡은 섭정 관백의 시대를 영원히 마감하고, 총리대신이 통수권과 국정을 한 손에 쥐는 강철의 '대일본 제국'을 천하에 선포하십시오!"
 tojo_proclaim_empire_of_japan_decision_tooltip:0 "무사시와 교토를 비롯한 열도 핵심 영지를 제압하여 '대일본 제국'을 선포하고 대본영 근위 헌병 사단을 소집합니다."
 tojo_proclaim_empire_of_japan_decision_confirm:0 "전 열도를 총력 신체제로 묶어라!"
 tojo_imperial_ghq_victory_bulletin_decision:0 "대본영 발표와 전진적 전선 이동 보도"
 tojo_imperial_ghq_victory_bulletin_decision_desc:0 "전황이 불리하다고 사실대로 적어 내는 참모는 정신 상태가 글러 먹은 자입니다! 적의 피해는 열 배로 불리고 아군의 후퇴는 '전진적 전선 이동'이라 고쳐 쓰십시오. 화려한 북소리와 나팔 가락을 앞세워 대본영 특별 승전보를 반포하면 온 영지 백성들이 열광하며 전쟁 성금을 바칠 것입니다!"
 tojo_imperial_ghq_victory_bulletin_decision_tooltip:0 "대본영 특별 발표문을 반포하여 계책력 전과 부풀리기 선동이나 '전진적 전선 이동' 전시 국채 징발을 단행합니다."
 tojo_imperial_ghq_victory_bulletin_decision_confirm:0 "나팔을 불어라! 오늘도 우리 군의 대승리다!"
 tojo_imperial_ghq_victory_bulletin_event_preview_tt:0 "대본영 보도국에서 #V 계책력#! 전과 열 배 부풀리기 제등행렬 선동, '전진적 전선 이동' 비상 국채 징발, 또는 헌병대 보도 검열 중 하나를 선택합니다."
 tojo_midnight_trash_inspection_decision:0 "새벽 골목 쓰레기통 불시 감사와 부처 겸직"
 tojo_midnight_trash_inspection_decision_desc:0 "서류 보고서만 믿고 책상머리에 앉아 있으면 아랫것들이 귀한 쌀과 군수품을 빼돌리기 마련입니다! 동트기 전 어두운 새벽 골목으로 직접 나가 관료와 상인 집 앞의 나무 쓰레기통 뚜껑을 열어젖히고, 못 미더운 대신들의 직책은 아예 내가 전부 겸직해 버리겠습니다!"
 tojo_midnight_trash_inspection_decision_tooltip:0 "새벽 뒷골목 쓰레기통을 직접 뒤져 암시장 횡령을 적발하거나, 내각 주요 직책을 혼자 독식해 행정 효율을 극대화합니다."
 tojo_midnight_trash_inspection_decision_confirm:0 "수첩과 횃불을 가져와라, 쓰레기통부터 열어 본다!"
 tojo_midnight_trash_inspection_event_preview_tt:0 "#V 관리력#! 새벽 골목 쓰레기통 불시 감사로 은닉 금화와 직할지 통제력을 확보하거나, 여덟 부처 장관직을 혼자 겸직해 상비군 유지비와 직할지 한계를 늘립니다."
 villains_religious_decision.0240.t:0 "붉은 붓질로 고쳐 쓰는 대본영 특별 발표문"
 villains_religious_decision.0240.desc:0 "촛불이 일렁이는 대본영 작전실 탁자 위에 일선에서 올라온 흙투성이 전황 보고서가 수북이 쌓여 있다. 둥근 대모테 안경을 치켜올리며 먹물 붓을 든 내 앞에서 참모가 식은땀을 흘리며 눈치를 살핀다.\n\n사실대로 발표했다간 영지민들의 사기와 내각의 권위가 흔들릴 터! 아예 적군 격멸 숫자와 노획품 목록 뒤에 동그라미를 하나씩 더 그려 넣어 열광적인 승전 제등행렬을 열게 할 것인가, 아니면 후퇴라는 글자를 전부 박박 지우고 '다음 결전을 위한 전진적 전선 이동'이라 발표한 뒤 비상 방위 성금을 걷어낼 것인가?"
 villains_religious_decision.0240.a:0 "적 사살 숫자에 동그라미를 하나 더 붙여라! 대승리 제등행렬을 명한다!"
 villains_religious_decision.0240.a.success:0 "감쪽같은 대승리 발표에 온 거리가 제등행렬과 환호성으로 뒤덮임!"
 villains_religious_decision.0240.a.failure:0 "\"세 번이나 격멸했다던 적군이 왜 멀쩡히 살아 있소?!\" 거짓말이 탄로 남!"
 villains_religious_decision.0240.b:0 "후퇴가 아니다, '전진적 전선 이동'이다! 결전 준비용 전시 국채를 징발하라!"
 villains_religious_decision.0240.b.toast:0 "전진적 전선 이동 담화문과 함께 비상 군자금을 징수함"
 villains_religious_decision.0240.c:0 "과장은 줄이고 제국 헌병대를 풀어 불온한 유언비어만 엄중히 단속한다."
 villains_religious_decision.0250.t:0 "동트기 전 뒷골목의 나무 쓰레기통과 깨알 수첩"
 villains_religious_decision.0250.desc:0 "물안개가 자욱한 새벽녘, 나는 호위 헌병 둘만 거느린 채 도성 관료들의 저택이 늘어선 어두운 뒷골목에 모습을 드러냈다. 둥근 안경알 너머로 빛나는 눈초리로 대문 옆 나무 쓰레기통 뚜껑을 확 열어젖히자, 절약령을 비웃듯 하얀 쌀밥 찌꺼기와 고급 도미 생선 가시가 고스란히 모습을 드러낸다!\n\n수첩에 꼼꼼히 죄목을 받아 적는 내 등 뒤로 잠옷 바람의 관료가 새파랗게 질려 무릎을 꿇었다. 지금 당장 골목 전체의 쓰레기통을 탈탈 털어 암시장 횡령금을 모조리 국고로 환수할 것인가, 아니면 아예 저 무능한 대신들의 감투를 전부 빼앗아 내가 여덟 부처를 혼자 겸직해 버릴 것인가?"
 villains_religious_decision.0250.a:0 "골목 쓰레기통을 전부 뒤져라! 생선 가시 하나까지 추징금으로 환수한다!"
 villains_religious_decision.0250.a.success:0 "신들린 쓰레기통 감사로 은닉 자금을 국고에 환수하고 관료 기강을 완전히 제압함!"
 villains_religious_decision.0250.a.failure:0 "어두운 골목에서 오물 통을 엎지르고 사나운 들개에게 쫓겨 망신만 당함!"
 villains_religious_decision.0250.b:0 "아랫것들은 못 믿겠다! 군무·내무·군수·재정 직책을 전부 내가 겸직한다!"
 villains_religious_decision.0250.b.toast:0 "내각 주요 직책을 독식하고 직할 특무 헌병대를 편성함"
 villains_religious_decision.0250.c:0 "수첩에 경고장만 빽빽이 적어 내려가고 검소한 보리차 배급령을 내린다."
