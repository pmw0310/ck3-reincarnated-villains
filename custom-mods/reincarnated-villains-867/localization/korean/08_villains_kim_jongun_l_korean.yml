 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 councillor_court_chaplain_juche:0 "선전선동부장"
 councillor_court_chaplain_juche_possessive:0 "선전선동부장의"
 d_juche:0 "당중앙위원회"
 d_juche_adj:0 "당중앙"
 artifact_kim_aged_emmental_casket_name:0 "당중앙 특각 숙성 에멘탈 치즈함"
 artifact_kim_aged_emmental_casket_desc:0 "알프스 유학 시절의 향수를 잊지 못해 온 나라가 허리띠를 졸라매는 고난의 행군 속에서도 당중앙 특각 지하 창고에 소중히 밀수해 쌓아 둔 최고급 구멍 뚫린 에멘탈 치즈 보관함입니다. 고소하고 진한 풍미가 최고존엄의 심신을 달래 주지만, 야심한 밤마다 계속 집어 먹다 보면 건강에는 다소 해롭습니다."
 kim_proclaim_paektu_monolithic_system_decision:0 "조선민주주의인민공화국 창건과 유일영도 체제 선포"
 kim_proclaim_paektu_monolithic_system_decision_desc:0 "서경과 북계를 넘어 개성 일대까지 완전히 평정한 지금, 백두산의 성스러운 혈통을 이어받은 우리 가문 아래 '조선민주주의인민공화국'의 창건을 온 천하에 선포할 때가 왔습니다! 당중앙의 유일사상 십대원칙을 영구히 반포하고, 대를 이어 충성을 바칠 호위사령부 결사대를 창설할 것입니다."
 kim_proclaim_paektu_monolithic_system_decision_tooltip:0 "'조선민주주의인민공화국'을 창설하고 백두혈통의 영구적인 유일영도 체제를 확립합니다."
 kim_proclaim_paektu_monolithic_system_decision_confirm:0 "백두의 혈통을 대를 이어 끝까지!"
 kim_paektu_monolithic_system_dynasty_modifier:0 "백두혈통 유일영도 체제"
 kim_paektu_monolithic_system_dynasty_modifier_desc:0 "이 가문은 조선민주주의인민공화국을 창건하고 신성불가침의 백두혈통 유일영도 체제를 확립하여, 모든 가문원이 강력한 정통성과 공포, 그리고 직할지 통치 한계 보너스를 누립니다."
 kim_proclaim_juche_superpower_empire_decision:0 "대조선 민주주의인민공화국 선포와 주체 천하통일"
 kim_proclaim_juche_superpower_decision_desc:0 "혁명의 수도 서경에서 출발한 우리의 폭풍군단이 개성과 경주를 넘어 북방 고토까지 삼천리 강토를 완전히 평정하였습니다! 이제 어버이 수령님들의 유훈을 받들어 온 세상이 우러러보는 주체의 대제국—'대조선 민주주의인민공화국'의 완성을 엄숙히 선포합니다!"
 kim_proclaim_juche_superpower_empire_decision_desc:0 "혁명의 수도 서경에서 출발한 우리의 폭풍군단이 개성과 경주를 넘어 북방 고토까지 삼천리 강토를 완전히 평정하였습니다! 이제 어버이 수령님들의 유훈을 받들어 온 세상이 우러러보는 주체의 대제국—'대조선 민주주의인민공화국'의 완성을 엄숙히 선포합니다!"
 kim_proclaim_juche_superpower_empire_decision_tooltip:0 "'대조선 민주주의인민공화국'을 창설하고 천하통일 대업을 완수하여 영원한 수령 통치 체제를 완성합니다."
 kim_proclaim_juche_superpower_empire_decision_confirm:0 "위대한 대조선 만세! 주체혁명 위업 만세!"
 kim_juche_superpower_empire_dynasty_modifier:0 "대조선의 영원한 수령"
 kim_juche_superpower_empire_dynasty_modifier_desc:0 "이 가문은 삼한과 북방 고토를 아우르는 대조선 민주주의인민공화국을 건설하여, 신앙인들의 절대적인 숭배와 직할지 한계, 공포 및 정통성을 영구히 누립니다."
 kim_revolutionary_pyongyang_county_modifier:0 "혁명의 수도 평양 직할시"
 kim_revolutionary_pyongyang_county_modifier_desc:0 "주체사상탑과 인민대학습당이 우뚝 솟은 강성대국의 심장부로서 난공불락의 요새 방어력과 높은 개발 성장을 자랑합니다."
 kim_paektu_idolization_decision:0 "백두혈통 우상화 사업 선포"
 kim_paektu_idolization_decision_desc:0 "백두산의 정기를 타고난 김씨 일가의 핏줄은 평범한 인간이 아니라 온 인민이 영원히 받들어 모셔야 할 주체의 태양이자 광명성입니다! 당 중앙위원회와 선전선동부를 총동원하여 전국 방방곡곡에 영생탑과 태양상을 세우고, 선택된 백두혈통 일원을 살아있는 성인이자 영원한 수령으로 신격화하겠습니다."
 kim_paektu_idolization_decision_tooltip:0 "백두혈통 우상화 대축전을 열어 선택한 일원을 성인으로 추대하고, 계책력이나 외교력·학식 판정에 따라 체제 결속 보상이 결정되는 전용 이벤트를 시작합니다."
 kim_paektu_idolization_decision_confirm:0 "백두산의 광명성으로 영원히 추대하라!"
 kim_paektu_idolization_decision_req_candidate:0 "아직 [GetTrait('saint').GetName( GetNullCharacter )]으로 우상화되지 않은 백두혈통 가문원 또는 직계 가족이 존재함"
 kim_paektu_idolization_decision_select_tt:0 "우상화할 백두혈통 인물을 선택해야 합니다."
 kim_paektu_idolization_decision_effect_tt:0 "[idolized_target.GetShortUIName|U] 동지가 [GetTrait('saint').GetName( GetNullCharacter )] 특성 및 황금 후광을 얻고 주체사상 영생 성인 명부에 공식 등재됨"
 kim_aged_emmental_casket_modifier:0 "당중앙 특각 숙성 에멘탈 치즈함"
 kim_paektu_idolization_event_preview_tt:0 "태양 성전 봉안식 이벤트가 열리며 [intrigue|E] 무결점 통제 우상화, [diplomacy|E] 및 [learning|E] 대서사시 선전, 또는 엄숙한 간부 봉안식 중 하나를 선택합니다"
 villains_religious_decision.0060.t:0 "백두의 태양을 모시는 영생 대축전"
 villains_religious_decision.0060.desc:0 "수만 개의 붉은 깃발과 거대한 태양 문양이 광장을 뒤덮은 가운데, 오늘 주체의 영생 성열에 오를 [idolized_target.GetTitledFirstName](을)를 기리는 봉안식이 막을 올렸다. 북소리가 대지를 울리고 백성들은 눈물을 흘릴 준비를 마친 채 단상을 우러러보고 있다.\n\n보위부의 서슬 퍼런 감시망으로 숨소리조차 허용치 않는 절대 복종을 관철할 것인가, 아니면 웅장한 서사시와 예술 선전으로 만민의 자발적 숭배를 이끌어낼 것인가?"
 villains_religious_decision.0060.a:0 "보위부를 총동원해 눈물 한 방울까지 검열하는 무결점 우상화를 관철한다!"
 villains_religious_decision.0060.a.success:0 "완벽한 감시와 공포 속에 온 나라가 백두혈통 앞에 일심단결함"
 villains_religious_decision.0060.a.failure:0 "과도한 강제 동원에 반발한 불경 낙서 사건이 터져 체면이 구겨짐"
 villains_religious_decision.0060.b:0 "거대한 태양 기념비와 혁명 서사시로 백성들의 열광적 숭배를 연출한다!"
 villains_religious_decision.0060.b.success:0 "압도적인 예술 선전에 감화된 백성들이 진심으로 만세를 연호함"
 villains_religious_decision.0060.b.failure:0 "조악하게 급조된 기념비와 찬가가 뒷골목의 수군거림을 자초함"
 villains_religious_decision.0060.c:0 "핵심 간부들만 참석한 가운데 엄숙하게 혈통 봉안 의식을 치른다."
 kim_paektu_idolization_supreme_modifier:0 "유일사상 일심단결의 정점"
 kim_paektu_idolization_supreme_modifier_desc:0 "성대하게 거행된 백두혈통 봉안식을 통해 수령을 향한 신격화와 체제 결속력이 하늘을 찌르고 있습니다."
 kim_idolization_backlash_modifier:0 "강압적 우상화의 민심 이반"
 kim_idolization_backlash_modifier_desc:0 "무리한 우상화 동원과 어설픈 선전 사업이 백성과 간부들 사이에 은밀한 반감을 키웠습니다."
 kim_paektu_idolization_decision_no_item_selected:0 "우상화로 추대할 백두혈통 대상이 선택되지 않았습니다"
 kim_asymmetric_force_development_decision:0 "비대칭 전력 개발"
 kim_asymmetric_force_development_decision_desc:0 "사방을 에워싼 대국들의 침략 야욕을 단숨에 분쇄하려면 재래식 창칼이 아니라 적의 성벽 자체를 흔적도 없이 날려버릴 초월적 결전 병기가 필요하다! 국고와 영지의 모든 구리와 초석을 지하 비밀 주조창에 쏟아부어 시대를 앞서간 거대 청동 사석포 열 문을 주조하고 시험 발사를 강행할 시간이다."
 kim_asymmetric_force_development_decision_post_gunpowder_desc:0 "화약과 대포 제조 기술이 온전히 확립된 지금, 더 이상 지하 주조창의 위태로운 시험 발사에 연연할 필요가 없습니다. 이제 국가의 모든 화약고와 대구경 주조소를 총동원하여 전략적 우위를 확립할 시간입니다. 군 최고사령부는 어느 방면에 화력을 집중할지 최고영도자의 교시를 기다리고 있습니다."
 kim_asymmetric_force_development_decision_tooltip:0 "지하 비밀 주조창을 가동하여 극악의 성공 확률을 뚫고 사석포 열 문으로 구성된 전략 포병 중대 생산을 시도하거나 위장 무력시위를 벌입니다."
 kim_asymmetric_force_development_decision_confirm:0 "지하 화포 주조창에 점화하라!"
 kim_asymmetric_force_development_decision_post_gunpowder_confirm:0 "전략 화력 총동원령을 하달하라!"
 kim_asymmetric_force_development_event_preview_tt:0 "극악의 확률로 #V 사석포 10기#! 세습 특수 부대를 생산하는 시험 발사 도박 또는 #V 계략#! 기반 통나무 모형 화포 위장 열병식 이벤트가 발생합니다."
 kim_asymmetric_force_post_gunpowder_preview_tt:0 "공성 효율을 극대화하는 #V [주체포 집중 타격]#! 또는 야전 병력 전투력을 대폭 증강하는 #V [폭풍군단 화력 지원]#! 중 하나를 선택하여 5년간 전략적 화력 우위를 누립니다."
 villains_religious_decision.0180.t:0 "지하 비밀 주조창의 시험 발사"
 villains_religious_decision.0180.desc:0 "매캐한 유황 연기와 붉은 쇳물 열기가 가득 찬 지하 석조 주조창 한복판에 거대한 청동 포신 열 문이 참나무 포차 위에 육중한 자태를 드러냈다. 배석한 서기들과 대장장이들은 지금 시대 기술로는 청동 두께와 흑색화약 배합을 조금만 잘못 맞추어도 포신이 산산조각 나 주조창 전체가 무너질 것이라며 바들바들 떨고 있다.\n\n하지만 단 한 번만 시험 발사에 성공한다면 천하의 어떤 난공불락 요새도 단숨에 잿더미로 만들 무적의 자위적 억제력을 손에 넣게 된다. 대장장이들의 목숨을 걸고 화약을 두 배로 채워 넣을 것인가, 아니면 검은 옻칠을 칠한 통나무 모형 포신으로 사방의 적들을 감쪽같이 속일 것인가?"
 villains_religious_decision.0180.a:0 "정석 배합대로 청동 포신을 주조하고 시험 발사를 단행하라!"
 villains_religious_decision.0180.a.success:0 "천지를 뒤흔드는 굉음과 함께 거대 사석포 열 문 주조에 대성공함!"
 villains_religious_decision.0180.a.failure:0 "청동 포신이 압력을 이기지 못하고 균열을 일으키며 산산조각 남"
 villains_religious_decision.0180.b:0 "장인들의 목을 걸고 흑색화약을 두 배로 쑤셔 넣어라! 무조건 쏴 올려!"
 villains_religious_decision.0180.b.success:0 "기적 같은 불기둥이 솟구치며 무적의 사석포 중대가 완성됨!"
 villains_religious_decision.0180.b.failure:0 "과충전된 포신이 폭발하며 날아온 청동 파편에 경상을 입음"
 villains_religious_decision.0180.b.critical_failure:0 "지하 화약고가 연쇄 대폭발하여 참관석이 무너지며 극심한 중상을 입음!"
 villains_religious_decision.0180.c:0 "검은 무쇠 옻칠을 한 소나무 통나무 모형 포신으로 야간 열병식을 열어라."
 villains_religious_decision.0180.c.success:0 "사방의 첩자들이 거대 통나무를 진짜 결전 화포로 착각하고 경악함"
 villains_religious_decision.0180.c.failure:0 "열병식 도중 쏟아진 폭우에 검은 먹물이 번져 통나무 결이 들통남"
 villains_religious_decision.0185.t:0 "화력 전력 현대화: 주체포 총동원 태세"
 villains_religious_decision.0185.desc:0 "규격화된 화약과 주철 주조 기술이 완전히 군대에 정착하면서, 우리 군의 화력 체계는 한 단계 더 높은 차원으로 도약했습니다.\n\n지하 비밀 주조창의 위험천만한 도박은 이제 과거의 유물이 되었습니다. 군 최고사령부는 전국의 모든 화포와 화약 자원을 일제히 결집시켰으며, 최고영도자의 전략적 결단에 따라 적의 요새를 지워버릴 집중 공성 포격에 나설지, 아니면 야전 군단의 돌격 화력을 극대화할지 지침을 청하고 있습니다."
 villains_religious_decision.0185.a:0 "주체포 집중 타격: 적의 성벽을 남김없이 잿더미로 갈아버려라! (공성 효율 증강)"
 villains_religious_decision.0185.a.toast:0 "주체포 총동원 공성 화력 태세 확립"
 villains_religious_decision.0185.b:0 "폭풍군단 화력 지원: 보병과 기병에 파괴적 지원 화력을 결합하라! (야전 병력 증강)"
 villains_religious_decision.0185.b.toast:0 "폭풍군단 충격 화력 지원 체계 가동"
 kim_juche_bombard_regiment_name:0 "주체 화성 사석포 중대"
 kim_asymmetric_deterrence_modifier:0 "자위적 사석포 전략 억제력"
 kim_asymmetric_deterrence_modifier_desc:0 "시대를 초월한 거대 청동 사석포의 천둥 같은 포성이 안팎의 적대 세력과 봉신들을 완벽한 공포와 복종 속에 묶어두고 있습니다."
 kim_asymmetric_siege_focus_modifier:0 "주체포 집중 타격 태세"
 kim_asymmetric_siege_focus_modifier_desc:0 "대구경 사석포와 공성 화포들이 적의 성벽을 밤낮없이 두들겨 농성군의 사기를 단숨에 꺾어버립니다."
 kim_asymmetric_army_focus_modifier:0 "폭풍군단 화력 지원 체계"
 kim_asymmetric_army_focus_modifier_desc:0 "야전 부대마다 유기적으로 배치된 화포와 폭발물 지원반이 적의 대열을 산산조각 내며 압도적인 돌파구를 엽니다."
 kim_failed_foundry_explosion_modifier:0 "지하 화포 주조창 폭발 후폭풍"
 kim_failed_foundry_explosion_modifier_desc:0 "무리한 화포 시험 발사 도중 발생한 대규모 폭발 사고로 막대한 자재가 잿더미가 되고 백성들의 원성이 높아졌습니다."
 kim_wooden_cannon_bluff_modifier:0 "옻칠 통나무 화포 위장 억제력"
 kim_wooden_cannon_bluff_modifier_desc:0 "횃불 아래 위풍당당하게 행진한 검은 통나무 모형 포신들이 적국의 세작들을 감쪽같이 속여 넘겨 누구도 섣불리 도발하지 못합니다."
