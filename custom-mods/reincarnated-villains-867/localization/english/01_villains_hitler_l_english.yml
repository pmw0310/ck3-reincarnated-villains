 aryan_collective_noun:0 "Greater Germans"
 tradition_stormtrooper_vanguard_name:0 "Stormtrooper Street Vanguard"
 tradition_stormtrooper_vanguard_desc:0 "Paramilitary party stormtroopers dominate every square and avenue with synchronized marches and iron intimidation, rallying swiftly under one leader to unleash relentless shock assaults."
 tradition_stormtrooper_vanguard_only_tt:0 "Must be of Greater German culture or descended from it"
