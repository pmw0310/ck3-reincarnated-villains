 # === [문화 · 전통 · 고유 무장병] ===
 american:0 "미국"
 american_prefix:0 "미국계"
 american_collective_noun:0 "미국인"
 pinkerton_guards:0 "핑커튼 사설경비단"
 pinkerton_guards_flavor:0 "#F 검은 외투와 철투구, 은빛 보안관 휘장을 착용하고 대자본가의 금고와 관세 장벽을 사수하는 유급 사설 궁병 경비단입니다. 고용비와 급료 유지비는 비싸지만 막강한 장궁 일제 사격과 도시·성채·농지 방어력을 자랑합니다.#!"
 trump_pinkerton_guards_name:0 "트럼프 타워 사설경비단"
 tradition_wall_street_tycoons_name:0 "월스트리트 자본 재벌"
 tradition_wall_street_tycoons_desc:0 "이 문화에서는 모든 외교와 전쟁이 곧 거대한 부동산 개발이자 수익성 높은 거래입니다. 막대한 현금 흐름으로 성채와 도시를 헐값에 올리고, 유급 사설경비단과 용병을 앞세워 시장을 독점합니다."
 tradition_wall_street_tycoons_only_tt:0 "미국 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_pinkerton_guards:0 "[GetMaA('pinkerton_guards').GetName](을)를 [men_at_arms|E]으로 모병 가능"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 TRUCE_TRUMP_VIKING_DEAL:0 "거래의 기술에 따른 불가침 협상"
 councillor_court_chaplain_americanism:0 "수석 로비스트"
 councillor_court_chaplain_americanism_possessive:0 "수석 로비스트의"
 d_americanism:0 "백악관 총재부"
 d_americanism_adj:0 "백악관"
 artifact_trump_cane_sugar_cola_name:0 "사탕수수 설탕 콜라"
 artifact_trump_cane_sugar_cola_desc:0 "집무실 책상의 빨간 단추만 누르면 은쟁반에 받쳐 즉시 배달되는 진짜 사탕수수 설탕 콜라병입니다. 싸구려 옥수수 물엿을 극도로 경멸하는 대통령 각하의 입맛에 맞춰 특별 제조되었으며, 시원하게 한 모금 들이켜는 순간 협상장의 스트레스와 피로가 거짓말처럼 사라집니다."
 trump_build_great_wall_and_tower_decision:0 "미합중국 창건과 황금 트럼프 타워 건립"
 trump_build_great_wall_and_tower_decision_desc:0 "노섬브리아 전역이 우리의 수중에 들어왔습니다! 이제 무너져가던 옛 하드리아누스 방벽을 역사상 가장 크고 아름다운 '위대한 국경 대장벽'으로 재건하고, 수도에 황금빛 트럼프 타워를 세워 중세 브리튼 땅에 천 년 앞서 '미합중국'의 탄생을 선포할 시간입니다!"
 trump_build_great_wall_and_tower_decision_tooltip:0 "'미합중국'을 창설하고 수도에 황금 트럼프 타워와 대장벽을 건립합니다."
 trump_build_great_wall_and_tower_decision_confirm:0 "역사상 가장 크고 아름다운 나라가 될 겁니다!"
 trump_golden_empire_dynasty_modifier:0 "거래의 기술과 황금 제국"
 trump_golden_empire_dynasty_modifier_desc:0 "이 가문은 모든 통치와 외교를 완벽한 부동산 거래로 승화시켜, 직할지 세금 수입이 급증하고 모든 건축 비용과 기간이 대폭 단축됩니다."
 trump_golden_tower_county_modifier:0 "황금 트럼프 타워와 대장벽"
 trump_golden_tower_county_modifier_desc:0 "하늘 높이 솟은 황금빛 타워와 난공불락의 국경 대장벽이 자리한 이 백작령은 막대한 무역 관세 수입과 철통같은 방어력을 자랑합니다."
 trump_proclaim_pax_americana_empire_decision:0 "팍스 아메리카나와 아메리카 합중제국 선포"
 trump_proclaim_pax_americana_empire_decision_desc:0 "노섬벌랜드에서 요크와 스코틀랜드, 그리고 런던에 이르기까지 브리튼 제도 전체가 우리의 완벽한 부동산 포트폴리오로 편입되었습니다! 이제 역사상 가장 부유하고 위대한 초강대국—'아메리카 합중제국'을 선포하고 전 세계에 '팍스 아메리카나'와 황금 관세의 시대를 열겠습니다!"
 trump_proclaim_pax_americana_empire_decision_tooltip:0 "'아메리카 합중제국'을 창설하고 수도에 세계 금융의 중심지 월스트리트를 개장합니다."
 trump_proclaim_pax_americana_empire_decision_confirm:0 "우리는 승리하고 또 승리해서, 승리에 지칠 지경입니다!"
 trump_pax_americana_empire_dynasty_modifier:0 "팍스 아메리카나 초강대국"
 trump_pax_americana_empire_dynasty_modifier_desc:0 "이 가문은 압도적인 자본력과 협상력으로 아메리카 합중제국을 건설하여, 직할지 한계와 세금 수입이 폭증하고 건축 및 용병 고용 비용이 대폭 절감됩니다."
 trump_wall_street_capital_county_modifier:0 "세계 금융의 수도 월스트리트"
 trump_wall_street_capital_county_modifier_desc:0 "황금 트럼프 타워 아래 전 세계의 금화가 모여드는 금융 수도로서 상상을 초월하는 세금 수입과 발전 속도를 자랑합니다."
 trump_marine_expeditionary_force_name:0 "미합중국 해병 원정군"
 trump_monetize_faith_decision:0 "애국 후원금 모금 및 황금 굿즈 판매"
 trump_monetize_faith_decision_desc:0 "우리의 위대한 애국자들과 열성 신도들은 트럼프 타워가 새겨진 황금 성조기 성경과 한정판 황금 신발, 애국 채권에 기꺼이 지갑을 열 준비가 되어 있습니다! 그들의 뜨거운 신앙심과 애국심을 역사상 가장 아름다운 현금 흐름으로 전환하겠습니다!"
 trump_monetize_faith_decision_tooltip:0 "황금 성전 후원 만찬을 열어 당신의 관리력이나 외교력에 따라 성물 경매 수익과 후원 규모가 결정되는 전용 이벤트를 시작합니다."
 trump_monetize_faith_decision_confirm:0 "최고의 굿즈, 최고의 후원금! 지금 바로 주문하세요!"
 trump_super_pac_fundraising_modifier:0 "슈퍼 팩 황금 모금"
 trump_super_pac_fundraising_modifier_desc:0 "지지자들의 자발적인 정치 후원금과 황금 굿즈 판매 수익이 국고로 쏟아져 들어오며 용병 계약 협상력이 높아집니다."
 d_nf_trump:0 "트럼프 패밀리"
 d_nf_trump_adj:0 "트럼프"
 war_867_Trump_Conquest_of_Northumbria:0 "트럼프의 노섬브리아 배신 전쟁"
 trump_cane_sugar_cola_modifier:0 "사탕수수 설탕 콜라"
 trump_monetize_faith_event_preview_tt:0 "황금 성전 후원 만찬 이벤트가 열리며 [stewardship|E] 초고가 성물 독점 거래, [diplomacy|E] 대규모 유세 모금, 또는 정가 판매 중 하나를 선택합니다"
 villains_religious_decision.0040.t:0 "역사상 가장 위대한 황금 성물 만찬"
 villains_religious_decision.0040.desc:0 "연회장 천장의 촛대가 눈부신 황금빛 휘장을 비추고, 돈주머니가 묵직한 영주들과 열광적인 신도들이 내 한마디에 지갑을 열 준비를 마쳤다. 탁자 위에는 금박을 입힌 성경과 내 서명이 새겨진 한정판 성물들이 번쩍이고 있다.\n\n거물 귀족들을 상대로 초대형 독점 계약을 밀어붙일 것인가, 아니면 군중의 애국심을 자극해 소액 후원금의 파도를 일으킬 것인가?"
 villains_religious_decision.0040.a:0 "부유한 영주들에게 최고급 황금 성물 독점 거래를 성사시킨다!"
 villains_religious_decision.0040.a.success:0 "환상적인 거래의 기술로 귀족들의 금고를 통째로 쓸어 담음"
 villains_religious_decision.0040.a.failure:0 "만찬 도중 얇은 금박이 벗겨지며 사기 경매 추문이 폭발함"
 villains_religious_decision.0040.b:0 "광신적인 지지자들 앞에서 유세를 펼쳐 애국 후원금을 쓸어 담는다!"
 villains_religious_decision.0040.b.success:0 "구름 같은 인파가 감동하여 금화 자루를 단상 위로 던져 올림"
 villains_religious_decision.0040.b.failure:0 "유세 도중 치명적인 말실수로 후원자들이 썰물처럼 빠져나감"
 villains_religious_decision.0040.c:0 "검증된 핵심 신도들에게만 정가로 축복 기념품을 판매한다."
 trump_art_of_the_deal_boom_modifier:0 "황금 성물 대호황 거래"
 trump_art_of_the_deal_boom_modifier_desc:0 "부유한 영주들과 성사시킨 초고가 성물 독점 계약 덕분에 국고에 황금이 마르지 않고 흘러들어 옵니다."
 trump_fraud_scandal_modifier:0 "도금 성물 사기 경매 논란"
 trump_fraud_scandal_modifier_desc:0 "비싸게 팔아넘긴 황금 성물의 도금이 벗겨지면서 후원자들과 봉신들 사이에 거센 사기 논란이 일고 있습니다."
 trump_youre_fired_tribunal_decision:0 "공개 성과 심판과 해고 선고"
 trump_youre_fired_tribunal_decision_desc:0 "아메리카니즘에서 파산과 무능은 구원받을 수 없는 최악의 죄악이며, 오직 거래에서 승리하는 자만이 황금의 은총을 누릴 자격이 있습니다. 봉신이나 자문위원을 황금 원탁 알현실로 직접 호출하여 실적을 낱낱이 추궁하십시오. 징벌적 관세 칙령을 들이밀어 막대한 공납을 쥐어짜거나, 만좌의 앞에서 손가락을 겨누며 가차 없이 해고를 선고하여 진정한 승자의 위엄을 만천하에 과시할 시간입니다."
 trump_youre_fired_tribunal_decision_tooltip:0 "지정한 가신을 알현실 원탁으로 호출하여 관리력 관세 협박이나 외교력 공개 해고 대결을 펼치는 전용 이벤트를 시작합니다."
 trump_youre_fired_tribunal_decision_confirm:0 "원탁 심판장으로 호출하라!"
 trump_youre_fired_tribunal_decision_no_item_selected:0 "심판대에 세울 대상이 선택되지 않음"
