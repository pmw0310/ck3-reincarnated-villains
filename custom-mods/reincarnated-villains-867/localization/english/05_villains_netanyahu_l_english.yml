l_english:
 # ============================================================================
 # 05. Benjamin Netanyahu — Zionism & Israeli
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_netanyahu:0 "Prime Minister's Navy Surcoat"
 bookmark_reincarnated_netanyahu:0 "Prime Minister Benjamin Netanyahu"
 bookmark_reincarnated_netanyahu_subheading:0 "Prime Minister of the Zionist Security Governorate"
 bookmark_reincarnated_netanyahu_desc:0 "Israel's longest-serving Prime Minister Benjamin Netanyahu—famed for miraculously surviving every corruption indictment and coalition collapse by declaring a conveniently timed security emergency—has awakened in 867 AD Jerusalem and Jaffa in the eighteen-year-old body of his Sayeret Matkal commando youth.\n\nIn peacetime, fussy judges hound him over ledgers of pink wine and fine cigars gifted by wealthy merchants; yet the instant sparks fly along the border, he hoists a giant red-line cartoon bomb placard and extends his rule once again! With his heroic brother Yonatan beside him and vast empires encircling Zion, can King Bibi postpone his trial forever and forge Greater Israel?"
 bookmark_reincarnated_yonatan_netanyahu:0 "Commander Yonatan Netanyahu"
 dynn_Netanyahu_867:0 "Netanyahu"
 dynn_Netanyahu_867_motto:0 "You cannot put the Prime Minister on trial during an emergency!"
 nick_shield_of_zion:0 "King Bibi"
 nick_shield_of_zion_desc:0 "Whenever pink-wine bribery scandals or impeachment threats close in, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] waves a giant red-line bomb placard, declares a security crisis, and miraculously clings to the Prime Minister's seat."
 villains_dead_personality_benzion:0 "Intransigent Historian"

