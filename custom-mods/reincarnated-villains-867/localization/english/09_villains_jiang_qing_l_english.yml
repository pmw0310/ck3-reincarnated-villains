 # === [Culture, Traditions & Men-at-Arms] ===
 red_guard_rebels:0 "Red Guard Rebel Vanguards"
 red_guard_rebels_flavor:0 "#F Fanatical youth vanguards wearing crimson armbands and brandishing red-bound quotations, fielding oversized 125-strong sub-regiments and cheap upkeep to overwhelm foes in human waves across floodplains, farmlands, and terraced hills.#!"
 jiang_red_guards_army_name:0 "Shanghai Red Guard Rebel Headquarters"
 jiang_red_guard_vanguard_name:0 "Shanghai Red Guard Rebel Vanguard"
 jiang_january_storm_commune_army_name:0 "January Storm Shanghai Rebel Command"
 jiang_central_cultural_revolution_army_name:0 "Central Cultural Revolution Guard Army"
 zaofan_chinese:0 "Proletarian Han"
 zaofan_chinese_prefix:0 "Proletarian Han"
 zaofan_chinese_collective_noun:0 "Proletarian Han"
 tradition_rebel_headquarters_name:0 "Rebel Cultural Headquarters"
 tradition_rebel_headquarters_desc:0 "Under the banner that to rebel is justified, crimson-armbanded youth vanguards smash old customs and political rivals through ceaseless mass rallies and ideological fervor."
 tradition_rebel_headquarters_only_tt:0 "Must be of Proletarian Han culture or descended from it"
 culture_parameter_unlock_maa_red_guard_rebels:0 "Can recruit [GetMaA('red_guard_rebels').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 d_cultural_revolution:0 "Central Cultural Revolution Group"
 d_cultural_revolution_adj:0 "Cultural Revolutionary"
 councillor_court_chaplain_cultural_revolution:0 "Cultural Group Commissar"
 councillor_court_chaplain_cultural_revolution_possessive:0 "Cultural Group Commissar's"
 jiang_qing_western_film_log_modifier:0 "Secret Screening Log of Banned Western Films"
 artifact_jiang_qing_western_film_log_name:0 "Secret Screening Log of Banned Western Films"
 artifact_jiang_qing_western_film_log_desc:0 "A silk-bound private screening diary cataloging banned Western melodramas enjoyed nightly in a private villa theater after spending all afternoon ordering Red Guards to burn bourgeois art in the public square. Any courtier who catches a glimpse of its pages is promptly purged first as a reactionary."
 artifact_relic_shanghai_january_storm_manifesto_name:0 "Shanghai January Storm Rebel Manifesto"
 artifact_relic_shanghai_january_storm_manifesto_desc:0 "A crimson revolutionary proclamation announcing the overthrow of the old municipal authorities and the birth of the Shanghai Commune."
 artifact_relic_west_lake_may_16_directive_name:0 "West Lake Secret Directive Draft"
 artifact_relic_west_lake_may_16_directive_desc:0 "The original directive drafted in secret beside West Lake in Hangzhou that launched the sweeping purge of old-guard scholars and bureaucrats."
 artifact_relic_first_big_character_poster_name:0 "First Big-Character Poster Plaque of Beijing"
 artifact_relic_first_big_character_poster_desc:0 "The wooden plaque of the very first big-character poster hung upon academy walls by rebel youth, igniting nationwide revolutionary fervor."
 artifact_relic_yangtze_red_guard_standard_name:0 "Jiangnan Rebel Headquarters Red Banner"
 artifact_relic_yangtze_red_guard_standard_desc:0 "The golden-sun red banner carried by Red Guard rebel shock brigades across the lower Yangtze."
 artifact_relic_dongfanghong_armband_casket_name:0 "Changan Dongfanghong Armband Reliquary"
 artifact_relic_dongfanghong_armband_casket_desc:0 "A lacquered casket holding the crimson silk armbands awarded to vanguard Red Guard commanders during grand capital rallies."
 jiang_shanghai_january_storm_dynasty_modifier:0 "January Storm and Shanghai Commune Momentum"
 jiang_shanghai_january_storm_dynasty_modifier_desc:0 "Having overthrown the old municipal order to establish the Shanghai Commune, this dynasty radiates revolutionary terror against every rival."
 jiang_proletarian_cultural_empire_dynasty_modifier:0 "Perpetual Cultural Revolution Supreme Leadership"
 jiang_proletarian_cultural_empire_dynasty_modifier_desc:0 "Having transformed the entire realm into a grand revolutionary stage, this dynasty permits nothing save total devotion to the Great Sun."
 jiang_shanghai_revolutionary_capital_county_modifier:0 "Shanghai Proletarian Rebel Headquarters"
 jiang_shanghai_revolutionary_capital_county_modifier_desc:0 "The beating heart of Jiangnan where tens of thousands of Red Guards and propaganda brigades assemble."
 jiang_four_olds_revolutionary_gale_modifier:0 "Smash the Four Olds Revolutionary Gale"
 jiang_four_olds_revolutionary_gale_modifier_desc:0 "Amid bonfires of old relics and scriptures, Red Guard shock brigades march with feverish speed and zeal."
 jiang_big_character_poster_terror_modifier:0 "Terror of Gatehouse Big-Character Posters"
 jiang_big_character_poster_terror_modifier_desc:0 "Denunciation posters plastered across every alley keep officials and commoners alike watching one another in breathless fear."
 jiang_model_opera_premiere_modifier:0 "Revolutionary Model Opera Tour Fervor"
 jiang_model_opera_premiere_modifier_desc:0 "Melodies from model operas personally directed by Jiang Qing echo through markets and barracks, exalting the ruler."
 jiang_red_guard_factional_clash_modifier:0 "Red Guard Factional Armed Clashes"
 jiang_red_guard_factional_clash_modifier_desc:0 "Rival Red Guard factions claiming true revolutionary orthodoxy wage street battles that paralyze local administration."
 jiang_struggle_session_terror_modifier:0 "Chilling Lesson of the Struggle Stage"
 jiang_struggle_session_terror_modifier_desc:0 "Having witnessed a rival kneeling in a paper dunce cap before jeering crowds, courtiers dare not raise their heads."
 jiang_botched_struggle_backlash_modifier:0 "Stage Defiance and Crowd Unrest"
 jiang_botched_struggle_backlash_modifier_desc:0 "Dragged onto the struggle stage, the accused turned the tables with fiery defiance that left the square murmuring."
 rival_struggle_session_defiance:0 "[TARGET_CHARACTER.GetShortUIName|U] openly defied [CHARACTER.GetShortUIName] from the struggle session stage."
 rival_struggle_session_defiance_corresponding:0 "[CHARACTER.GetShortUIName|U] tried to parade [TARGET_CHARACTER.GetShortUIName] in a paper dunce cap before a jeering crowd."
 jiang_proclaim_shanghai_commune_decision:0 "Proclaim the Shanghai Commune"
 jiang_proclaim_shanghai_commune_decision_desc:0 "The hour has struck to sweep aside the old governors and aristocratic clans of Jiangnan in a January Storm. Gathering dockworkers and Red Guard rebels across Huating and Zhexi, we shall hoist the crimson banner of the Shanghai Commune beneath the Great Sun."
 jiang_proclaim_shanghai_commune_decision_tooltip:0 "Unite Zhexi and Jiangnan strongholds to found the Shanghai Commune and muster a Red Guard main host."
 jiang_proclaim_shanghai_commune_decision_confirm:0 "Let the January Storm overturn old Jiangnan!"
 jiang_proclaim_cultural_revolution_empire_decision:0 "Proclaim the Great Proletarian Cultural Empire"
 jiang_proclaim_cultural_revolution_empire_decision_desc:0 "Thousands of years of feudal ritual and bureaucratic rule across the Central Plains have ended. As millions wave the Little Red Book in unison, we proclaim to all under heaven the dawn of the Great Proletarian Cultural Empire!"
 jiang_proclaim_cultural_revolution_empire_decision_tooltip:0 "Command the heartland of China to found the Great Proletarian Cultural Empire and cement perpetual revolution."
 jiang_proclaim_cultural_revolution_empire_decision_confirm:0 "Paint all under heaven crimson beneath the Great Sun!"
 jiang_smash_four_olds_decision:0 "Smash the Four Olds and Red Guard Long March"
 jiang_smash_four_olds_decision_desc:0 "A new world cannot dawn until Old Ideas, Old Culture, Old Customs, and Old Habits are reduced to ash. Unleash crimson-armbanded Red Guards into temples and streets to shatter decadent relics and sound the drums of model opera."
 jiang_smash_four_olds_decision_tooltip:0 "Launch a Smash the Four Olds campaign across the realm to gain gold, piety, Red Guard troops, or dread."
 jiang_smash_four_olds_decision_confirm:0 "Smash the old world and fasten the red armbands!"
 jiang_smash_four_olds_event_preview_tt:0 "Test Diplomacy or Intrigue to seize temple wealth and rally Red Guards, or safely stage a Model Opera tour for prestige and renown."
 jiang_struggle_session_decision:0 "Stage a Dunce-Cap Struggle Session"
 jiang_struggle_session_decision_desc:0 "Reactionary capitalist roaders lurking inside court must be stripped of pride upon a public stage. Crown the culprit with a tall paper dunce cap, hang a heavy wooden placard from their neck, and force a tearful self-criticism before the roaring masses."
 jiang_struggle_session_decision_tooltip:0 "Select a courtier, councillor, vassal, or prisoner to drag before a public struggle session for hooks, imprisonment, or forced conversion."
 jiang_struggle_session_decision_confirm:0 "Drag that reactionary up onto the stage!"
 jiang_struggle_session_decision_no_item_selected:0 "You must first select a target character for the struggle session"
 jiang_struggle_session_decision_req_candidate:0 "You must have at least one adult councillor, vassal, courtier, or prisoner to haul before the struggle session"
 jiang_struggle_session_decision_select_tt:0 "The selected target must be a living adult"
 jiang_struggle_session_event_preview_tt:0 "Engage the chosen target in an Intrigue duel for gold and a hook, cast them straight into the dungeon, or force their conversion to Cultural Revolution Thought."
 villains_religious_decision.0190.t:0 "Blazing Torches of the Four Olds"
 villains_religious_decision.0190.desc:0 "Amid crashing gongs and drums that rattle every tiled roof, thousands of crimson-armbanded youth surge into the square waving the Little Red Book.\n\nBronze censers from ancient temples and bolts of clan silk already lie heaped before roaring bonfires, while propaganda scribes wait brush in hand at the city gates for my signal."
 villains_religious_decision.0190.a:0 "Sweep clean every old temple and aristocratic silk warehouse!"
 villains_religious_decision.0190.a.success:0 "Confiscated temple wealth and cheering youth swell the Red Guard ranks"
 villains_religious_decision.0190.a.failure:0 "Rival Red Guard factions erupt into bloody street fighting over spoils"
 villains_religious_decision.0190.b:0 "Plaster razor-sharp denunciation posters across every gate!"
 villains_religious_decision.0190.b.success:0 "The entire city freezes in obedience beneath the posters"
 villains_religious_decision.0190.b.failure:0 "Posters are torn down overnight and replaced with mocking graffiti"
 villains_religious_decision.0190.c:0 "Raise the curtain on our new model opera, Red Detachment of Women!"
 villains_religious_decision.0200.t:0 "Paper Dunce Cap Upon the Struggle Stage"
 villains_religious_decision.0200.desc:0 "Beneath a sea of crimson banners, [struggle_target.GetTitledFirstName] is wrenched onto the central stage with arms twisted behind the back. As Red Guards jam a tall paper dunce cap onto the head and sling a heavy wooden placard painted with reactionary crimes around the neck, the roar of the crowd shakes the square.\n\nTrembling and pale, [struggle_target.GetFirstNameNoTooltip] looks up toward my seat of honor."
 villains_religious_decision.0200.a:0 "Force them to kneel before all and sign a tearful self-criticism!"
 villains_religious_decision.0200.a.success:0 "Broken before the crowd, the target confesses all and swears obedience"
 villains_religious_decision.0200.a.failure:0 "Tearing off the dunce cap, the target hurls fierce defiance from the stage"
 villains_religious_decision.0200.b:0 "No mercy for reactionaries. Cast them into the dungeon in the name of the people!"
 villains_religious_decision.0200.c:0 "Accept their tearful repentance and bind a Red Guard armband on their sleeve."
