 # ============================================================================
 # 09. Jiang Qing & Zhang Chunqiao — Cultural Revolution & Proletarian Han
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 PORTRAIT_MODIFIER_custom_clothes_f_clothes_villains_jiang_qing:0 "Rebel Vanguard's Olive Tunic"
 dynn_Jiang_Qing_867:0 "Jiang"
 dynn_Jiang_Qing_867_motto:0 "To Rebel Is Justified!"
 dynn_Shanghai_Gang_867:0 "Shanghai Faction"
