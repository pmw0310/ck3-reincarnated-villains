 # === [Culture, Traditions & Men-at-Arms] ===
 kim_storm_corps_name:0 "KPA Storm Corps"
 kpa_storm_corps:0 "Storm Corps Infantry"
 kpa_storm_corps_flavor:0 "#F Elite mountain infiltration commandos of Mount Paektu who breach fortress walls and strike across snowy granite peaks, combining superior skirmisher combat stats with siege breach capability and winter mountain bonuses.#!"
 kim_supreme_guard_command_name:0 "Supreme Guard Command Corps"
 kim_strategic_rocket_guard_corps_name:0 "Strategic Red Banner Guard Corps"
 tradition_songun_fortress_name:0 "Songun Fortress State"
 tradition_songun_fortress_desc:0 "Putting military affairs above all else, every mountain pass is fortified and military and state facilities are erected at lightning speed through shock-brigade mobilization, though relentless command-economy extraction imposes chronic civilian development bottlenecks and popular hardship."
 tradition_songun_fortress_only_tt:0 "Must be of Paektu Korean culture or descended from it"
 culture_parameter_unlock_maa_kpa_storm_corps:0 "Can recruit [GetMaA('kpa_storm_corps').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 councillor_court_chaplain_juche:0 "Director of Propaganda"
 councillor_court_chaplain_juche_possessive:0 "Director of Propaganda's"
 d_juche:0 "Workers' Party Central Committee"
 d_juche_adj:0 "Central Committee"
 artifact_kim_aged_emmental_casket_name:0 "Party Central Reserve Aged Emmental Casket"
 artifact_kim_aged_emmental_casket_desc:0 "A cellar casket packed with wheels of fine Swiss-style holey Emmental cheese smuggled into the Party Central compound out of nostalgia for Alpine school days, even while the rest of the realm tightens its belt. Its rich flavor soothes the Supreme Dignity's nerves at the cost of midnight indigestion."
 kim_proclaim_paektu_monolithic_system_decision:0 "Found the Democratic People's Republic of Joseon"
 kim_proclaim_paektu_monolithic_system_decision_desc:0 "Having unified Seogyeong, Bukgye, and marched south to secure all of Gaeseong, it is time to proclaim the founding of the Democratic People's Republic of Joseon under the eternal Mount Paektu Bloodline!"
 kim_proclaim_paektu_monolithic_system_decision_tooltip:0 "Found the 'Democratic People's Republic of Joseon' and establish the eternal Mount Paektu Monolithic Leadership System."
 kim_proclaim_paektu_monolithic_system_decision_confirm:0 "Carry the Mount Paektu revolution through the generations!"
 kim_paektu_monolithic_system_dynasty_modifier:0 "Mount Paektu Monolithic System"
 kim_paektu_monolithic_system_dynasty_modifier_desc:0 "Enforcing absolute devotion to the sacred bloodline of Mount Paektu, this dynasty commands immense dread, legitimacy, and an expanded domain limit."
 kim_proclaim_juche_superpower_empire_decision:0 "Proclaim the Democratic People's Republic of Great Joseon"
 kim_proclaim_juche_superpower_decision_desc:0 "From our revolutionary capital of Seogyeong, our Storm Corps have swept across Gaeseong, Gyeongju, and the northern ancestral marches to unify the entire realm! Upholding the eternal teachings of the Fatherly Leaders, we solemnly proclaim the People's Republic of Great Joseon!"
 kim_proclaim_juche_superpower_empire_decision_desc:0 "From our revolutionary capital of Seogyeong, our Storm Corps have swept across Gaeseong, Gyeongju, and the northern ancestral marches to unify the entire realm! Upholding the eternal teachings of the Fatherly Leaders, we solemnly proclaim the Democratic People's Republic of Great Joseon!"
 kim_proclaim_juche_superpower_empire_decision_tooltip:0 "Found the 'Democratic People's Republic of Great Joseon' empire and complete the unification of the peninsula and northern marches under the Mount Paektu bloodline."
 kim_proclaim_juche_superpower_empire_decision_confirm:0 "Long live Great Joseon! Long live the Juche Revolution!"
 kim_juche_superpower_empire_dynasty_modifier:0 "Eternal Supreme Leader of Great Joseon"
 kim_juche_superpower_empire_dynasty_modifier_desc:0 "Having unified the Three Kingdoms and northern marches into the Democratic People's Republic of Great Joseon, this dynasty commands total devotion, expanded domain limits, dread, and legitimacy."
 kim_revolutionary_pyongyang_county_modifier:0 "Revolutionary Capital Pyongyang"
 kim_revolutionary_pyongyang_county_modifier_desc:0 "The fortified heart of the Socialist Superpower of Korea, boasting mighty defenses, development growth, and tax revenues."
 kim_paektu_idolization_decision:0 "Proclaim Mount Paektu Bloodline Idolization"
 kim_paektu_idolization_decision_desc:0 "Those born of the sacred bloodline of Mount Paektu are no mere mortals—they are the Shining Stars and Eternal Suns of the Juche revolution! By mobilizing the Propaganda and Agitation Department to erect Towers of Eternal Life across the realm, we shall deify a chosen member of the Mount Paektu family as a living Saint with a golden halo!"
 kim_paektu_idolization_decision_tooltip:0 "Open the Mount Paektu Idolization festival to canonize the chosen bloodline member, with Intrigue or Diplomacy and Learning determining regime rewards."
 kim_paektu_idolization_decision_confirm:0 "Exalt the Shining Star of Mount Paektu forever!"
 kim_paektu_idolization_decision_req_candidate:0 "There is a Mount Paektu dynasty or close family member who does not yet have the [GetTrait('saint').GetName( GetNullCharacter )] trait"
 kim_paektu_idolization_decision_select_tt:0 "You must select a Mount Paektu family member to idolize."
 kim_paektu_idolization_decision_effect_tt:0 "[idolized_target.GetShortUIName|U] gains the [GetTrait('saint').GetName( GetNullCharacter )] trait with a golden halo and is enshrined in the Juche Saints roster"
 kim_aged_emmental_casket_modifier:0 "Party Central Reserve Aged Emmental Casket"
 kim_paektu_idolization_event_preview_tt:0 "Opens the Sun Shrine Idolization event, offering [intrigue|E] total state control, a [diplomacy|E] and [learning|E] grand epic, or a solemn inner-circle rite"
 villains_religious_decision.0060.t:0 "Grand Festival of the Eternal Paektu Sun"
 villains_religious_decision.0060.desc:0 "Beneath tens of thousands of crimson banners and towering sun emblems, the grand consecration ceremony begins to exalt [idolized_target.GetTitledFirstName] among the eternal saints of Juche. Great drums shake the earth as the assembled populace gazes upward at the marble rostrum.\n\nShall state security enforce breathless, absolute obedience through terror, or shall sweeping poetic propaganda inspire heartfelt worship across the realm?"
 villains_religious_decision.0060.a:0 "Mobilize state security to enforce flawless, breathless idolization!"
 villains_religious_decision.0060.a.success:0 "Total surveillance and awe bind the entire realm in monolithic unity"
 villains_religious_decision.0060.a.failure:0 "Harsh coercion sparks defaced monuments and covert resentment"
 villains_religious_decision.0060.b:0 "Unveil grand sun monuments and epic hymns to inspire mass devotion!"
 villains_religious_decision.0060.b.success:0 "Magnificent propaganda moves the masses to genuine, thunderous cheers"
 villains_religious_decision.0060.b.failure:0 "Crudely rushed monuments and verses invite quiet mockery"
 villains_religious_decision.0060.c:0 "Conduct a solemn enshrinement ceremony attended only by inner cadres."
 kim_paektu_idolization_supreme_modifier:0 "Zenith of Monolithic Idolization"
 kim_paektu_idolization_supreme_modifier_desc:0 "A flawless bloodline consecration elevated reverence for the Supreme Leader to an unassailable height."
 kim_idolization_backlash_modifier:0 "Forced Idolization Backlash"
 kim_idolization_backlash_modifier_desc:0 "Heavy-handed mobilization and clumsy propaganda bred quiet resentment behind forced smiles."
 kim_paektu_idolization_decision_no_item_selected:0 "No Mount Paektu bloodline target selected"
 kim_asymmetric_force_development_decision:0 "Develop Asymmetric Strategic Forces"
 kim_asymmetric_force_development_decision_desc:0 "Conventional blades and spears alone cannot deter mighty surrounding empires; we need an overwhelming strategic weapon capable of pulverizing enemy fortress walls in a single thunderous volley! Pour the realm’s copper, saltpeter, and treasury into our secret subterranean foundry to cast ten colossal bronze bombards far ahead of their era."
 kim_asymmetric_force_development_decision_post_gunpowder_desc:0 "Now that the science of gunpowder and heavy cannon casting is firmly mastered, there is no need to risk life and treasury on reckless subterranean gambles. It is time to mobilize every royal powder magazine and heavy foundry into a permanent strategic fire-support doctrine. High Command awaits the Supreme Leader's guidance on where to direct our overwhelming artillery superiority."
 kim_asymmetric_force_development_decision_tooltip:0 "Ignite the underground cannon foundry to attempt a low-probability gamble for a ten-gun bombard regiment or stage a deceptive night parade."
 kim_asymmetric_force_development_decision_confirm:0 "Light the Underground Cannon Furnaces!"
 kim_asymmetric_force_development_decision_post_gunpowder_confirm:0 "Issue the Strategic Firepower Mobilization Decree!"
 kim_asymmetric_force_development_event_preview_tt:0 "Triggers a low-odds test-firing gamble to produce an inheritable #V 10 Bombard#! special regiment or an #V Intrigue#! dummy-cannon parade bluff."
 kim_asymmetric_force_post_gunpowder_preview_tt:0 "Choose between #V [Juche Bombard Saturation]#! (extreme siege efficiency) or #V [Storm Corps Firepower Support]#! (massive field army combat power) to gain strategic military supremacy for 5 years."
 villains_religious_decision.0180.t:0 "Test-Firing in the Secret Underground Foundry"
 villains_religious_decision.0180.desc:0 "Amid choking sulfur smoke and glowing molten metal deep inside the subterranean stone arsenal, ten colossal cast-bronze barrels rest atop heavy oak siege carriages. Trembling scribes and master founders warn that with present metallurgy, the slightest flaw in bronze thickness or black-powder mixture will shatter the barrels and bring the vault crashing down.\n\nYet a single successful test-firing will grant an unstoppable strategic deterrent capable of reducing any fortress under heaven to rubble. Shall we stake the founders’ heads on a double powder charge, or fool every foreign spy with black-lacquered pine logs?"
 villains_religious_decision.0180.a:0 "Cast the bronze barrels to exact measure and order the live test-firing!"
 villains_religious_decision.0180.a.success:0 "Earth-shattering thunder roars as ten colossal bombards succeed!"
 villains_religious_decision.0180.a.failure:0 "The bronze barrel cracks under pressure and bursts into fragments"
 villains_religious_decision.0180.b:0 "Put the artisans’ necks on the line and pack double the black powder! Fire!"
 villains_religious_decision.0180.b.success:0 "A miraculous pillar of flame heralds an invincible bombard battery!"
 villains_religious_decision.0180.b.failure:0 "The overcharged barrel bursts and flying bronze shrapnel inflicts a wound"
 villains_religious_decision.0180.b.critical_failure:0 "A chain detonation collapses the foundry dais and inflicts a severe wound!"
 villains_religious_decision.0180.c:0 "Stage a torchlight parade with pine logs painted in black iron lacquer."
 villains_religious_decision.0180.c.success:0 "Foreign spies mistake the massive painted logs for invincible cannons"
 villains_religious_decision.0180.c.failure:0 "A sudden downpour washes away the black ink and exposes bare pine wood"
 villains_religious_decision.0185.t:0 "Modernization of Firepower: Juche Artillery Mobilization"
 villains_religious_decision.0185.desc:0 "With standardized gunpowder and cast-iron metallurgy fully integrated into our ranks, our military fire doctrine has ascended to an unprecedented height.\n\nThe hazardous gambles of the underground foundry are relics of the past. The Supreme Command has concentrated the realm's artillery reserves, seeking the Supreme Leader's strategic decision: shall we focus our firepower on crushing enemy battlements in catastrophic sieges, or embed mobile fire units into our storm divisions to shatter opposing ranks on the battlefield?"
 villains_religious_decision.0185.a:0 "Juche Bombard Saturation: Pulverize enemy fortresses into dust! (Siege Efficiency Focus)"
 villains_religious_decision.0185.a.toast:0 "Juche Total Siege Artillery Posture Established"
 villains_religious_decision.0185.b:0 "Storm Corps Firepower Support: Integrate devastating barrage teams into field armies! (Field Combat Focus)"
 villains_religious_decision.0185.b.toast:0 "Storm Corps Shock Firepower Network Activated"
 kim_juche_bombard_regiment_name:0 "Juche Hwasong Bombard Battery"
 kim_asymmetric_deterrence_modifier:0 "Self-Reliant Bombard Deterrence"
 kim_asymmetric_deterrence_modifier_desc:0 "The thunderous roar of colossal bronze bombards ahead of their age keeps rival realms and vassals alike locked in awe and obedience."
 kim_asymmetric_siege_focus_modifier:0 "Juche Bombard Saturation Posture"
 kim_asymmetric_siege_focus_modifier_desc:0 "Heavy bombards and siege guns relentlessly pound hostile ramparts day and night, shattering garrison resolve in moments."
 kim_asymmetric_army_focus_modifier:0 "Storm Corps Shock Firepower Network"
 kim_asymmetric_army_focus_modifier_desc:0 "Field divisions reinforced with mobile firepower squads disintegrate enemy formations and breach defensive lines with ease."
 kim_failed_foundry_explosion_modifier:0 "Underground Foundry Explosion Fallout"
 kim_failed_foundry_explosion_modifier_desc:0 "A catastrophic blast during reckless cannon testing reduced precious materials to ash and stirred bitter public discontent."
 kim_wooden_cannon_bluff_modifier:0 "Lacquered Log Cannon Deterrence"
 kim_wooden_cannon_bluff_modifier_desc:0 "Massive black-lacquered pine logs paraded by torchlight have thoroughly deceived foreign spies, deterring hostile plots without firing a shot."
