 putinism:0 "유라시아 주권주의"
 putinism_adj:0 "주권주의"
 putinism_adherent:0 "주권파 실로비키"
 putinism_adherent_plural:0 "주권파 실로비키"
 putinism_desc:0 "표면적으로는 시장 자본과 의회 공화정의 간판을 내걸면서도 핵심 광산과 무역 독점권, 정보기관과 용병단을 크렘린 대통령 한 사람의 권력 수직 구조 아래 틀어쥐는 냉혹한 실리 패권주의입니다. 고분고분한 올리가르히에게는 부와 독점권을 하사하지만, 감히 선을 넘은 자에게는 고층 탑의 서늘한 창가와 루뱐카 특제 홍차가 기다릴 뿐입니다."
