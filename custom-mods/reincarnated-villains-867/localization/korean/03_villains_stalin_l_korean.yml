 # === [종교 · 성지 · 신앙] ===
 bolshevism_religion:0 "공산주의"
 bolshevism_religion_adj:0 "공산주의"
 bolshevism_religion_adherent:0 "공산주의자"
 bolshevism_religion_adherent_plural:0 "공산주의자"
 bolshevism_religion_desc:0 "모든 토지와 생산수단의 집산화와 계급 철폐, 세계 혁명 전쟁을 설파하는 공산주의 이념 체계입니다."
 bolshevism:0 "볼셰비즘"
 bolshevism_adj:0 "볼셰비즘"
 bolshevism_adherent:0 "볼셰비키"
 bolshevism_adherent_plural:0 "볼셰비키"
 bolshevism_desc:0 "모든 토지와 생산수단의 집산화, 당 중앙의 절대 권위, 그리고 무자비한 숙청과 세계 혁명 전쟁을 설파하는 급진적 사상입니다. 봉건적 특권과 낡은 계급 질서를 타파하고 오직 당 중앙과 최고 서기장의 강철 같은 지령에 복종하는 것만이 인민의 낙원을 건설하는 길이라 가르칩니다."
 bolshevism_house_of_worship:0 "소비에트 인민회관"
 bolshevism_house_of_worship_plural:0 "소비에트 인민회관"
 bolshevism_religious_symbol:0 "낫과 망치"
 bolshevism_religious_text:0 "자본론과 레닌주의 기초"
 bolshevism_priest_male:0 "정치장교"
 bolshevism_priest_male_plural:0 "정치장교"
 bolshevism_bishop_male:0 "인민위원"
 bolshevism_bishop_male_plural:0 "인민위원"
 bolshevism_religious_head_title:0 "서기장"
 bolshevism_religious_head_title_name:0 "당 중앙위원회"
 bolshevism_ghw_name:0 "적색 혁명전쟁"
 bolshevism_ghw_name_plural:0 "적색 혁명전쟁"
 bolshevism_high_god_name:0 "역사의 섭리"
 bolshevism_high_god_name_possessive:0 "역사의 섭리의"
 bolshevism_high_god_name_alternate:0 "하늘"
 bolshevism_high_god_name_alternate_possessive:0 "하늘의"
 bolshevism_war_god_name:0 "적성의 군신"
 bolshevism_war_god_name_possessive:0 "적성의 군신의"
 bolshevism_devil_name:0 "악마"
 bolshevism_devil_name_possessive:0 "악마의"
 bolshevism_devotee:0 "열성 공산당원"
 bolshevism_devotee_plural:0 "열성 공산당원"
 bolshevism_positive_afterlife:0 "이상향"
 bolshevism_negative_afterlife:0 "영원한 나락"
 holy_site_moskva_name:0 "모스크바"
 holy_site_leningrad_name:0 "레닌그라드"
 holy_site_kiev_bolshevism_name:0 "키이우"
 holy_site_tsaritsyn_name:0 "스탈린그라드"
 holy_site_trier_name:0 "트리어"
 bolshevism_religion_opinion:0 "$bolshevism_religion_adherent$의 의견"

 # === [문화 · 전통 · 고유 무장병] ===
 stalin_red_guards_name:0 "볼셰비키 적위대"
 red_guards:0 "적위대"
 red_guards_flavor:0 "#F 붉은 완장을 차고 공장과 거리에서 동원된 무장 노동자 결사대입니다. 극도로 저렴한 유지비와 강인한 맷집으로 혹한의 겨울과 깊은 침엽수림·삼림 전선을 끝까지 사수합니다.#!"
 stalin_shock_worker_brigade_name:0 "스타하노프 돌격 노동 여단"
 soviet:0 "소비에트"
 soviet_prefix:0 "소비에트계"
 soviet_collective_noun:0 "소비에트 인민"
 tradition_bolshevik_vanguard_name:0 "볼셰비키 붉은 전위대"
 tradition_bolshevik_vanguard_desc:0 "당 중앙위원회의 강철 같은 규율 아래 노동자와 농민이 총동원되어 초고속으로 요새와 공방을 건설하고, 끝없는 예비 병력과 적위대로 전선을 밀어붙입니다."
 tradition_bolshevik_vanguard_only_tt:0 "소비에트 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_red_guards:0 "[GetMaA('red_guards').GetName](을)를 [men_at_arms|E]으로 모병 가능"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 councillor_court_chaplain_bolshevism:0 "정치위원"
 councillor_court_chaplain_bolshevism_possessive:0 "정치위원의"
 d_bolshevism:0 "코민테른 집행위원회"
 d_bolshevism_adj:0 "코민테른"
 artifact_relic_kremlin_red_star_name:0 "크렘린 첨탑의 붉은 별"
 artifact_relic_kremlin_red_star_desc:0 "모스크바 크렘린 첨탑 위에서 세계 프롤레타리아 혁명을 비추도록 깎아 세운 거대한 붉은 루비 별 성물입니다."
 artifact_relic_aurora_shell_name:0 "방호순양함 오로라호의 포탄피"
 artifact_relic_aurora_shell_desc:0 "네바강 위에서 겨울궁전 습격과 시월 사회주의 대혁명의 개시를 알린 방호순양함 오로라호의 주포 탄피입니다. 구시대를 끝내고 새 시대를 연 혁명의 첫 포성이 이 성물에 남아 있습니다."
 artifact_relic_konarmiya_banner_name:0 "제1기병군의 적기"
 artifact_relic_konarmiya_banner_desc:0 "광활한 우크라이나 평원을 질주하며 반혁명 백군을 분쇄한 붉은 군대 제1기병군의 피 묻은 군기입니다. 깃발에 수놓인 금빛 낫과 망치는 적색 테러의 무자비한 진격을 상징합니다."
 artifact_relic_tsaritsyn_order_name:0 "강철 서기장의 방어 훈장"
 artifact_relic_tsaritsyn_order_desc:0 "볼가강 하류의 붉은 요새를 포위망 속에서 끝까지 사수한 지휘관과 전사들에게 수여된 최초의 혁명 무공 성물입니다."
 artifact_relic_communist_manifesto_name:0 "공산당 선언 친필 초판본"
 artifact_relic_communist_manifesto_desc:0 "트리어에서 태어난 프롤레타리아의 예언자 카를 마르크스가 집필한 혁명 사상의 최고 경전 초판본입니다. 만국의 노동자가 단결하여 낡은 세상의 사슬을 끊으라는 불멸의 선언이 담겨 있습니다."
 stalin_establish_supreme_soviet_decision:0 "소비에트 러시아 수립과 대숙청"
 stalin_establish_supreme_soviet_decision_desc:0 "모스크바와 블라디미르의 삼림 지대를 완전히 장악한 지금, 구시대 봉건 귀족들을 일소할 '대숙청'을 단행하고 역사상 최초의 사회주의 공화국—'소비에트 러시아'를 수립할 시간입니다! 강철의 규율과 무자비한 감시망으로 스탈린 가문의 철권통치를 영구히 굳힐 것입니다."
 stalin_establish_supreme_soviet_decision_tooltip:0 "'소비에트 러시아'를 창설하고 대숙청을 통해 스탈린 가문의 영구적인 철권통치 체제를 확립합니다."
 stalin_establish_supreme_soviet_decision_confirm:0 "소비에트 만세! 반동분자들에게 자비란 없다!"
 stalin_iron_curtain_dynasty_modifier:0 "강철의 서기장 가문"
 stalin_iron_curtain_dynasty_modifier_desc:0 "이 가문은 소비에트 러시아를 수립하고 무자비한 대숙청과 중앙집권화를 관철하여, 모든 반역 음모를 분쇄하고 봉신들로부터 절대적인 복종과 공물을 받아냅니다."
 stalin_nkvd_divisions_name:0 "내무인민위원부 경비사단"
 stalin_proclaim_ussr_superpower_decision:0 "소비에트 연방 창설과 5개년 계획 완수"
 stalin_proclaim_ussr_superpower_decision_desc:0 "모스크바에서 노브고로드와 키이우에 이르는 광활한 대지가 마침내 붉은 깃발 아래 하나로 묶였습니다! 제1차 5개년 계획의 대성공과 함께 인류 역사상 가장 거대한 프롤레타리아 초강대국—'소비에트 사회주의 공화국 연방'의 출범을 선포할 시간입니다!"
 stalin_proclaim_ussr_superpower_decision_tooltip:0 "'소비에트 사회주의 공화국 연방' 제국을 창설하고 5개년 계획을 완수하여 초강대국 체제를 수립합니다."
 stalin_proclaim_ussr_superpower_decision_confirm:0 "깨뜨릴 수 없는 자유 공화국들의 연방이여!"
 stalin_ussr_superpower_dynasty_modifier:0 "붉은 제국의 대원수"
 stalin_ussr_superpower_dynasty_modifier_desc:0 "이 가문은 소비에트 사회주의 공화국 연방을 창설하고 철의 장막과 계획경제를 완성하여, 모든 봉신의 공물과 병력을 총동원하고 적대 음모를 원천 봉쇄합니다."
 stalin_socialist_metropolis_county_modifier:0 "사회주의 총본산 모스크바"
 stalin_socialist_metropolis_county_modifier_desc:0 "5개년 계획의 총아로 거듭난 세계 혁명의 수도로서 건설 속도와 세수, 개발도가 폭발적으로 증가합니다."
 stalin_red_army_shock_corps_name:0 "붉은 군대 제1근위 충격군"
 stalin_great_purge_decision:0 "반혁명분자 대숙청 단행"
 stalin_great_purge_decision_desc:0 "당 내부와 영지 곳곳에 숨어든 트로츠키주의자, 반혁명 음모꾼, 그리고 곡물을 빼돌리는 배부른 부농들을 뿌리째 뽑아낼 시간입니다! 죄목이 없으면 만들어서라도 무자비한 숙청 재판과 재산 국유화를 단행하여, 온 나라에 강철 같은 공포와 통제력을 확립하겠습니다!"
 stalin_great_purge_decision_tooltip:0 "심야 숙청 재판을 열어 당신의 계책력이나 관리력에 따라 반혁명분자 색출 및 재산 몰수 성과가 결정되는 전용 이벤트를 시작합니다."
 stalin_great_purge_decision_confirm:0 "숙청 명단에 서명하라! 반동분자에게 자비란 없다!"
 stalin_great_purge_modifier:0 "대숙청의 공포 정치"
 stalin_great_purge_modifier_desc:0 "밤마다 울리는 체포조의 발소리에 모든 봉신과 음모꾼들이 공포에 질려 감히 숨소리조차 크게 내지 못하며 세금을 바칩니다."
 artifact_stalin_retouched_purge_album_name:0 "동지들이 사라지는 마법의 수정 화보집"
 artifact_stalin_retouched_purge_album_desc:0 "어제까지 서기장 옆에서 환하게 웃고 있던 혁명 동지들이 숙청당할 때마다 궁정 화공들이 밤새 정교하게 덧칠해 운하 물결이나 빈 벽으로 바꿔 놓은 기록 화보집입니다. 책장을 넘길수록 주변 인물이 하나씩 증발하는 서늘한 마법 앞에 그 어떤 반역자도 감히 음모를 꾸미지 못합니다."
 stalin_retouched_purge_album_modifier:0 "동지들이 사라지는 마법의 수정 화보집"
 stalin_great_purge_event_preview_tt:0 "심야 숙청 재판 이벤트가 열리며 [intrigue|E] 반혁명 음모 색출, [stewardship|E] 부농 재산 전면 몰수, 또는 안전한 본보기 처단 중 하나를 선택합니다"
 villains_religious_decision.0030.t:0 "붉은 잉크로 적힌 심야의 명단"
 villains_religious_decision.0030.desc:0 "모두가 잠든 깊은 밤, 집무실 책상 위에는 파이프 담배 연기가 자욱하게 내려앉고 붉은 연필 자국이 빼곡한 체포 명단이 놓여 있다. 복도 너머에서는 장화 소리와 함께 반혁명 용의자들이 끌려가는 신음이 희미하게 들려온다.\n\n의심스러운 그림자를 단 한 명도 남김없이 뿌리 뽑을 것인가, 아니면 배부른 지주와 부농들의 금고를 털어 혁명 과업의 밑거름으로 삼을 것인가?"
 villains_religious_decision.0030.a:0 "당과 군부 깊숙이 숨은 반혁명 음모자 전원을 색출하라!"
 villains_religious_decision.0030.a.success:0 "완벽한 숙청 작전으로 모든 정적과 음모꾼들의 숨통을 틀어쥠"
 villains_religious_decision.0030.a.failure:0 "편집증적 오판으로 유능한 충신들만 숙청되어 행정이 마비됨"
 villains_religious_decision.0030.b:0 "반동 귀족과 부농들이 숨긴 금화와 곡물을 국가 명의로 전부 몰수하라."
 villains_religious_decision.0030.b.success:0 "치밀한 재산 압류로 국고가 가득 차고 직할지 기강이 확립됨"
 villains_religious_decision.0030.b.failure:0 "농민들이 곡물과 가축을 불태우며 저항해 징수 성과가 참담함"
 villains_religious_decision.0030.c:0 "이미 감옥에 갇힌 소수의 태업 사보타주범만 본보기로 처단한다."
 stalin_great_purge_triumph_modifier:0 "강철의 무결점 대숙청"
 stalin_great_purge_triumph_modifier_desc:0 "숨죽인 심야 체포 작전이 모든 잠재적 배신자들을 정확히 도려내어 그 누구도 감히 역심을 품지 못합니다."
 stalin_purge_paranoia_backlash_modifier:0 "편집증적 오판 숙청의 혼란"
 stalin_purge_paranoia_backlash_modifier_desc:0 "엉뚱한 충신들과 유능한 관리들까지 마구잡이로 숙청당한 탓에 행정과 징병 체계가 마비되었습니다."
 stalin_five_year_plan_stakhanov_decision:0 "오개년 중공업 계획과 노력영웅 경진대회"
 stalin_five_year_plan_stakhanov_decision_desc:0 "혁명 조국이 사방의 적대 세력에게 짓밟히지 않으려면 남들이 백 년에 걸쳐 이룰 제철과 성채 건설을 단 오 년 만에 주파해야 합니다! 전 영지의 대장간과 광산에 초인적인 오개년 중공업 할당량을 하달하고, 하룻밤에 철광석 열네 수레를 캐낸 모범 노동자를 노력영웅으로 추앙하여 모든 백성이 잠을 줄여가며 용광로 앞으로 달려가게 만드십시오."
 stalin_five_year_plan_stakhanov_decision_tooltip:0 "거대 제철 대장간을 시찰하며 관리력 오개년 할당량 강행이나 외교력·전투력 노력영웅 선전 및 적위대 동원 판정을 진행하는 전용 이벤트를 시작합니다."
 stalin_five_year_plan_stakhanov_decision_confirm:0 "용광로의 불길을 멈추지 마라!"
 stalin_five_year_plan_event_preview_tt:0 "제철소 현장에서 #V 관리력#! 오개년 초과 달성령, #V 외교력·전투력#! 노력영웅 선전 및 적위대 소집, 또는 안전한 죄수 채석장 투입 중 하나를 집행합니다"
 villains_religious_decision.0170.t:0 "타오르는 제철 용광로와 열네 수레의 노력영웅"
 villains_religious_decision.0170.desc:0 "시뻘건 쇳물 열기와 매캐한 석탄 연기가 자욱한 거대 석조 대장간 안, 거대한 풀무 소리와 함께 모루 위에서 불꽃이 소나기처럼 튀어 오른다. 나무 단상 위에 선 나는 양피지에 적힌 영지별 철광석·무기 생산 할당량 도표를 매서운 눈으로 내려다보았다.\n\n\"볼셰비키에게 점령 못 할 요새나 불가능한 할당량 따위는 없다.\" 나는 단상 난간 너머로 땀범벅이 되어 망치질을 이어가는 대장장이들을 가리켰다. 지방 관리들의 비명을 묵살하고 전 영지에 오개년 중공업 초과 달성령을 가차 없이 밀어붙일 것인가, 아니면 하룻밤에 열네 배의 실적을 올렸다는 모범 장인을 노력영웅으로 대대적으로 선전하여 전 인민의 충성 경쟁과 무장 열기를 불태울 것인가?"
 villains_religious_decision.0170.a:0 "변명은 용납하지 않는다! 전 영지에 오개년 중공업 초과 달성령을 강행하라!"
 villains_religious_decision.0170.a.success:0 "밤낮없는 용광로 가동으로 건설 속도와 생산력이 폭발적으로 상승함"
 villains_religious_decision.0170.a.failure:0 "처벌을 두려워한 관리들의 허위 장부 조작으로 자재 파동이 벌어짐"
 villains_religious_decision.0170.b:0 "열네 수레의 기적을 이룬 모범 대장장이를 노력영웅으로 추앙해 열풍을 일으킨다!"
 villains_religious_decision.0170.b.success:0 "노력영웅 경쟁 열풍 속에 충성스러운 노동 적위대가 자진 결집함"
 villains_religious_decision.0170.b.failure:0 "사전에 꾸며낸 기록이라는 소문이 퍼져 장인들의 태업이 번짐"
 villains_religious_decision.0170.c:0 "지하감옥의 죄수들을 변경 채석장과 벌목장에 투입해 할당량을 채운다."
 stalin_five_year_plan_shock_work_modifier:0 "오개년 중공업 돌격 건설"
 stalin_five_year_plan_shock_work_modifier_desc:0 "밤낮없이 타오르는 제철소 용광로와 무자비한 할당량 독려로 성채와 기반 시설이 초고속으로 들어섭니다."
 stalin_stakhanovite_fervor_modifier:0 "스타하노프 노력영웅 열풍"
 stalin_stakhanovite_fervor_modifier_desc:0 "할당량을 열네 배 초과 달성한 노력영웅 신화가 온 영지의 노동자와 병사들을 광적인 경쟁으로 몰아넣습니다."
 stalin_falsified_quota_collapse_modifier:0 "허위 생산 장부와 자재 파동"
 stalin_falsified_quota_collapse_modifier_desc:0 "숙청이 두려운 관리들이 서류상 숫자만 부풀리는 바람에 실제 건설 현장과 세수가 심각한 혼란에 빠졌습니다."
