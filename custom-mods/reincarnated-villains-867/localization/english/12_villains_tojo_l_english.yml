 # ============================================================================
 # 12. Hideki Tojo — Imperial Rule Assistance & Imperial Japanese
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 Hideki:0 "Hideki"
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_tojo:0 "Prime Minister's Showa Khaki Daimon"
 bookmark_reincarnated_tojo:0 "'The Razor' Hideki Tojo"
 bookmark_reincarnated_tojo_subheading:0 "Prime Minister of the Imperial Rule Assistance Governorate"
 bookmark_reincarnated_tojo_desc:0 "Notorious for hoarding half the cabinet portfolios himself—serving simultaneously as Prime Minister, Army Minister, Home Minister, Munitions Minister, and Chief of Staff—while prowling Tokyo alleyways at dawn to inspect household trash bins for wasted rations, bureaucratic dictator Hideki Tojo has awakened in 867 AD as the young Soryo lord of Musashi and Sagami on Tokyo Bay.\n\nThough Fujiwara regents dominate the Heian court in Kyoto, nothing can stop the Razor from scribbling obsessive pocket-notebook memos behind his round tortoiseshell spectacles and rebranding every setback as a 'forward redeployment'! Can he mobilize the Kanto warrior bands, sweep aside Kyoto's regency, and proclaim the Empire of Japan?"
 dynn_Tojo_867:0 "Tojo"
 dynn_Tojo_867_motto:0 "Take Notes, Hoard Offices, Control All!"
 nick_the_razor_premier:0 "the Razor"
 nick_the_razor_premier_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is a relentless paper-pushing 'Razor' who monopolizes every ministerial seal at court and personally rummages through neighborhood kitchen trash bins at dawn to root out waste."

