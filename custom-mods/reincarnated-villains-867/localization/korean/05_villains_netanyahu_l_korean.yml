 holy_site_sinai_zionism_name:0 "시나이 산"
 holy_site_damascus_zionism_name:0 "다마스쿠스 북방 요충지"

 # === [문화 · 전통 · 고유 무장병] ===
 tradition_iron_wall_citadels_name:0 "철벽 요새 수호자"
 tradition_iron_wall_citadels_desc:0 "사방이 적대 세력으로 둘러싸인 최전선에서 살아남기 위해, 이 문화는 모든 성채를 난공불락의 철벽 요새로 증축하고 적진 깊숙이 침투하는 최정예 특임대를 상시 양성합니다."
 tradition_iron_wall_citadels_israeli_only_tt:0 "이스라엘 문화 또는 그 후계 문화여야 함"
 culture_parameter_unlock_maa_sayeret_commandos:0 "[GetMaA('sayeret_commandos').GetName](을)를 [men_at_arms|E]로 징집 가능"
 sayeret_commandos:0 "사예레트 마트칼 특임대"
 sayeret_commandos_flavor:0 "#F 총리 직속 참모본부 정찰대로서 적진 깊숙한 심야 침투와 요인 보쌈 생포, 사막과 구릉지 기동 타격에 특화된 최정예 특임 중보병입니다.#!"
 netanyahu_idf_defense_force_army_name:0 "이스라엘 방위군 주력 여단"
 netanyahu_lions_of_zion_army_name:0 "시온의 사자 근위 사단"
 netanyahu_iron_dome_reserve_army_name:0 "비상내각 동원 사예레트 특임대"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 d_nf_netanyahu:0 "네타냐후 패밀리"
 d_nf_netanyahu_adj:0 "네타냐후"
 yonatan_married_to_sayeret_modifier:0 "특공대와 결혼함"
 yonatan_married_to_sayeret_modifier_desc:0 "이 인물은 안락한 가정과 혼담을 뒤로한 채 오직 야간 침투 훈련과 인질 구출 작전에만 청춘을 바친 독신 특공대 지휘관입니다."
 israeli:0 "이스라엘"
 israeli_prefix:0 "이스라엘계"
 israeli_collective_noun:0 "이스라엘인"
 netanyahu_sayeret_initial_troops:0 "사예레트 마트칼 제1특임대"
 councillor_court_chaplain_zionism:0 "모사드 국장"
 councillor_court_chaplain_zionism_possessive:0 "모사드 국장의"
 d_zionism:0 "크네세트 안보내각"
 d_zionism_adj:0 "크네세트"
 artifact_netanyahu_red_line_bomb_placard_name:0 "총리의 빨간 선 도화선 폭탄 그림판"
 artifact_netanyahu_red_line_bomb_placard_desc:0 "어린아이도 단번에 알아볼 만큼 큼지막한 둥근 도화선 폭탄 그림 복판에 붉은 안료로 찍 가로줄을 그어 놓은 연설용 양피지 그림판입니다. 내각이 흔들리거나 부패 재판 일정이 다가올 때마다 성벽 위에서 이 그림판을 번쩍 치켜들면 모든 비난이 안보 비상사태 속으로 거짓말처럼 묻혀 버립니다."
 artifact_netanyahu_pink_champagne_ledger_name:0 "우정의 분홍 포도주 상납 비밀 장부"
 artifact_netanyahu_pink_champagne_ledger_desc:0 "부유한 대상인들에게 순수한 우정의 선물이라며 상자째 배달받은 최고급 분홍 발포 포도주와 잎담배 내역이 빼곡히 적힌 비밀 장부입니다. 뒷거래 자금줄과 정적들의 약점이 함께 얽혀 있어 세수와 음모 공작에는 요긴하지만, 소문을 들은 봉신들의 눈초리는 따갑기만 합니다."
 artifact_relic_western_wall_foundation_stone_name:0 "통곡의 벽 정초석 성합"
 artifact_relic_western_wall_foundation_stone_desc:0 "예루살렘 성전산 서쪽 성벽의 고대 정초석 파편을 청동과 금박 성합에 봉안한 시오니즘 제1성물입니다."
 artifact_relic_scroll_of_zionist_independence_name:0 "시온 독립 선언 양피지 두루마리"
 artifact_relic_scroll_of_zionist_independence_desc:0 "지중해 해안 야파와 텔아비브의 재건된 성채에서 주권 국가의 부활을 천명하며 서명한 역사적인 독립 선언 두루마리입니다."
 artifact_relic_maccabean_bronze_menorah_name:0 "갈릴리 마카베오 전사의 청동 메노라"
 artifact_relic_maccabean_bronze_menorah_desc:0 "티베리아스 호숫가에서 발굴되어 사예레트 특임대원들의 출정 서약식마다 불을 밝히는 고대 마카베오 항쟁기의 일곱 가지 촛대입니다."
 artifact_relic_sinai_covenant_tablet_shard_name:0 "시나이 언약의 석판 파편"
 artifact_relic_sinai_covenant_tablet_shard_desc:0 "시나이 반도의 험준한 바위산 정상에서 수습되어 고대 히브리 문자 각인이 선명히 남아 있는 성스러운 돌판 조각입니다."
 artifact_relic_northern_iron_wall_lion_standard_name:0 "북방 철벽의 유다 사자 군기"
 artifact_relic_northern_iron_wall_lion_standard_desc:0 "골란고원과 다마스쿠스 방면 북방 최전선을 수호하는 방위군 선봉대가 높이 치켜들었던 청백색 사자 문장 군기입니다."
 netanyahu_red_line_bomb_placard_modifier:0 "총리의 빨간 선 도화선 폭탄 그림판"
 netanyahu_pink_champagne_ledger_modifier:0 "우정의 분홍 포도주 상납 비밀 장부"
 netanyahu_state_of_israel_dynasty_modifier:0 "시온의 철벽 수호 가문"
 netanyahu_state_of_israel_dynasty_modifier_desc:0 "약속의 땅에 주권 국가 이스라엘국을 재건한 이 가문은 정예 중보병과 방어전에서 타의 추종을 불허하는 결속력을 발휘합니다."
 netanyahu_greater_israel_empire_dynasty_modifier:0 "다윗과 솔로몬을 잇는 대이스라엘 패권"
 netanyahu_greater_israel_empire_dynasty_modifier_desc:0 "나일강 어귀부터 유프라테스 변경까지 레반트 전역을 철벽 요새와 첩보망으로 평정한 이 가문의 위세는 모든 적대 제국을 압도합니다."
 netanyahu_eternal_jerusalem_capital_county_modifier:0 "영원한 황금의 수도 예루살렘"
 netanyahu_eternal_jerusalem_capital_county_modifier_desc:0 "다중 성벽과 대공성 요격 포대, 번영하는 회당과 무기고로 가득 찬 난공불락의 황금 수도입니다."
 netanyahu_iron_dome_bastion_modifier:0 "폭탄 그림판 공포 마케팅과 아이언 돔"
 netanyahu_iron_dome_bastion_modifier_desc:0 "적국의 파멸 병기가 구할 완성됐다는 총리의 생생한 그림판 연설에 혼비백산한 봉신과 상인들이 예산을 쏟아부어 전 성벽에 정밀 요격 포대가 들어섰습니다."
 netanyahu_iron_dome_fort_county_modifier:0 "아이언 돔 철벽 방호망"
 netanyahu_iron_dome_fort_county_modifier_desc:0 "성채 상부를 덮은 강철 방호 지붕과 연발 요격 포대가 공성 투석탄을 무력화하여 요새 방어력을 극대화합니다."
 netanyahu_iron_dome_budget_overrun_modifier:0 "우려먹은 폭탄 그림판 망신"
 netanyahu_iron_dome_budget_overrun_modifier_desc:0 "해마다 똑같은 폭탄 그림을 들고나와 구할 완성이라 외치던 습관이 들통나 봉신들의 조롱 속에 방위 성금 모금이 참패했습니다."
 netanyahu_judicial_overhaul_triumph_modifier:0 "불사신 비비의 사법 장악과 재판 무기한 연기"
 netanyahu_judicial_overhaul_triumph_modifier_desc:0 "안보 비상사태를 명분으로 율법 재판관들의 탄핵 권한을 거세하고 극단파 종파와 연정 뒷거래를 성사시켜 그 누구도 총리의 분홍 포도주 장부를 문제 삼지 못합니다."
 netanyahu_judicial_protest_backlash_modifier:0 "사법 개악 반대 밤샘 횃불 시위"
 netanyahu_judicial_protest_backlash_modifier_desc:0 "부패 재판을 뭉개려는 노골적인 법관 권한 박탈 시도에 분노한 예루살렘 시민들과 귀족들이 밤마다 양각 나팔을 불며 총리 관저를 포위하고 있습니다."
 netanyahu_defense_pact_arsenal_modifier:0 "당당한 우방국 방산 청구서 외교"
 netanyahu_defense_pact_arsenal_modifier_desc:0 "동맹국의 잔소리는 한 귀로 흘리면서도 군수 지원 영수증만큼은 칼같이 청구하여 성채 증축비와 군 유지비를 알뜰히 아꼈습니다."
 netanyahu_mossad_shadow_network_modifier:0 "황금 태엽 폭탄 서신함의 공포"
 netanyahu_mossad_shadow_network_modifier_desc:0 "모사드가 보낸 선물 상자나 전서구 통만 보아도 적국의 장수들이 기겁하고 창밖으로 몸을 던질 만큼 서슬 퍼런 공포가 번졌습니다."
 netanyahu_mossad_compromised_cell_modifier:0 "뻔뻔한 유체이탈 야간 방범 훈련 브리핑"
 netanyahu_mossad_compromised_cell_modifier_desc:0 "심야 보쌈 공작이 발각되자 적성국의 허술한 경비 실태를 무상으로 점검해 준 합동 훈련이었다고 우기는 바람에 사방의 비난이 쏟아집니다."
 netanyahu_secret_tunnel_excuse_modifier:0 "외양간 밑 비밀 땅굴 브리핑 조롱"
 netanyahu_secret_tunnel_excuse_modifier_desc:0 "표적 대신 엉뚱한 당나귀 외양간만 폭파해 놓고 사실 저 여물통 밑에 적군의 거대 지하 땅굴 본부가 있었다고 우겨 국제적인 웃음거리가 되었습니다."
 rival_mossad_raid_exposed:0 "[CHARACTER.GetShortUIName|U](이)가 보낸 모사드 공작조가 [TARGET_CHARACTER.GetShortUIName]의 침실 앞에서 발각된 뒤 방범 훈련이었다며 오리발을 내밀었습니다."
 rival_mossad_raid_exposed_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName]의 뻔뻔한 심야 모사드 공작을 적발하고 피의 보복을 맹세했습니다."
 netanyahu_proclaim_state_of_israel_decision:0 "이스라엘국 독립 선포"
 netanyahu_proclaim_state_of_israel_decision_desc:0 "수천 년간 흩어졌던 시온의 후예들이 마침내 예루살렘과 팔레스타인 해안을 완전히 장악했습니다. 이제 청백색 다윗의 별 깃발을 성전산 위에 높이 내걸고 자주독립 주권 국가 이스라엘국의 건국을 온 세상에 선포할 때입니다!"
 netanyahu_proclaim_state_of_israel_decision_tooltip:0 "팔레스타인과 인접 거점을 통합하여 이스라엘국을 창건하고 정예 사예레트 마트칼 여단을 소집합니다."
 netanyahu_proclaim_state_of_israel_decision_confirm:0 "예루살렘 성벽 위에 다윗의 별을 올려라!"
 netanyahu_proclaim_greater_israel_decision:0 "대이스라엘 제국 선포"
 netanyahu_proclaim_greater_israel_decision_desc:0 "시나이 사막의 바위산부터 갈릴리 호수와 다마스쿠스의 성문에 이르기까지, 그 어떤 대제국도 우리의 철벽 방어선을 뚫지 못했습니다. 고대 다윗과 솔로몬의 영광을 뛰어넘는 불패의 대이스라엘 제국을 천명할 순간입니다!"
 netanyahu_proclaim_greater_israel_decision_tooltip:0 "레반트와 시나이, 요르단, 다마스쿠스를 석권하여 대이스라엘 제국을 건국하고 예루살렘을 황금의 수도로 격상합니다."
 netanyahu_proclaim_greater_israel_decision_confirm:0 "시온의 철벽이여, 영원무궁하라!"
 netanyahu_iron_dome_fortification_decision:0 "폭탄 그림판 안보 브리핑과 아이언 돔 예산안"
 netanyahu_iron_dome_fortification_decision_desc:0 "깐깐한 율법 재판관들이 또다시 분홍 포도주와 잎담배 상납 장부를 들먹이며 총리 탄핵을 거론하기 시작했습니다! 이럴 때일수록 만좌의 봉신과 사절단을 성벽 위로 불러 모아 큼지막한 빨간 선 도화선 폭탄 그림판을 번쩍 치켜들어야 합니다. 임박한 파멸의 공포로 방공 성벽 예산을 한몫에 타내거나, 비상시국을 핑계로 재판관들의 입을 영원히 틀어막을 절호의 기회입니다."
 netanyahu_iron_dome_fortification_decision_tooltip:0 "빨간 선 폭탄 그림판 연설로 아이언 돔 성벽 예산을 타내거나, 안보 위기를 핑계로 사법부를 장악해 부패 재판을 무기한 연기합니다."
 netanyahu_iron_dome_fortification_decision_confirm:0 "빨간 물감과 내 폭탄 그림판을 가져와라!"
 netanyahu_iron_dome_fortification_event_preview_tt:0 "#V 외교력·무력#! 폭탄 그림판 레드라인 연설로 직할 성채 전체에 아이언 돔 방공망을 구축하거나, #V 계책력·관리력#! 사법 장악으로 부패 재판을 무기한 연기하고 예비군을 소집합니다."
 netanyahu_mossad_targeted_operation_decision:0 "모사드 폭탄 전서구 공작과 침실 급습"
 netanyahu_mossad_targeted_operation_decision_desc:0 "국경 너머 숙적과 눈엣가시 같은 정적들에게 가장 확실한 선제적 자위권을 보여줄 시간입니다! 한밤중 침실에 사예레트 특임대를 들여보내 이불째 보쌈해 오든, 평화 화해 선물이라며 화약 태엽을 쑤셔 넣은 황금 전서구 서신함을 배달시키든 모든 공작은 준비되었습니다. 설령 엉뚱한 건물이 날아가더라도 그 밑에 비밀 땅굴이 있었다고 발표하면 그만입니다!"
 netanyahu_mossad_targeted_operation_decision_tooltip:0 "평시에 숙적, 인접 타 종교 군주, 봉신 또는 궁정 인물을 지목하여 이불 보쌈 생포, 황금 폭탄 서신함 발송 또는 분홍 포도주 금고 탈취 공작을 집행합니다."
 netanyahu_mossad_targeted_operation_decision_confirm:0 "화약 서신함 포장 완료! 작전을 개시하라!"
 netanyahu_mossad_targeted_operation_decision_no_item_selected:0 "모사드 공작 목표로 삼을 대상 인물을 먼저 선택해야 합니다"
 netanyahu_mossad_targeted_operation_decision_req_candidate:0 "공작 대상으로 지목할 성인 숙적, 인접 군주, 봉신, 자문위원, 신하 또는 죄수가 최소 1명 이상 있어야 합니다"
 netanyahu_mossad_targeted_operation_decision_select_tt:0 "선택한 공작 표적이 생존 중인 성인이어야 합니다"
 netanyahu_mossad_targeted_operation_event_preview_tt:0 "지목한 표적을 상대로 엔테베식 이불 보쌈 생포나 황금 폭탄 서신함 암살을 감행하거나, 분홍 포도주로 경비를 매수해 금고 비자금과 치부책을 털어 옵니다."
 villains_religious_decision.0210.t:0 "예루살렘 성벽 위의 빨간 선 폭탄 그림판"
 villains_religious_decision.0210.desc:0 "횃불이 타오르는 예루살렘 성벽 연단 아래, 영지의 봉신들과 외국 상인 사절단, 그리고 내 침실의 분홍 포도주 상납 장부를 들고 기소 기회를 엿보는 율법 재판관들이 빽빽이 모여들었다.\n\n나는 헛기침을 한 번 한 뒤, 어린아이도 단번에 알아볼 만큼 큼지막하고 둥글게 그린 검은 도화선 폭탄 양피지 그림판을 번쩍 치켜들고 붉은 안료 붓으로 폭탄 목 부분에 선명한 가로줄을 찍 그었다! \"여러분, 적국의 파멸 병기가 이미 구할까지 채워졌습니다! 여기가 바로 레드라인입니다!\" 지금 이 공포의 그림판으로 막대한 아이언 돔 방공 성벽 예산을 긁어모을 것인가, 아니면 안보 비상사태를 선포해 저 성가신 재판관들의 권한부터 박탈할 것인가?"
 villains_religious_decision.0210.a:0 "그림판을 흔들며 외친다! \"구할 완성입니다! 당장 아이언 돔 성벽 예산을 내놓으시오!\""
 villains_religious_decision.0210.a.success:0 "붉은 선 폭탄 그림판에 혼비백산한 귀족들이 성금을 쏟아부어 철벽 방공망이 완성됨!"
 villains_religious_decision.0210.a.failure:0 "\"그 폭탄 그림 재작년에도 구할이라 하지 않았소?\" 야유가 터지며 망신만 당함"
 villains_religious_decision.0210.b:0 "\"비상시국에 총리 재판이 웬 말이냐!\" 법관 권한을 정지시키고 극단파와 연정을 꾸린다!"
 villains_religious_decision.0210.b.success:0 "부패 재판이 무기한 연기되고 비상내각 사예레트 특임대가 소집됨!"
 villains_religious_decision.0210.b.failure:0 "분노한 법관들과 백성들이 밤새 양각 나팔을 불며 총리 관저를 횃불로 포위함!"
 villains_religious_decision.0210.c:0 "우방국 대사에게 당당히 방위비 영수증을 청구해 성벽 자재와 군수품만 타낸다."
 villains_religious_decision.0220.t:0 "한밤중의 황금 폭탄 서신함과 비밀 땅굴 대본"
 villains_religious_decision.0220.desc:0 "예루살렘 지하 작전실 탁자 위에 [mossad_target.GetTitledFirstName]의 침실 도면과 함께, 흑색화약 태엽 장치가 정교하게 숨겨진 최고급 황금 전서구 서신함이 놓여 있다. 다른 한편에서는 대변인이 혹시라도 작전이 빗나갔을 때 낭독할 \"사실 그 건물 지하에 적군의 거대 비밀 땅굴이 있었다\"라는 양피지 성명서를 미리 연습하고 있다.\n\n특임대원들을 들여보내 자고 있는 [mossad_target.GetFirstNameNoTooltip](을)를 이불째 둘둘 말아 보쌈해 올 것인가, 아니면 화해 선물로 위장한 황금 폭탄 서신함을 머리맡으로 배달시킬 것인가?"
 villains_religious_decision.0220.a:0 "엔테베의 방식이다! 침실에서 이불째 둘둘 말아 예루살렘 지하감옥으로 보쌈해 와라!"
 villains_religious_decision.0220.a.success:0 "경비병들이 하품하는 사이 표적을 이불째 보쌈하여 예루살렘 지하감옥에 처넣음!"
 villains_religious_decision.0220.a.failure:0 "발각되어 도주한 뒤 야간 방범 실태를 점검해 준 합동 훈련이었다고 뻔뻔히 우김"
 villains_religious_decision.0220.b:0 "평화 화해 선물이라며 화약 태엽을 숨긴 황금 전서구 서신함을 침실로 배달시켜라!"
 villains_religious_decision.0220.b.success:0 "서신함 뚜껑을 여는 순간 굉음과 함께 표적이 흔적도 없이 사라짐!"
 villains_religious_decision.0220.b.failure:0 "배달 당나귀가 넘어져 외양간만 날아가자 여물통 밑에 비밀 땅굴이 있었다고 우김!"
 villains_religious_decision.0220.c:0 "최고급 분홍 포도주로 경비를 매수해 금고 속 비자금과 침실 치부책만 털어 와라."
