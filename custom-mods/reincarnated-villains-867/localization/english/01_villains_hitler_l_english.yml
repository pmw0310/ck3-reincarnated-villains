 # ============================================================================
 # 01. Adolf Hitler — National Socialism & Greater German
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 bookmark_reincarnated_hitler:0 "Führer Adolf Hitler"
 bookmark_reincarnated_hitler_subheading:0 "Führer of the Alpine Party Gau"
 bookmark_reincarnated_hitler_desc:0 "After pulling the trigger of his pistol in the Berlin underground bunker, Adolf Hitler opened his eyes neither in the afterlife nor in an art-school lecture hall, but as the feudal Count of Innsbruck and Brixen in the Alpine backwaters of 867 AD.\n\nReduced to a medieval lord without a single tank to his name, his manic street oratory and obsession with Lebensraum remain completely uncooled. Reunited across the Alps with his old ally Mussolini in Milan, can he finally build a real World Capital instead of staring at scale models all night?"
 dynn_Hitler_867:0 "Hitler"
 dynn_Hitler_867_motto:0 "One People, One Empire, One Leader"
 nick_the_fuhrer:0 "the Mad Demagogue"
 nick_the_fuhrer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] hypnotizes the masses with fanatical oratory and an obsession with absolute power brought from a millennium in the future."
 dog_name_blondi:0 "Blondi"
 PORTRAIT_MODIFIER_custom_beards_male_beard_hitler_toothbrush:0 "Toothbrush Moustache"
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_hitler:0 "Führer's Brownshirt Tunic"

