 juche_desc:0 "백두산 성지 숭배와 백두혈통 수령 유일체제, 그리고 선군정치 교리를 결합한 독창적 사상입니다. 백두산을 가장 신성한 성지로 받들며, 오직 최고존엄과 백두혈통에 대한 절대 충성 및 무력에 의한 강성대국 건설만을 유일한 구원으로 설파합니다."
