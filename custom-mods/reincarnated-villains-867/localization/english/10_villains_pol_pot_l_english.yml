 angkar_adherent_plural:0 "Khmer Rouge"
 angkar_desc:0 "An extreme agrarian communist doctrine demanding absolute obedience to the faceless organization 'Angkar' and the systematic destruction of urban civilization. Condemning currency, temples, and scholarship as corrupt relics of the old world, it preaches that salvation lies solely in the collective agrarian communes of 'Year Zero'."
