 # ============================================================================
 # 13. 블라디미르 푸틴 — 유라시아 주권주의 · 신러시아
 # ============================================================================

 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_putin:0 "대통령의 크렘린 감청색 양복"
 villains_name_vladimir:0 "블라디미르"
 bookmark_reincarnated_putin:0 "'맨손으로 곰을 잡은' 블라디미르 푸틴"
 bookmark_reincarnated_putin_subheading:0 "크렘린 주권 행정부의 대통령"
 bookmark_reincarnated_putin_desc:0 "긴 대리석 식탁 저편에 대신들을 앉혀 놓고 홍차 사모바르를 끓이며 얼음 강물과 타이가 숲에서 웃통을 벗고 곰 사냥 무용담을 뽐내던 정보기관 출신 대통령 블라디미르 푸틴은, 서기 867년 루테니아 변경의 테레보빌과 우시치아를 장악한 젊은 귀족 공화국 데스포티스로 눈을 떴습니다.\n\n동북쪽 모스크바 통나무집에서는 소비에트의 유산을 독차지하려는 스탈린이 붉은 기치를 올리고, 사방에는 슬라브 부족과 유목 기마대가 들끓고 있지만 실로비키 올리가르히 콘체른과 바그너 용병단을 앞세운 그의 권력 수직화가 멈출 리 없습니다! 과연 '맨손으로 곰을 잡은' 대통령은 사흘 기한 특별 기동이 진흙탕 수렁에 빠지기 전에 모스크바와 전 루스를 석권하고 유라시아 연방의 패권을 거머쥘 수 있을까요?"
 dynn_Putin_867:0 "푸틴"
 dynn_Putin_867_motto:0 "주권은 수직으로 흐르고, 창문은 늘 열려 있다!"
 nick_slayed_bear_bare_handed:0 "맨손으로 곰을 잡은"
 nick_slayed_bear_bare_handed_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 열 살에는 곰을 쓰러뜨리진 못했더라도 얼어붙은 타이가 숲에서 웃통을 벗어 던지고 무기 하나 없이 야생 불곰의 목덜미를 꺾어 눕혔다는 전설적인 무용담으로 온 영지에 위세를 떨치는 '맨손으로 곰을 잡은' 사나이입니다."

