 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 bookmark_reincarnated_stalin:0 "서기장 이오시프 스탈린"
 bookmark_reincarnated_stalin_subheading:0 "적색 모스크바 코뮌의 서기장"
 bookmark_reincarnated_stalin_desc:0 "모스크바 별장에서 눈을 감았던 이오시프 스탈린이 다시 깨어났을 때, 화려한 크렘린 궁전은 온데간데없고 통나무 울타리만 둘러쳐진 서기 867년 모스크바의 원시 부족 마을이 펼쳐져 있었습니다.\n\n프롤레타리아 노동자는커녕 문자도 모르는 삼림 부족민들뿐이지만, 서기장 동지에게는 사소한 문제일 뿐입니다. 사유재산 철폐와 무자비한 대숙청의 교리를 내걸고 붉은 군대를 일으킨 그가, 통나무집에서 시작해 유라시아를 뒤덮는 소비에트 초강대국을 건설할 수 있을까요?"
 dynn_Stalin_867:0 "스탈린"
 dynn_Stalin_867_motto:0 "만국의 노동자여, 단결하라!"
 nick_the_general_secretary:0 "강철의 사나이"
 nick_the_general_secretary_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 강철처럼 냉혹한 의지와 무자비한 숙청으로 당과 인민을 틀어쥔 '강철의 사나이'입니다. 편집증적인 감시망 앞에 영지의 귀족과 농민들은 숨조차 제대로 쉬지 못합니다."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_stalin:0 "대원수의 카키 군복 코트"

 # === [작위 · 대표 국가 · 호칭] ===
