 # ============================================================================
 # 11. Renya Mutaguchi — State Shinto & Imperial Japanese
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 PORTRAIT_MODIFIER_custom_beards_male_beard_mutaguchi_moustache:0 "Imperial Officer Moustache"
 Renya:0 "Renya"
 bookmark_reincarnated_mutaguchi:0 "'The Commander' Renya Mutaguchi"
 bookmark_reincarnated_mutaguchi_subheading:0 "Commander of the 15th Army Operational Zone"
 bookmark_reincarnated_mutaguchi_desc:0 "Infamous for orchestrating the catastrophic 1944 Imphal campaign—where he ignored all supply lines and ordered his starving troops to graze on jungle grass—Lieutenant General Renya Mutaguchi has awakened over a millennium in the past in 867 AD at the very site of his obsession: as the young Japanese Count of Manipur and Dimapur.\n\nSurrounded by the jungles of Assam, the Pagan realm of Burma to the east, and the kingdoms of Kamarupa and Bengal to the west, his stubborn delusion and fanatical belief in 'spirit over logistics' remain unbroken. Can he march beyond Imphal into India in this life?"
 dynn_Mutaguchi_867:0 "Mutaguchi"
 dynn_Mutaguchi_867_motto:0 "Japanese are inherently herbivores!"
 nick_the_imphal_commander:0 "the Commander"
 nick_the_imphal_commander_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is an incorrigible 'Commander' who firmly believes that logistics and supply lines can be overcome by sheer willpower—and by grazing on jungle grass."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_mutaguchi:0 "Commander's Khaki Daimon"

 # === [Titles, Polities & Honorifics] ===
 k_imperial_japan_india:0 "Imphal Military Administration"
 k_imperial_japan_india_adj:0 "Imphal"
 d_rep_mutaguchi:0 "15th Army Operational Zone"
 d_rep_mutaguchi_adj:0 "15th Army"
 e_greater_east_asia_imphal:0 "Greater East Asia Co-Prosperity Sphere"
 e_greater_east_asia_imphal_adj:0 "Greater East Asian"
 c_nf_mutaguchi:0 "Mutaguchi Clan"
 c_nf_mutaguchi_adj:0 "Mutaguchi"

 # === [Religion, Faith & Holy Sites] ===
 state_shinto:0 "State Shinto"
 state_shinto_adj:0 "State Shinto"
 state_shinto_adherent:0 "Imperial Subject"
 state_shinto_adherent_plural:0 "Imperial Subjects"
 state_shinto_desc:0 "A radical militarist ideology fusing ultranationalist state worship, fanatical spiritualism over material logistics, and relentless conquest. It preaches that any supply shortage can be overcome by sheer fighting spirit and absolute obedience to the Commander's reckless charges."
 state_shinto_house_of_worship:0 "Gokoku Shrine"
 state_shinto_house_of_worship_plural:0 "Gokoku Shrines"
 state_shinto_religious_symbol:0 "Sun Disc and Chrysanthemum"
 state_shinto_religious_text:0 "Senjinkun"
 state_shinto_priest_male:0 "Military Priest"
 state_shinto_priest_male_plural:0 "Military Priests"
 state_shinto_bishop_male:0 "Imperial Staff Officer"
 state_shinto_bishop_male_plural:0 "Imperial Staff Officers"
 state_shinto_religious_head_title:0 "Commander"
 state_shinto_religious_head_title_name:0 "Imperial General Headquarters"
 state_shinto_ghw_name:0 "Greater East Asia Holy War"
 state_shinto_ghw_name_plural:0 "Greater East Asia Holy Wars"
 state_shinto_high_god_name:0 "Amaterasu Omikami"
 state_shinto_high_god_name_possessive:0 "Amaterasu Omikami's"
 state_shinto_high_god_name_alternate:0 "the Eight Million Kami"
 state_shinto_high_god_name_alternate_possessive:0 "the Eight Million Kami's"
 state_shinto_war_god_name:0 "Hachiman Daibosatsu"
 state_shinto_war_god_name_possessive:0 "Hachiman Daibosatsu's"
 state_shinto_devil_name:0 "the Evil Oni"
 state_shinto_devil_name_possessive:0 "the Evil Oni's"
