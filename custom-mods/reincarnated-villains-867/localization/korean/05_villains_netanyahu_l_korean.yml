 # === [종교 · 성지 · 신앙] ===
 zionism:0 "시오니즘"
 zionism_adj:0 "시오니즘"
 zionism_adherent:0 "시오니스트"
 zionism_adherent_plural:0 "시오니스트"
 zionism_desc:0 "수천 년의 유랑을 끝내고 시온의 옛 땅에 주권 국가와 불패의 철벽 요새를 재건하겠다는 민족 부흥 사상입니다. 수동적인 기다림 대신 선제적 자위권의 무력과 모사드 공작, 그리고 우방국을 향한 당당한 방위비 청구 외교를 통해 약속의 땅을 지켜낼 것을 설파합니다."
 zionism_high_god_name:0 "아도나이"
