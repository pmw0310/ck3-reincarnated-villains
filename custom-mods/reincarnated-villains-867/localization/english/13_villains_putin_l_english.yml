 # === [Religion, Faith & Holy Sites] ===
 eurasianism_religion:0 "Eurasian Statism"
 eurasianism_religion_adj:0 "Eurasianist"
 eurasianism_religion_adherent:0 "Eurasianist"
 eurasianism_religion_adherent_plural:0 "Eurasianists"
 eurasianism_religion_desc:0 "A sovereign statist doctrine binding intelligence directorates and state resource monopolies beneath a single vertical of power to restore continental empire."
 eurasianism_religion_opinion:0 "$eurasianism_religion_adherent$ Opinion"
 putinism:0 "Eurasian Sovereignism"
 putinism_adj:0 "Sovereignist"
 putinism_adherent:0 "Silovik"
 putinism_adherent_plural:0 "Siloviki"
 putinism_desc:0 "Wearing the outward trappings of market capitalism and parliamentary republicanism while locking mines, trade monopolies, security bureaus, and private mercenaries beneath one Kremlin President's vertical of power, this creed rewards loyal oligarchs with lucrative concessions—and greets defectors with open tower windows and special samovar tea."
 putinism_high_god_name:0 "Sovereign Providence"
 putinism_high_god_name_possessive:0 "Sovereign Providence's"
 putinism_high_god_name_alternate:0 "Holy Mother Rus"
 putinism_high_god_name_alternate_possessive:0 "Holy Mother Rus's"
