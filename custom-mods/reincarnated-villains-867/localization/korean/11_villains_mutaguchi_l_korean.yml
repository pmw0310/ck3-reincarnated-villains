 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 PORTRAIT_MODIFIER_custom_beards_male_beard_mutaguchi_moustache:0 "일본군 장성 콧수염"
 Renya:0 "렌야"
 bookmark_reincarnated_mutaguchi:0 "'사령관' 무타구치 렌야"
 bookmark_reincarnated_mutaguchi_subheading:0 "제15군 작전관구의 사령관"
 bookmark_reincarnated_mutaguchi_desc:0 "보급을 완전히 무시한 임팔 작전으로 일본군 역사상 최악의 참패를 빚어냈던 제15군 사령관 무타구치 렌야는, 어째서인지 자신이 그토록 집착했던 바로 그 임팔 분지—서기 867년 마니푸르와 디마푸르의 총령으로 눈을 떴습니다.\n\n사방이 험준한 밀림과 인도의 대군주들로 둘러싸여 있지만, 일본인은 본래 초식동물이니 풀을 뜯어 먹으며 진격하면 그만이라는 그의 정신승리는 조금도 꺾이지 않았습니다. 후방 요정에서 술잔을 기울이며 돌격 명령을 내리는 사령관 아래, 과연 장병들은 살아남아 인도를 정복할 수 있을까요?"
 dynn_Mutaguchi_867:0 "무타구치"
 dynn_Mutaguchi_867_motto:0 "일본인은 본래 초식동물이다!"
 nick_the_imphal_commander:0 "사령관"
 nick_the_imphal_commander_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 보급과 병참 따위는 정신력으로 극복할 수 있다고 굳게 믿는 구제 불능의 '사령관'입니다. 정글의 풀을 뜯어 먹으며 진격하라는 그의 황당한 명령 앞에 아군은 적군보다 먼저 굶주림과 공포에 직면합니다."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_mutaguchi:0 "사령관의 황갈색 다이몬"

