 reincarnated_villains_chronicle_desc:0 "서기 867년의 낯선 중세 진흙탕에 떨어진 전생 인물들과 그 후예들이 아무런 신의 가호 없이 얼마나 오래 살아남아 왕조를 이어가는지 사신의 모래시계 아래 기록하는 순수 관전 연대기입니다."
