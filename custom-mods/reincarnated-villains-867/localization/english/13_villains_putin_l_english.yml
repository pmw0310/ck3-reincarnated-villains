l_english:
 # ============================================================================
 # 13. Vladimir Putin — Eurasian Sovereignism & Neo-Russian
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_putin:0 "President's Kremlin Navy Suit"
 villains_name_vladimir:0 "Vladimir"
 bookmark_reincarnated_putin:0 "'Who Slayed a Bear Bare-Handed' Vladimir Putin"
 bookmark_reincarnated_putin_subheading:0 "President of the Kremlin Security Administration"
 bookmark_reincarnated_putin_desc:0 "Famed for seating ministers twenty paces away across a gleaming white marble table, brewing special Lubyanka samovar tea, and boasting of wrestling wild taiga bears bare-chested, intelligence strongman Vladimir Putin has awakened in 867 AD as the young Noble Republic Despot of Terebovl and Ushytsia on the Ruthenian frontier.\n\nTo the northeast, Joseph Stalin raises the red banner over timber-palisaded Moskva while Slavic tribes and steppe riders prowl every border—yet armed with his Siloviki oligarchic cartel and Wagner storm contractors, his power vertical will brook no rival! Can the President who slayed a bear bare-handed conquer Moscow and unite all Rus under the Eurasian Union before his three-day special maneuver bogs down in endless mud?"
 dynn_Putin_867:0 "Putin"
 dynn_Putin_867_motto:0 "Sovereignty Flows Vertically, Windows Stay Open!"
 nick_slayed_bear_bare_handed:0 "Who Slayed a Bear Bare-Handed"
 nick_slayed_bear_bare_handed_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is celebrated across the realm as the man 'Who Slayed a Bear Bare-Handed'—having reportedly cast off his tunic in the frozen taiga and wrestled a full-grown brown bear into submission without a single weapon."

