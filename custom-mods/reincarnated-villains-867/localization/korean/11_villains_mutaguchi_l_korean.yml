 # === [문화 · 전통 · 고유 무장병] ===
 mutaguchi_15th_army_name:0 "제15군 임팔 결사대"
 mutaguchi_banzai_samurai:0 "임팔 밀림 결사대"
 mutaguchi_banzai_samurai_flavor:0 "#F 보급은 임팔과 카마루파 밀림에서 풀을 뜯어 해결하라는 사령관의 무모한 명령 아래 오직 정신력과 태도 백병 돌격만으로 폭우의 정글을 돌파하는 결사대입니다. 보급 소모가 거의 없고 살상력과 추격력이 폭발적이지만 방어력은 종잇장처럼 얇습니다.#!"
 mutaguchi_southern_expeditionary_army_name:0 "황군 남방 총군 결사대"
 imperial_japanese:0 "황국 일본"
 imperial_japanese_prefix:0 "황국 일본계"
 imperial_japanese_collective_noun:0 "황국 신민"
 tradition_gyokusai_bushido_name:0 "옥쇄 돌격 무사도"
 tradition_gyokusai_bushido_desc:0 "보급이 끊긴 임팔의 밀림에서도 후퇴 대신 전원 발도 백병 돌격을 택하는 극단적 황군 무사도입니다. 장교단과 임팔 밀림 결사대가 목숨을 돌보지 않고 적진으로 뛰어듭니다."
 tradition_gyokusai_bushido_only_tt:0 "황국 일본 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_mutaguchi_banzai_samurai:0 "[GetMaA('mutaguchi_banzai_samurai').GetName](을)를 [men_at_arms|E]으로 모병 가능"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 councillor_court_chaplain_state_shinto:0 "종군신관"
 councillor_court_chaplain_state_shinto_possessive:0 "종군신관의"
 artifact_mutaguchi_herbivore_manual_name:0 "임팔 초식동물 야초 시식 교범"
 artifact_mutaguchi_herbivore_manual_desc:0 "일본인은 본래 초식동물이므로 정글에 널린 풀만 뜯어 먹어도 얼마든지 진격할 수 있다고 진지하게 설파한 사령관 친필 병참 교범입니다. 오직 무타구치 렌야 본인이 펼쳐 들 때만 전군의 보급 기간과 진군 속도가 기적처럼 늘어나지만, 굶주린 아군 병사들의 사망률 또한 덩달아 치솟습니다."
 mutaguchi_execute_operation_ugo_decision:0 "임팔 총군정청 수립과 초식 병참 교리"
 mutaguchi_execute_operation_ugo_decision_desc:0 "보급이 부족하다고 징징대던 나약한 참모들은 모두 틀렸습니다! 우리는 임팔과 카마루파의 험준한 정글을 돌파해 '일본인은 본래 초식동물'이라는 위대한 진리를 실전으로 증명하고 마침내 '임팔 총군정청'을 세웠습니다. 이제 전군에 초식 자급자족 병참 교리를 영구히 하달하여 인도 대륙 끝까지 진격할 것입니다!"
 mutaguchi_execute_operation_ugo_decision_tooltip:0 "'임팔 총군정청'을 창설하고 무타구치 가문 고유의 초식 병참 교리를 영구히 확립합니다."
 mutaguchi_execute_operation_ugo_decision_confirm:0 "풀을 뜯어 먹으며 인도로 진격하라!"
 mutaguchi_herbivore_logistics_dynasty_modifier:0 "임팔의 초식 병참 교리"
 mutaguchi_herbivore_logistics_dynasty_modifier_desc:0 "이 가문은 '풀만 있으면 어디든 진군할 수 있다'는 초식 병참 교리를 확립하여, 군대의 보급 지속 기간과 진군 속도가 비약적으로 상승하고 유지비가 대폭 절감됩니다."
 mutaguchi_imphal_vanguard_name:0 "임팔 돌파 결사 선봉대"
 mutaguchi_grand_marshal:0 "대원수"
 mutaguchi_proclaim_greater_east_asia_decision:0 "대동아 공영권 선포와 인도 대륙 정복"
 mutaguchi_proclaim_greater_east_asia_decision_desc:0 "임팔과 아삼의 정글을 넘어 버마와 벵골의 대평원까지 모두 우리 제15군의 군화 아래 무릎을 꿇었습니다! 보급선 없이도 풀을 뜯으며 대륙을 횡단할 수 있다는 무타구치 병참학의 완벽한 승리입니다. 이제 인도양과 동남아시아를 아우르는 '대동아 공영권'의 완성을 선포합니다!"
 mutaguchi_proclaim_greater_east_asia_decision_tooltip:0 "'대동아 공영권'을 창설하고 인도·버마 전역을 아우르는 무타구치 가문의 대제국을 수립합니다."
 mutaguchi_proclaim_greater_east_asia_decision_confirm:0 "보급은 적에게서, 아니 정글에서 조달한다! 진격하라!"
 mutaguchi_greater_east_asia_dynasty_modifier:0 "대동아 공영권의 정글 대원수"
 mutaguchi_greater_east_asia_dynasty_modifier_desc:0 "이 가문은 임팔을 넘어 벵골과 버마를 평정하고 초식 기동전의 극의를 달성하여, 군대의 보급 지속력과 진군 속도, 전투 유리함이 극대화됩니다."
 mutaguchi_geisha_banquet_decision:0 "사령부 진중 요정 연회 개최"
 mutaguchi_geisha_banquet_decision_desc:0 "전선의 장병들이 정글의 풀을 뜯으며 행군하는 동안, 후방 사령관에게는 고도의 작전 구상을 위한 심신 수양이 필요한 법입니다! 사령부 전용 진중 요정에 게이샤들을 불러 모아 최고급 청주와 산해진미로 성대한 밤 연회를 열겠습니다!"
 mutaguchi_geisha_banquet_decision_tooltip:0 "사령부 진중 요정 연회를 열어 정신력 작전 훈시나 주석 환대 판정에 따라 사기와 스트레스 해소가 갈리는 전용 이벤트를 시작합니다."
 mutaguchi_geisha_banquet_decision_confirm:0 "전선은 참모들에게 맡기고, 오늘 밤은 요정으로 간다!"
 mutaguchi_geisha_banquet_modifier:0 "사령부 요정의 밤"
 mutaguchi_geisha_banquet_modifier_desc:0 "사령부 후방에 마련된 호화 요정에서 매일 밤 연회를 즐기며 스트레스를 잊고 사교와 유혹에 열중하고 있습니다."
 mutaguchi_personal_only_tt:0 "무타구치 렌야 본인만 장착하고 효과를 받을 수 있음"
 artifact_mutaguchi_geisha_sake_flask_name:0 "후방 사령부 요정 특선 청주 호리병"
 artifact_mutaguchi_geisha_sake_flask_desc:0 "일선 장병들이 정글의 풀뿌리를 씹으며 빗속을 행군하는 동안, 후방 사령부 요정에서 미인들과 연회를 벌이며 기울이던 최상급 청주 호리병입니다. 무타구치 가문의 연회장마다 빠지지 않고 올라와 사령관의 스트레스를 말끔히 씻어 내고 빈객들의 환심을 사게 해 줍니다."
 mutaguchi_herbivore_manual_modifier:0 "임팔 초식동물 야초 시식 교범"
 mutaguchi_geisha_sake_flask_modifier:0 "후방 사령부 요정 특선 청주 호리병"
 mutaguchi_geisha_banquet_event_preview_tt:0 "사령부 요정 연회 이벤트가 열리며 고위험 [martial|E] 정신력 필승 일장훈시, [diplomacy|E] 및 [prowess|E] 주석 환대, 또는 조용한 독주 중 하나를 선택합니다"
 villains_religious_decision.0050.t:0 "등불 흔들리는 사령부 진중 요정"
 villains_religious_decision.0050.desc:0 "비단 병풍 너머로 현악기 가락이 흐르고, 따스하게 데운 최고급 청주 향기가 연회장을 가득 채운다. 참모들과 빈객들의 잔이 거나하게 돌며 분위기가 무르익자, 내 가슴속에서 다시금 주체할 수 없는 명장의 피가 끓어오른다!\n\n이 자리에서 보급 따위는 초식동물의 풀뜯기로 충분하다는 불세출의 정신력 필승 작전을 일장훈시할 것인가, 아니면 오늘 밤만큼은 술과 가무로 손님들의 환심을 사는 데 집중할 것인가?"
 villains_religious_decision.0050.a:0 "술상을 치워라! 보급 무시 정신력 필승 작전을 일장훈시한다!"
 villains_religious_decision.0050.a.success:0 "기적 같은 광기의 달변에 장교단 전원이 눈물을 흘리며 감화됨!"
 villains_religious_decision.0050.a.failure:0 "무능한 만취 헛소리에 참모들이 절망하며 사령부 사기가 바닥을 침"
 villains_religious_decision.0050.b:0 "게이샤의 가무와 호쾌한 주량으로 장교들과 빈객들의 환심을 산다."
 villains_religious_decision.0050.b.success:0 "완벽한 주석 풍류로 연회장이 웃음과 충성 맹세로 가득 참"
 villains_religious_decision.0050.b.failure:0 "주량을 넘긴 만취 추태로 상을 엎고 인사불성이 되어 망신을 당함"
 villains_religious_decision.0050.c:0 "작전 이야기는 입 밖에 내지 않고 조용히 독주와 풍류를 즐긴다."
 mutaguchi_banzai_delusion_inspired_modifier:0 "전염된 정신력 필승의 광기"
 mutaguchi_banzai_delusion_inspired_modifier_desc:0 "사령관의 기적 같은 궤변에 전염된 장교단이 보급이 없어도 이길 수 있다는 무모한 돌격 정신으로 불타오릅니다."
 mutaguchi_drunken_blunder_modifier:0 "만취 작전 훈시의 사기 붕괴"
 mutaguchi_drunken_blunder_modifier_desc:0 "연회장에서 쏟아낸 터무니없는 무능 지휘관의 헛소리에 참모들과 병사들이 깊은 절망에 빠졌습니다."
 mutaguchi_hangover_disgrace_modifier:0 "인사불성 만취 추태"
 mutaguchi_hangover_disgrace_modifier_desc:0 "과음 끝에 술상을 뒤엎고 쓰러진 추태가 궁정 안팎의 입방아에 오르내리고 있습니다."
 mutaguchi_jingisukan_herbivore_logistics_decision:0 "징기스칸식 우마 보급령과 초식 행군 감찰"
 mutaguchi_jingisukan_herbivore_logistics_decision_desc:0 "보급이 끊겨 진격할 수 없다니, 그따위 나약한 소리는 정신력이 썩어 빠진 탓입니다! 옛 영웅들의 지혜를 본받아 물소와 황소 수백 마리에 군량을 싣고 강을 건너 잡아먹으면 될 일이며, 설령 소가 없으면 어떻습니까? 우리 민족은 본래 초식동물이니 사방에 자라난 푸른 정글의 풀과 나무뿌리가 전부 하늘이 내린 군량입니다! 직접 우기 강가로 나가 물소 도하를 독전하고 나태한 일선 지휘관들의 군기를 바로잡으십시오."
 mutaguchi_jingisukan_herbivore_logistics_decision_tooltip:0 "폭우가 쏟아지는 정글 강가에서 관리력·전투력 물소 도하 도박이나 기량·외교력 들풀 시식 및 부하 문책 판정을 진행하는 전용 이벤트를 시작합니다."
 mutaguchi_jingisukan_herbivore_logistics_decision_confirm:0 "풀도 다 군량이다, 전진하라!"
 mutaguchi_jingisukan_herbivore_event_preview_tt:0 "정글 도하 현장에서 #V 관리력·전투력#! 물소 보급대 강행 도하, #V 기량·외교력#! 야초 시식 및 부하 장수 남탓 문책, 또는 안전한 본영 기원 참배 중 하나를 단행합니다"
 villains_religious_decision.0160.t:0 "흙탕물 급류의 물소 떼와 한 줌의 푸른 잡초"
 villains_religious_decision.0160.desc:0 "장대비가 억수같이 쏟아지는 밀림의 황톳빛 강물 속에서 대나무 짐바리를 짊어진 물소 떼가 거센 급류에 놀라 날뛰고 있다. 비에 흠뻑 젖은 일선 장수가 창백해진 얼굴로 달려와 식량 수송이 불가능하니 후퇴해야 한다고 읍소하자, 내 머릿속에서 뜨거운 울화가 치밀어 올랐다.\n\n나는 군배 부채를 높이 치켜들고 발밑의 젖은 정글 잡초를 한 움큼 뜯어 장수의 코앞에 들이밀었다! \"사방이 온통 푸른 풀밭인데 식량이 없다는 게 말이 되느냐!\" 지금 당장 물소 부대를 채찍질해 기어이 급류를 건너게 하는 세기의 병참 기적을 보여줄 것인가, 아니면 직접 들풀 국을 들이켜며 저 무능한 부하 장수에게 모든 실패 책임을 뒤집어씌울 것인가?"
 villains_religious_decision.0160.a:0 "군배를 휘둘러 물소 보급대 전원을 거친 급류 너머로 강행 도하시킨다!"
 villains_religious_decision.0160.a.success:0 "기적적으로 물소 떼가 강을 건너 전설의 생체 보급선이 완성됨!"
 villains_religious_decision.0160.a.failure:0 "물소 떼가 급류에 놀라 군량과 함께 전부 하류로 떠내려감!"
 villains_religious_decision.0160.b:0 "직접 들풀 국을 들이켜 시범을 보이고 나약한 부하 장수를 가차 없이 문책한다!"
 villains_religious_decision.0160.b.success:0 "초식 행군 정신력과 완벽한 남탓 문책으로 사령부 기강을 다잡음"
 villains_religious_decision.0160.b.failure:0 "독초가 섞인 잡초를 삼켰다가 극심한 복통으로 진흙탕에 뒹굶"
 villains_religious_decision.0160.c:0 "전선 시찰은 접어두고 본영 신사에서 필승 참배만 올린 뒤 전령을 보낸다."
 mutaguchi_miracle_ox_convoy_modifier:0 "기적의 징기스칸 우마 보급대"
 mutaguchi_miracle_ox_convoy_modifier_desc:0 "모두가 미친 짓이라 비웃었던 물소와 황소 수송대가 기적적으로 강을 건너 자급자족 행군을 뒷받침합니다!"
 mutaguchi_herbivore_march_spirit_modifier:0 "초식 행군과 무책임 정신력"
 mutaguchi_herbivore_march_spirit_modifier_desc:0 "들풀을 뜯어 먹으며 진격하라는 추상같은 호령과 부하 장수 문책으로 병사들이 굶주림을 정신력으로 견뎌냅니다."
 mutaguchi_drowned_buffalo_disaster_modifier:0 "수장된 물소 보급 대참사"
 mutaguchi_drowned_buffalo_disaster_modifier_desc:0 "급류에 휩쓸려 떠내려간 물소 떼와 함께 군량이 수장되어 전군의 보급선이 처참하게 붕괴했습니다."
 mutaguchi_toxic_weed_stomachache_modifier:0 "독초 시식 복통 굴욕"
 mutaguchi_toxic_weed_stomachache_modifier_desc:0 "아무 풀이나 먹을 수 있다고 호기롭게 삼킨 정글 잡초에 독성이 있어 지휘관이 극심한 배탈로 앓아누웠습니다."
