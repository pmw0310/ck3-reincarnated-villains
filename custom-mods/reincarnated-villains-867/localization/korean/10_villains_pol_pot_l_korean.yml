 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 d_angkar:0 "앙카르 상임위원회"
 d_angkar_adj:0 "앙카르"
 councillor_court_chaplain_angkar:0 "앙카르 보안위원장"
 pol_pot_khmer_rouge_name:0 "크메르 루주 중앙 직할대"
 pol_pot_proclaim_democratic_kampuchea_decision:0 "민주 캄푸치아 창건과 제0년 선포"
 pol_pot_proclaim_democratic_kampuchea_decision_desc:0 "앙코르의 낡은 신왕과 부패한 사원 귀족들이 마침내 무너졌습니다! 이제 화폐와 시장, 계급과 구시대의 역사를 모두 불태우고, 오직 앙카르의 지령 아래 모든 인민이 검은 농민복을 입고 집단농장을 일구는 위대한 '제0년'의 나라—'민주 캄푸치아'의 창건을 선포할 시간입니다!"
 pol_pot_proclaim_democratic_kampuchea_decision_tooltip:0 "'민주 캄푸치아'를 창설하고 살롯 가문 폴 포트 집안의 제0년 농본 공산주의 체제를 선포합니다."
 pol_pot_proclaim_democratic_kampuchea_decision_confirm:0 "오늘부터 역사는 제0년으로 다시 시작된다!"
 pol_pot_year_zero_utopia_dynasty_modifier:0 "제0년의 혁명 조직 앙카르"
 pol_pot_year_zero_utopia_dynasty_modifier_desc:0 "이 가문은 구시대의 사원 왕국을 타도하고 민주 캄푸치아를 창건하여, 철통같은 내부 감시망과 농민 유격대 동원력을 발휘합니다."
 pol_pot_angkar_central_division_name:0 "앙카르 혁명군 중앙사단"
 pol_pot_proclaim_angkar_agrarian_empire_decision:0 "대캄푸치아 제국 선포와 제0년 대공세"
 pol_pot_proclaim_angkar_agrarian_empire_decision_desc:0 "앙코르와 프놈펜에서 타오른 제0년의 불길이 메콩강 삼각주와 참파, 진랍의 정글까지 인도차이나 전역을 붉게 물들였습니다! 구시대의 화려한 사원 왕국들을 모두 허물고, 온 동남아시아를 하나의 거대한 집단농장으로 통합한 초강대국—'대캄푸치아 제국'의 완성을 선포합니다!"
 pol_pot_proclaim_angkar_agrarian_empire_decision_tooltip:0 "'대캄푸치아 제국'을 창설하고 동남아시아 전역을 제0년의 거대 집단농장 제국으로 재편합니다."
 pol_pot_proclaim_angkar_agrarian_empire_decision_confirm:0 "위대한 앙카르와 붉은 캄푸치아여, 영원하라!"
 pol_pot_red_khmers_supreme_dynasty_modifier:0 "제0년의 최고 설계자"
 pol_pot_red_khmers_supreme_dynasty_modifier_desc:0 "이 가문은 인도차이나 전역을 평정하고 대캄푸치아 제국을 수립하여, 절대적인 공포와 직할지 통제력, 광신적인 충성을 누립니다."
 pol_pot_year_zero_commune_capital_county_modifier:0 "제0년 중앙 제1집단농장"
 pol_pot_year_zero_commune_capital_county_modifier_desc:0 "모든 인민이 밤낮없이 집단 노역과 군사 훈련에 동원되는 제0년 혁명의 심장부로서 막대한 식량 세수와 요새 방어력을 자랑합니다."
 pol_pot_year_zero_great_purge_decision:0 "제0년 도시 비우기와 집단농장 강제 하방"
 pol_pot_year_zero_great_purge_decision_desc:0 "도시에 기생하는 상인과 화폐 경제, 사치스러운 사원 문화는 모두 앙카르의 순수한 농경 유토피아를 좀먹는 구시대의 적폐입니다! 모든 도시 거주민을 즉시 정글의 집단농장으로 강제 하방시켜 괭이를 쥐여 주고, 영지 전체를 자급자족 농경 공동체로 재편하겠습니다!"
 pol_pot_year_zero_great_purge_decision_tooltip:0 "영년의 도시 비우기 행군을 단행하여 계책력이나 관리력 판정에 따라 집단농장 동원과 개간 성과가 갈리는 전용 이벤트를 시작합니다."
 pol_pot_year_zero_great_purge_decision_confirm:0 "모두 도시를 비우고 정글의 협동농장으로 집결하라!"
 pol_pot_year_zero_commune_labor_modifier:0 "제0년 집단농장 총동원령"
 pol_pot_year_zero_commune_labor_modifier_desc:0 "강제 하방된 신인민들의 집단 노역으로 영지 내 건설 비용과 기간이 대폭 단축되고 병력 충원 속도가 급증합니다."
 pol_pot_peasant_purification_squad_name:0 "앙카르 농민 정화대"
 pol_pot_arrest_intellectuals_decision:0 "반동 지식인 색출 및 사상 교화옥 투옥"
 pol_pot_arrest_intellectuals_decision_desc:0 "글자를 읽을 줄 아는 자, 경전을 외우는 학자와 의사, 머리가 비상하거나 손바닥이 하얀 자들은 모두 앙카르를 배신할 부르주아 지식인들입니다! '보존해도 이득이 없고 제거해도 손해가 없다'는 원칙 아래, 영지 내의 지식인을 즉시 체포하여 앙카르 특별 사상감옥에 가두겠습니다!"
 pol_pot_arrest_intellectuals_decision_tooltip:0 "체포한 반동 지식인을 특별 심문소로 끌고 가 대상과의 계책력·학식 대결에 따라 자백 확보와 사상 개조 여부가 결정되는 전용 이벤트를 시작합니다."
 pol_pot_arrest_intellectuals_decision_confirm:0 "앙카르 사상감옥으로 끌고 가라! 자백서를 받아내라!"
 pol_pot_arrest_intellectuals_decision_req_candidate:0 "궁정 또는 직속 봉신 중에 아직 투옥되지 않은 성인 지식인, 즉 [learning|E]이 10 이상이거나 학식·지성·학자·시인·의사 특성을 보유한 인물이 존재함"
 pol_pot_arrest_intellectuals_decision_select_tt:0 "앙카르 사상감옥에 투옥할 반동 지식인을 선택해야 합니다."
 pol_pot_arrest_intellectuals_decision_effect_tt:0 "[arrested_intellectual.GetShortUIName|U](이)가 반동 지식인으로 지목되어 재산을 몰수당하고 즉시 지하 감옥에 투옥됨"
 pol_pot_tuol_sleng_purge_modifier:0 "앙카르 특별 사상 심문"
 pol_pot_tuol_sleng_purge_modifier_desc:0 "앙카르 보안감옥에서 밤낮으로 이어지는 색출과 심문 앞에 영지 내의 모든 지식인과 음모꾼들이 공포에 떨고 있습니다."
 artifact_pol_pot_failed_paris_transcript_name:0 "파리 라디오학교 낙제 성적표"
 artifact_pol_pot_failed_paris_transcript_desc:0 "젊은 시절 유학지에서 학업 부진으로 장학금을 박탈당하고 쫓겨나듯 귀국해야 했던 라디오 전기학교의 치욕스러운 낙제 성적표입니다. 세상의 모든 먹물 지식인과 시험 제도를 증오하게 만든 원초적 분노가 서려 있어, 글 아는 자들을 가차 없이 숙청할 때마다 기괴한 정당성을 부여하지만 정작 본인의 학식에는 전혀 보탬이 되지 않습니다."
 pol_pot_failed_paris_transcript_modifier:0 "파리 라디오학교 낙제 성적표"
 councillor_court_chaplain_angkar_possessive:0 "앙카르 보안위원장의"
 pol_pot_year_zero_event_preview_tt:0 "영년의 강제 행군 이벤트가 열리며 [intrigue|E] 비밀 감시 강제 이주, 고위험 [stewardship|E] 수확량 네 배 관개 설계, 또는 단계적 동원 중 하나를 선택합니다"
 pol_pot_arrest_intellectuals_event_preview_tt:0 "특별 심문소 대면 이벤트가 열리며 [arrested_intellectual.GetShortUIName](와)과 [intrigue|E] 함정 심문 대결, [learning|E] 사상 투쟁 논파 대결, 또는 즉시 투옥 중 하나를 선택합니다"
 villains_religious_decision.0070.t:0 "영년의 새벽과 비워진 도시"
 villains_religious_decision.0070.desc:0 "붉은 수건을 두른 유격대원들이 골목마다 북을 울리며 모든 도시민에게 즉각 농촌으로 떠나라고 외친다. 화폐와 시장, 낡은 계급의 때가 묻은 도시는 오늘부로 소멸하고 오직 앙카르의 순수한 농경 공동체만이 남을 것이다.\n\n비밀 감시망을 가동해 단 한 명의 낙오자도 없이 밀림 개간지로 몰아넣을 것인가, 아니면 수확량을 네 배로 늘릴 대운하와 집단농장을 내 손으로 직접 설계할 것인가?"
 villains_religious_decision.0070.a:0 "앙카르 비밀 감시망으로 도시민 전원을 밀림 협동농장으로 강제 행군시킨다!"
 villains_religious_decision.0070.a.success:0 "철저한 감시 아래 모든 인력이 협동농장과 유격대에 완벽히 편입됨"
 villains_religious_decision.0070.a.failure:0 "행군 대열에서 집단 탈주와 폭동이 터져 식량 배급망이 무너짐"
 villains_religious_decision.0070.b:0 "벼 수확량 네 배 달성을 목표로 전국의 바둑판 수로를 직접 설계한다!"
 villains_religious_decision.0070.b.success:0 "기적적인 수로 완공으로 황무지가 비옥한 대풍작 곡창지대로 변모함!"
 villains_religious_decision.0070.b.failure:0 "상식을 무시한 수로 공사가 대홍수와 끔찍한 대기근을 불러일으킴"
 villains_religious_decision.0070.c:0 "외곽 거주민부터 단계적으로 농촌 노동대에 편입시킨다."
 villains_religious_decision.0080.t:0 "등불 아래의 반동 지식인 심문"
 villains_religious_decision.0080.desc:0 "축축한 석조 심문실 한가운데 놓인 나무 의자에 불순한 학식을 뽐내던 [arrested_intellectual.GetTitledFirstName](이)가 창백하게 질린 얼굴로 앉아 있다. 책상 위에는 자백서 양식과 먹물 벼루가 정갈하게 놓여 있다.\n\n교묘한 함정 심문으로 외세와 내통했다는 자백과 은닉 금화를 모두 토해내게 만들 것인가, 아니면 공개 사상 투쟁 집회를 열어 저 오만한 지식인의 논리를 만인 앞에서 꺾어버릴 것인가?"
 villains_religious_decision.0080.a:0 "집요한 유도 심문으로 첩자 자백서와 은닉 재산을 남김없이 받아낸다!"
 villains_religious_decision.0080.a.success:0 "[arrested_intellectual.GetShortUIName](이)가 무너져 내리며 은닉 금고와 죄상을 모두 실토함"
 villains_religious_decision.0080.a.failure:0 "[arrested_intellectual.GetShortUIName](이)가 심문의 허점을 찌르고 간수를 매수해 도주함!"
 villains_religious_decision.0080.b:0 "사상 투쟁 집회에서 지식인의 위선적인 학문을 공개 논파해 굴복시킨다!"
 villains_religious_decision.0080.b.success:0 "완벽한 사상 논파에 굴복한 지식인이 눈물로 자기비판을 올림"
 villains_religious_decision.0080.b.failure:0 "날카로운 반박에 말문이 막혀 궁정 한복판에서 큰 망신을 당함"
 villains_religious_decision.0080.c:0 "번거로운 문답 없이 곧장 쇠사슬을 채워 지하감옥에 처넣는다."
 pol_pot_year_zero_miracle_harvest_modifier:0 "영년 협동농장의 기적 대풍작"
 pol_pot_year_zero_miracle_harvest_modifier_desc:0 "새로 건설된 관개 수로와 집단 노동이 기적적으로 맞물리며 수확량과 건설 속도가 폭발적으로 증가했습니다."
 pol_pot_commune_famine_modifier:0 "영년 집단농장 대기근"
 pol_pot_commune_famine_modifier_desc:0 "무지한 농법 강요와 무리한 강제 이주로 인해 들판이 황폐해지고 심각한 기근이 영지를 덮쳤습니다."
 pol_pot_arrest_intellectuals_decision_no_item_selected:0 "심문소로 압송할 구사회 지식인이 선택되지 않았습니다"
