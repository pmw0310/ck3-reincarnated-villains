 # === [Decisions, Events, Modifiers & Relics] ===
 d_laamp_rasputin:0 "Order of the Holy Wanderer"
 d_laamp_rasputin_adj:0 "Holy Wanderer"
 d_laamp_rasputin_article:0 "$DEFAULT_TITLE_NAME_ARTICLE$"
 rasputin_holy_starets:0 "Starets"
 rasputin_living_christ_holder:0 "Living Christ"
 rasputin_living_mother_holder:0 "Living Mother of God"
 d_khlystism:0 "Throne of the Living Christ"
 d_khlystism_adj:0 "Khlyst"
 councillor_court_chaplain_khlystism:0 "Grand Starets"
 councillor_court_chaplain_khlystism_possessive:0 "Grand Starets'"
 artifact_rasputin_cyanide_madeira_name:0 "Cyanide-Spiked Madeira Wine Flask"
 artifact_rasputin_cyanide_madeira_desc:0 "A dark ruby flask of sweet Madeira wine laced by assassins with enough poison to fell an ox, yet drained to the last drop with pastries because its syrupy sugars blunted the toxin. Handed down through House Rasputin as proof of uncanny resistance to murder."
 rasputin_cyanide_madeira_modifier:0 "Cyanide-Spiked Madeira Wine Flask"
 rasputin_cyanide_madeira_modifier_desc:0 "An iron stomach capable of washing down lethal poison with sweet Madeira wine mocks would-be assassins and grants eerie vitality."
 artifact_rasputin_hypnotic_crucifix_name:0 "Hypnotic Silver Crucifix of the Empress's Bedchamber"
 artifact_rasputin_hypnotic_crucifix_desc:0 "A Siberian-wrought Eastern eight-pointed silver cross whose candlelit gleam draws every eye into an unblinking trance, lowering the guard of royal bedchambers and noblewomen alike."
 rasputin_hypnotic_crucifix_modifier:0 "Hypnotic Silver Crucifix of the Empress's Bedchamber"
 rasputin_hypnotic_crucifix_modifier_desc:0 "The swaying gleam of the eight-pointed silver cross disarms suspicion and wraps its target in irresistible hypnotic allure."
 rasputin_found_khlystism_decision:0 "Found the Secret Mysteries of Khlystism"
 rasputin_found_khlystism_decision_desc:0 "Long enough have we worn the orthodox mask of a Chalcedonian pilgrim while whispering forbidden mysteries in candlelit chambers! Now that devoted lovers and followers hang upon our every word, we shall cast off hypocritical priesthoods, proclaim the ecstatic sect of Khlystism, and ascend as the Living Vessel of the Spirit!"
 rasputin_found_khlystism_decision_tooltip:0 "Conduct the underground Khlyst founding rite to become temporal head of faith, testing Learning or Diplomacy for additional fervor."
 rasputin_found_khlystism_decision_confirm:0 "Fear not sacred sin, for through me comes salvation!"
 rasputin_found_khlystism_lovers_req_tt:0 "You have at least 3 nobleborn lovers"
 rasputin_found_khlystism_convert_followers_tt:0 "All of your camp followers, courtiers, and non-ruler lovers immediately embrace Khlystism"
 rasputin_living_vessel_modifier:0 "Living Vessel of the Spirit"
 rasputin_living_vessel_modifier_desc:0 "Revered as a living vessel of divine ecstasy, the starets commands fanatical devotion and magnetic allure among believers."
 rasputin_miracle_healing_intrigue_decision:0 "Bedchamber Miracle Healing & Shadow Intrigue"
 rasputin_miracle_healing_intrigue_decision_desc:0 "Summoned in secret to the candlelit bedchambers of anxious nobles and ailing heirs, we shall soothe their torment with fervent prayer and Siberian herbal remedies! Grateful patrons will shower our camp with gold and provisions—while entrusting their deepest family vulnerabilities into our hands!"
 rasputin_miracle_healing_intrigue_decision_tooltip:0 "Hold a midnight healing vigil where an Intrigue duel against the patron ruler or a Learning remedy check determines hooks and offerings."
 rasputin_miracle_healing_intrigue_decision_confirm:0 "Look into my eyes... the pain fades, and only my voice remains."
 rasputin_miracle_healing_target_realm_tt:0 "Your camp is pitched in a county held by another ruler, or you reside in a valid county"
 rasputin_miracle_healing_hook_tt:0 "If possible, you gain a Strong Favor Hook or Favor Hook on the top liege of the county where you currently reside"
 rasputin_imperial_healer_modifier:0 "Shadow Healer of the Imperial Bedchamber"
 rasputin_imperial_healer_modifier_desc:0 "Trusted behind the closed curtains of noble bedchambers, the mystic healer enjoys effortless supplies and potent leverage in personal and hostile schemes."
 rasputin_herbal_contraception_modifier:0 "Siberian Undying Brew & Contraception"
 rasputin_herbal_contraception_modifier_desc:0 "A secret taiga herbal infusion grants uncanny vitality resilient against poison and frailty while keeping unwanted bastard scandals in check across noble bedchambers.\n\nCannot become [GetTrait('incapable').GetName( GetNullCharacter )]"
 rasputin_miracle_healing_event_preview_tt:0 "Opens the Midnight Healing Vigil event, offering an opposed [intrigue|E] hypnosis duel for a strong hook, a [learning|E] herbal cure, or a safe blessing"
 rasputin_found_khlystism_event_preview_tt:0 "Opens the Underground Khlyst Founding event, offering a [learning|E] whirling revelation, a [diplomacy|E] noble communion, or a quiet cellar oath"
 villains_religious_decision.0110.t:0 "Flickering Candles in the Noble Bedchamber"
 villains_religious_decision.0110.desc:0 "Thick incense smoke and trembling candlelight veil the bedchamber as anxious noble eyes lock onto my dark, unblinking gaze. Tracing a slow sign over the sickbed, I murmur a resonant prayer that fills the hushed room.\n\nShall I bind the patron ruler soul with hypnotic suggestion to seize an unbreakable hold over their house, or apply genuine Siberian herbal lore to work a wondrous recovery?"
 villains_religious_decision.0110.a:0 "Look deep into my eyes… bind the patron soul and secrets through hypnosis!"
 villains_religious_decision.0110.a.success:0 "Spellbound patron surrenders deep secrets, gold, and unwavering obedience"
 villains_religious_decision.0110.a.failure:0 "Hypnotic trickery is exposed, getting you driven out as a wicked charlatan!"
 villains_religious_decision.0110.b:0 "Cleanse the illness with Siberian herbal remedies and fervent prayer."
 villains_religious_decision.0110.b.success:0 "Miraculous recovery leaves the household worshiping you as a living saint"
 villains_religious_decision.0110.b.failure:0 "Botched herbal brew worsens the stomach cramps and tarnishes your aura"
 villains_religious_decision.0110.c:0 "Offer a comforting blessing and laying on of hands for generous alms."
 villains_religious_decision.0120.t:0 "The Underground Circle of Sacred Ecstasy"
 villains_religious_decision.0120.desc:0 "Deep within a hidden cellar beneath the chapel, noble lovers and devoted followers clad in white linen form a breathless circle around me. Tonight we shatter the hollow rules of hypocritical priests and birth a new mystic covenant where flesh and spirit merge in divine ecstasy!\n\nShall I lead a whirling rite of mystic revelation to ignite fanatical zeal, or host an intoxicating communion to captivate high society and its gold?"
 villains_religious_decision.0120.a:0 "Whirl until dawn in ecstatic flagellation and mystic revelation!"
 villains_religious_decision.0120.a.success:0 "Transcendent whirling rite crowns you the undisputed living savior!"
 villains_religious_decision.0120.a.failure:0 "Wild shrieks leak past the cellar doors, fueling dark scandal across the realm"
 villains_religious_decision.0120.b:0 "Captivate noble devotees body and purse with sweet wine and sacred communion!"
 villains_religious_decision.0120.b.success:0 "Enchanted aristocrats lavish gold and prestige upon your newborn sect"
 villains_religious_decision.0120.b.failure:0 "Jealous quarrels among noble lovers mar the sacred founding night"
 villains_religious_decision.0120.c:0 "Exchange a hushed covenant of blood away from prying ears."
 rasputin_charlatan_exposed_modifier:0 "Exposed Charlatan Mystic"
 rasputin_charlatan_exposed_modifier_desc:0 "Caught attempting hypnotic manipulation in a noble bedchamber, whispers of fraud now shadow your prayers."
 rasputin_khlyst_ecstasy_fervor_modifier:0 "Khlyst Ecstatic Fervor"
 rasputin_khlyst_ecstasy_fervor_modifier_desc:0 "Swept up in the transcendent ecstasy of the founding night, noble devotees shower you with ardent devotion."
 rasputin_khlyst_scandal_rumors_modifier:0 "Underground Sect Scandal"
 rasputin_khlyst_scandal_rumors_modifier_desc:0 "Lurid rumors of midnight cellar rites leaked abroad, drawing sharp condemnation from conventional believers."
