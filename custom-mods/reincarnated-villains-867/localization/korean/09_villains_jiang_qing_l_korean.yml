 nick_white_boned_empress:0 "붉은 여황"
 nick_white_boned_empress_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 화려했던 은막의 여배우에서 문화대혁명의 무자비한 총감독으로 군림하며 측천무후의 제위를 탐낸 '붉은 여황'입니다. 광신적인 홍위병 조반파와 피비린내 나는 조리돌림 비판대회로 옛 원한을 품은 정적과 구시대의 문화를 남김없이 불태웁니다."
 bookmark_reincarnated_jiang_qing:0 "문혁조장 장 칭"
 bookmark_reincarnated_jiang_qing_subheading:0 "강남 조반총부의 문혁조장"
 bookmark_reincarnated_jiang_qing_desc:0 "문화대혁명의 광풍 속에서 혁명 모범극과 홍위병 조리돌림을 지휘하던 상하이방의 수괴 장 칭은, 서기 867년 황혼기에 접어든 당 제국 강남의 부유한 양절과 화정 일대를 다스리는 젊은 여성 왕국급 천조 총독으로 눈을 떴습니다.\n\n그녀의 궁정에는 장 춘차오·야오 원위안·왕 훙원 등 상하이의 핵심 측근들이 고스란히 집결해 있으며, 위대한 태양 아래 낡은 유교와 불교 유산을 불태우는 조반 문혁사상의 깃발이 이미 강남 하늘에 나부끼고 있습니다. 과연 붉은 여황은 흔들리는 당 황실로부터 독립해 중화 대륙에 프롤레타리아 문화대제국을 세울 수 있을까요?"

