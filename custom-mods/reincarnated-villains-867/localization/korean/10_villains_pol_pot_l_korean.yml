 # === [문화 · 전통 · 고유 무장병] ===
 khmer_rouge_guerrillas:0 "크메르 루주 유격대"
 khmer_rouge_guerrillas_flavor:0 "#F 검은 농민복과 붉은 격자 크라마 스카프를 두르고 밀림 속에서 기습을 감행하는 앙카르 농민 유격대입니다. 신앙도를 섞어 헐값에 모병되며 유지비가 사실상 거의 들지 않고, 정글과 습지에서 압도적인 은폐·회피 엄호력을 발휘합니다.#!"
 pol_pot_red_khmers_grand_army_name:0 "앙카르 적색 크메르 총군단"
 tradition_year_zero_collectives_name:0 "영년의 밀림 집단농장"
 tradition_year_zero_collectives_desc:0 "과거의 도시 문명을 비워 내고 모든 주민을 밀림 속 자급자족 집단농장과 유격대로 편성합니다. 빽빽한 정글 지형을 완벽히 장악하여 외적을 수렁에 빠뜨립니다."
 tradition_year_zero_collectives_only_tt:0 "앙카르 크메르 문화이거나 그 후예 문화여야 함"
