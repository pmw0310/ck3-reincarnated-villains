 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 Grigori:0 "그리고리"
 dynn_Rasputin_867:0 "라스푸틴"
 dynn_Rasputin_867_motto:0 "크게 죄짓지 않고서 어찌 크게 구원받으리요"
 nick_the_mad_monk:0 "불사신 괴승"
 nick_the_mad_monk_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 치사량의 독약과 총탄 세례, 얼어붙은 강물조차 끝내 숨통을 끊지 못한 기괴한 생명력의 '불사신 괴승'입니다. 꿰뚫어 보는 듯한 최면의 눈빛과 타락을 구원이라 설파하는 밀교적 광기로 황실의 안방과 귀부인들의 영혼을 집어삼킵니다."
 bookmark_reincarnated_rasputin:0 "'불사신 괴승' 그리고리 라스푸틴"
 bookmark_reincarnated_rasputin_subheading:0 "네바 강변의 비지주 방랑 수도사"
 bookmark_reincarnated_rasputin_desc:0 "차르 니콜라이 2세와 알렉산드라 황후의 총애를 등에 업고 제정 러시아 황실을 뒤흔들었던 시베리아 출신의 신비주의 괴승 그리고리 라스푸틴은, 독이 든 케이크와 포도주, 총탄 세례를 맞고 얼어붙은 네바강에 수장당하던 바로 그 강기슭—서기 867년 핀란드만 어귀에 천막 하나만 가진 방랑 모험가로 눈을 떴습니다.\n\n동서 교회가 아직 갈라지기 전인 주류 칼케돈파 그리스 예법 순례자의 탈을 쓴 채, 이제 그는 영지 한 조각 없이 온 유럽과 비잔티움의 황실 침실을 떠돌며 기적 치유와 최면 유혹으로 귀부인들의 영혼을 사로잡을 것입니다. 때가 무르익어 타락과 황홀경 속에서 구원을 찾는 비밀 종파 '흘리스티'를 창단할 때, 과연 괴승의 검은 장삼 아래 온 제국이 무릎 꿇게 될까요?"
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_rasputin:0 "괴승의 흑색 수도복"

 # === [종교 · 성지 · 신앙] ===
 holy_site_neva_khlyst_name:0 "네바"
 khlystism:0 "흘리스티"
 khlystism_adj:0 "흘리스티"
 khlystism_adherent:0 "흘리스티 신도"
 khlystism_adherent_plural:0 "흘리스티 신도들"
 khlystism_desc:0 "'성스러운 방탕을 통한 구원'을 설파하는 러시아 신비주의 비밀 종파 흘리스티는, 엄격한 제도권 성직자와 수도원을 배격하고 성령이 살아있는 인간의 육신에 직접 강림한다고 믿습니다. 끝없는 원무와 황홀경의 야간 집회 속에서 육체적 죄악에 깊이 빠져들고 참회할 때에야 비로소 영혼이 구원에 이른다고 가르칩니다."
 khlystism_old:0 "고대 흘리스티"
 khlystism_old_adj:0 "고대 흘리스티"
 khlystism_old_adherent:0 "고대 흘리스티 신도"
 khlystism_old_adherent_plural:0 "고대 흘리스티 신도들"
 khlystism_high_god_name:0 "만군의 주"
 khlystism_high_god_name_possessive:0 "만군의 주의"
 khlystism_high_god_name_alternate:0 "살아있는 그리스도"
 khlystism_high_god_name_alternate_possessive:0 "살아있는 그리스도의"
 khlystism_fertility_god_name:0 "살아있는 성모"
 khlystism_fertility_god_name_possessive:0 "살아있는 성모의"
 khlystism_devil_name:0 "타락한 적그리스도"
 khlystism_devil_name_possessive:0 "타락한 적그리스도의"
 khlystism_house_of_worship:0 "방주 집회소"
 khlystism_house_of_worship_plural:0 "방주 집회소들"
 khlystism_religious_symbol:0 "최면의 팔단 십자가"
 khlystism_religious_text:0 "성령의 비의록"
 khlystism_devotee:0 "방랑 고행자"
 khlystism_devotee_plural:0 "방랑 고행자들"
 khlystism_devotee_female:0 "황홀경의 자매"
 khlystism_devotee_female_plural:0 "황홀경의 자매들"
 khlystism_priest_male:0 "스타레츠"
 khlystism_priest_male_plural:0 "스타레츠들"
 khlystism_priest_female:0 "성모 예언자"
 khlystism_priest_female_plural:0 "성모 예언자들"
 khlystism_bishop_male:0 "방주의 인도자"
 khlystism_bishop_male_plural:0 "방주의 인도자들"
 khlystism_bishop_female:0 "방주의 성모"
 khlystism_bishop_female_plural:0 "방주의 성모들"
 khlystism_religious_head_title:0 "살아있는 그리스도"
 khlystism_religious_head_title_female:0 "살아있는 성모"
 khlystism_religious_head_title_name:0 "살아있는 그리스도좌"
 khlystism_positive_afterlife:0 "일곱째 하늘의 낙원"
 khlystism_negative_afterlife:0 "얼어붙은 심연"
 khlystism_ghw_name:0 "성령의 대순례 성전"
 khlystism_ghw_name_plural:0 "성령의 대순례 성전들"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 d_laamp_rasputin:0 "성스러운 방랑 수도회"
 d_laamp_rasputin_adj:0 "방랑 수도회"
 d_laamp_rasputin_article:0 "$DEFAULT_TITLE_NAME_ARTICLE$"
 d_khlystism:0 "살아있는 그리스도좌"
 d_khlystism_adj:0 "흘리스티"
 councillor_court_chaplain_khlystism:0 "수석 스타레츠"
 councillor_court_chaplain_khlystism_possessive:0 "수석 스타레츠의"
 artifact_rasputin_cyanide_madeira_name:0 "청산가리 타 마신 마데이라 포도주병"
 artifact_rasputin_cyanide_madeira_desc:0 "암살자들이 치사량의 독약을 듬뿍 타서 권했으나 달콤한 당분이 독성을 중화시키는 바람에 안주까지 곁들여 멀쩡히 비워 버렸다는 전설의 마데이라 포도주병입니다. 라스푸틴 가문의 기괴한 생명력과 독살 면역의 상징으로 전해 내려옵니다."
 rasputin_cyanide_madeira_modifier:0 "청산가리 타 마신 마데이라 포도주병"
 rasputin_cyanide_madeira_modifier_desc:0 "치사량의 독약이 섞인 포도주조차 달콤한 반주로 삼아 넘기는 불사신의 위장이 암살 위협을 비웃으며 끈질긴 생명력을 부여합니다."
 artifact_rasputin_hypnotic_crucifix_name:0 "황후 침실 출입용 최면 은십자가"
 artifact_rasputin_hypnotic_crucifix_desc:0 "시베리아 은세공으로 벼려내어 촛불 아래 흔들릴 때마다 상대의 동공을 빨아들이는 동방 팔단 은십자가입니다. 귀부인들과 황실 안방의 경계심을 단숨에 허물어뜨리는 치명적인 최면 유혹의 매개체입니다."
 rasputin_hypnotic_crucifix_modifier:0 "황후 침실 출입용 최면 은십자가"
 rasputin_hypnotic_crucifix_modifier_desc:0 "흔들리는 은빛 팔단 십자가 너머로 번뜩이는 최면의 눈빛이 상대의 이성을 마비시키고 거부할 수 없는 매혹에 빠뜨립니다."
 rasputin_found_khlystism_decision:0 "흘리스티 비의 창단"
 rasputin_found_khlystism_decision_desc:0 "그동안 주류 칼케돈파 순례자의 장삼 아래 본모습을 숨긴 채 수많은 영혼과 살결을 어루만지며 신성한 비밀을 속삭여 왔습니다! 이제 위선적인 사제들의 교리를 벗어던지고, 격렬한 원무와 성스러운 방탕을 통해 참된 구원에 이르는 비밀 비의 종파—'흘리스티'를 창단하여 스스로 살아있는 그리스도의 권좌에 오를 시간입니다!"
 rasputin_found_khlystism_decision_tooltip:0 "심야 지하 성소에서 흘리스티 비의 창단 의식을 거행하여 세속 교주에 등극하고, 학식이나 외교력 판정에 따라 추가 광신 보너스를 획득합니다."
 rasputin_found_khlystism_decision_confirm:0 "성스러운 죄악을 두려워 마라! 내가 곧 살아있는 구원자다!"
 rasputin_found_khlystism_lovers_req_tt:0 "평민이 아닌 귀족 출신 연인이 3명 이상임"
 rasputin_found_khlystism_convert_followers_tt:0 "당신의 야영지 및 궁정 추종자 전원과, 작위가 없는 모든 연인이 즉시 흘리스티 신앙을 받아들입니다"
 rasputin_living_vessel_modifier:0 "살아있는 그리스도의 현신"
 rasputin_living_vessel_modifier_desc:0 "스스로 성령이 깃든 살아있는 그릇임을 선포한 괴승의 눈빛 앞에 광신도들과 귀부인들이 홀린 듯이 무릎을 꿇습니다."
 rasputin_miracle_healing_intrigue_decision:0 "황실 침실의 기적 치유와 비선 암약"
 rasputin_miracle_healing_intrigue_decision_desc:0 "병마와 불안에 시달리는 귀족 가문과 군주의 침실에 은밀히 불려 들어가, 타오르는 촛불 아래 간절한 기도와 약초 비방으로 기적 같은 안식을 선사할 시간입니다! 눈물 흘리며 매달리는 귀부인들의 후원금과 보급품을 챙기는 것은 물론, 가문 가장의 치명적인 약점까지 손아귀에 쥐어 궁정의 숨은 실세로 군림하겠습니다!"
 rasputin_miracle_healing_intrigue_decision_tooltip:0 "귀족 침실의 심야 기도회를 열어 후원 군주와의 계책력 대결이나 학식 치유 판정에 따라 강한 구실과 시주 규모가 결정되는 전용 이벤트를 시작합니다."
 rasputin_miracle_healing_intrigue_decision_confirm:0 "내 눈을 똑바로 보시오… 고통은 사라지고 내 뜻만이 남을 것이오."
 rasputin_miracle_healing_target_realm_tt:0 "타 군주가 지배하는 백작령에 야영지를 치고 머무르고 있거나 유효한 영지에 위치함"
 rasputin_miracle_healing_hook_tt:0 "현재 체류 중인 영지의 최고 주군에게 구실을 걸 수 있다면 강한 호의 구실 또는 호의 구실을 획득합니다"
 rasputin_imperial_healer_modifier:0 "황실 침실의 비선 치유사"
 rasputin_imperial_healer_modifier_desc:0 "귀족 가문과 황실의 은밀한 침실을 드나들며 기적 치유사로 추앙받아 각종 개인 및 적대 모략과 보급 유지가 한결 수월해집니다."
 rasputin_herbal_contraception_modifier:0 "시베리아 불사 비방과 피임술"
 rasputin_herbal_contraception_modifier_desc:0 "타이가 숲에서 전해 내려오는 은밀한 약초 비방으로 독극물과 병마조차 견뎌내는 끈질긴 생명력을 유지하며, 수많은 침실을 오가면서도 사생아 스캔들을 억제합니다.\n\n[GetTrait('incapable').GetName( GetNullCharacter )]가 되지 않음"
 rasputin_miracle_healing_event_preview_tt:0 "심야 침실 기도회 이벤트가 열리며 후원 영주와의 [intrigue|E] 최면 암약 대결, [learning|E] 약초 비방 치유, 또는 안전한 축복 시주 중 하나를 선택합니다"
 rasputin_found_khlystism_event_preview_tt:0 "지하 성소 창단 의식 이벤트가 열리며 [learning|E] 황홀경의 원무 계시, [diplomacy|E] 귀족 신도 성찬식, 또는 은밀한 피의 서약 중 하나를 선택합니다"
 villains_religious_decision.0110.t:0 "흔들리는 촛불과 황실 침실의 속삭임"
 villains_religious_decision.0110.desc:0 "자욱한 유향 연기와 흔들리는 촛불 그림자가 침실을 감싸고, 병마와 불안에 지친 귀족 가문의 시선이 내 깊고 어두운 눈동자에 얽매여 있다. 나는 성호를 그으며 나직한 목소리로 기도를 읊조렸다.\n\n이 기회에 최면 같은 눈빛으로 가문 가장의 영혼을 완벽히 결박해 치명적인 약점을 쥐어잡을 것인가, 아니면 고향 시베리아의 비전 약초술로 진짜 기적 같은 쾌유를 선보여 성자의 명성을 얻을 것인가?"
 villains_religious_decision.0110.a:0 "내 눈을 똑바로 보시오… 최면의 암시로 영주의 영혼과 약점을 쥐어잡는다!"
 villains_religious_decision.0110.a.success:0 "최면에 홀린 후원자가 눈물을 흘리며 가문의 은밀한 비밀과 금화를 바침"
 villains_religious_decision.0110.a.failure:0 "최면 술수가 들통나 불경한 요승이라는 고함과 함께 침실에서 쫓겨남!"
 villains_religious_decision.0110.b:0 "시베리아 약초 비방과 간절한 기도로 병마를 씻어내 성자로 추앙받는다."
 villains_religious_decision.0110.b.success:0 "놀라운 약효로 열기가 가라앉으며 모두가 살아있는 성자라고 경배함"
 villains_religious_decision.0110.b.failure:0 "약초 배합 실수로 구토와 복통만 심해져 체면과 신앙심이 깎임"
 villains_religious_decision.0110.c:0 "무난한 축복 기도와 안수 의식만 베풀고 후한 시주를 챙긴다."
 villains_religious_decision.0120.t:0 "성스러운 광란의 지하 원무"
 villains_religious_decision.0120.desc:0 "성당 아래 비밀 지하실, 하얀 소복을 입은 귀족 연인들과 추종자들이 나를 중심으로 거대한 원을 그리고 서 있다. 위선적인 성직자들의 낡은 율법을 부수고, 육신의 고행과 황홀경을 통해 신과 하나가 되는 새로운 비의 종파가 탄생하는 순간이다!\n\n숨이 멎을 듯한 광란의 원무와 신비주의 설법으로 절대적 광신을 불어넣을 것인가, 아니면 감미로운 유혹의 성찬으로 귀족 후원자들의 재물과 사교계를 단숨에 장악할 것인가?"
 villains_religious_decision.0120.a:0 "새벽이 밝을 때까지 황홀경의 원무와 신비 계시로 영혼을 불태운다!"
 villains_religious_decision.0120.a.success:0 "신들린 설법과 원무 속에 모든 신도가 당신을 살아있는 구원자로 경배함!"
 villains_religious_decision.0120.a.failure:0 "지하실 밖으로 기괴한 비명과 소문이 새어 나가 추문으로 번짐"
 villains_religious_decision.0120.b:0 "달콤한 포도주와 유혹의 성찬으로 귀족 연인들의 몸과 금고를 사로잡는다!"
 villains_religious_decision.0120.b.success:0 "매혹된 귀족 추종자들이 막대한 후원금과 함께 종파의 선봉에 섬"
 villains_religious_decision.0120.b.failure:0 "질투에 눈먼 연인들 사이에 다툼이 벌어져 비밀 모임이 소란스럽게 파함"
 villains_religious_decision.0120.c:0 "외부의 귀를 피해 침묵 속에서 엄숙한 피의 서약만 나눈다."
 rasputin_charlatan_exposed_modifier:0 "탄로 난 요승의 최면 술수"
 rasputin_charlatan_exposed_modifier_desc:0 "귀족 침실에서 부리던 최면 수작이 발각되면서 거짓 예언자라는 불신과 경계의 시선이 뒤따르고 있습니다."
 rasputin_khlyst_ecstasy_fervor_modifier:0 "흘리스티 황홀경의 광신"
 rasputin_khlyst_ecstasy_fervor_modifier_desc:0 "창단 의식의 강렬한 신비 체험에 매료된 신도들과 귀족 연인들이 아낌없는 헌신을 바치고 있습니다."
 rasputin_khlyst_scandal_rumors_modifier:0 "지하 비밀 집회의 추문"
