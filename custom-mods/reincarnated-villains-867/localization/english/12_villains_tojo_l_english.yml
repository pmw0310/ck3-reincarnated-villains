 # === [Single-Name Artifacts, Decisions, Events & Modifiers] ===
 artifact_tojo_tortoiseshell_spectacles_name:0 "Tojo's Round Tortoiseshell Spectacles"
 artifact_tojo_tortoiseshell_spectacles_desc:0 "A pair of round tortoiseshell-rimmed spectacles perched atop Hideki Tojo's nose as he pores over tax ledgers, ration coupons, and dawn trash-bin inspection notes. Nothing escapes their bureaucratic glare, though relentless micromanagement steadily frays their wearer's nerves."
 artifact_tojo_ghq_victory_bulletin_name:0 "Imperial Headquarters Victory Bulletin"
 artifact_tojo_ghq_victory_bulletin_desc:0 "A bound dossier of official Imperial General Headquarters proclamations capable of transforming any battlefield disaster into a miraculous triumph or a 'forward redeployment' with a single brush stroke. Cheering crowds shower the regime with legitimacy, even as fictional troop counts slow real-world levy replacements."
 tojo_tortoiseshell_spectacles_modifier:0 "Tojo's Round Tortoiseshell Spectacles"
 tojo_ghq_victory_bulletin_modifier:0 "Imperial Headquarters Victory Bulletin"
 tojo_total_mobilization_dynasty_modifier:0 "National Mobilization Control Cabinet"
 tojo_total_mobilization_dynasty_modifier_desc:0 "Having organized the Kanto plain beneath a total-war bureaucracy, this dynasty commands ruthless efficiency in heavy infantry discipline and vassal taxation."
 tojo_imperial_rule_dynasty_modifier:0 "New Order Total Mobilization Hegemony"
 tojo_imperial_rule_dynasty_modifier_desc:0 "Having united the archipelago under a single Imperial Rule Assistance apparatus, this dynasty wields unyielding administrative control, heavy infantry might, and counter-intelligence."
 tojo_imperial_tokyo_capital_county_modifier:0 "Imperial Tokyo General Headquarters"
 tojo_imperial_tokyo_capital_county_modifier_desc:0 "The administrative heart of total mobilization, packed with General Headquarters bureaus, Kenpeitai barracks, and state arsenals."
 tojo_ghq_fabricated_victory_euphoria_modifier:0 "Lantern Parades Over Fabricated GHQ Victories"
 tojo_ghq_fabricated_victory_euphoria_modifier_desc:0 "Thrilled by official bulletins claiming tenfold enemy losses, jubilant subjects march with paper lanterns all night and eagerly flock to the colors."
 tojo_ghq_bulletin_exposed_fiasco_modifier:0 "Exposed GHQ Victory Bulletin Fiasco"
 tojo_ghq_bulletin_exposed_fiasco_modifier_desc:0 "When enemy forces supposedly annihilated three times over sailed into view unharmed, your bombastic headquarters bulletins became an object of public ridicule."
 tojo_strategic_redeployment_requisition_modifier:0 "Forward Redeployment War-Bond Requisition"
 tojo_strategic_redeployment_requisition_modifier_desc:0 "Outlawing the word 'retreat' in favor of 'forward redeployment', the cabinet extracts emergency war taxes in preparation for the next decisive battle."
 tojo_portfolio_monopoly_cabinet_modifier:0 "One-Man Eight-Portfolio Cabinet"
 tojo_portfolio_monopoly_cabinet_modifier_desc:0 "Holding the seals of Prime Minister, Army, Home Affairs, Finance, and Munitions simultaneously slashes army upkeep and expands personal oversight, though sidelined vassals seethe."
 tojo_midnight_trash_audit_triumph_modifier:0 "Dread of Dawn Alleyway Trash-Bin Audits"
 tojo_midnight_trash_audit_triumph_modifier_desc:0 "Ever since the Prime Minister personally lifted neighborhood trash-bin lids before dawn to catch contraband fishbones and white rice, not a single official dares skim state funds."
 tojo_alleyway_laughingstock_modifier:0 "Chased by Stray Dogs During Dawn Trash Raid"
 tojo_alleyway_laughingstock_modifier_desc:0 "Rumors that the Prime Minister overturned a kitchen refuse tub in the dark and fled from barking alley dogs have set the whole court snickering."
 tojo_establish_total_mobilization_cabinet_decision:0 "Establish the Total Mobilization Cabinet"
 tojo_establish_total_mobilization_cabinet_decision_desc:0 "The warrior bands and estates around Tokyo Bay and the Kanto plain now stand regimented beneath our Imperial Rule Assistance Governorate! It is time to sweep aside lazy noble factionalism and inaugurate the Total Mobilization Cabinet, directing every soldier and grain sack by ministerial decree."
 tojo_establish_total_mobilization_cabinet_decision_tooltip:0 "Unite Kanto to found the 'Total Mobilization Cabinet', unlocking your dynasty's National Mobilization modifier and Special Kenpeitai Corps."
 tojo_establish_total_mobilization_cabinet_decision_confirm:0 "Stamp the National Mobilization Decree!"
 tojo_proclaim_empire_of_japan_decision:0 "Proclaim the Empire of Japan"
 tojo_proclaim_empire_of_japan_decision_desc:0 "From Tokyo Bay in Musashi to the Imperial Palace in Kyoto, every fortress and prefecture across the archipelago answers to the Imperial Rule Assistance Headquarters! End the archaic Fujiwara regency forever and proclaim a centralized Empire of Japan under the Prime Minister's supreme command!"
 tojo_proclaim_empire_of_japan_decision_tooltip:0 "Secure Musashi, Kyoto, and the archipelago heartland to proclaim the 'Empire of Japan' and muster an elite Imperial Headquarters Kenpeitai Division."
 tojo_proclaim_empire_of_japan_decision_confirm:0 "Bind the entire archipelago into the New Order!"
 tojo_imperial_ghq_victory_bulletin_decision:0 "Issue Imperial GHQ Victory Bulletin"
 tojo_imperial_ghq_victory_bulletin_decision_desc:0 "Any staff officer who reports setbacks honestly clearly lacks fighting spirit! Multiply enemy casualties by ten and rewrite every withdrawal as a 'forward redeployment'. Announce a glorious Imperial General Headquarters bulletin accompanied by drums and bugles so cheering subjects pour funds into our war chest!"
 tojo_imperial_ghq_victory_bulletin_decision_tooltip:0 "Publish a special Imperial Headquarters communique to test an Intrigue victory-inflation rally or levy 'forward redeployment' war bonds."
 tojo_imperial_ghq_victory_bulletin_decision_confirm:0 "Sound the bugles! Announce another glorious triumph!"
 tojo_imperial_ghq_victory_bulletin_event_preview_tt:0 "Choose between an #V Intrigue#! tenfold victory-inflation lantern rally, 'forward redeployment' war-bond requisitions, or strict Kenpeitai press censorship."
 tojo_midnight_trash_inspection_decision:0 "Dawn Trash-Bin Inspection and Portfolio Monopoly"
 tojo_midnight_trash_inspection_decision_desc:0 "Sitting behind a desk trusting written reports only invites lazy officials to pilfer state rice and munitions! Before sunrise, let us slip into the back alleys ourselves to pry open household wooden trash bins—or better yet, strip unreliable ministers of their seals and hold all eight cabinet portfolios in person!"
 tojo_midnight_trash_inspection_decision_tooltip:0 "Conduct a surprise dawn trash-bin inspection to root out black-market waste, or monopolize cabinet portfolios yourself."
 tojo_midnight_trash_inspection_decision_confirm:0 "Fetch my notebook and lantern—open every trash bin!"
 tojo_midnight_trash_inspection_event_preview_tt:0 "Test #V Stewardship#! in a dawn alleyway trash-bin audit to seize hoarded gold and county control, or monopolize eight ministerial portfolios to boost domain limit and cut Men-at-Arms upkeep."
 villains_religious_decision.0240.t:0 "Red Ink Across the Imperial Headquarters Bulletin"
 villains_religious_decision.0240.desc:0 "Mud-stained dispatches from the provinces lie stacked high across the candlelit Imperial General Headquarters table. Adjusting my round tortoiseshell spectacles with an ink brush poised in hand, I watch my staff officer sweat nervously beside the map.\n\nPublishing unvarnished setbacks would only sap public morale! Shall I paint an extra zero onto every tally of defeated foes to spark a triumphant lantern parade through the streets, or cross out the word 'retreat' in favor of 'planned forward redeployment' to collect emergency defense bonds?"
 villains_religious_decision.0240.a:0 "Add another zero to enemy casualties! Order a grand victory lantern parade!"
 villains_religious_decision.0240.a.success:0 "Jubilant crowds fill the streets with paper lanterns celebrating your fabricated triumph!"
 villains_religious_decision.0240.a.failure:0 "\"How is an enemy wiped out three times still marching intact?!\" The lie unravels!"
 villains_religious_decision.0240.b:0 "It is never a retreat—call it a 'forward redeployment' and collect emergency war bonds!"
 villains_religious_decision.0240.b.toast:0 "Issued the Forward Redeployment communique and collected emergency war funds"
 villains_religious_decision.0240.c:0 "Tone down the numbers and dispatch the Kenpeitai to silence loose talk."
 villains_religious_decision.0250.t:0 "Wooden Trash Bins at Dawn and the Pocket Notebook"
 villains_religious_decision.0250.desc:0 "Through cold pre-dawn mist, I stride into the narrow back alleys behind the mansions of my capital's officials with two Kenpeitai escorts. Prying open the wooden lid of a curbside refuse bin beneath the glint of my round spectacles, I uncover leftover white rice and fine sea-bream bones in brazen defiance of austerity decrees!\n\nAs my brush scratches furiously into my pocket notebook, a nightshirt-clad official tumbles out of his gate and drops to his knees in terror. Shall I ransack every trash bin down the avenue to confiscate black-market wealth for the treasury, or confiscate these incompetent ministers' seals altogether and run eight departments myself?"
 villains_religious_decision.0250.a:0 "Inspect every bin on the street! Fine them down to the last sea-bream bone!"
 villains_religious_decision.0250.a.success:0 "Relentless trash-bin auditing fills the treasury and terrifies corrupt officials into line!"
 villains_religious_decision.0250.a.failure:0 "Overturned refuse tubs and barking alley dogs turn your dawn raid into a farce!"
 villains_religious_decision.0250.b:0 "Subordinates cannot be trusted! I shall hold the Military, Home, and Finance seals myself!"
 villains_religious_decision.0250.b.toast:0 "Monopolized cabinet portfolios and mustered a Special Kenpeitai Patrol"
 villains_religious_decision.0250.c:0 "Issue stern notebook reprimands and enforce a frugal roasted-barley tea ration."
