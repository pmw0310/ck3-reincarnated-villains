l_english:
 # ============================================================================
 # 02. Benito Mussolini — Fascism & Fascist Italy
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 cat_name_italia:0 "Italia"
 bookmark_reincarnated_mussolini:0 "Il Duce Benito Mussolini"
 bookmark_reincarnated_mussolini_subheading:0 "Duce of the Milanese Combat Fasci"
 bookmark_reincarnated_mussolini_desc:0 "Cut down by partisan gunfire in 1945, Benito Mussolini awakened in 867 AD as the young feudal Count of Milan and Brescia, his old political home turf.\n\nWith the Pope entrenched in Rome to the south and Carolingian kings looming to the north, his exaggerated jaw-jutting gestures and bluster about restoring ancient Roman glory already pierce the heavens. Allied once again with Hitler just across the Alps in Innsbruck, can Il Duce become a true Caesar this time instead of a military liability?"
 dynn_Mussolini_867:0 "Mussolini"
 dynn_Mussolini_867_motto:0 "Believe, Obey, Fight!"
 nick_the_duce:0 "the Blackshirt Caesar"
 nick_the_duce_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] styles [Select_CString( CHARACTER.IsLocalPlayer, 'yourself', CHARACTER.GetHerselfHimself )] a new Caesar at the head of the Blackshirts, driving subjects on an endless march toward a reborn Roman Empire."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_mussolini:0 "Duce's Blackshirt Garnache"

 # === [Titles, Polities & Honorifics] ===
 k_fascist_italy:0 "Fascist Italy"
 k_fascist_italy_adj:0 "Fascist Italian"
 d_rep_mussolini:0 "Milanese Combat Fasci"
 d_rep_mussolini_adj:0 "Milanese Fasci"
 e_new_roman_empire:0 "New Roman Empire"
 e_new_roman_empire_adj:0 "New Roman"
 c_nf_mussolini:0 "House of Mussolini"
 c_nf_mussolini_adj:0 "Mussolini"

 # === [Religion, Faith & Holy Sites] ===
 fascism:0 "Fascism"
 fascism_adj:0 "Fascist"
 fascism_adherent:0 "Fascist"
 fascism_adherent_plural:0 "Fascists"
 fascism_desc:0 "A radical ideology fusing Roman imperial revanchism, the symbol of the Fasces, and totalitarian worship of the State. Rejecting individual liberty and pacifism, it preaches absolute obedience to 'Il Duce' and relentless conquest to reclaim the Mediterranean as 'Mare Nostrum'."
 fascism_house_of_worship:0 "Casa del Fascio"
 fascism_house_of_worship_plural:0 "Case del Fascio"
 fascism_religious_symbol:0 "Fasces and Eagle"
 fascism_religious_text:0 "The Doctrine of Fascism"
 fascism_priest_male:0 "Blackshirt Officer"
 fascism_priest_male_plural:0 "Blackshirt Officers"
 fascism_bishop_male:0 "Grand Councilman"
 fascism_bishop_male_plural:0 "Grand Councilmen"
 fascism_religious_head_title:0 "Il Duce"
 fascism_religious_head_title_name:0 "Grand Council of Fascism"
 fascism_ghw_name:0 "Roman Revival War"
 fascism_ghw_name_plural:0 "Roman Revival Wars"
 fascism_high_god_name:0 "the Supreme Being"
 fascism_high_god_name_possessive:0 "the Supreme Being's"
 fascism_high_god_name_alternate:0 "Providence"
 fascism_high_god_name_alternate_possessive:0 "Providence's"
 fascism_war_god_name:0 "Mars"
 fascism_war_god_name_possessive:0 "Mars'"
 fascism_devil_name:0 "Satan"
 fascism_devil_name_possessive:0 "Satan's"
 fascism_devotee:0 "Blackshirt"
 fascism_devotee_plural:0 "Blackshirts"
 fascism_positive_afterlife:0 "Elysium"
 fascism_negative_afterlife:0 "Tartarus"
 holy_site_roma_fascism_name:0 "Rome"
 holy_site_milano_name:0 "Milan"
 holy_site_ravenna_fascism_name:0 "Ravenna"
 holy_site_napoli_fascism_name:0 "Naples"
 holy_site_carthage_fascism_name:0 "Carthage"
 fascism_religion:0 "Fascism"
 fascism_religion_adj:0 "Fascist"
 fascism_religion_adherent:0 "Fascist"
 fascism_religion_adherent_plural:0 "Fascists"
 fascism_religion_desc:0 "A totalitarian ideological tradition exalting the supreme authority of the State under the Roman symbol of the Fasces and pursuing imperial expansion."
 fascism_religion_opinion:0 "$fascism_religion_adherent$ Opinion"
 tenet_state_corporatism_name:0 "State Corporatism"
 tenet_state_corporatism_desc:0 "Divisive factional strife is outlawed as peasants, guild artisans, nobles, and magistrates are bound together within state-chartered syndicates. Strict hierarchy and unified law keep every province firmly under control."
 tenet_state_corporatism_carta_historical_glossary:0 "[Glossary('Carta del Lavoro','tenet_state_corporatism_carta_historical_desc')]"
 tenet_state_corporatism_carta_historical_desc:0 "Corporatist charter outlawing class conflict and binding employers and workers into state-supervised syndicates."
 tenet_state_corporatism_statalismo_historical_glossary:0 "[Glossary('Tutto nello Stato','tenet_state_corporatism_statalismo_historical_desc')]"
 tenet_state_corporatism_statalismo_historical_desc:0 "Totalitarian maxim holding that everything exists within the state, nothing outside the state, and nothing against the state."
 tenet_state_corporatism_historical_glossary:0 "$tenet_state_corporatism_carta_historical_glossary$ / $tenet_state_corporatism_statalismo_historical_glossary$"

 # === [Culture, Traditions & Men-at-Arms] ===
 mussolini_blackshirts_name:0 "Blackshirt Militia"
 blackshirts_militia:0 "Blackshirts"
 blackshirts_militia_flavor:0 "#F Fez-capped, black-shirted Fascist action squads armed with daggers and clubs, recruited partly with prestige and boasting low gold upkeep, swift screening mobility, and farmland dominance.#!"
 tradition_blackshirt_squadrismo_name:0 "Blackshirt Squadrismo"
 tradition_blackshirt_squadrismo_desc:0 "Claiming the mantle of ancient Roman legions and the fasces, black-shirted action squads march swiftly across city and countryside to exalt state prestige and overwhelm foes."
 tradition_blackshirt_squadrismo_only_tt:0 "Must be of Fascist Italian culture or descended from it"
 culture_parameter_unlock_maa_blackshirts_militia:0 "Can recruit [GetMaA('blackshirts_militia').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 councillor_court_chaplain_fascism:0 "Party Secretary"
 councillor_court_chaplain_fascism_possessive:0 "Party Secretary's"
 d_fascism:0 "Grand Council of Fascism"
 d_fascism_adj:0 "Fascist Grand Council"
 artifact_relic_golden_fasces_name:0 "Golden Fasces of the New Roman Consul"
 artifact_relic_golden_fasces_desc:0 "A ceremonial golden bundle of rods and an axe symbolizing the supreme authority of Rome and the unbreakable unity of the totalitarian state."
 artifact_relic_san_sepolcro_manifesto_name:0 "San Sepolcro Founding Manifesto"
 artifact_relic_san_sepolcro_manifesto_desc:0 "The original founding manifesto proclaimed at Piazza San Sepolcro in Milan, revered as the foundational scripture of the Blackshirts."
 artifact_relic_blackshirt_standard_name:0 "Blackshirt Standard of the March on Rome"
 artifact_relic_blackshirt_standard_desc:0 "The black eagle standard of the first Blackshirt legions from Emilia-Romagna that spearheaded the March on Rome."
 artifact_relic_march_on_rome_dagger_name:0 "Consular Dagger of the Naples Congress"
 artifact_relic_march_on_rome_dagger_desc:0 "A ceremonial golden dagger presented by Il Duce at the Naples Fascist Congress on the eve of the March on Rome."
 artifact_relic_mare_nostrum_aquila_name:0 "Bronze Aquila of Mare Nostrum"
 artifact_relic_mare_nostrum_aquila_desc:0 "A bronze Roman legionary eagle cast to commemorate the subjugation of Carthage and the reclamation of the Mediterranean as Our Sea."
 mussolini_march_on_rome_decision:0 "March on Rome & Proclaim Fascist Italy"
 mussolini_march_on_rome_decision_desc:0 "The Blackshirts' flame ignited in Milan now shakes all of northern Italy! Like Caesar crossing the Rubicon, we shall proclaim Fascist Italy beneath Il Duce's banner and march onward toward Eternal Rome!"
 mussolini_march_on_rome_decision_tooltip:0 "Found 'Fascist Italy' and proclaim the Mussolini dynasty's totalitarian order."
 mussolini_march_on_rome_decision_confirm:0 "All roads lead to Rome once more!"
 mussolini_new_roman_order_dynasty_modifier:0 "Duce of the New Roman Order"
 mussolini_new_roman_order_dynasty_modifier_desc:0 "Having established Fascist Italy, this dynasty claims the mantle of Eternal Rome, bestowing immense prestige and legitimacy upon its members."
 mussolini_roman_legions_name:0 "Duce's Blackshirt Legions"
 mussolini_restore_mare_nostrum_empire_decision:0 "Mare Nostrum & Restore the New Roman Empire"
 mussolini_restore_mare_nostrum_empire_decision_desc:0 "Our legions have marched from Milan through Eternal Rome and Naples, crossing the sea to conquer Carthage itself! The empire of Augustus and Trajan is reborn under the Fascist banner, and the Mediterranean is once again Mare Nostrum!"
 mussolini_restore_mare_nostrum_empire_decision_tooltip:0 "Found the 'New Roman Empire', make Rome your imperial capital, and reclaim dominion over Mare Nostrum."
 mussolini_restore_mare_nostrum_empire_decision_confirm:0 "The Roman Empire is reborn today!"
 mussolini_mare_nostrum_empire_dynasty_modifier:0 "Emperors of Mare Nostrum"
 mussolini_mare_nostrum_empire_dynasty_modifier_desc:0 "Having restored the New Roman Empire across Italy and Carthage, this dynasty commands unyielding legionary toughness, damage, and imperial legitimacy."
 mussolini_eternal_imperial_rome_county_modifier:0 "Eternal Imperial Capital of Rome"
 mussolini_eternal_imperial_rome_county_modifier_desc:0 "Rebuilt as the gleaming heart of the New Roman Empire, Eternal Rome radiates wealth, development, and absolute order."
 mussolini_praetorian_cohort_name:0 "New Roman Praetorian Cohorts"
 axis_mass_agitation_decision_mussolini_title:0 "Piazza Balcony Mass Agitation Speech"
 axis_mass_agitation_decision_mussolini_desc:0 "A roaring crowd fills the piazza below the palace balcony, chanting for Il Duce! With bold gestures and fiery rhetoric proclaiming the glory of New Rome, we shall electrify the populace, tighten our grip on the capital, and muster Blackshirt volunteers!"
 axis_mass_agitation_decision_mussolini_confirm:0 "Believe, Obey, Fight!"
 artifact_mussolini_chin_angle_mirror_name:0 "Duce's Forty-Five-Degree Chin Practice Mirror"
 artifact_mussolini_chin_angle_mirror_desc:0 "A brass-rimmed hand mirror consulted before every balcony speech to verify that folded arms and an upturned chin hit a heroic forty-five-degree angle. Its theatrical swagger thrills Blackshirt knights even if vanity occasionally distracts from actual defensive command."
 mussolini_chin_angle_mirror_modifier:0 "Duce's Forty-Five-Degree Chin Practice Mirror"
 axis_mass_agitation_mussolini_event_preview_tt:0 "Opens the Piazza Balcony Rally event, letting you choose between a [diplomacy|E] speech, a [learning|E] and [intrigue|E] Roman pageant, or a safe march"
 villains_religious_decision.0020.t:0 "The New Caesar Upon the Balcony"
 villains_religious_decision.0020.desc:0 "Beneath the marble balcony stretches a boundless tide of black shirts, their rhythmic chants hammering the walls like echoes of an ancient amphitheater. Thrusting my chin high toward the clouds with hands planted firmly on my hips, I survey the crowd.\n\nShall I unleash thunderous oratory to set Italian blood boiling, or dazzle their eyes with a grand pageant worthy of imperial Rome?"
 villains_religious_decision.0020.a:0 "Cross my arms and bellow the rebirth of Imperial Rome!"
 villains_religious_decision.0020.a.success:0 "Fiery rhetoric drives ecstatic citizens into the Blackshirts"
 villains_religious_decision.0020.a.failure:0 "Overblown gestures spark whispers of buffoonery across the piazza"
 villains_religious_decision.0020.b:0 "Stage an imperial triumph complete with eagle standards and arches."
 villains_religious_decision.0020.b.success:0 "Majestic Roman pageantry captivates scholars and commoners alike"
 villains_religious_decision.0020.b.failure:0 "Flimsy wooden props collapse into an expensive embarrassment"
 villains_religious_decision.0020.c:0 "Content myself with an orderly parade of the Blackshirt cohorts."
 mussolini_battle_for_grain_and_marshes_decision:0 "Battle for Grain and Punctual Courier Propaganda"
 mussolini_battle_for_grain_and_marshes_decision_desc:0 "The New Roman proves his worth not in idle parlor chatter, but through sweat, golden wheat, and iron discipline! Stride into the sun-drenched harvest fields bare-chested to swing the reaping sickle before cheering peasants, drain the pestilent marshes, and enforce stone-paved courier schedules so every carriage in the realm arrives strictly on time."
 mussolini_battle_for_grain_and_marshes_decision_tooltip:0 "Take to the golden harvest fields for an event testing Prowess and Diplomacy in a shirtless reaping spectacle or Stewardship and Learning in road and marsh works."
 mussolini_battle_for_grain_and_marshes_decision_confirm:0 "Hoist the Sickle and Wheat Sheaf!"
 mussolini_battle_for_grain_event_preview_tt:0 "Choose between a #V Prowess and Diplomacy#! shirtless harvest stunt, a #V Stewardship and Learning#! marsh drainage and punctual road drive, or a safe harvest parade"
 villains_religious_decision.0150.t:0 "Iron Muscle in the Wheat Field and Carriages Running on Time"
 villains_religious_decision.0150.desc:0 "Blazing Italian sunlight bathes the golden wheat fields and the weathered arches of an ancient Roman stone aqueduct in the distance. Straw-hatted peasant farmers crowd around in eager anticipation while a court chronicler readies quill and parchment on a wooden stool to immortalize my heroic posture.\n\nCasting aside my tunic and jutting my chin toward the clouds, I grip a curved iron reaping sickle. Shall I charge into the sun-scorched grain bare-chested to prove the tireless vigor of the New Roman Man, or crack the whip over marsh drainage and stone courier stations until every wagon runs strictly on schedule?"
 villains_religious_decision.0150.a:0 "Reap the wheat bare-chested under the blazing sun and hoist the golden sheaf!"
 villains_religious_decision.0150.a.success:0 "Heroic Bare-Chested Harvest Sends Peasants into Rapture"
 villains_religious_decision.0150.a.failure:0 "Overzealous Reaping Ends in Sunstroke and Back Spasms"
 villains_religious_decision.0150.b:0 "Drain the marshes and enforce stone-road schedules so every carriage runs on time!"
 villains_religious_decision.0150.b.success:0 "Reclaimed Marshes and Punctual Couriers Boost Prosperity"
 villains_religious_decision.0150.b.failure:0 "Hasty Embankments Collapse and Bog Down the Couriers"
 villains_religious_decision.0150.c:0 "Don a wheat-ear wreath and have the scribes sketch a heroic harvest portrait."
 mussolini_shirtless_harvester_modifier:0 "Bare-Chested Harvester of Rome"
 mussolini_shirtless_harvester_modifier_desc:0 "Wielding a reaping sickle alongside peasant farmers under the blazing sun has won popular acclaim and vigor."
 mussolini_carriages_on_time_modifier:0 "Couriers Running Strictly on Time"
 mussolini_carriages_on_time_modifier_desc:0 "Reclaimed marshes and ironclad road discipline keep armies and tax couriers moving right on schedule."
 mussolini_sunstroke_fiasco_modifier:0 "Harvest Sunstroke Embarrassment"
 mussolini_sunstroke_fiasco_modifier_desc:0 "Collapsing from heat exhaustion during a theatrical harvest stunt has sapped both health and bravado."
 mussolini_bogged_down_public_works_modifier:0 "Bogged-Down Showcase Works"
 mussolini_bogged_down_public_works_modifier_desc:0 "Rushed embankments built for show have collapsed into mud, hampering local trade and tax collection."
 fascist_italian:0 "Fascist Italian"
 fascist_italian_prefix:0 "Fascist Italian"
 fascist_italian_collective_noun:0 "Fascist Italians"
