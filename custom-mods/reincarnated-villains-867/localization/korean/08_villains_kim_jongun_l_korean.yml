 kim_storm_corps_name:0 "조선인민군 폭풍군단"
 kpa_storm_corps:0 "폭풍군단 경보병"
 kpa_storm_corps_flavor:0 "#F 최고사령관의 명령 아래 험준한 설산과 요새 성벽을 은밀히 타격하는 백두산 줄기의 최정예 산악 침투 경보병입니다. 일반 경보병을 웃도는 공방 능력과 공성 돌파력, 산악·설원 전투력을 겸비하고 있습니다.#!"
 kim_supreme_guard_command_name:0 "최고사령부 호위총국 결사대"
 kim_strategic_rocket_guard_corps_name:0 "전략군 붉은기 근위군단"
 tradition_songun_fortress_name:0 "선군 요새 국가"
 tradition_songun_fortress_desc:0 "온 나라의 산악을 난공불락의 요새로 다지고 속도전과 총동원으로 군사·산업 시설을 초고속 건설하는 선군 계획경제 체제입니다. 침략자는 폭풍군단의 매복에 직면하지만, 가혹한 자원 동원과 배급 병목으로 인해 민생 경제 개발과 영지민의 불만이라는 고난의 행군을 감내해야 합니다."
