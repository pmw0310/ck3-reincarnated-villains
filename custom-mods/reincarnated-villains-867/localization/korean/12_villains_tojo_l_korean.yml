 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 Hideki:0 "히데키"
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_tojo:0 "총리대신의 국방색 다이몬"
 bookmark_reincarnated_tojo:0 "'면도날' 도조 히데키"
 bookmark_reincarnated_tojo_subheading:0 "대정익찬 총괄부의 내각총리대신"
 bookmark_reincarnated_tojo_desc:0 "총리대신과 육군대신, 내무대신, 군수대신에 참모총장까지 온갖 감투를 혼자 독식하고 새벽마다 백성들의 골목 쓰레기통을 뒤지며 전시 배급 기강을 잡던 관료 독재자 도조 히데키는, 서기 867년 간토 도쿄만의 무사시와 사가미를 다스리는 젊은 총령으로 눈을 떴습니다.\n\n교토 조정의 후지와라 섭정 가문이 천하를 좌지우지하는 헤이안 시대 한복판이지만, 둥근 대모테 안경 너머로 깨알 같은 메모 수첩을 적으며 모든 전패를 '전진적 전선 이동'이라 우기는 그의 대본영 서류 행정이 멈출 리 없습니다! 과연 면도날 총리는 간토 무사단을 총동원해 교토의 관백 정치를 갈아엎고 대일본 제국을 선포할 수 있을까요?"
 dynn_Tojo_867:0 "도조"
 dynn_Tojo_867_motto:0 "메모하고, 겸직하고, 통제하라!"
 nick_the_razor_premier:0 "면도날 총리"
 nick_the_razor_premier_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 온갖 관직을 혼자 겸직한 채 새벽마다 남의 집 부엌 쓰레기통까지 직접 뒤져 보아야 직성이 풀리는 지독한 서류 중독자이자 '면도날 총리'입니다."

