 d_rep_mussolini_adj:0 "밀라노 파쇼"
 e_new_roman_empire:0 "신로마 제국"
 e_new_roman_empire_adj:0 "신로마 제국"
 c_nf_mussolini:0 "무솔리니 가문"
 c_nf_mussolini_adj:0 "무솔리니"

 # === [종교 · 성지 · 신앙] ===
 fascism:0 "파시즘"
 fascism_adj:0 "파시즘"
 fascism_adherent:0 "파시스트"
 fascism_adherent_plural:0 "파시스트"
 fascism_desc:0 "고대 로마 제국의 영광에 대한 향수와 결속을 상징하는 속간의 교리, 그리고 '국가가 곧 전부'라는 전체주의적 국가 숭배를 결합한 급진적 사상입니다. 개인의 자유와 나약한 평화주의를 배격하며, 오직 '두체'의 절대적 지도 아래 지중해를 다시 '우리의 바다'로 만드는 정복 전쟁만이 국가의 위대함을 증명한다고 설파합니다."
 fascism_house_of_worship:0 "파쇼 당사"
 fascism_house_of_worship_plural:0 "파쇼 당사"
 fascism_religious_symbol:0 "속간과 독수리"
 fascism_religious_text:0 "파시즘의 교리"
 fascism_priest_male:0 "검은셔츠단 간부"
 fascism_priest_male_plural:0 "검은셔츠단 간부"
 fascism_bishop_male:0 "파시즘 대평의원"
 fascism_bishop_male_plural:0 "파시즘 대평의원"
 fascism_religious_head_title:0 "두체"
 fascism_religious_head_title_name:0 "파시즘 대평의회"
 fascism_ghw_name:0 "로마 부흥 성전"
 fascism_ghw_name_plural:0 "로마 부흥 성전"
 fascism_high_god_name:0 "지존자"
 fascism_high_god_name_possessive:0 "지존자의"
 fascism_high_god_name_alternate:0 "섭리"
 fascism_high_god_name_alternate_possessive:0 "섭리의"
 fascism_war_god_name:0 "마르스"
 fascism_war_god_name_possessive:0 "마르스의"
 fascism_devil_name:0 "사탄"
 fascism_devil_name_possessive:0 "사탄의"
 fascism_devotee:0 "검은셔츠단원"
 fascism_devotee_plural:0 "검은셔츠단원"
 fascism_positive_afterlife:0 "엘리시움"
 fascism_negative_afterlife:0 "타르타로스"
 holy_site_roma_fascism_name:0 "로마"
 holy_site_milano_name:0 "밀라노"
 holy_site_ravenna_fascism_name:0 "라벤나"
 holy_site_napoli_fascism_name:0 "나폴리"
 holy_site_carthage_fascism_name:0 "카르타고"
 fascism_religion:0 "파시즘"
 fascism_religion_adj:0 "파시즘"
 fascism_religion_adherent:0 "파시스트"
 fascism_religion_adherent_plural:0 "파시스트"
 fascism_religion_desc:0 "고대 로마 제국의 권위와 결속을 상징하는 속간의 이념 아래 국가를 절대적 가치로 숭배하고 대외 팽창을 추구하는 전체주의 사상 체계입니다."
 fascism_religion_opinion:0 "$fascism_religion_adherent$의 의견"
 tenet_state_corporatism_name:0 "국가 조합주의"
 tenet_state_corporatism_desc:0 "계급과 파벌의 분열적인 다툼을 금하고 농민과 장인, 귀족과 관료를 국가가 공인한 직능 기구 아래 강제로 결속시킵니다. 엄정한 규율과 일원화된 법질서 아래 영지의 통제력과 세수는 흔들림 없이 유지됩니다."
 tenet_state_corporatism_carta_historical_glossary:0 "[Glossary('노동헌장','tenet_state_corporatism_carta_historical_desc')]"
 tenet_state_corporatism_carta_historical_desc:0 "계급투쟁을 금지하고 고용주와 노동자를 국가가 통제하는 직능별 조합 기구로 묶어 국익에 종속시킨 조합주의 강령입니다."
 tenet_state_corporatism_statalismo_historical_glossary:0 "[Glossary('국가 지상주의','tenet_state_corporatism_statalismo_historical_desc')]"
 tenet_state_corporatism_statalismo_historical_desc:0 "모든 것은 국가 안에 있고 국가 밖에는 아무것도 없으며 국가에 반하는 것은 허용되지 않는다는 전체주의 국가관입니다."
 tenet_state_corporatism_historical_glossary:0 "$tenet_state_corporatism_carta_historical_glossary$ / $tenet_state_corporatism_statalismo_historical_glossary$"

 # === [문화 · 전통 · 고유 무장병] ===
 mussolini_blackshirts_name:0 "검은셔츠단 의용대"
 blackshirts_militia:0 "검은셔츠단"
 blackshirts_militia_flavor:0 "#F 검은 페즈모와 검은 셔츠를 착용하고 단검과 곤봉으로 행군하는 파시스트 준군사 행동대입니다. 위신으로 모병되며 저렴한 금화 유지비와 빼어난 엄호 기동력으로 농지와 구릉지를 제압합니다.#!"
 tradition_blackshirt_squadrismo_name:0 "검은셔츠단 행동주의"
 tradition_blackshirt_squadrismo_desc:0 "고대 로마 군단의 속간 정신을 계승했다고 자처하는 검은 셔츠 결사대가 열렬한 행군과 선동으로 국가의 위신을 드높이며 상시 전장에 투입됩니다."
 tradition_blackshirt_squadrismo_only_tt:0 "이탈리아 파쇼 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_blackshirts_militia:0 "[GetMaA('blackshirts_militia').GetName](을)를 [men_at_arms|E]으로 모병 가능"

 # === [고유 결단 · 이벤트 · 변화요소 · 성물] ===
 councillor_court_chaplain_fascism:0 "당 서기장"
 councillor_court_chaplain_fascism_possessive:0 "당 서기장의"
 d_fascism:0 "파시즘 대평의회"
 d_fascism_adj:0 "파시즘 대평의회"
 artifact_relic_golden_fasces_name:0 "신로마 집정관의 황금 속간"
 artifact_relic_golden_fasces_desc:0 "고대 로마 집정관의 권위와 파시스트 국가의 절대적인 단결을 상징하는 황금 결속 도끼입니다. 하나하나의 나뭇가지는 부러지기 쉬우나 하나로 묶인 다발은 결코 꺾이지 않는다는 전체주의 결속의 이념이 깃들어 있습니다."
 artifact_relic_san_sepolcro_manifesto_name:0 "산 세폴크로 창립 강령 원고"
 artifact_relic_san_sepolcro_manifesto_desc:0 "밀라노 산 세폴크로 광장에서 이탈리아 전투 파쇼의 창설을 선포하며 낭독된 파시즘 최초의 강령 원고입니다. 검은셔츠단 대원들의 서약이 적힌 이 문서는 파시스트 운동의 출발점으로 추앙받습니다."
 artifact_relic_blackshirt_standard_name:0 "로마 진군 검은셔츠단 군기"
 artifact_relic_blackshirt_standard_desc:0 "에밀리아로마냐에서 결집해 로마 진군의 선봉에 섰던 검은셔츠단 제1군단의 검은 독수리 군기입니다. 금실로 수놓인 속간과 해골 문양은 타협 없는 진격을 상징합니다."
 artifact_relic_march_on_rome_dagger_name:0 "나폴리 대집회 집정관 단검"
 artifact_relic_march_on_rome_dagger_desc:0 "로마 진군 직전 나폴리 전당대회에서 두체가 검은셔츠단 사령관들에게 하사하며 권력 장악을 결의한 의식용 황금 단검입니다."
 artifact_relic_mare_nostrum_aquila_name:0 "마레 노스트룸의 청동 독수리상"
 artifact_relic_mare_nostrum_aquila_desc:0 "고대 로마가 카르타고를 굴복시키고 지중해를 우리의 바다로 삼았던 영광을 기리며 주조된 군단 독수리 성물입니다."
 mussolini_march_on_rome_decision:0 "로마 진군과 파시스트 이탈리아 선포"
 mussolini_march_on_rome_decision_desc:0 "밀라노에서 타오른 검은셔츠단의 불길이 마침내 북이탈리아 전역을 집어삼켰습니다! 고대 로마의 카이사르가 루비콘강을 건넜듯, 이제 두체의 깃발 아래 '파시스트 이탈리아'의 탄생을 선포하고 영원한 도시 로마를 향한 대진군을 완수할 때입니다."
 mussolini_march_on_rome_decision_tooltip:0 "'파시스트 이탈리아'를 창설하고 무솔리니 가문의 전체주의 신질서를 선포합니다."
 mussolini_march_on_rome_decision_confirm:0 "모든 길은 다시 로마로 통한다!"
 mussolini_new_roman_order_dynasty_modifier:0 "신로마 질서의 두체 가문"
 mussolini_new_roman_order_dynasty_modifier_desc:0 "이 가문은 파시스트 이탈리아를 수립하고 고대 로마의 영광을 계승했음을 선포하여, 모든 가문원이 막대한 위신과 정통성을 누립니다."
 mussolini_roman_legions_name:0 "두체 근위 검은셔츠 군단"
 mussolini_restore_mare_nostrum_empire_decision:0 "마레 노스트룸과 신로마 제국 복원"
 mussolini_restore_mare_nostrum_empire_decision_desc:0 "밀라노에서 시작된 행군이 영원한 도시 로마와 나폴리를 넘어 마침내 바다 건너 카르타고까지 정복했습니다! 아우구스투스와 트라야누스의 옛 제국이 오늘 검은 깃발 아래 부활했으니, 지중해는 다시금 우리의 호수 '마레 노스트룸'이 되었습니다!"
 mussolini_restore_mare_nostrum_empire_decision_tooltip:0 "'신로마 제국'을 복원하고 로마를 제국의 수도로 삼아 지중해 패권을 천명합니다."
 mussolini_restore_mare_nostrum_empire_decision_confirm:0 "로마 제국이 오늘 다시 태어났다!"
 mussolini_mare_nostrum_empire_dynasty_modifier:0 "마레 노스트룸의 황제"
 mussolini_mare_nostrum_empire_dynasty_modifier_desc:0 "이 가문은 로마와 카르타고를 아우르는 신로마 제국을 복원하여, 불굴의 군단 전투력과 제국의 정통성을 영구히 누립니다."
 mussolini_eternal_imperial_rome_county_modifier:0 "영원한 제국의 수도 로마"
 mussolini_eternal_imperial_rome_county_modifier_desc:0 "신로마 제국의 심장으로 다시금 화려하게 재건된 영원한 도시 로마는 막대한 부와 통제력을 뿜어냅니다."
 mussolini_praetorian_cohort_name:0 "신로마 프라이토리아니 근위군단"
 axis_mass_agitation_decision_mussolini_title:0 "광장 발코니 대중 선동 연설"
 axis_mass_agitation_decision_mussolini_desc:0 "궁전 발코니 아래 운집한 인파가 두체의 등장을 연호하고 있습니다! 팔짱을 끼고 턱을 치켜든 특유의 과장된 몸짓과 불타는 웅변으로 로마의 영광을 부르짖어, 군중을 열광시키고 검은셔츠단 의용대를 거리로 불러 모으겠습니다!"
 axis_mass_agitation_decision_mussolini_confirm:0 "믿으라, 복종하라, 그리고 싸우라!"
 artifact_mussolini_chin_angle_mirror_name:0 "두체의 45도 턱선 연습용 손거울"
 artifact_mussolini_chin_angle_mirror_desc:0 "발코니 연설에 나서기 전 팔짱을 끼고 턱을 정확히 사십오 도로 치켜들었을 때 가장 위엄 있어 보이는 각도를 점검하던 황동 테두리 손거울입니다. 우스꽝스러울 만큼 당당한 포즈로 기사단과 봉신들의 사기를 북돋아 주지만, 거울 속 허세에 취해 실제 방어전 지휘는 종종 뒷전이 되곤 합니다."
 mussolini_chin_angle_mirror_modifier:0 "두체의 45도 턱선 연습용 손거울"
 axis_mass_agitation_mussolini_event_preview_tt:0 "광장 발코니 집회 이벤트가 열리며 [diplomacy|E] 사자후 연설, [learning|E] 및 [intrigue|E] 개선식 연출, 또는 안전한 행진 독려 중 하나를 선택합니다"
 villains_religious_decision.0020.t:0 "발코니 위의 새로운 카이사르"
 villains_religious_decision.0020.desc:0 "대리석 발코니 아래로 검은 셔츠의 물결이 끝없이 펼쳐지고, 나를 연호하는 함성이 고대 원형경기장의 메아리처럼 성벽을 때린다. 나는 턱을 한껏 치켜들고 양팔을 허리에 얹은 채 군중을 내려다보았다.\n\n이탈리아의 뜨거운 피를 끓어오르게 할 불멸의 웅변을 선보일 것인가, 아니면 고대 로마의 개선식을 재현한 장엄한 볼거리로 그들의 눈을 홀릴 것인가?"
 villains_religious_decision.0020.a:0 "팔짱을 끼고 우렁찬 사자후로 로마의 부활을 선언한다!"
 villains_religious_decision.0020.a.success:0 "불타는 웅변에 열광한 시민들이 앞다투어 검은셔츠단에 자원함"
 villains_religious_decision.0020.a.failure:0 "과장된 몸짓이 광대극 같다는 수군거림이 광장에 퍼짐"
 villains_religious_decision.0020.b:0 "독수리 군기와 개선 아치를 앞세운 제국 재건 연극을 연출한다."
 villains_religious_decision.0020.b.success:0 "장엄한 고대 로마의 재현이 지식인과 평민 모두를 매료시킴"
 villains_religious_decision.0020.b.failure:0 "어설픈 나무 무대 장치가 무너지며 값비싼 웃음거리가 됨"
 villains_religious_decision.0020.c:0 "검은셔츠단 대열의 절도 있는 시가 행진만 독려한다."
 mussolini_battle_for_grain_and_marshes_decision:0 "밀 증산 대전투와 정시 역참 개간 선전전"
 mussolini_battle_for_grain_and_marshes_decision_desc:0 "새롭게 태어난 로마인은 나약한 탁상공론 대신 대지와 땀방울, 그리고 한 치의 오차도 없는 규율로 증명됩니다! 황금빛으로 익어가는 밀밭 한복판에 직접 뛰어들어 상반신을 드러낸 채 큰낫을 휘두르며 강철 같은 지도자의 육체를 백성들에게 각인시키고, 늪지대 배수로 개간과 석조 역참 가도 정비를 강행하여 우리 영지의 모든 파발 마차가 정시에 도착하게 만드십시오."
 mussolini_battle_for_grain_and_marshes_decision_tooltip:0 "황금 밀밭 현장에 직접 나서 기량·외교력 상의 탈의 수확 시범이나 관리력·학식 역참 개간 판정을 진행하는 전용 이벤트를 시작합니다."
 mussolini_battle_for_grain_and_marshes_decision_confirm:0 "큰낫과 밀단을 높이 들어라!"
 mussolini_battle_for_grain_event_preview_tt:0 "수확 현장에서 #V 기량·외교력#! 상의 탈의 낫질 시범, #V 관리력·학식#! 늪지 개간 및 정시 역참 정비, 또는 안전한 풍년 찬가 편찬 중 하나를 진행합니다"
 villains_religious_decision.0150.t:0 "황금 밀밭의 강철 육체와 정시에 달리는 역참 마차"
 villains_religious_decision.0150.desc:0 "뜨거운 이탈리아의 태양이 황금빛으로 물든 밀밭과 저 멀리 고대 로마의 석조 수도교를 눈부시게 비추고 있다. 밀짚모자를 쓴 농부들이 구름처럼 몰려든 가운데, 궁정 서기는 양피지와 깃펜을 들고 나의 가장 영웅적인 순간을 화폭에 담을 준비를 마쳤다.\n\n나는 겉옷을 과감히 벗어 던지고 턱을 당당히 치켜든 채 잘 벼려진 무쇠 큰낫을 거머쥐었다. 뙤약볕 아래 직접 밀단을 베어 넘기며 강철 같은 신로마인의 기상을 만백성 앞에 과시할 것인가, 아니면 늪지대 간척과 로마 가도 역참 규율을 매섭게 다그쳐 단 한 대의 파발 마차도 늦지 않는 완벽한 행정을 증명할 것인가?"
 villains_religious_decision.0150.a:0 "상반신을 드러내고 뙤약볕 아래 직접 큰낫을 휘둘러 밀단을 높이 치켜든다!"
 villains_religious_decision.0150.a.success:0 "강철 같은 수확 시범에 농민들의 환호성이 들판을 뒤흔듦"
 villains_religious_decision.0150.a.failure:0 "성급하게 낫질을 몰아치다 일사병과 요통으로 밀밭에 주저앉음"
 villains_religious_decision.0150.b:0 "늪지대 배수로 개간과 석조 가도 규율을 강행해 모든 마차를 정시에 달리게 한다!"
 villains_religious_decision.0150.b.success:0 "개간된 농지와 정시 운행 역참망으로 물류와 세수가 급증함"
 villains_religious_decision.0150.b.failure:0 "날림으로 쌓은 제방이 무너지고 역참 마차들이 진흙탕에 고립됨"
 villains_religious_decision.0150.c:0 "밀 이삭 화관을 머리에 쓰고 서기들에게 영웅적인 풍년 화보만 그리게 한다."
 mussolini_shirtless_harvester_modifier:0 "밀밭의 강철 수확자"
 mussolini_shirtless_harvester_modifier_desc:0 "뙤약볕 아래 농민들과 함께 큰낫을 휘두른 지도자의 활력이 백성들의 열광적인 지지를 이끌어냈습니다."
 mussolini_carriages_on_time_modifier:0 "정시에 도착하는 역참 마차"
 mussolini_carriages_on_time_modifier_desc:0 "늪지 개간과 엄격한 로마 가도 역참 규율 덕분에 군대와 물자 수송이 한 치의 지체도 없이 이루어집니다."
 mussolini_sunstroke_fiasco_modifier:0 "밀밭의 일사병 추태"
 mussolini_sunstroke_fiasco_modifier_desc:0 "무리한 상의 탈의 수확 시범 도중 더위를 먹고 쓰러진 소문이 퍼져 체면과 기력이 모두 깎였습니다."
 mussolini_bogged_down_public_works_modifier:0 "진흙탕에 빠진 전시 토목"
 mussolini_bogged_down_public_works_modifier_desc:0 "선전에만 급급해 날림으로 강행한 배수로와 가도가 무너지며 오히려 영지 통행과 세수가 악화되었습니다."
 fascist_italian:0 "이탈리아 파쇼"
 fascist_italian_prefix:0 "파쇼 이탈리아계"
 fascist_italian_collective_noun:0 "파쇼 이탈리아인"
