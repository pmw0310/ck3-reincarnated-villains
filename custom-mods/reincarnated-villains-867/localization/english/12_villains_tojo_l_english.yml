 # === [Culture, Traditions & Men-at-Arms] ===
 imperial_japanese:0 "Imperial Japanese"
 imperial_japanese_prefix:0 "Imperial Japanese"
 imperial_japanese_collective_noun:0 "Imperial Subjects"
 tradition_imperial_rule_assistance_name:0 "Imperial Rule Assistance Bureaucracy"
 tradition_imperial_rule_assistance_desc:0 "Binding every province into a rigid grid of neighborhood associations, ration ledgers, and military police checkpoints, this bureaucratic martial culture enforces iron public order and relentless tax collection."
 tradition_imperial_rule_assistance_only_tt:0 "Must be of Imperial Japanese culture or descended from it"
