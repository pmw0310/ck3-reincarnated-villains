 trump_youre_fired_authority_modifier:0 "가차 없는 해고자의 권위"
 trump_youre_fired_authority_modifier_desc:0 "무능한 가신을 만좌의 앞에서 공개 해고한 본보기가 궁정 전체에 긴장감과 승자의 카리스마를 불어넣었습니다."
 trump_bad_deal_humiliation_modifier:0 "망신스러운 졸속 협상"
