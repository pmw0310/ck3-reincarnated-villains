 americanism_adj:0 "아메리카니즘"
 americanism_adherent:0 "애국자"
 americanism_adherent_plural:0 "애국자"
 americanism_desc:0 "천 년 뒤 신대륙 초강대국의 건국 신화와 자본주의적 황금 숭배, 그리고 '거래의 기술'을 결합한 독창적 사상입니다. 청빈과 겸손을 패배자의 덕목으로 치부하며, 오직 막대한 부의 축적과 타 세력에 대한 고율의 관세 부과, 그리고 거대한 방벽 너머로의 힘에 의한 평화만이 축복을 증명하는 길이라 설파합니다."
