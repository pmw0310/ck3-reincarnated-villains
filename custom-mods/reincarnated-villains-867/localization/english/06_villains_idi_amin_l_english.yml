 # === [Religion, Faith & Holy Sites] ===
 aminism:0 "Aminism"
 aminism_adj:0 "Aminite"
 aminism_adherent:0 "Aminite"
 aminism_adherent_plural:0 "Aminites"
 aminism_desc:0 "An unorthodox Islamic warlord creed claiming direct dream revelations from Allah while exalting the absolute power of His Excellency the President for Life, 'Lord of All the Beasts of the Earth and Fishes of the Sea'. It preaches that chestfuls of medals and overwhelming brute force are divine providence, and that traitors belong in the jaws of Nile crocodiles or upon the sacrificial banquet table."
 aminism_house_of_worship:0 "Field Marshal Command Hall"
 aminism_house_of_worship_plural:0 "Field Marshal Command Halls"
 aminism_religious_symbol:0 "the Marshal's Star and Crescent"
 aminism_religious_text:0 "Decrees of the President for Life"
 aminism_priest_male:0 "State Research Agent"
 aminism_priest_male_plural:0 "State Research Agents"
 aminism_priest_female:0 "State Research Agent"
 aminism_priest_female_plural:0 "State Research Agents"
