 # === [북마크 · 인물 · 가문 · 별명 · 외형] ===
 Idi:0 "이디"
 bookmark_reincarnated_idi_amin:0 "'스코틀랜드의 마지막 왕' 이디 아민"
 bookmark_reincarnated_idi_amin_subheading:0 "나일 최고군정청의 종신 대통령"
 bookmark_reincarnated_idi_amin_desc:0 "우간다의 종신 대통령이자 스스로에게 '스코틀랜드의 마지막 왕', '대영제국의 정복자' 등 온갖 황당무계한 칭호를 수여했던 검은 거인 이디 아민 다다는, 서기 867년 나일강 상류의 파주글리와 센나르 성채를 틀어쥔 무슬림 군벌 독재자로 눈을 떴습니다.\n\n비록 훈장으로 도배된 원수 제복도, 정복했다고 자랑할 대영제국도 아직 존재하지 않는 천 년 전의 아프리카지만, 헤비급 복싱 챔피언 출신의 압도적인 무력과 적산을 몰수해 측근들에게 나눠 주는 패거리 공포 정치는 중세 전장에서 오히려 물 만난 고기나 다름없습니다! 나일강의 악어들에게 정적을 던져 주며 폭군으로 군림한 그가, 과연 아프리카를 평정하고 바다 건너 진짜 스코틀랜드 왕관까지 손에 넣을 수 있을까요?"
 dynn_Amin_867:0 "아민"
 dynn_Amin_867_motto:0 "지상의 모든 짐승과 바다의 모든 물고기의 주인!"
 nick_last_king_of_scotland:0 "스코틀랜드의 마지막 왕"
 nick_last_king_of_scotland_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 스코틀랜드 땅을 단 한 번도 밟아본 적이 없으면서도 타탄 체크 치마와 백파이프 군악대에 심취해 스스로를 '스코틀랜드의 마지막 왕'이라 참칭하고 스코틀랜드 왕위의 정당한 주인이라 우기는 과대망상적 군벌 독재자입니다."
 nick_conqueror_of_british_empire:0 "대영제국의 정복자"
 nick_conqueror_of_british_empire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 스스로를 '지상의 모든 짐승과 바다의 모든 물고기의 주인'이자 '스코틀랜드의 마지막 왕', '대영제국의 정복자'라 칭하는 과대망상적 군벌 독재자입니다."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_idi_amin:0 "종신대통령의 원수 군복"

