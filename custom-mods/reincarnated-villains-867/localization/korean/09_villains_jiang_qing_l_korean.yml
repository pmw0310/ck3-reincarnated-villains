 jiang_central_cultural_revolution_army_name:0 "중앙문혁소조 친위 홍위병군"
 zaofan_chinese:0 "프롤레타리아 한족"
 zaofan_chinese_prefix:0 "프롤레타리아 한족계"
 zaofan_chinese_collective_noun:0 "프롤레타리아 한족"
 tradition_rebel_headquarters_name:0 "조반파 혁명 사령부"
 tradition_rebel_headquarters_desc:0 "조반유리의 기치 아래 붉은 완장을 찬 청년 조반파들이 구습과 반대파를 거침없이 타도하며, 끝없는 대중 집회와 사상 투쟁으로 영지를 장악합니다."
 tradition_rebel_headquarters_only_tt:0 "프롤레타리아 한족 문화이거나 그 후예 문화여야 함"
