 # === [Culture, Traditions & Men-at-Arms] ===
 stalin_red_guards_name:0 "Bolshevik Red Guards"
 red_guards:0 "Red Guards"
 red_guards_flavor:0 "#F Armed factory workers and party detachments wearing red armbands, fielding very cheap maintenance, rugged toughness, and unyielding winter and taiga endurance.#!"
 stalin_shock_worker_brigade_name:0 "Stakhanovite Shock-Worker Brigade"
 soviet:0 "Soviet"
 soviet_prefix:0 "Soviet"
 soviet_collective_noun:0 "Soviet People"
 tradition_bolshevik_vanguard_name:0 "Bolshevik Red Vanguard"
 tradition_bolshevik_vanguard_desc:0 "Bound by the iron discipline of the Central Committee, workers and peasants mobilize at breakneck speed to build fortifications, replenish levies, and field Red Guard detachments."
 tradition_bolshevik_vanguard_only_tt:0 "Must be of Soviet culture or descended from it"
 culture_parameter_unlock_maa_red_guards:0 "Can recruit [GetMaA('red_guards').GetName] as [men_at_arms|E]"

 # === [Decisions, Events, Modifiers & Relics] ===
 councillor_court_chaplain_bolshevism:0 "Political Commissar"
 councillor_court_chaplain_bolshevism_possessive:0 "Political Commissar's"
 d_bolshevism:0 "Comintern Executive"
 d_bolshevism_adj:0 "Comintern"
 artifact_relic_kremlin_red_star_name:0 "Red Ruby Star of the Kremlin"
 artifact_relic_kremlin_red_star_desc:0 "A towering crimson ruby star carved to shine from the highest spire of the Moscow Kremlin over the world proletarian revolution."
 artifact_relic_aurora_shell_name:0 "Shell Casing of the Cruiser Aurora"
 artifact_relic_aurora_shell_desc:0 "The historic blank shell casing fired from the cruiser Aurora on the Neva River that signaled the storming of the Winter Palace and the dawn of the October Revolution."
 artifact_relic_konarmiya_banner_name:0 "Red Banner of the First Cavalry Army"
 artifact_relic_konarmiya_banner_desc:0 "A battle-scarred red standard carried across the Ukrainian steppes by the Red Cavalry as they crushed the counter-revolutionary White armies."
 artifact_relic_tsaritsyn_order_name:0 "Defense Order of the Man of Steel"
 artifact_relic_tsaritsyn_order_desc:0 "The sacred revolutionary decoration forged to honor the unyielding defense of the Red citadel on the lower Volga."
 artifact_relic_communist_manifesto_name:0 "First Edition of the Communist Manifesto"
 artifact_relic_communist_manifesto_desc:0 "An original manuscript penned by Karl Marx of Trier, calling upon the workers of the world to unite and cast off their chains."
 stalin_establish_supreme_soviet_decision:0 "Establish Soviet Russia & Great Purge"
 stalin_establish_supreme_soviet_decision_desc:0 "With the forests of Moscow and Vladimir firmly under our control, it is time to unleash a Great Purge against reactionary nobles and proclaim the world's first socialist republic—Soviet Russia!"
 stalin_establish_supreme_soviet_decision_tooltip:0 "Found 'Soviet Russia' and establish permanent iron-fisted rule for the Stalin dynasty."
 stalin_establish_supreme_soviet_decision_confirm:0 "Long live Soviet Russia! No mercy for reactionaries!"
 stalin_iron_curtain_dynasty_modifier:0 "Dynasty of the Man of Steel"
 stalin_iron_curtain_dynasty_modifier_desc:0 "Through ruthless purges and total centralization, this dynasty crushes hostile schemes and extracts absolute obedience from its vassals."
 stalin_nkvd_divisions_name:0 "NKVD Internal Guard Divisions"
 stalin_proclaim_ussr_superpower_decision:0 "Establish the USSR & Complete the Five-Year Plan"
 stalin_proclaim_ussr_superpower_decision_desc:0 "From Moscow to Novgorod and Kiev, the vast lands of the Rus are united beneath the Red Banner! With the triumph of our Five-Year Plan, it is time to proclaim the Union of Soviet Socialist Republics!"
 stalin_proclaim_ussr_superpower_decision_tooltip:0 "Found the 'Union of Soviet Socialist Republics' empire and cement your dynasty's superpower rule."
 stalin_proclaim_ussr_superpower_decision_confirm:0 "An unbreakable union of Soviet republics!"
 stalin_ussr_superpower_dynasty_modifier:0 "Generalissimo of the Red Superpower"
 stalin_ussr_superpower_dynasty_modifier_desc:0 "Presiding over the Union of Soviet Socialist Republics, this dynasty commands massive vassal contributions, total counter-intelligence, and terrifying dread."
 stalin_socialist_metropolis_county_modifier:0 "Socialist Metropolis of Moscow"
 stalin_socialist_metropolis_county_modifier_desc:0 "Transformed by the Five-Year Plans into the capital of world revolution, this county boasts rapid construction and surging tax income."
 stalin_red_army_shock_corps_name:0 "1st Guards Red Army Shock Corps"
 stalin_great_purge_decision:0 "Launch the Great Purge of Counter-Revolutionaries"
 stalin_great_purge_decision_desc:0 "It is time to uproot the Trotskyite conspirators, saboteurs, and hoarding Kulaks hiding within our party and domain! Through ruthless show trials and property nationalization, we shall fill the state treasury and enforce iron discipline and dread across the realm!"
 stalin_great_purge_decision_tooltip:0 "Convene a midnight purge trial and open an event where your Intrigue or Stewardship determines the outcome of rooting out traitors and seizing wealth."
 stalin_great_purge_decision_confirm:0 "Sign the purge lists! No mercy for enemies of the people!"
 stalin_great_purge_modifier:0 "Terror of the Great Purge"
 stalin_great_purge_modifier_desc:0 "Terrified by midnight arrests and show trials, vassals and conspirators alike cower in submission and pay their dues without complaint."
 artifact_stalin_retouched_purge_album_name:0 "Retouched Album of Vanishing Comrades"
 artifact_stalin_retouched_purge_album_desc:0 "A heavy official portrait album in which smiling comrades standing beside the General Secretary yesterday are meticulously painted over into canal ripples or blank walls by court artists overnight. Watching figures vanish page by page freezes would-be plotters in their tracks."
 stalin_retouched_purge_album_modifier:0 "Retouched Album of Vanishing Comrades"
 stalin_great_purge_event_preview_tt:0 "Opens the Midnight Purge Trial event, letting you choose between an [intrigue|E] conspiracy hunt, a [stewardship|E] asset seizure, or a safe exemplary execution"
 villains_religious_decision.0030.t:0 "The Midnight List in Red Ink"
 villains_religious_decision.0030.desc:0 "Deep in the dead of night, thick pipe smoke coils above my desk where arrest warrants bleed with red pencil marks. Beyond the heavy oak doors echo the muffled boots of secret police dragging suspected saboteurs down cold stone stairs.\n\nShall we tear out every last hidden conspirator within the court and army, or strip wealthy landowners and kulaks of every hidden coin?"
 villains_religious_decision.0030.a:0 "Root out every last counter-revolutionary traitor in court and army!"
 villains_religious_decision.0030.a.success:0 "Ruthless purge crushes every plot and paralyzes all opposition"
 villains_religious_decision.0030.a.failure:0 "Paranoid blunders purge loyalists and cripple realm administration"
 villains_religious_decision.0030.b:0 "Confiscate every hidden granary and coffer of the kulaks and nobles."
 villains_religious_decision.0030.b.success:0 "Methodical requisitions fill the treasury and tighten state control"
 villains_religious_decision.0030.b.failure:0 "Peasants burn their own grain and livestock in fierce defiance"
 villains_religious_decision.0030.c:0 "Make an example only of the few saboteurs already in custody."
 stalin_great_purge_triumph_modifier:0 "Ironclad Great Purge"
 stalin_great_purge_triumph_modifier_desc:0 "Surgical midnight arrests excised every potential traitor, leaving the entire court in breathless obedience."
 stalin_purge_paranoia_backlash_modifier:0 "Paranoid Purge Backlash"
 stalin_purge_paranoia_backlash_modifier_desc:0 "Indiscriminate arrests swept away loyal stewards and capable officers, paralyzing realm administration."
 stalin_five_year_plan_stakhanov_decision:0 "Five-Year Heavy Forge Plan and Shock-Worker Competition"
 stalin_five_year_plan_stakhanov_decision_desc:0 "If the revolutionary motherland is not to be crushed by surrounding enemies, we must cover a century of ironworking and fortress building in five short years! Decree merciless Five-Year blast-furnace quotas across every smithy and mine in the realm, and exalt a model shock-worker who hauled fourteen carts of ore in a single night to drive the masses into tireless competition."
 stalin_five_year_plan_stakhanov_decision_tooltip:0 "Inspect the grand ironworks in an event testing Stewardship for Five-Year construction quotas or Diplomacy and Martial for Stakhanovite fervor and Red Guard mobilization."
 stalin_five_year_plan_stakhanov_decision_confirm:0 "Never Let the Blast Furnaces Cool!"
 stalin_five_year_plan_event_preview_tt:0 "Choose between a #V Stewardship#! Five-Year quota drive, a #V Diplomacy and Martial#! shock-worker propaganda campaign with Red Guards, or safe convict quarry labor"
 villains_religious_decision.0170.t:0 "Roaring Blast Furnaces and the Fourteen-Cart Shock Worker"
 villains_religious_decision.0170.desc:0 "Inside the cavernous stone-and-timber ironworks thick with coal smoke and furnace heat, showers of orange sparks erupt from the anvil to the roar of giant leather bellows. Standing atop the wooden inspection walkway, I run a cold eye down the parchment scroll listing every province’s iron and weapon quotas.\n\n\"There are no fortresses or production quotas that true Bolsheviks cannot storm.\" Pointing from the railing toward the sweat-drenched smiths hammering glowing steel below, I weigh the next directive. Shall I enforce ruthless Five-Year heavy-industry quotas across every holding, or trumpet a legendary shock-worker who smashed his nightly target fourteen times over to ignite nationwide ideological fervor?"
 villains_religious_decision.0170.a:0 "Accept no excuses! Enforce over-fulfillment of the Five-Year heavy forge plan!"
 villains_religious_decision.0170.a.success:0 "Relentless Furnaces Drive Surging Construction and Output"
 villains_religious_decision.0170.a.failure:0 "Terrified Officials Falsify Ledgers, Triggering Supply Chaos"
 villains_religious_decision.0170.b:0 "Exalt the fourteen-cart master smith as a Hero of Labor to ignite mass fervor!"
 villains_religious_decision.0170.b.success:0 "Shock-Worker Fervor Rallies Loyal Red Guard Brigades"
 villains_religious_decision.0170.b.failure:0 "Whispers of a Staged Quota Record Spark Work Slowdowns"
 villains_religious_decision.0170.c:0 "Dispatch dungeon prisoners to frontier quarries and timber camps to meet quotas."
 stalin_five_year_plan_shock_work_modifier:0 "Five-Year Heavy Forge Drive"
 stalin_five_year_plan_shock_work_modifier_desc:0 "Unceasing blast furnaces and ruthless quota enforcement build fortresses and infrastructure at breakneck speed."
 stalin_stakhanovite_fervor_modifier:0 "Stakhanovite Hero of Labor Fervor"
 stalin_stakhanovite_fervor_modifier_desc:0 "The legend of the fourteen-fold quota hero spurs workers and soldiers alike into fervent ideological competition."
 stalin_falsified_quota_collapse_modifier:0 "Falsified Quota Ledger Collapse"
 stalin_falsified_quota_collapse_modifier_desc:0 "Officials terrified of punishment inflated paper figures, plunging real construction sites and revenues into chaos."
