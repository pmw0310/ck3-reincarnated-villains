 # === [Decisions, Events, Modifiers & Relics] ===
 councillor_court_chaplain_national_socialism:0 "Minister of Propaganda"
 councillor_court_chaplain_national_socialism_possessive:0 "Minister of Propaganda's"
 d_national_socialism:0 "Reich Leadership"
 d_national_socialism_adj:0 "Reich Leadership"
 artifact_relic_blutfahne_name:0 "The Blutfahne"
 artifact_relic_blutfahne_desc:0 "A party banner stained during a botched Munich beer-hall putsch, repackaged as a sacred martyr relic whose hem must touch every new standard in a theatrical consecration rite."
 artifact_relic_bronze_reichsadler_name:0 "Bronze Reichsadler of the Chancellery"
 artifact_relic_bronze_reichsadler_desc:0 "An oversized bronze imperial eagle cast heavy enough to crack doorframes just to intimidate visitors, showcasing megalomaniacal architectural taste."
 artifact_relic_reichsparteitag_chalice_name:0 "Chalice of the Nuremberg Rally"
 artifact_relic_reichsparteitag_chalice_desc:0 "A ceremonial chalice used during theatrical nocturnal torchlight rallies in Nuremberg designed to mesmerize crowds into blind obedience."
 artifact_relic_mein_kampf_manuscript_name:0 "Original Manuscript of Mein Kampf"
 artifact_relic_mein_kampf_manuscript_desc:0 "Dictated in prison out of bitter resentment after Vienna art-school rejections and a failed putsch. Almost nobody survives its rambling, repetitive prose to the final page, yet every terrified vassal displays a copy in plain sight and pays mandatory royalties."
 artifact_relic_wewelsburg_ring_name:0 "Crypt Roundtable Chalice of Wewelsburg"
 artifact_relic_wewelsburg_ring_desc:0 "An esoteric ritual chalice commissioned after squandering vast treasury funds to remodel the cellar of Wewelsburg Castle near Paderborn into a pseudo-medieval knights' hall."
 hitler_proclaim_thousand_year_reich_decision:0 "Proclaim the German Reich"
 hitler_proclaim_thousand_year_reich_decision_desc:0 "What began in our Alpine stronghold of Innsbruck has now conquered all of Bavaria! The time has come to cast off the Carolingian yoke and proclaim the founding of the German Reich under the eternal leadership of House Hitler!"
 hitler_proclaim_thousand_year_reich_decision_tooltip:0 "Found the custom 'German Reich' and establish an eternal Führer state for the Hitler dynasty."
 hitler_proclaim_thousand_year_reich_decision_confirm:0 "One People, One Reich, One Führer!"
 hitler_thousand_year_reich_dynasty_modifier:0 "Bloodline of the Führer"
 hitler_thousand_year_reich_dynasty_modifier_desc:0 "This dynasty founded the German Reich across Bavaria and the Alps, granting all members formidable military authority and dread."
 hitler_proclaim_greater_german_reich_decision:0 "Proclaim the Greater German Reich"
 hitler_proclaim_greater_german_reich_decision_desc:0 "From Bavaria, Tyrol, and Austria to the northern marches of Berlin, the German lands stand united under a single banner! Now we shall rebuild our capital into the World Capital Germania and proclaim the eternal Greater German Reich!"
 hitler_proclaim_greater_german_reich_decision_tooltip:0 "Found the 'Greater German Reich', transform your capital into World Capital Germania, and mobilize the Iron Cross Shock Vanguard Corps."
 hitler_proclaim_greater_german_reich_decision_confirm:0 "Long live the Eternal Greater German Reich!"
 hitler_greater_german_reich_dynasty_modifier:0 "Rulers of the Greater German Reich"
 hitler_greater_german_reich_dynasty_modifier_desc:0 "Having unified the German lands into the Greater German Reich, this dynasty commands overwhelming knight effectiveness, army damage, and imperial dread."
 hitler_germania_world_capital_county_modifier:0 "World Capital Germania"
 hitler_germania_world_capital_county_modifier_desc:0 "Monumental halls and triumphal avenues make the World Capital of the Reich a powerhouse of tax revenue, levies, and development."
 axis_mass_agitation_decision_hitler_title:0 "Reich Party Congress & Mass Agitation Speech"
 axis_mass_agitation_decision_hitler_desc:0 "Tens of thousands have gathered beneath a sea of banners and torches! With a thunderous speech, we shall ignite fanatic zeal in the hearts of the masses, restore order to our capital, and rally eager SA Stormtrooper volunteers from the streets!"
 axis_mass_agitation_decision_hitler_confirm:0 "One People, One Reich, One Führer!"
 artifact_hitler_rejected_watercolor_name:0 "Rejected Vienna Academy Watercolor Sketch"
 artifact_hitler_rejected_watercolor_desc:0 "A faded architectural watercolor twice rejected by the Vienna Academy of Fine Arts for lifeless human figures. Because any courtier who dares critique its perspective vanishes overnight, the entire court praises it in hushed terror while old insecurities gnaw at its painter's nerves."
 hitler_rejected_watercolor_modifier:0 "Rejected Vienna Academy Watercolor Sketch"
 hitler_married_to_the_state_modifier:0 "Married to the State"
 hitler_married_to_the_state_modifier_desc:0 "Loudly proclaiming from every podium that the Reich itself is his sole bride, this ruler spends his nights hunched over architectural models and campaign maps rather than the marriage bed."
 axis_mass_agitation_hitler_event_preview_tt:0 "Opens the Torchlight Mass Rally event, letting you choose between a [diplomacy|E] oratory gamble, an [intrigue|E] street march, or a safe podium review"
 villains_religious_decision.0010.t:0 "Night of Blazing Torches"
 villains_religious_decision.0010.desc:0 "Thousands of blazing torches stain the night sky crimson while the thunderous boots of brown-clad stormtroopers shake the flagstones of the grand square. Below the high podium, a breathless sea of faces waits for my first word.\n\nDepending on how I ignite their fervor tonight, legions of fanatical youths will flock to our banners, or the entire spectacle could collapse into hoarse ridicule."
 villains_religious_decision.0010.a:0 "Roar of destiny and vengeance until my throat bleeds!"
 villains_religious_decision.0010.a.success:0 "Frenzied oratory utterly mesmerizes the multitude"
 villains_religious_decision.0010.a.failure:0 "Cracked voice draws jeers and awkward laughter"
 villains_religious_decision.0010.b:0 "Sweep the opposition quarters with an intimidating torchlight march."
 villains_religious_decision.0010.b.success:0 "Disciplined street terror freezes the capital in obedience"
 villains_religious_decision.0010.b.failure:0 "Unruly street brawls spiral into destructive riots"
 villains_religious_decision.0010.c:0 "Stick to the script and review the stormtrooper columns from the podium."
 hitler_grand_architecture_and_art_purge_decision:0 "Degenerate Art Purge and Grand Architectural Model Unveiling"
 hitler_grand_architecture_and_art_purge_decision_desc:0 "The spirit of our Volksgemeinschaft is forged not through weak, decadent art, but in monumental stone architecture built to outlast a thousand years! Confiscate degenerate paintings and illuminated manuscripts from noble estates across the realm, and unveil the white limestone scale model of our future world capital sketched by my own hand."
 hitler_grand_architecture_and_art_purge_decision_tooltip:0 "Unveil your grand architectural model and open an event testing Diplomacy for monumental prestige or Intrigue for covertly auctioning confiscated art abroad."
 hitler_grand_architecture_and_art_purge_decision_confirm:0 "Unveil the Thousand-Year Model!"
 hitler_grand_architecture_event_preview_tt:0 "Choose between a #V Diplomacy#! grand architectural unveiling, an #V Intrigue#! foreign auction of confiscated art, or a safe scroll bonfire ceremony"
 villains_religious_decision.0140.t:0 "Vision of the White Dome and Crates of Confiscated Art"
 villains_religious_decision.0140.desc:0 "At the center of the torchlit stone gallery stands a massive white limestone scale model of a colossal domed temple and triumphal colonnade, carved from sketches drawn through sleepless nights. Across the hall, chainmail-clad guards pack confiscated triptych icons and gilded manuscripts from noble manors into rough wooden crates.\n\nHolding my rolled charcoal blueprints before the hushed nobles, I survey my masterpiece. Shall I entrance the court with a fiery lecture on monumental proportions that dwarfs ancient Rome itself, or quietly auction those crates of decadent artworks to wealthy foreign merchants for a tidy fortune?"
 villains_religious_decision.0140.a:0 "Deliver a spellbinding lecture on the perfection of my white domed temple model!"
 villains_religious_decision.0140.a.success:0 "Vassals and Masons Awed by the Thousand-Year Blueprint"
 villains_religious_decision.0140.a.failure:0 "Masons Question Dome Weight, Sparking an Artistic Fury"
 villains_religious_decision.0140.b:0 "Secretly auction the confiscated decadent artworks to foreign merchants."
 villains_religious_decision.0140.b.success:0 "Covert Border Auction Yields Gold and Ideological Control"
 villains_religious_decision.0140.b.failure:0 "Embezzled Paintings and Hypocritical Sale Rumors Leak Out"
 villains_religious_decision.0140.c:0 "Hold a public scroll bonfire and commission heroic palace frescoes."
 hitler_germania_grand_model_modifier:0 "Thousand-Year Architectural Blueprint"
 hitler_germania_grand_model_modifier_desc:0 "The monumental white limestone temple model drives masons and vassals into fanatical building zeal."
 hitler_cultural_purification_modifier:0 "Confiscated Art and Cultural Purge"
 hitler_cultural_purification_modifier_desc:0 "Strict cultural censorship and art seizures suppress subversive plots and reinforce ideological orthodoxy."
 hitler_rejected_artist_rage_modifier:0 "Scorned Architect’s Fury"
 hitler_rejected_artist_rage_modifier_desc:0 "Criticism of cherished architectural drawings has provoked an uncontrollable outburst that paralyzes court business."
