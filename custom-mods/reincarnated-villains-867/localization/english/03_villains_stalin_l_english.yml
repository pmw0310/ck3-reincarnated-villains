l_english:
 # ============================================================================
 # 03. Joseph Stalin — Bolshevism & Soviet
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 bookmark_reincarnated_stalin:0 "General Secretary Joseph Stalin"
 bookmark_reincarnated_stalin_subheading:0 "General Secretary of the Red Moscow Commune"
 bookmark_reincarnated_stalin_desc:0 "When Joseph Stalin opened his eyes after breathing his last at his Moscow dacha, the grand Kremlin was nowhere to be seen—replaced by a primitive 867 AD backwater of wooden palisades in Moskva.\n\nNever mind an industrial proletariat, the surrounding woods hold only illiterate forest tribesmen—a minor detail to the Comrade General Secretary. Preaching collective ownership and ruthless Great Purges from a log hall, can he turn this muddy timber settlement into a Soviet superpower spanning Eurasia?"
 dynn_Stalin_867:0 "Stalin"
 dynn_Stalin_867_motto:0 "Workers of the World, Unite!"
 nick_the_general_secretary:0 "the Man of Steel"
 nick_the_general_secretary_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rules the vanguard of revolution with an iron will and ruthless purges as the 'Man of Steel'. Beneath [Select_CString( CHARACTER.IsLocalPlayer, 'your', CHARACTER.GetHerHis )] paranoid surveillance, nobles and peasants alike tremble."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_stalin:0 "Generalissimo's Khaki Tunic Coat"

