l_english:
 # ============================================================================
 # 06. Idi Amin — Aminism & Ugandan
 # ============================================================================

 # === [Bookmark, Characters, Dynasty, Nicknames & Appearance] ===
 Idi:0 "Idi"
 bookmark_reincarnated_idi_amin:0 "'Last King of Scotland' Idi Amin"
 bookmark_reincarnated_idi_amin_subheading:0 "President for Life of the Nile Supreme Military Junta"
 bookmark_reincarnated_idi_amin_desc:0 "Idi Amin Dada—the towering Ugandan military dictator who styled himself 'President for Life', 'Last King of Scotland', and 'Conqueror of the British Empire'—has awakened in 867 AD along the Upper Nile as the Muslim military warlord of Fazughli and Sennar.\n\nThough neither his medal-festooned field marshal uniform nor the British Empire exists yet in ninth-century Africa, the former heavyweight boxing champion's terrifying physique and patronage-fueled rule of dread make him a natural terror on the medieval battlefield. Feeding his rivals to the crocodiles of the Nile, can 'Big Daddy' conquer East Africa and march north to claim the actual crown of Scotland?"
 dynn_Amin_867:0 "Amin"
 dynn_Amin_867_motto:0 "Lord of All the Beasts of the Earth and Fishes of the Sea!"
 nick_last_king_of_scotland:0 "the Last King of Scotland"
 nick_last_king_of_scotland_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is a larger-than-life warlord dictator infatuated with tartan kilts and bagpipe bands who proclaims [Select_CString( CHARACTER.IsLocalPlayer, 'yourself', CHARACTER.GetHerselfHimself )] the rightful 'Last King of Scotland' despite starting thousands of miles down the Nile."
 nick_conqueror_of_british_empire:0 "the Conqueror of the British Empire"
 nick_conqueror_of_british_empire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is a larger-than-life warlord dictator who proclaims [Select_CString( CHARACTER.IsLocalPlayer, 'yourself', CHARACTER.GetHerselfHimself )] 'Lord of All the Beasts of the Earth and Fishes of the Sea', 'Last King of Scotland', and 'Conqueror of the British Empire'."
 PORTRAIT_MODIFIER_custom_clothes_m_clothes_villains_idi_amin:0 "Field Marshal's Ceremonial Tunic"

