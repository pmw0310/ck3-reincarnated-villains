 bolshevik_hostility_doctrine_name:0 "프롤레타리아 국제전선"
 bolshevik_hostility_doctrine_desc:0 "혁명 사회주의 계통 신앙은 노선이 다른 사회주의 분파를 미혹적으로 여기며, 파시스트와 구세계 지배 종교들은 타도해야 할 계급의 적으로 간주합니다."
 axis_hostility_doctrine_name:0 "추축국 이념 동맹"
 axis_hostility_doctrine_desc:0 "전체주의 추축 동맹에 속한 교파들은 서로의 패권을 정당한 질서로 인정하며, 볼셰비키와 적대 세력에는 무자비한 성전을 선포합니다."
