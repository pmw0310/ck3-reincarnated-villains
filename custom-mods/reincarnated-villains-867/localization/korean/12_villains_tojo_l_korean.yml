 tradition_imperial_rule_assistance_name:0 "익찬 총동원 관료제"
 tradition_imperial_rule_assistance_desc:0 "온 영지를 바둑판 같은 인보반 감시망과 배급 장부로 촘촘히 묶어 세우고, 제국 헌병대의 서슬 퍼런 기강 아래 세수와 치안을 빈틈없이 통제하는 관료 군국 전통입니다."
 tradition_imperial_rule_assistance_only_tt:0 "황국 일본 문화이거나 그 후예 문화여야 함"
 culture_parameter_unlock_maa_kenpeitai_enforcers:0 "[GetMaA('kenpeitai_enforcers').GetName](을)를 [men_at_arms|E]으로 모병 가능"
 culture_parameter_administrator_trait_more_common:0 "[GetTrait('administrator').GetName( GetNullCharacter )] [trait|E]이 더 흔히 나타남"
 kenpeitai_enforcers:0 "제국 헌병대"
 kenpeitai_enforcers_flavor:0 "#F 붉은 완장을 차고 군도와 포승줄로 무장한 채 아군 장교단과 영지 백성의 사상 불순까지 가차 없이 색출하는 군사경찰 중보병입니다. 도시와 평야 방어전, 반란 진압과 적 경보병 제압에 탁월한 위력을 발휘합니다.#!"
