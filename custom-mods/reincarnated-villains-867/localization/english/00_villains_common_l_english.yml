 # === [Shared Core Tenets & Historical Glossary] ===
 tenet_mass_propaganda_name:0 "Mass Propaganda"
 tenet_mass_propaganda_desc:0 "Blaring horns in the public square, surging banners, and ceaseless proclamations forge scattered crowds into a single iron will. True legitimacy is forged not in silent chapels, but in the roar of mobilized masses."
 tenet_planned_economy_name:0 "Planned Economy"
 tenet_planned_economy_desc:0 "Private profiteering across scattered estates is abolished as every field, granary, forge, and laborer is integrated into central multi-year quotas. Even where local nobles grumble, state construction and output surge forward."
 tenet_permanent_revolution_name:0 "Permanent Revolution"
 tenet_permanent_revolution_desc:0 "Revolution never ends with seizing the throne; reactionaries and revisionists lurking within and without must be relentlessly rooted out. Unforgiving purges and ideological warfare preserve the purity of the vanguard."
 tenet_fuhrerprinzip_name:0 "Leader Principle"
 tenet_fuhrerprinzip_desc:0 "All sovereign authority flows downward from the supreme leader's command while absolute obedience rises upward from every rank. Mobilized as a single armed camp, elite legions crush rival realms without hesitation."
 tenet_free_market_name:0 "Free Market"
 tenet_free_market_desc:0 "Unfettered enterprise and the relentless pursuit of profit are the truest engines of civilization. Bustling commercial cities and overflowing treasuries sweep aside outdated sermons of medieval poverty."
 tenet_military_industrial_complex_name:0 "Military-Industrial Complex"
 tenet_military_industrial_complex_desc:0 "When overflowing treasuries unite with foundries and arsenals, warfare becomes a lucrative investment and diplomacy an irresistible deal. Hired armies and backroom influence reshape distant realms to order."
 VILLAINS_TENET_TOOLTIP_INLINE_PERSONAL_EFFECTS:0 "#S Effects as [personal_tenet|E]:#!\n[TenetType.GetPersonalTenetEffectsDescription( Rite.Self )]"
 tenet_mass_propaganda_agitprop_historical_glossary:0 "[Glossary('Agitprop','tenet_mass_propaganda_agitprop_historical_desc')]"
 tenet_mass_propaganda_agitprop_historical_desc:0 "Political agitation and propaganda fused together to spread state doctrine and mobilize the masses through art, press, and public rallies."
 tenet_mass_propaganda_gleichschaltung_historical_glossary:0 "[Glossary('Gleichschaltung','tenet_mass_propaganda_gleichschaltung_historical_desc')]"
 tenet_mass_propaganda_gleichschaltung_historical_desc:0 "Totalitarian coordination aligning society, culture, press, and civic institutions beneath a single ruling ideology."
 tenet_mass_propaganda_historical_glossary:0 "$tenet_mass_propaganda_agitprop_historical_glossary$ / $tenet_mass_propaganda_gleichschaltung_historical_glossary$"
 tenet_planned_economy_gosplan_historical_glossary:0 "[Glossary('Gosplan','tenet_planned_economy_gosplan_historical_desc')]"
 tenet_planned_economy_gosplan_historical_desc:0 "Central state planning administration directing national production quotas, resource allocation, and industrial construction."
 tenet_planned_economy_kolkhoz_historical_glossary:0 "[Glossary('Kolkhoz','tenet_planned_economy_kolkhoz_historical_desc')]"
 tenet_planned_economy_kolkhoz_historical_desc:0 "Collective farming organization pooling private landholdings, livestock, and tools under mandatory state delivery quotas."
 tenet_planned_economy_historical_glossary:0 "$tenet_planned_economy_gosplan_historical_glossary$ / $tenet_planned_economy_kolkhoz_historical_glossary$"
 tenet_permanent_revolution_chistka_historical_glossary:0 "[Glossary('Chistka','tenet_permanent_revolution_chistka_historical_desc')]"
 tenet_permanent_revolution_chistka_historical_desc:0 "Systematic party and state purges sweeping away suspected dissenters and opportunists to enforce ideological purity."
 tenet_permanent_revolution_zaofan_historical_glossary:0 "[Glossary('Zaofan Youli','tenet_permanent_revolution_zaofan_historical_desc')]"
 tenet_permanent_revolution_zaofan_historical_desc:0 "Radical revolutionary slogan proclaiming that rebellion against entrenched hierarchy and old authority is justified."
 tenet_permanent_revolution_historical_glossary:0 "$tenet_permanent_revolution_chistka_historical_glossary$ / $tenet_permanent_revolution_zaofan_historical_glossary$"
 tenet_fuhrerprinzip_german_historical_glossary:0 "[Glossary('Führerprinzip','tenet_fuhrerprinzip_german_historical_desc')]"
 tenet_fuhrerprinzip_german_historical_desc:0 "Political doctrine placing the supreme leader's word above written law and demanding unconditional obedience from every subordinate rank."
 tenet_fuhrerprinzip_totalkrieg_historical_glossary:0 "[Glossary('Totalkrieg','tenet_fuhrerprinzip_totalkrieg_historical_desc')]"
 tenet_fuhrerprinzip_totalkrieg_historical_desc:0 "Military doctrine erasing the boundary between front and homefront to commit all population and industry to war."
 tenet_fuhrerprinzip_historical_glossary:0 "$tenet_fuhrerprinzip_german_historical_glossary$ / $tenet_fuhrerprinzip_totalkrieg_historical_glossary$"
 tenet_free_market_laissez_faire_historical_glossary:0 "[Glossary('Laissez-Faire','tenet_free_market_laissez_faire_historical_desc')]"
 tenet_free_market_laissez_faire_historical_desc:0 "Economic doctrine minimizing state intervention so private enterprise, free contract, and open competition govern trade."
 tenet_free_market_invisible_hand_historical_glossary:0 "[Glossary('Invisible Hand','tenet_free_market_invisible_hand_historical_desc')]"
 tenet_free_market_invisible_hand_historical_desc:0 "Classical economic principle holding that individuals pursuing private gain allocate society's wealth through market exchange."
 tenet_free_market_historical_glossary:0 "$tenet_free_market_laissez_faire_historical_glossary$ / $tenet_free_market_invisible_hand_historical_glossary$"
 tenet_military_industrial_complex_arsenal_historical_glossary:0 "[Glossary('Arsenal of Democracy','tenet_military_industrial_complex_arsenal_historical_desc')]"
 tenet_military_industrial_complex_arsenal_historical_desc:0 "Strategic mobilization harnessing private manufacturing and finance to mass-produce armaments for allied and national warfare."
 tenet_military_industrial_complex_realpolitik_historical_glossary:0 "[Glossary('Realpolitik','tenet_military_industrial_complex_realpolitik_historical_desc')]"
 tenet_military_industrial_complex_realpolitik_historical_desc:0 "Pragmatic statecraft prioritizing concrete material interest, financial leverage, and military balance over moral sentiment."
 tenet_military_industrial_complex_historical_glossary:0 "$tenet_military_industrial_complex_arsenal_historical_glossary$ / $tenet_military_industrial_complex_realpolitik_historical_glossary$"

 # === [Shared Axis Decisions & Generic Portrait Modifiers] ===
 axis_mass_agitation_decision:0 "Hold Mass Agitation & Rally Speech"
 axis_mass_agitation_decision_tooltip:0 "Convene a mass rally and open an event where your Diplomacy or Intrigue determines the scale of volunteer mobilization and agitation rewards."
 axis_mass_agitation_modifier:0 "Fanatic Mass Agitation"
 axis_mass_agitation_modifier_desc:0 "Electrified by the ruler's fiery oratory, the populace flocks to the banners and coreligionists rally in fervent solidarity."
 PORTRAIT_MODIFIER_custom_clothes_male_empty:0 "None"
 PORTRAIT_MODIFIER_custom_clothes_female_empty:0 "None"
 axis_mass_agitation_triumph_modifier:0 "Triumphant Mass Agitation"
 axis_mass_agitation_triumph_modifier_desc:0 "Mesmerized by a spellbinding rally speech, the populace rallies beneath the ruler banner with fanatical zeal."
 axis_mass_agitation_fiasco_modifier:0 "Humiliating Rally Fiasco"
 axis_mass_agitation_fiasco_modifier_desc:0 "A cracked voice and clumsy staging turned the grand rally into a laughingstock, dampening follower morale."
 axis_street_riot_county_modifier:0 "Bloody Street Riot Aftermath"
 axis_street_riot_county_modifier_desc:0 "An unruly armed march degenerated into street brawls and arson, leaving townsfolk bitter and commerce disrupted."

