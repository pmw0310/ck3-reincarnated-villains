 taisei_yokusankai_desc:0 "사사로운 정파와 개인의 자유를 일체 폐지하고 천하 만민을 국가 총동원 서류망과 인보반 감시 체제 아래 일사불란하게 편제하는 관료 전체주의 이념입니다. 전선의 참패조차 대본영의 화려한 승리 발표문으로 둔갑시키며, 새벽 골목의 쓰레기통 하나까지 국가가 검열해야 직성이 풀립니다."
